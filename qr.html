<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Redirigiendo…</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Helvetica Neue',Arial,sans-serif;background:#0a0a08;min-height:100vh;display:flex;align-items:center;justify-content:center;color:#fff}
.card{text-align:center;padding:2rem;max-width:320px}
.spin{width:40px;height:40px;border:3px solid rgba(200,169,110,.2);border-top-color:#c8a96e;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 1.25rem}
@keyframes spin{to{transform:rotate(360deg)}}
h3{font-size:18px;font-weight:400;color:rgba(255,255,255,.8);margin-bottom:.4rem}
p{font-size:13px;color:rgba(255,255,255,.35);line-height:1.6}
.gold{color:#c8a96e}
</style>
</head>
<body>
<div class="card">
  <div class="spin"></div>
  <h3>Redirigiendo…</h3>
  <p id="msg">Un momento</p>
</div>
<script>
const SUPABASE_URL = 'https://ctgyvydzshueemlelkzv.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN0Z3l2eWR6c2h1ZWVtbGVsa3p2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2NTc1NzAsImV4cCI6MjA4OTIzMzU3MH0.3pMA-VZLV2Kfyl6BD-x8v79P7UuXSfMgtIwnfoP_VuY';
const SB = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function run() {
  // 1. Leer el código del QR desde la URL
  const params = new URLSearchParams(window.location.search);
  const codigo = params.get('c') || location.pathname.split('/q/')[1];

  if (!codigo) {
    document.getElementById('msg').textContent = 'Link inválido';
    return;
  }

  // 2. Buscar el link en la BD
  const { data: link } = await SB.from('qr_links')
    .select('*').eq('codigo', codigo).eq('activo', true).maybeSingle();

  if (!link) {
    document.getElementById('msg').textContent = 'Este código no existe o fue desactivado.';
    return;
  }

  // 3. Capturar datos del dispositivo desde el navegador
  const ua = navigator.userAgent;

  function detectarDispositivo(ua) {
    if (/iPad|tablet/i.test(ua)) return 'tablet';
    if (/Mobi|Android|iPhone|iPod|BlackBerry|IEMobile|Opera Mini/i.test(ua)) return 'móvil';
    return 'desktop';
  }

  function detectarSO(ua) {
    if (/iPhone|iPad|iPod/.test(ua)) return 'iOS';
    if (/Android/.test(ua)) return 'Android';
    if (/Windows/.test(ua)) return 'Windows';
    if (/Mac OS X/.test(ua)) return 'macOS';
    if (/Linux/.test(ua)) return 'Linux';
    return 'Desconocido';
  }

  function detectarNavegador(ua) {
    if (/CriOS/.test(ua))  return 'Chrome iOS';
    if (/FxiOS/.test(ua))  return 'Firefox iOS';
    if (/EdgA|EdgW|Edg\//.test(ua)) return 'Edge';
    if (/OPR|Opera/.test(ua)) return 'Opera';
    if (/SamsungBrowser/.test(ua)) return 'Samsung Browser';
    if (/Chrome/.test(ua) && !/Chromium/.test(ua)) return 'Chrome';
    if (/Firefox/.test(ua)) return 'Firefox';
    if (/Safari/.test(ua) && !/Chrome/.test(ua)) return 'Safari';
    return 'Otro';
  }

  const now      = new Date();
  const fecha    = now.toLocaleDateString('es-CO');
  const hora     = now.toLocaleTimeString('es-CO', { hour:'2-digit', minute:'2-digit' });
  const referrer = document.referrer || null;

  // 4. Obtener IP y geo via servicio público (no requiere API key)
  let ip = null, pais = null, ciudad_geo = null;
  try {
    const geo = await fetch('https://ipapi.co/json/', { signal: AbortSignal.timeout(3000) });
    if (geo.ok) {
      const gd = await geo.json();
      ip        = gd.ip || null;
      pais      = gd.country_name || null;
      ciudad_geo = gd.city || null;
    }
  } catch(e) { /* geo opcional — no bloquear la redirección */ }

  // 5. Registrar el escaneo en BD (no esperar — redirigir ya)
  SB.from('qr_scans').insert({
    qr_link_id:  link.id,
    codigo,
    fecha, hora,
    user_agent:  ua,
    dispositivo: detectarDispositivo(ua),
    so:          detectarSO(ua),
    navegador:   detectarNavegador(ua),
    ip, pais, ciudad_geo,
    referrer,
  }).then(() => {}).catch(() => {});

  // 6. Redirigir
  window.location.replace(link.url_destino);
}

run();
</script>
</body>
</html>
