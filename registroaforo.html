<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title data-i18n="reg.title">Registro · Hostal Terraza</title>
    <link rel="preconnect" href="https://ctgyvydzshueemlelkzv.supabase.co" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <script src="js/i18n.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.3.0/dist/fonts/geist.min.css" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.3.0/dist/fonts/geist.min.css"></noscript>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <!-- Kernel SaaS agnóstico (espejo del landing: reset + grano + IoC) -->
    <style>
        html, body { margin: 0; padding: 0; min-height: 100%; background-color: #050505; color: #ffffff; font-family: 'Geist', sans-serif; overflow-x: hidden; }
        body::before {
            content: ""; position: fixed; inset: 0; z-index: 9999; pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            opacity: 0.04;
        }
        section, header, footer { display: none; }
        .loading-overlay { position: fixed; inset: 0; background: #000; z-index: 999; display: flex; align-items: center; justify-content: center; }
        .loading-overlay .spinner {
            width: 44px; height: 44px;
            border: 3px solid rgba(255,255,255,0.15);
            border-top-color: var(--gold, #ff9f1c);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        /* Estilo mínimo para el formulario de registro (no forma parte del template del landing) */
        .inv-badge { font-size: 0.68rem; letter-spacing: 0.28em; text-transform: uppercase; font-weight: 900; color: var(--gold, #ff9f1c); margin-bottom: 0.6rem; }
        /* Página solo-cabezote+formulario: neutraliza el grid/hero del template del landing */
        body.page-registro #main-content-flow { display: block !important; }
        body.page-registro #mod-hero {
            display: block !important;
            min-height: 0 !important;
            padding: 0 !important;
            margin: 0 !important;
            background: none !important;
        }
        body.page-registro #mod-hero::after { display: none !important; }
        body.page-registro #cabezote-img { display: block; width: 100%; height: auto; }
        body.page-registro #cabezote-picture { display: block; width: 100%; }
        body.page-registro #mod-form { display: block !important; padding: 1.5rem 6% 3rem; border-bottom: none !important; }
        body.page-registro .wa-row { display: flex; gap: 0.5rem; align-items: stretch; margin-bottom: 1.1rem; }
        body.page-registro .wa-code { flex: 0 0 128px; width: auto; margin-bottom: 0; min-width: 0; }
        body.page-registro .wa-number { flex: 1; min-width: 0; margin-bottom: 0; }
        body.page-registro .wa-code option { background: #14032C; color: #fff; }
    </style>
</head>
<body class="tpl-init page-registro">
    <div id="loader" class="loading-overlay"><div class="spinner"></div></div>

    <main id="main-content-flow">

        <!-- CABEZOTE: imagen del evento, responsive + WebP vía Supabase Storage transform.
             Fallback local solo si el evento no tiene imagen (Cero Borrado). -->
        <header id="mod-hero" class="hero">
            <picture id="cabezote-picture">
                <source id="cabezote-desktop-webp" type="image/webp" media="(min-width: 768px)">
                <source id="cabezote-mobile-webp" type="image/webp" media="(max-width: 767px)">
                <source id="cabezote-desktop-jpg" type="image/jpeg" media="(min-width: 768px)">
                <source id="cabezote-mobile-jpg" type="image/jpeg" media="(max-width: 767px)">
                <img id="cabezote-img" alt="Cabezote del evento" fetchpriority="high" decoding="async">
            </picture>
        </header>

        <!-- FORMULARIO DE REGISTRO (captura simple: nombre, cédula, whatsapp → BD) -->
        <section id="mod-form">
            <div class="form-master-box">
                <p class="inv-badge" id="form-alert-badge" style="display:none"></p>
                <form id="master-reg-form" novalidate>
                    <input type="text" id="reg-nombre" class="form-input" placeholder="Nombre completo *" required data-i18n-ph="reg.f_nombre_ph">
                    <input type="text" id="reg-cedula" class="form-input" placeholder="Cédula *" required data-i18n-ph="reg.f_cedula_ph">
                    <div class="wa-row">
                        <select id="reg-whatsapp-code" class="form-input wa-code">
                            <option value="+57" selected>🇨🇴 +57</option>
                            <option value="+1">🇺🇸 +1</option>
                            <option value="+58">🇻🇪 +58</option>
                            <option value="+593">🇪🇨 +593</option>
                            <option value="+52">🇲🇽 +52</option>
                            <option value="+51">🇵🇪 +51</option>
                            <option value="+55">🇧🇷 +55</option>
                            <option value="+34">🇪🇸 +34</option>
                            <option value="+54">🇦🇷 +54</option>
                            <option value="+56">🇨🇱 +56</option>
                            <option value="+507">🇵🇦 +507</option>
                            <option value="+33">🇫🇷 +33</option>
                            <option value="+49">🇩🇪 +49</option>
                            <option value="+39">🇮🇹 +39</option>
                            <option value="+44">🇬🇧 +44</option>
                            <option value="+1">🇨🇦 +1</option>
                            <option value="+506">🇨🇷 +506</option>
                            <option value="+1">🇩🇴 +1</option>
                            <option value="+591">🇧🇴 +591</option>
                            <option value="+31">🇳🇱 +31</option>
                            <option value="+53">🇨🇺 +53</option>
                            <option value="otro">🌐 <span data-i18n="common.otro">Otro…</span></option>
                        </select>
                        <input type="tel" id="reg-whatsapp" class="form-input wa-number" placeholder="WhatsApp *" inputmode="numeric" maxlength="15" required data-i18n-ph="reg.f_wa_ph">
                    </div>
                    <input type="text" id="reg-whatsapp-custom-code" class="form-input" placeholder="Código de país (ej. +7)" maxlength="6" style="display:none" data-i18n-ph="reg.f_pais_codigo_ph">
                    <button type="submit" class="btn-submit" data-i18n="reg.registrarme_btn">Registrarme →</button>
                </form>
                <p class="inv-badge" id="form-success-msg" style="display:none"></p>
            </div>
        </section>

    </main>

    <script>
        const SB_URL = "https://ctgyvydzshueemlelkzv.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN0Z3l2eWR6c2h1ZWVtbGVsa3p2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2NTc1NzAsImV4cCI6MjA4OTIzMzU3MH0.3pMA-VZLV2Kfyl6BD-x8v79P7UuXSfMgtIwnfoP_VuY";
        // Cliente Supabase perezoso: supabase-js se carga con defer, así que se
        // instancia en el primer uso (ya con la librería disponible).
        let sbClient = null;
        function getClient() {
            if (!sbClient) sbClient = window.supabase.createClient(SB_URL, SB_KEY);
            return sbClient;
        }
        const T = window.I18N && typeof I18N.t === 'function' ? I18N.t.bind(I18N) : (k => k);

        function log(format, t = 'INFO') {
            const colors = { 'INFO': '#00ff88', 'LINK': '#f1c40f', 'TIME': '#9b59b6', 'TRACE': '#e67e22', 'DEBUG': '#3498db', 'ERROR': '#ff4d4d' };
            console.log('%c[' + new Date().toLocaleTimeString() + '] [' + t + '] ' + format, 'color: ' + (colors[t] || '#fff') + '; font-weight: bold;');
        }

        function TODAY() { return new Date().toLocaleDateString('es-CO'); }
        function NOW()   { return new Date().toLocaleTimeString('es-CO'); }

        // Reutiliza el MISMO mecanismo de inyección de CSS del landing (Data-First).
        function injectAtomicCSS(cat, tplId) {
            return new Promise((resolve) => {
                const path = `css/templates/${(cat || 'fiesta').toLowerCase()}/${(tplId || 'f3').toLowerCase()}.css?v=${Date.now()}`;
                let link = document.querySelector('link[data-template-css]');
                if (!link) { link = document.createElement('link'); link.rel = 'stylesheet'; link.setAttribute('data-template-css', 'true'); document.head.appendChild(link); }
                let isResolved = false;
                const timer = setTimeout(() => { if (!isResolved) { isResolved = true; log("ERROR: Timeout 5s al cargar CSS [" + path + "].", "ERROR"); resolve(false); } }, 5000);
                link.onload = () => {
                    if (!isResolved) { isResolved = true; clearTimeout(timer); log("LINK: Estilo [" + tplId + "] cargado (reuso del template del landing).", "LINK"); resolve(true); }
                };
                link.onerror = () => { if (!isResolved) { isResolved = true; clearTimeout(timer); log("ERROR: No se pudo cargar [" + path + "].", "ERROR"); resolve(false); } };
                link.href = path;
            });
        }

        // CABEZOTE dinámico: imagen del evento con variantes responsive + WebP
        // vía transformación de Supabase Storage (render/image). Si el origen no es
        // Supabase Storage, se sirve la URL tal cual. Fallback: archivo local.
        const CABEZOTE_FALLBACK = '/imagenes/cabezote%20tropilove%20formulario.jpg.jpeg';
        const CABEZOTE_SOURCE_IDS = ['cabezote-desktop-webp', 'cabezote-mobile-webp', 'cabezote-desktop-jpg', 'cabezote-mobile-jpg'];

        function setCabezote(srcUrl) {
            const img = document.getElementById('cabezote-img');
            if (!img) return;
            const clearSources = () => CABEZOTE_SOURCE_IDS.forEach((id) => {
                const el = document.getElementById(id);
                if (el) el.removeAttribute('srcset');
            });
            if (!srcUrl) {
                clearSources();
                img.src = CABEZOTE_FALLBACK;
                log("DEBUG: Cabezote sin imagen de evento — fallback local.", "DEBUG");
                return;
            }
            if (srcUrl.indexOf('/storage/v1/object/public/') !== -1) {
                const base = srcUrl.replace('/storage/v1/object/public/', '/storage/v1/render/image/public/');
                img.onerror = () => { img.onerror = null; img.src = srcUrl; };
                img.src = base + '?width=1600&resize=contain&quality=75';
                document.getElementById('cabezote-desktop-webp').srcset = base + '?width=1600&resize=contain&quality=75&format=webp';
                document.getElementById('cabezote-mobile-webp').srcset = base + '?width=640&resize=contain&quality=70&format=webp';
                document.getElementById('cabezote-desktop-jpg').srcset = base + '?width=1600&resize=contain&quality=75';
                document.getElementById('cabezote-mobile-jpg').srcset = base + '?width=640&resize=contain&quality=70';
                log("LINK: Cabezote transformado (WebP/JPEG × desktop/mobile) desde Supabase Storage.", "LINK");
            } else {
                clearSources();
                img.src = srcUrl;
                log("LINK: Cabezote desde URL externa (sin transformar): " + srcUrl, "LINK");
            }
        }

        function showBadge(id, msg, tipo) {
            const el = document.getElementById(id);
            el.style.display = 'block';
            el.textContent = msg;
            el.style.color = tipo === 'err' ? '#ff6b6b' : 'inherit';
        }

        function esTelefonoValido(num) {
            const clean = (num || '').replace(/[\s\-().]/g, '');
            return /^\d{6,15}$/.test(clean);
        }

        async function init() {
            log("Iniciando Registro (ADR-030) — captura simple de datos con estilos del template del landing.", "INFO");
            const params = new URLSearchParams(window.location.search);
            const slug = params.get('slug');
            const id = params.get('id');
            const rol = (params.get('rol') || 'invitado').trim().toLowerCase();
            if (!slug && !id) {
                document.body.innerHTML = '<div style="min-height:100vh; display:flex; align-items:center; justify-content:center; padding:2rem; color:#fff; background:#0a0a0c; text-align:center;"><p>' + T('reg.err_no_evento') + '</p></div>';
                log("ERROR: Sin slug ni id.", "ERROR");
                return;
            }
            try {
                const timeoutPromise = new Promise((_, rej) => setTimeout(() => rej(new Error('Timeout 8s')), 8000));
                let query = getClient().from('eventos').select('*, organizaciones(nombre)');
                if (slug) query = query.eq('slug', slug).single();
                else query = query.eq('id', id).single();
                const { data: ev, error } = await Promise.race([query, timeoutPromise]);
                if (error || !ev) throw error || new Error('Evento no hallado');
                window.__ctxEventoId = ev.id;
                window.__ctxOrgId = ev.org_id || null;
                window.__ctxEv = ev;
                window.__ctxRol = rol;

                // Cabezote responsive + WebP tan pronto se conoce la imagen del evento.
                // ADR-034: cabezote_formulario_url tiene precedencia (imagen propia del formulario).
                setCabezote(ev.cabezote_formulario_url || ev.imagen_url || ev.poster_url);
                const cabImg = document.getElementById('cabezote-img');
                if (cabImg) cabImg.alt = ev.nombre || 'Cabezote del evento';

                // Inyecta el MISMO silo CSS que usa su landing (mismo template_id/categoria_slug).
                let cssOK = true;
                try {
                    if (ev.primary_color) document.documentElement.style.setProperty('--master-accent', ev.primary_color);
                    cssOK = await injectAtomicCSS(ev.categoria_slug, ev.template_id);
                } catch (e) { cssOK = false; }
                if (!cssOK) {
                    document.body.innerHTML = '<div style="min-height:100vh; display:flex; align-items:center; justify-content:center; text-align:center; padding:2rem; color:#fff; background:#0a0a0c;"><p style="max-width:400px; opacity:0.8;">' + T('reg.err_css') + '</p></div>';
                    return;
                }

                // Activación de Ámbito Dual (misma del landing)
                const tplNormal = `tpl-${ev.template_id || 'F3'}`;
                const tplLower = `tpl-${(ev.template_id || 'f3').toLowerCase()}`;
                document.body.className = `${tplNormal} ${tplLower} page-registro`;

                const content = ev.config_landing?.content || {};
                const formSolo = content.form_solo ? content.form_solo.activo !== false : true;

                document.getElementById('loader').style.display = 'none';
                document.getElementById('mod-form').style.display = 'block';
                log("LINK: Evento cargado para registro: " + (ev.nombre || '') + " (id=" + ev.id + ", rol=" + rol + ").", "LINK");

                if (!formSolo) {
                    document.getElementById('master-reg-form').style.display = 'none';
                    showBadge('form-alert-badge', T('reg.no_disponible'), 'err');
                    log("INFO: form_solo.activo=false — registro desactivado.", "INFO");
                }
            } catch (err) {
                log("ERROR: " + err.message, "ERROR");
                document.body.innerHTML = '<div style="min-height:100vh; display:flex; align-items:center; justify-content:center; text-align:center; padding:2rem; color:#fff; background:#0a0a0c;"><p style="max-width:400px; opacity:0.8;">' + T('reg.err_cargar') + '</p></div>';
            }
        }

        document.getElementById('reg-whatsapp-code').addEventListener('change', function () {
            const isOtro = this.value === 'otro';
            document.getElementById('reg-whatsapp-custom-code').style.display = isOtro ? 'block' : 'none';
        });

        document.getElementById('master-reg-form').addEventListener('submit', async function (e) {
            e.preventDefault();
            const ev = window.__ctxEv;
            if (!ev) { showBadge('form-alert-badge', T('reg.ev_no_cargado'), 'err'); return; }
            const nombre = document.getElementById('reg-nombre').value.trim();
            const cedula = document.getElementById('reg-cedula').value.trim();
            const phone = document.getElementById('reg-whatsapp').value.trim();
            const codeSel = document.getElementById('reg-whatsapp-code');
            let code = codeSel.value === 'otro' ? (document.getElementById('reg-whatsapp-custom-code').value || '').trim() : codeSel.value;
            if (code && !code.startsWith('+')) code = '+' + code;
            const rol = window.__ctxRol || 'invitado';
            if (!nombre || !cedula || !phone) { showBadge('form-alert-badge', T('reg.completa_campos'), 'err'); return; }
            if (!esTelefonoValido(phone)) { showBadge('form-alert-badge', T('reg.wa_invalido'), 'err'); return; }
            if (codeSel.value === 'otro' && !code) { showBadge('form-alert-badge', T('reg.pais_codigo_err'), 'err'); return; }
            const whatsapp = (code + phone).trim();

            const btn = document.querySelector('#master-reg-form .btn-submit');
            btn.disabled = true; btn.textContent = T('reg.registrando');
            try {
                const { data: dup } = await getClient().from('inscritos').select('id').eq('cedula', cedula).eq('evento_id', ev.id).maybeSingle();
                if (dup) { showBadge('form-alert-badge', T('reg.ya_registrada'), 'err'); btn.disabled = false; btn.textContent = T('reg.registrarme_btn'); return; }
                const payload = {
                    evento_id: ev.id,
                    org_id: window.__ctxOrgId,
                    evento_nombre: ev.nombre,
                    evento_fecha: ev.fecha,
                    nombre: nombre,
                    cedula: cedula,
                    whatsapp: whatsapp,
                    telefono: whatsapp,
                    tipo: rol,
                    tipo_ayuda: rol,
                    cuenta_aforo: true,
                    used: false,
                    fecha_inscripcion: TODAY(),
                    hora_inscripcion: NOW(),
                    respuestas_custom: { rol, origen: 'pagina-registro' }
                };
                const { error } = await getClient().from('inscritos').insert(payload);
                if (error) throw error;
                log("INFO: Registro guardado (rol=" + rol + ", cuenta_aforo=true, cédula=" + cedula + ", whatsapp=" + whatsapp + ").", "INFO");
                btn.disabled = false; btn.textContent = T('reg.registrarme_btn');
                document.getElementById('master-reg-form').style.display = 'none';
                const ok = document.getElementById('form-success-msg');
                ok.style.display = 'block';
                ok.style.color = '#25d366';
                ok.textContent = T('reg.ok_guardado', { nombre: nombre });
                setTimeout(() => {
                    document.getElementById('master-reg-form').reset();
                    document.getElementById('reg-whatsapp-custom-code').style.display = 'none';
                    ok.style.display = 'none';
                    document.getElementById('master-reg-form').style.display = 'block';
                }, 2500);
            } catch (err) {
                log("ERROR: " + err.message, "ERROR");
                btn.disabled = false; btn.textContent = T('reg.registrarme_btn');
                showBadge('form-alert-badge', T('reg.err_guardar'), 'err');
            }
        });

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }

        if (window.I18N) {
            window.addEventListener('langchange', () => { window.location.reload(); });
        }
    </script>
</body>
</html>
