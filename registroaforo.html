<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Registro · Hostal Terraza</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.3.0/dist/fonts/geist.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/qr-creator/dist/qr-creator.min.js"></script>
    <!-- Kernel SaaS agnóstico (espejo del landing: reset + grano + IoC) -->
    <style>
        html, body { margin: 0; padding: 0; min-height: 100%; background-color: #050505; color: #ffffff; font-family: 'Geist', sans-serif; overflow-x: hidden; }
        body::before {
            content: ""; position: fixed; inset: 0; z-index: 9999; pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            opacity: 0.04;
        }
        section, header, footer { display: none; }
        .loading-overlay { position: fixed; inset: 0; background: #000; z-index: 999; display: flex; align-items: center; justify-content: center; font-weight: 900; letter-spacing: 3px; text-transform: uppercase; }
        /* Estilo mínimo para la invitación QR (no forma parte del template del landing) */
        .inv-panel { text-align: center; }
        .inv-badge { font-size: 0.68rem; letter-spacing: 0.28em; text-transform: uppercase; font-weight: 900; color: var(--gold, #ff9f1c); margin-bottom: 0.6rem; }
        .inv-panel h2 { font-size: 1.3rem; font-weight: 900; text-transform: uppercase; margin-bottom: 0.3rem; }
        .inv-panel .inv-sub { color: var(--f6-text-muted, #a89b85); font-size: 0.9rem; margin-bottom: 1.4rem; }
        .inv-qr { width: 200px; height: 200px; margin: 0 auto; background: #fff; border-radius: 8px; display: flex; align-items: center; justify-content: center; padding: 12px; }
        .inv-qr svg, .inv-qr canvas { width: 100%; height: 100%; }
        .inv-code { margin-top: 1.1rem; font-family: monospace; font-size: 0.82rem; color: var(--gold, #ff9f1c); word-break: break-all; }
        .inv-note { margin-top: 0.6rem; font-size: 0.76rem; color: var(--f6-text-muted, #a89b85); }
        .inv-note + button { margin-top: 1.6rem; }
        .field-note { display: block; font-size: 0.78rem; color: var(--f6-text-muted, #a89b85); margin: -0.4rem 0 1.1rem; }
    </style>
</head>
<body class="tpl-init">
    <div id="loader" class="loading-overlay">CARGANDO INVITACIÓN…</div>

    <main id="main-content-flow">

        <!-- HERO (espejo del landing: mismos IDs/classes para reutilizar el template) -->
        <header id="mod-hero" class="hero">
            <div id="org-name-badge" style="position:absolute; top:2.5rem; left:2.5rem; font-weight:900; letter-spacing:2px; text-transform:uppercase; z-index:10;">--</div>
            <div class="hero-content" style="position:relative; z-index:5;">
                <h1 id="event-title">--</h1>
            </div>
        </header>

        <!-- COUNTDOWN (espejo del landing) -->
        <div id="unified-frame" class="unified-countdown-frame" style="display:flex; justify-content:center; margin-top:3rem;">
            <div class="cd-block" style="text-align:center;"><span id="cd-days" style="display:block; font-size:3.2rem; font-weight:900;">00</span><small>DÍAS</small></div>
            <div class="cd-block" style="text-align:center;"><span id="cd-hours" style="display:block; font-size:3.2rem; font-weight:900;">00</span><small>HORAS</small></div>
            <div class="cd-block" style="text-align:center;"><span id="cd-mins" style="display:block; font-size:3.2rem; font-weight:900;">00</span><small>MIN</small></div>
            <div class="cd-block" style="text-align:center;"><span id="cd-secs" style="display:block; font-size:3.2rem; font-weight:900;">00</span><small>SEG</small></div>
        </div>

        <!-- METADATOS (espejo del landing) -->
        <div id="mod-hero-meta" class="hero-meta">
            <div class="meta-item"><svg class="meta-svg" viewBox="0 0 24 24" width="18" height="18" fill="var(--gold)"><path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2z"/></svg><span id="meta-fecha">--/--/--</span></div>
            <div class="meta-item"><svg class="meta-svg" viewBox="0 0 24 24" width="18" height="18" fill="var(--gold)"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58-8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg><span id="meta-hora">--:--</span></div>
            <div class="meta-item"><svg class="meta-svg" viewBox="0 0 24 24" width="18" height="18" fill="var(--gold)"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg><span id="meta-lugar">--</span></div>
        </div>

        <!-- FORMULARIO DE REGISTRO (espejo del landing: .form-master-box + tabs + .btn-submit) -->
        <section id="mod-form">
            <div class="form-master-box">
                <div class="form-tabs">
                    <button id="tab-new" class="tab-btn active" onclick="switchForm('nuevo')">REGISTRO</button>
                    <button id="tab-old" class="tab-btn" onclick="switchForm('ya')">RECUPERAR</button>
                </div>

                <div id="form-nuevo">
                    <form id="master-reg-form" novalidate>
                        <p class="inv-badge" id="form-alert-badge" style="display:none"></p>
                        <input type="text" id="reg-nombre" class="form-input" placeholder="Nombre completo *" required>
                        <input type="text" id="reg-cedula" class="form-input" placeholder="Cédula *" required>
                        <input type="tel" id="reg-telefono" class="form-input" placeholder="Teléfono / WhatsApp *" required>
                        <button type="submit" class="btn-submit">Generar Invitación →</button>
                    </form>
                </div>

                <div id="form-ya" style="display:none">
                    <form id="master-rec-form" novalidate>
                        <input type="text" id="rec-cedula" class="form-input" placeholder="Cédula *" required>
                        <span class="field-note">Ingresa la cédula con la que te registraste para recuperar tu invitación con QR.</span>
                        <button type="submit" class="btn-submit">Recuperar Invitación →</button>
                    </form>
                    <p class="inv-badge" style="display:none" id="rec-alert-badge"></p>
                </div>

                <!-- Invitación QR -->
                <div class="inv-panel" id="inv-panel" style="display:none">
                    <p class="inv-badge">Invitación Confirmada</p>
                    <h2 id="inv-name">--</h2>
                    <p class="inv-sub" id="inv-event">--</p>
                    <div class="inv-qr" id="inv-qr"></div>
                    <p class="inv-code" id="inv-code-text">--</p>
                    <p class="inv-note">Presenta este código QR en la entrada del evento. Un solo ingreso por invitación.</p>
                    <button type="button" class="btn-submit" onclick="location.reload()">Registrar otra persona →</button>
                </div>
            </div>
        </section>

    </main>

    <script>
        const SB_URL = "https://ctgyvydzshueemlelkzv.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN0Z3l2eWR6c2h1ZWVtbGVsa3p2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2NTc1NzAsImV4cCI6MjA4OTIzMzU3MH0.3pMA-VZLV2Kfyl6BD-x8v79P7UuXSfMgtIwnfoP_VuY";
        const sbClient = window.supabase.createClient(SB_URL, SB_KEY);

        function log(format, t = 'INFO') {
            const colors = { 'INFO': '#00ff88', 'LINK': '#f1c40f', 'TIME': '#9b59b6', 'TRACE': '#e67e22', 'DEBUG': '#3498db', 'ERROR': '#ff4d4d' };
            console.log('%c[' + new Date().toLocaleTimeString() + '] [' + t + '] ' + format, 'color: ' + (colors[t] || '#fff') + '; font-weight: bold;');
        }

        function TODAY() { return new Date().toLocaleDateString('es-CO'); }
        function NOW()   { return new Date().toLocaleTimeString('es-CO'); }
        function UID()   { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

        function parseSpanishDate(dateStr, timeStr) {
            const months = { "enero": "01", "febrero": "02", "marzo": "03", "abril": "04", "mayo": "05", "junio": "06", "julio": "07", "agosto": "08", "septiembre": "09", "octubre": "10", "noviembre": "11", "diciembre": "12" };
            const parts = (dateStr || '').toLowerCase().split(' de ');
            if (parts.length === 3) {
                const d = parts[0].trim().padStart(2, '0');
                const m = months[parts[1].trim()];
                const a = parts[2].trim();
                return new Date(`${a}-${m}-${d}T${timeStr}`);
            }
            return new Date(`${dateStr}T${timeStr}`);
        }

        // Reutiliza el MISMO mecanismo de inyección de CSS del landing (Data-First).
        function injectAtomicCSS(cat, tplId) {
            return new Promise((resolve) => {
                const path = `css/templates/${(cat || 'fiesta').toLowerCase()}/${(tplId || 'f3').toLowerCase()}.css?v=${Date.now()}`;
                let link = document.querySelector('link[data-template-css]');
                if (!link) { link = document.createElement('link'); link.rel = 'stylesheet'; link.setAttribute('data-template-css', 'true'); document.head.appendChild(link); }
                let isResolved = false;
                const timer = setTimeout(() => { if (!isResolved) { isResolved = true; log("ERROR: Timeout 5s al cargar CSS [" + path + "].", "ERROR"); resolve(false); } }, 5000);
                link.onload = () => {
                    if (!isResolved) { isResolved = true; clearTimeout(timer); log("LINK: Estilo [" + tplId + "] cargado (reuso del template del landing).", "LINK"); resolve(true); }
                };
                link.onerror = () => { if (!isResolved) { isResolved = true; clearTimeout(timer); log("ERROR: No se pudo cargar [" + path + "].", "ERROR"); resolve(false); } };
                link.href = path;
            });
        }

        function switchForm(type) {
            const isNew = type === 'nuevo';
            document.getElementById('tab-new').classList.toggle('active', isNew);
            document.getElementById('tab-old').classList.toggle('active', !isNew);
            document.getElementById('form-nuevo').style.display = isNew ? 'block' : 'none';
            document.getElementById('form-ya').style.display = isNew ? 'none' : 'block';
            log("DEBUG: Ruta de formulario cambiada a [" + type.toUpperCase() + "]", "DEBUG");
        }

        function showBadge(id, msg, tipo) {
            const el = document.getElementById(id);
            el.style.display = 'block';
            el.textContent = msg;
            el.style.color = tipo === 'err' ? '#ff6b6b' : 'inherit';
        }

        function mostrarInvitacion(nombre, eventoTxt, qrCode) {
            document.getElementById('form-nuevo').style.display = 'none';
            document.getElementById('form-ya').style.display = 'none';
            document.getElementById('inv-name').textContent = (nombre || '').toUpperCase();
            document.getElementById('inv-event').textContent = eventoTxt;
            document.getElementById('inv-code-text').textContent = qrCode || '--';
            const qd = document.getElementById('inv-qr');
            qd.innerHTML = '';
            try {
                QrCreator.render({ text: qrCode, radius: 0, ecLevel: "H", fill: "#181815", background: "#ffffff", size: 200 }, qd);
            } catch (e) {
                qd.textContent = qrCode;
            }
            document.getElementById('inv-panel').style.display = 'block';
            log("TRACE: Invitación QR renderizada con código " + (qrCode || ''), "TRACE");
        }

        async function init() {
            log("Iniciando Registro (ADR-030) — invitación QR con estilos del template del landing.", "INFO");
            const params = new URLSearchParams(window.location.search);
            const slug = params.get('slug');
            const id = params.get('id');
            const rol = (params.get('rol') || 'invitado').trim().toLowerCase();
            if (!slug && !id) {
                document.body.innerHTML = '<div style="min-height:100vh; display:flex; align-items:center; justify-content:center; padding:2rem; color:#fff; background:#0a0a0c; text-align:center;"><p>Evento no especificado. Revisa el enlace.</p></div>';
                log("ERROR: Sin slug ni id.", "ERROR");
                return;
            }
            try {
                const timeoutPromise = new Promise((_, rej) => setTimeout(() => rej(new Error('Timeout 8s')), 8000));
                let query = sbClient.from('eventos').select('*, organizaciones(nombre)');
                if (slug) query = query.eq('slug', slug).single();
                else query = query.eq('id', id).single();
                const { data: ev, error } = await Promise.race([query, timeoutPromise]);
                if (error || !ev) throw error || new Error('Evento no hallado');
                window.__ctxEventoId = ev.id;
                window.__ctxOrgId = ev.org_id || null;
                window.__ctxEv = ev;
                window.__ctxRol = rol;

                // Inyecta el MISMO silo CSS que usa su landing (mismo template_id/categoria_slug).
                let cssOK = true;
                try {
                    if (ev.primary_color) document.documentElement.style.setProperty('--master-accent', ev.primary_color);
                    cssOK = await injectAtomicCSS(ev.categoria_slug, ev.template_id);
                } catch (e) { cssOK = false; }
                if (!cssOK) {
                    document.body.innerHTML = '<div style="min-height:100vh; display:flex; align-items:center; justify-content:center; text-align:center; padding:2rem; color:#fff; background:#0a0a0c;"><p style="max-width:400px; opacity:0.8;">No pudimos cargar el diseño de este evento. Vuelve a intentarlo.</p></div>';
                    return;
                }

                // Activación de Ámbito Dual (misma del landing)
                const tplNormal = `tpl-${ev.template_id || 'F3'}`;
                const tplLower = `tpl-${(ev.template_id || 'f3').toLowerCase()}`;
                document.body.className = `${tplNormal} ${tplLower}`;

                const content = ev.config_landing?.content || {};
                const formSolo = content.form_solo ? content.form_solo.activo !== false : true;

                // Hero en 2 líneas (misma lógica del landing)
                const __tituloEl = document.getElementById('event-title');
                const __tituloRaw = (ev.nombre || '').toUpperCase();
                const __palabras = __tituloRaw.split(' ');
                const __mitad = Math.ceil(__palabras.length / 2);
                const __l1 = document.createElement('span'); __l1.className = 'hero-title-line1'; __l1.textContent = __palabras.slice(0, __mitad).join(' ');
                const __l2 = document.createElement('span'); __l2.className = 'hero-title-line2'; __l2.textContent = __palabras.slice(__mitad).join(' ');
                __tituloEl.textContent = ''; __tituloEl.appendChild(__l1); __tituloEl.appendChild(__l2);

                document.getElementById('org-name-badge').innerText = ev.organizaciones?.nombre.toUpperCase() || "--";
                document.getElementById('meta-fecha').innerText = ev.fecha;
                document.getElementById('meta-hora').innerText = `${ev.hora} HRS`;
                document.getElementById('meta-lugar').innerText = (ev.ubicacion || "--").toUpperCase();
                if (ev.imagen_url) document.getElementById('mod-hero').style.backgroundImage = `url('${ev.imagen_url}')`;

                // Countdown
                const target = parseSpanishDate(ev.fecha, ev.hora).getTime();
                setInterval(() => {
                    const diff = target - Date.now();
                    if (diff <= 0) return;
                    document.getElementById('cd-days').innerText = Math.floor(diff / 86400000).toString().padStart(2, '0');
                    document.getElementById('cd-hours').innerText = Math.floor((diff % 86400000) / 3600000).toString().padStart(2, '0');
                    document.getElementById('cd-mins').innerText = Math.floor((diff % 3600000) / 60000).toString().padStart(2, '0');
                    document.getElementById('cd-secs').innerText = Math.floor((diff % 60000) / 1000).toString().padStart(2, '0');
                }, 1000);

                document.getElementById('loader').style.display = 'none';
                document.getElementById('mod-form').style.display = 'block';
                log("LINK: Evento cargado para registro: " + (ev.nombre || '') + " (id=" + ev.id + ", rol=" + rol + ").", "LINK");

                if (!formSolo) {
                    document.getElementById('form-nuevo').style.display = 'none';
                    document.getElementById('form-ya').style.display = 'none';
                    showBadge('form-alert-badge', 'El registro con invitación no está disponible para este evento.', 'err');
                    log("INFO: form_solo.activo=false — registro desactivado.", "INFO");
                }
            } catch (err) {
                log("ERROR: " + err.message, "ERROR");
                document.body.innerHTML = '<div style="min-height:100vh; display:flex; align-items:center; justify-content:center; text-align:center; padding:2rem; color:#fff; background:#0a0a0c;"><p style="max-width:400px; opacity:0.8;">No pudimos cargar el evento. Vuelve a intentarlo.</p></div>';
            }
        }

        document.getElementById('master-reg-form').addEventListener('submit', async function (e) {
            e.preventDefault();
            const ev = window.__ctxEv;
            if (!ev) { showBadge('form-alert-badge', 'Evento no cargado.', 'err'); return; }
            const nombre = document.getElementById('reg-nombre').value.trim();
            const cedula = document.getElementById('reg-cedula').value.trim();
            const telefono = document.getElementById('reg-telefono').value.trim();
            const rol = window.__ctxRol || 'invitado';
            if (!nombre || !cedula || !telefono) { showBadge('form-alert-badge', 'Completa nombre, cédula y teléfono.', 'err'); return; }

            const btn = document.querySelector('#master-reg-form .btn-submit');
            btn.disabled = true; btn.textContent = 'Generando invitación…';
            try {
                const { data: dup } = await sbClient.from('inscritos').select('id').eq('cedula', cedula).eq('evento_id', ev.id).maybeSingle();
                if (dup) { showBadge('form-alert-badge', 'Esta cédula ya está registrada. Usa la pestaña RECUPERAR.', 'err'); btn.disabled = false; btn.textContent = 'Generar Invitación →'; return; }
                const qr = 'QR-' + UID();
                const payload = {
                    evento_id: ev.id,
                    org_id: window.__ctxOrgId,
                    evento_nombre: ev.nombre,
                    evento_fecha: ev.fecha,
                    nombre: nombre,
                    cedula: cedula,
                    telefono: telefono,
                    whatsapp: telefono,
                    tipo: rol,
                    tipo_ayuda: rol,
                    cuenta_aforo: true,
                    qr_code: qr,
                    used: false,
                    fecha_inscripcion: TODAY(),
                    hora_inscripcion: NOW(),
                    respuestas_custom: { rol, origen: 'pagina-registro' }
                };
                const { error } = await sbClient.from('inscritos').insert(payload);
                if (error) throw error;
                log("INFO: Invitación creada (rol=" + rol + ", cuenta_aforo=true, " + qr + ").", "INFO");
                mostrarInvitacion(nombre, (ev.nombre || '') + ' · ' + (ev.fecha || ''), qr);
            } catch (err) {
                log("ERROR: " + err.message, "ERROR");
                btn.disabled = false; btn.textContent = 'Generar Invitación →';
                showBadge('form-alert-badge', 'Hubo un problema al generar tu invitación. Inténtalo de nuevo.', 'err');
            }
        });

        document.getElementById('master-rec-form').addEventListener('submit', async function (e) {
            e.preventDefault();
            const ev = window.__ctxEv;
            if (!ev) { showBadge('rec-alert-badge', 'Evento no cargado.', 'err'); return; }
            const cedula = document.getElementById('rec-cedula').value.trim();
            if (!cedula) { showBadge('rec-alert-badge', 'Ingresa tu cédula.', 'err'); return; }
            const btn = document.querySelector('#master-rec-form .btn-submit');
            btn.disabled = true; btn.textContent = 'Buscando…';
            try {
                const { data: ins, error } = await sbClient.from('inscritos').select('*').eq('cedula', cedula).eq('evento_id', ev.id).maybeSingle();
                if (error) throw error;
                if (!ins) { showBadge('rec-alert-badge', 'No encontramos una invitación con esa cédula.', 'err'); btn.disabled = false; btn.textContent = 'Recuperar Invitación →'; return; }
                const qr = ins.qr_code || ('QR-' + UID());
                log("LINK: Invitación recuperada por cédula (" + (ins.id || '') + ").", "LINK");
                mostrarInvitacion(ins.nombre, (ev.nombre || '') + ' · ' + (ev.fecha || ''), qr);
            } catch (err) {
                log("ERROR: " + err.message, "ERROR");
                btn.disabled = false; btn.textContent = 'Recuperar Invitación →';
                showBadge('rec-alert-badge', 'Hubo un problema al recuperar tu invitación.', 'err');
            }
        });

        window.onload = init;
    </script>
</body>
</html>
