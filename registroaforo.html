<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Registro · Hostal Terraza</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.3.0/dist/fonts/geist.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Kernel SaaS agnóstico (espejo del landing: reset + grano + IoC) -->
    <style>
        html, body { margin: 0; padding: 0; min-height: 100%; background-color: #050505; color: #ffffff; font-family: 'Geist', sans-serif; overflow-x: hidden; }
        body::before {
            content: ""; position: fixed; inset: 0; z-index: 9999; pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            opacity: 0.04;
        }
        section, header, footer { display: none; }
        .loading-overlay { position: fixed; inset: 0; background: #000; z-index: 999; display: flex; align-items: center; justify-content: center; font-weight: 900; letter-spacing: 3px; text-transform: uppercase; }
        /* Estilo mínimo para el formulario de registro (no forma parte del template del landing) */
        .inv-badge { font-size: 0.68rem; letter-spacing: 0.28em; text-transform: uppercase; font-weight: 900; color: var(--gold, #ff9f1c); margin-bottom: 0.6rem; }
        /* Página solo-cabezote+formulario: neutraliza el grid/hero del template del landing */
        body.page-registro #main-content-flow { display: block !important; }
        body.page-registro #mod-hero {
            display: block !important;
            min-height: 0 !important;
            padding: 0 !important;
            margin: 0 !important;
            background: none !important;
        }
        body.page-registro #mod-hero::after { display: none !important; }
        body.page-registro #cabezote-img { display: block; width: 100%; height: auto; }
        body.page-registro #mod-form { display: block !important; padding: 1.5rem 6% 3rem; border-bottom: none !important; }
        body.page-registro .wa-row { display: flex; gap: 0.5rem; align-items: stretch; margin-bottom: 1.1rem; }
        body.page-registro .wa-code { flex: 0 0 128px; width: auto; margin-bottom: 0; min-width: 0; }
        body.page-registro .wa-number { flex: 1; min-width: 0; margin-bottom: 0; }
        body.page-registro .wa-code option { background: #14032C; color: #fff; }
    </style>
</head>
<body class="tpl-init page-registro">
    <div id="loader" class="loading-overlay">CARGANDO REGISTRO…</div>

    <main id="main-content-flow">

        <!-- CABEZOTE: imagen estática cargada en /imagenes (único encabezado de la página) -->
        <header id="mod-hero" class="hero">
            <img id="cabezote-img" src="/imagenes/cabezote%20tropilove%20formulario.jpg.jpeg" alt="Cabezote del evento">
        </header>

        <!-- FORMULARIO DE REGISTRO (captura simple: nombre, cédula, whatsapp → BD) -->
        <section id="mod-form">
            <div class="form-master-box">
                <p class="inv-badge" id="form-alert-badge" style="display:none"></p>
                <form id="master-reg-form" novalidate>
                    <input type="text" id="reg-nombre" class="form-input" placeholder="Nombre completo *" required>
                    <input type="text" id="reg-cedula" class="form-input" placeholder="Cédula *" required>
                    <div class="wa-row">
                        <select id="reg-whatsapp-code" class="form-input wa-code">
                            <option value="+57" selected>+57 Colombia</option>
                            <option value="+58">+58 Venezuela</option>
                            <option value="+1">+1 EE. UU. / Canadá</option>
                            <option value="+52">+52 México</option>
                            <option value="+34">+34 España</option>
                            <option value="+51">+51 Perú</option>
                            <option value="+54">+54 Argentina</option>
                            <option value="+56">+56 Chile</option>
                            <option value="+593">+593 Ecuador</option>
                            <option value="+55">+55 Brasil</option>
                            <option value="+507">+507 Panamá</option>
                            <option value="+502">+502 Guatemala</option>
                            <option value="+503">+503 El Salvador</option>
                            <option value="+504">+504 Honduras</option>
                            <option value="+505">+505 Nicaragua</option>
                            <option value="+506">+506 Costa Rica</option>
                            <option value="otro">Otro…</option>
                        </select>
                        <input type="tel" id="reg-whatsapp" class="form-input wa-number" placeholder="Número de WhatsApp *" required>
                    </div>
                    <input type="text" id="reg-whatsapp-custom-code" class="form-input" placeholder="Código de país (ej. +7)" maxlength="6" style="display:none">
                    <button type="submit" class="btn-submit">Registrarme →</button>
                </form>
                <p class="inv-badge" id="form-success-msg" style="display:none"></p>
            </div>
        </section>

    </main>

    <script>
        const SB_URL = "https://ctgyvydzshueemlelkzv.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN0Z3l2eWR6c2h1ZWVtbGVsa3p2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2NTc1NzAsImV4cCI6MjA4OTIzMzU3MH0.3pMA-VZLV2Kfyl6BD-x8v79P7UuXSfMgtIwnfoP_VuY";
        const sbClient = window.supabase.createClient(SB_URL, SB_KEY);

        function log(format, t = 'INFO') {
            const colors = { 'INFO': '#00ff88', 'LINK': '#f1c40f', 'TIME': '#9b59b6', 'TRACE': '#e67e22', 'DEBUG': '#3498db', 'ERROR': '#ff4d4d' };
            console.log('%c[' + new Date().toLocaleTimeString() + '] [' + t + '] ' + format, 'color: ' + (colors[t] || '#fff') + '; font-weight: bold;');
        }

        function TODAY() { return new Date().toLocaleDateString('es-CO'); }
        function NOW()   { return new Date().toLocaleTimeString('es-CO'); }

        // Reutiliza el MISMO mecanismo de inyección de CSS del landing (Data-First).
        function injectAtomicCSS(cat, tplId) {
            return new Promise((resolve) => {
                const path = `css/templates/${(cat || 'fiesta').toLowerCase()}/${(tplId || 'f3').toLowerCase()}.css?v=${Date.now()}`;
                let link = document.querySelector('link[data-template-css]');
                if (!link) { link = document.createElement('link'); link.rel = 'stylesheet'; link.setAttribute('data-template-css', 'true'); document.head.appendChild(link); }
                let isResolved = false;
                const timer = setTimeout(() => { if (!isResolved) { isResolved = true; log("ERROR: Timeout 5s al cargar CSS [" + path + "].", "ERROR"); resolve(false); } }, 5000);
                link.onload = () => {
                    if (!isResolved) { isResolved = true; clearTimeout(timer); log("LINK: Estilo [" + tplId + "] cargado (reuso del template del landing).", "LINK"); resolve(true); }
                };
                link.onerror = () => { if (!isResolved) { isResolved = true; clearTimeout(timer); log("ERROR: No se pudo cargar [" + path + "].", "ERROR"); resolve(false); } };
                link.href = path;
            });
        }

        function showBadge(id, msg, tipo) {
            const el = document.getElementById(id);
            el.style.display = 'block';
            el.textContent = msg;
            el.style.color = tipo === 'err' ? '#ff6b6b' : 'inherit';
        }

        async function init() {
            log("Iniciando Registro (ADR-030) — captura simple de datos con estilos del template del landing.", "INFO");
            const params = new URLSearchParams(window.location.search);
            const slug = params.get('slug');
            const id = params.get('id');
            const rol = (params.get('rol') || 'invitado').trim().toLowerCase();
            if (!slug && !id) {
                document.body.innerHTML = '<div style="min-height:100vh; display:flex; align-items:center; justify-content:center; padding:2rem; color:#fff; background:#0a0a0c; text-align:center;"><p>Evento no especificado. Revisa el enlace.</p></div>';
                log("ERROR: Sin slug ni id.", "ERROR");
                return;
            }
            try {
                const timeoutPromise = new Promise((_, rej) => setTimeout(() => rej(new Error('Timeout 8s')), 8000));
                let query = sbClient.from('eventos').select('*, organizaciones(nombre)');
                if (slug) query = query.eq('slug', slug).single();
                else query = query.eq('id', id).single();
                const { data: ev, error } = await Promise.race([query, timeoutPromise]);
                if (error || !ev) throw error || new Error('Evento no hallado');
                window.__ctxEventoId = ev.id;
                window.__ctxOrgId = ev.org_id || null;
                window.__ctxEv = ev;
                window.__ctxRol = rol;

                // Inyecta el MISMO silo CSS que usa su landing (mismo template_id/categoria_slug).
                let cssOK = true;
                try {
                    if (ev.primary_color) document.documentElement.style.setProperty('--master-accent', ev.primary_color);
                    cssOK = await injectAtomicCSS(ev.categoria_slug, ev.template_id);
                } catch (e) { cssOK = false; }
                if (!cssOK) {
                    document.body.innerHTML = '<div style="min-height:100vh; display:flex; align-items:center; justify-content:center; text-align:center; padding:2rem; color:#fff; background:#0a0a0c;"><p style="max-width:400px; opacity:0.8;">No pudimos cargar el diseño de este evento. Vuelve a intentarlo.</p></div>';
                    return;
                }

                // Activación de Ámbito Dual (misma del landing)
                const tplNormal = `tpl-${ev.template_id || 'F3'}`;
                const tplLower = `tpl-${(ev.template_id || 'f3').toLowerCase()}`;
                document.body.className = `${tplNormal} ${tplLower} page-registro`;

                const content = ev.config_landing?.content || {};
                const formSolo = content.form_solo ? content.form_solo.activo !== false : true;

                document.getElementById('loader').style.display = 'none';
                document.getElementById('mod-form').style.display = 'block';
                log("LINK: Evento cargado para registro: " + (ev.nombre || '') + " (id=" + ev.id + ", rol=" + rol + ").", "LINK");

                if (!formSolo) {
                    document.getElementById('master-reg-form').style.display = 'none';
                    showBadge('form-alert-badge', 'El registro no está disponible para este evento.', 'err');
                    log("INFO: form_solo.activo=false — registro desactivado.", "INFO");
                }
            } catch (err) {
                log("ERROR: " + err.message, "ERROR");
                document.body.innerHTML = '<div style="min-height:100vh; display:flex; align-items:center; justify-content:center; text-align:center; padding:2rem; color:#fff; background:#0a0a0c;"><p style="max-width:400px; opacity:0.8;">No pudimos cargar el evento. Vuelve a intentarlo.</p></div>';
            }
        }

        document.getElementById('reg-whatsapp-code').addEventListener('change', function () {
            const isOtro = this.value === 'otro';
            document.getElementById('reg-whatsapp-custom-code').style.display = isOtro ? 'block' : 'none';
        });

        document.getElementById('master-reg-form').addEventListener('submit', async function (e) {
            e.preventDefault();
            const ev = window.__ctxEv;
            if (!ev) { showBadge('form-alert-badge', 'Evento no cargado.', 'err'); return; }
            const nombre = document.getElementById('reg-nombre').value.trim();
            const cedula = document.getElementById('reg-cedula').value.trim();
            const phone = document.getElementById('reg-whatsapp').value.trim();
            const codeSel = document.getElementById('reg-whatsapp-code');
            let code = codeSel.value === 'otro' ? (document.getElementById('reg-whatsapp-custom-code').value || '').trim() : codeSel.value;
            if (code && !code.startsWith('+')) code = '+' + code;
            const rol = window.__ctxRol || 'invitado';
            if (!nombre || !cedula || !phone) { showBadge('form-alert-badge', 'Completa nombre, cédula y WhatsApp.', 'err'); return; }
            if (codeSel.value === 'otro' && !code) { showBadge('form-alert-badge', 'Ingresa el código de país.', 'err'); return; }
            const whatsapp = (code + phone).trim();

            const btn = document.querySelector('#master-reg-form .btn-submit');
            btn.disabled = true; btn.textContent = 'Registrando…';
            try {
                const { data: dup } = await sbClient.from('inscritos').select('id').eq('cedula', cedula).eq('evento_id', ev.id).maybeSingle();
                if (dup) { showBadge('form-alert-badge', 'Esta cédula ya está registrada en este evento.', 'err'); btn.disabled = false; btn.textContent = 'Registrarme →'; return; }
                const payload = {
                    evento_id: ev.id,
                    org_id: window.__ctxOrgId,
                    evento_nombre: ev.nombre,
                    evento_fecha: ev.fecha,
                    nombre: nombre,
                    cedula: cedula,
                    whatsapp: whatsapp,
                    telefono: whatsapp,
                    tipo: rol,
                    tipo_ayuda: rol,
                    cuenta_aforo: true,
                    used: false,
                    fecha_inscripcion: TODAY(),
                    hora_inscripcion: NOW(),
                    respuestas_custom: { rol, origen: 'pagina-registro' }
                };
                const { error } = await sbClient.from('inscritos').insert(payload);
                if (error) throw error;
                log("INFO: Registro guardado (rol=" + rol + ", cuenta_aforo=true, cédula=" + cedula + ", whatsapp=" + whatsapp + ").", "INFO");
                btn.disabled = false; btn.textContent = 'Registrarme →';
                document.getElementById('master-reg-form').style.display = 'none';
                const ok = document.getElementById('form-success-msg');
                ok.style.display = 'block';
                ok.style.color = '#25d366';
                ok.textContent = '¡Gracias, ' + nombre + '! Tu registro fue guardado.';
                setTimeout(() => {
                    document.getElementById('master-reg-form').reset();
                    document.getElementById('reg-whatsapp-custom-code').style.display = 'none';
                    ok.style.display = 'none';
                    document.getElementById('master-reg-form').style.display = 'block';
                }, 2500);
            } catch (err) {
                log("ERROR: " + err.message, "ERROR");
                btn.disabled = false; btn.textContent = 'Registrarme →';
                showBadge('form-alert-badge', 'Hubo un problema al guardar tu registro. Inténtalo de nuevo.', 'err');
            }
        });

        window.onload = init;
    </script>
</body>
</html>
