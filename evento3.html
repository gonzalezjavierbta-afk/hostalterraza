<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Master Orchestrator v192 · Multimedia & Sponsors Active</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.3.0/dist/fonts/geist.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/qr-creator/dist/qr-creator.min.js"></script>
    <style>
        :root { --main-bg: #0a0a0c; --text-color: #ffffff; }
        html, body { margin: 0; padding: 0; min-height: 100%; background-color: var(--main-bg); color: var(--text-color); font-family: 'Geist', sans-serif; overflow-x: hidden; }
        body::before { content: ""; position: fixed; inset: 0; z-index: 9999; pointer-events: none; opacity: 0.04; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E"); }
        section, header { display: none; }
        .loading-overlay { position: fixed; inset: 0; background: #000; z-index: 999; display: flex; align-items: center; justify-content: center; font-weight: 900; letter-spacing: 3px; }
        .tab-btn { background: none; border: none; color: rgba(255,255,255,0.4); cursor: pointer; font-weight: 800; text-transform: uppercase; font-size: 0.7rem; }
    </style>
</head>

<body class="tpl-init">
    <div id="loader" class="loading-overlay">SINCRO MULTIMEDIA v192...</div>

    <header id="mod-hero" class="hero">
        <div id="org-name-badge" style="position:absolute; top:2.5rem; left:2.5rem; font-weight:900; letter-spacing:2px; text-transform:uppercase; z-index:10;">--</div>
        <div class="hero-content" style="position:relative; z-index:5;">
            <h1 id="event-title">--</h1>
            <div class="hero-meta">
                <div class="meta-item"><svg class="meta-svg" viewBox="0 0 24 24" width="20" height="20"><path fill="#d72dc0" d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2z"/></svg><span id="meta-fecha">--/--/--</span></div>
                <div class="meta-item"><svg class="meta-svg" viewBox="0 0 24 24" width="20" height="20"><path fill="#d72dc0" d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58-8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg><span id="meta-hora">--:--</span></div>
                <div class="meta-item"><svg class="meta-svg" viewBox="0 0 24 24" width="20" height="20"><path fill="#d72dc0" d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg><span id="meta-lugar">--</span></div>
            </div>
            <div id="unified-frame" class="unified-countdown-frame">
                <div class="cd-block"><span id="cd-days" class="cd-v">00</span><span class="cd-l">DÍAS</span></div>
                <div class="cd-block"><span id="cd-hours" class="cd-v">00</span><span class="cd-l">HORAS</span></div>
                <div class="cd-block"><span id="cd-mins" class="cd-v">00</span><span class="cd-l">MIN</span></div>
                <div class="cd-block"><span id="cd-secs" class="cd-v">00</span><span class="cd-l">SEG</span></div>
            </div>
        </div>
    </header>

    <main id="main-content-flow">
        <section id="mod-lineup">
            <div class="lineup-grid" style="display:grid; grid-template-columns: 1fr 1.1fr; gap: 5rem; max-width: 1100px; margin: 0 auto;">
                <div class="poster-box" style="display:flex; justify-content:center; border-right:1px solid rgba(255,255,255,0.1); padding-right:5rem;"><img id="db-poster-img" src="" alt="Poster" style="width:340px; border-radius:15px; border:4px solid #d72dc0;"></div>
                <div id="db-lineup" style="display:flex; flex-direction:column; padding-left:5rem;"></div>
            </div>
        </section>

        <!-- MÓDULO 3: GALERÍA (v192) -->
        <section id="mod-gallery">
            <div id="db-gallery-grid"></div>
            <div class="media-grid" style="display:grid; grid-template-columns: 1.6fr 1fr; gap: 2.5rem; max-width: 1100px; margin: 0 auto;">
                <div id="db-video-content" style="aspect-ratio: 16/9; background: #000; border-radius: 15px; border: 1px solid #d72dc0; overflow: hidden;"></div>
                <div id="db-spotify-embed" style="border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); overflow: hidden;"></div>
            </div>
        </section>

        <section id="mod-info-tecnica">
            <div class="data-cards-container" style="display:grid; grid-template-columns: repeat(2, 1fr); gap: 1.5rem; max-width: 1100px; margin: 0 auto;">
                <div class="card-item"><span id="db-dress-val" style="font-size:1.4rem; font-weight:900;">--</span></div>
                <div class="card-item"><span id="db-aforo-val" style="font-size:1.4rem; font-weight:900;">--</span></div>
            </div>
        </section>

        <section id="mod-faq-ubicacion">
            <div id="mod-faq"><h2>FAQ</h2><div id="db-faq-list"></div></div>
            <div id="db-mapa-container"></div>
        </section>

        <!-- MÓDULO 6: SPONSORS (v192) -->
        <section id="mod-sponsors" style="text-align:center; padding:4rem 0;">
            <div id="db-sponsors-list"></div>
        </section>

        <section id="mod-form">
            <div class="form-master-box"><div id="form-nuevo"><form id="master-reg-form"><input type="text" id="reg-nombre" placeholder="Nombre completo *" required><button type="submit">CONFIRMAR →</button></form></div></div>
        </section>
    </main>

    <script>
        const SB_URL = "https://ctgyvydzshueemlelkzv.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN0Z3l2eWR6c2h1ZWVtbGVsa3p2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2NTc1NzAsImV4cCI6MjA4OTIzMzU3MH0.3pMA-VZLV2Kfyl6BD-x8v79P7UuXSfMgtIwnfoP_VuY";
        const sbClient = window.supabase.createClient(SB_URL, SB_KEY);

        function logStatus(m, t = 'INFO') {
            const colors = { 'INFO':'#00ff88', 'LINK':'#f1c40f', 'TIME':'#9b59b6', 'TRACE':'#e67e22', 'DEBUG':'#3498db', 'ERROR':'#ff4d4d' };
            console.log(`%c[${new Date().toLocaleTimeString()}] [${t}] ${m}`, `color: ${colors[t] || '#fff'}; font-weight: bold;`);
        }

        function parseSpanishDate(dateStr, timeStr) {
            const months = { "enero":"01", "febrero":"02", "marzo":"03", "abril":"04", "mayo":"05", "junio":"06", "julio":"07", "agosto":"08", "septiembre":"09", "octubre":"10", "noviembre":"11", "diciembre":"12" };
            const parts = dateStr.toLowerCase().split(' de ');
            if (parts.length === 3) return new Date(`${parts[1].trim()}-${months[parts[2].trim()]}-${parts.trim().padStart(2, '0')}T${timeStr}`);
            return new Date(`${dateStr}T${timeStr}`);
        }

        async function injectAtomicCSS(catSlug, tplId) {
            return new Promise((resolve) => {
                const path = `css/templates/${(catSlug || 'fiesta').toLowerCase()}/${(tplId || 'f3').toLowerCase()}.css?v=${Date.now()}`;
                let link = document.querySelector('link[data-template-css]');
                if (!link) { link = document.createElement('link'); link.rel = 'stylesheet'; link.setAttribute('data-template-css', 'true'); document.head.appendChild(link); }
                link.onload = () => { logStatus(`LINK: Estilo [${tplId}] cargado.`, "LINK"); resolve(true); };
                link.onerror = () => { logStatus(`ERROR: Fallo carga en [${path}]`, "ERROR"); resolve(false); };
                link.href = path;
            });
        }

        async function initEvento() {
            logStatus("Iniciando Orquestador v192 - Multimedia Sync.", "INFO");
            const slug = new URLSearchParams(window.location.search).get('slug');
            if (!slug) return;
            try {
                const { data: ev, error } = await sbClient.from('eventos').select('*, organizaciones(nombre)').eq('slug', slug).single();
                if (error || !ev) throw new Error("Evento no hallado.");
                
                await injectAtomicCSS(ev.categoria_slug, ev.template_id);
                document.body.className = `tpl-${(ev.template_id || 'f3').toLowerCase()}`;

                const target = parseSpanishDate(ev.fecha, ev.hora).getTime();
                setInterval(() => {
                    const diff = target - Date.now();
                    if (diff <= 0) return;
                    document.getElementById('cd-days').innerText = Math.floor(diff / 86400000).toString().padStart(2, '0');
                    document.getElementById('cd-hours').innerText = Math.floor((diff % 86400000) / 3600000).toString().padStart(2, '0');
                    document.getElementById('cd-mins').innerText = Math.floor((diff % 3600000) / 60000).toString().padStart(2, '0');
                    document.getElementById('cd-secs').innerText = Math.floor((diff % 60000) / 1000).toString().padStart(2, '0');
                }, 1000);

                document.getElementById('event-title').innerText = ev.nombre.toUpperCase();
                document.getElementById('org-name-badge').innerText = ev.organizaciones?.nombre.toUpperCase() || "--";
                document.getElementById('meta-fecha').innerText = ev.fecha;
                document.getElementById('meta-hora').innerText = `${ev.hora} HRS`;
                document.getElementById('meta-lugar').innerText = (ev.ubicacion || "--").toUpperCase();
                if (ev.imagen_url) document.getElementById('mod-hero').style.backgroundImage = `url('${ev.imagen_url}')`;

                const content = ev.config_landing?.content || {};
                
                // INYECCIÓN CUANTITATIVA GALERÍA [cite: 827]
                if (content.gallery && Array.isArray(content.gallery)) {
                    document.getElementById('db-gallery-grid').innerHTML = content.gallery.map(url => `<img src="${url}" class="gallery-img">`).join('');
                    logStatus(`TRACE: Galería inyectada (${content.gallery.length} fotos).`, "TRACE");
                }

                // INYECCIÓN CUANTITATIVA SPONSORS [cite: 827]
                const spList = Array.isArray(content.sponsors) ? content.sponsors : (content.sponsors || "").split(',').map(s => s.trim());
                document.getElementById('db-sponsors-list').innerHTML = spList.map(name => `<span class="sponsor-tag">${name.toUpperCase()}</span>`).join('');
                logStatus(`TRACE: Sponsors inyectados (${spList.length} marcas).`, "TRACE");

                // INYECCIÓN LINEUP
                if (content.dj_lineup) {
                    document.getElementById('db-lineup').innerHTML = content.dj_lineup.map(dj => `
                        <div style="display:flex; align-items:center; gap:1.8rem; margin-bottom:2rem;">
                            <img src="https://images.unsplash.com/photo-1520813792240-56fc4a3765a7?q=80&w=200" style="width:65px; height:65px; border-radius:50%; border:2px solid #d72dc0; object-fit:cover;">
                            <span style="font-weight:900; text-transform:uppercase;">${dj.toUpperCase()}</span>
                        </div>`).join('');
                }

                document.getElementById('db-dress-val').innerText = (content.dresscode || "Formal").toUpperCase();
                document.getElementById('db-aforo-val').innerText = `${ev.aforo_max || 100} PERSONAS`;
                document.getElementById('db-poster-img').src = ev.poster_url || ev.imagen_url;

                const modules = ['mod-hero', 'mod-lineup', 'mod-gallery', 'mod-info-tecnica', 'mod-faq-ubicacion', 'mod-sponsors', 'mod-form'];
                modules.forEach(id => { if (document.getElementById(id)) document.getElementById(id).style.setProperty('display', 'block', 'important'); });

            } catch (err) { logStatus(`FALLO CRÍTICO: ${err.message}`, "ERROR"); } finally { document.getElementById('loader').style.display = 'none'; }
        }
        window.onload = initEvento;
    </script>
</body>
</html>
