<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Master Orchestrator v147 · Full Integrity</title>
    
    <!-- CDNs Obligatorios (Contrato v107) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.3.0/dist/fonts/geist.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/qr-creator/dist/qr-creator.min.js"></script>

    <style>
        :root { --main-bg: #050505; --gold: #df20b6; --text-color: #ffffff; }
        html, body { margin: 0; padding: 0; min-height: 100%; background: var(--main-bg); color: var(--text-color); font-family: 'Geist', sans-serif; overflow-x: hidden; }
        
        /* ESCUDO DE GRANO (v47) */
        body::before { content: ""; position: fixed; inset: 0; z-index: 9999; pointer-events: none; opacity: 0.04; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E"); }
        
        /* Blindaje: Oculto hasta validación GOLD */
        section, header { display: none; }
        .loading-overlay { position: fixed; inset: 0; background: #000; z-index: 999; display: flex; align-items: center; justify-content: center; font-weight: 900; letter-spacing: 3px; }
        
        /* Estilos Base Formulario Dual-Path */
        .form-tabs { display: flex; gap: 1rem; margin-bottom: 2rem; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .tab-btn { background: none; border: none; color: rgba(255,255,255,0.4); padding-bottom: 1rem; cursor: pointer; font-weight: 800; text-transform: uppercase; font-size: 0.75rem; }
        .tab-btn.active { color: var(--gold); border-bottom: 2px solid var(--gold); }
    </style>
</head>

<body>
    <div id="loader" class="loading-overlay">VERIFICACIÓN MAESTRA V147...</div>

    <header id="mod-hero" class="hero">
        <div id="org-name-badge" style="position:absolute; top:2rem; left:2rem; font-weight:900; letter-spacing:2px; text-transform:uppercase;">--</div>
        <div class="hero-content">
            <h1 id="event-title" class="hero-title">--</h1>
            <div class="hero-meta" style="display:flex; gap:2rem; justify-content:center; margin: 1rem 0;">
                <span id="meta-fecha">--/--/--</span>
                <span id="meta-hora">--:--</span>
                <span id="meta-lugar">--</span>
            </div>
            <div id="unified-frame" class="unified-countdown-frame">
                <div class="cd-block"><span id="cd-days" class="cd-v">00</span><span>DÍAS</span></div>
                <div class="cd-block"><span id="cd-hours" class="cd-v">00</span><span>HORAS</span></div>
                <div class="cd-block"><span id="cd-mins" class="cd-v">00</span><span>MIN</span></div>
                <div class="cd-block"><span id="cd-secs" class="cd-v">00</span><span>SEG</span></div>
            </div>
        </div>
    </header>

    <main id="main-content-flow">
        <!-- 1. LINEUP & POSTER -->
        <section id="mod-lineup">
            <div id="db-poster-container"><img id="db-poster-img" src="" alt="Poster" style="max-width:300px;"></div>
            <div id="db-lineup"></div>
        </section>

        <!-- 2. GALLERY & MEDIA -->
        <section id="mod-gallery">
            <div id="db-gallery-grid"></div>
            <div class="media-sync">
                <div id="mod-trailer"><div id="db-video-content"></div></div>
                <div id="mod-playlist"><div id="db-spotify-embed"></div></div>
            </div>
        </section>

        <!-- 3. DATA CARDS -->
        <section id="mod-info-tecnica">
            <div class="card-item"><span id="db-dress-val">--</span></div>
            <div class="card-item"><span id="db-guest-val">--</span></div>
            <div class="card-item"><span id="db-aforo-val">--</span></div>
            <div class="card-item"><span id="db-ticket-val">--</span></div>
        </section>

        <!-- 4. FAQ & UBICACIÓN -->
        <section id="mod-faq-ubicacion">
            <div id="db-faq-list"></div>
            <div id="venue-name">--</div>
            <div id="db-mapa-container"></div>
        </section>

        <!-- 5. SPONSORS -->
        <section id="mod-sponsors">
            <div id="db-sponsors-list"></div>
        </section>

        <!-- 6. MOTOR DUAL-PATH (RESTORED) -->
        <section id="mod-form">
            <div class="form-master-box">
                <div class="form-tabs">
                    <button id="tab-new" class="tab-btn active" onclick="switchForm('nuevo')">Registro</button>
                    <button id="tab-old" class="tab-btn" onclick="switchForm('ya')">Recuperar QR</button>
                </div>
                <div id="form-nuevo">
                    <form id="master-reg-form">
                        <input type="text" id="reg-nombre" placeholder="Nombre completo *" required>
                        <input type="text" id="reg-cedula" placeholder="Cédula *" required>
                        <input type="tel" id="reg-tel" placeholder="WhatsApp *" required>
                        <button type="submit" class="btn-submit">Confirmar Asistencia →</button>
                    </form>
                </div>
                <div id="form-ya" style="display:none;">
                    <input type="text" id="rec-cedula" placeholder="Ingresa tu cédula *">
                    <button class="btn-submit" onclick="alert('Buscando...')">Verificar Datos →</button>
                </div>
            </div>
        </section>
    </main>

    <script>
        const SB_URL = "https://ctgyvydzshueemlelkzv.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN0Z3l2eWR6c2h1ZWVtbGVsa3p2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2NTc1NzAsImV4cCI6MjA4OTIzMzU3MH0.3pMA-VZLV2Kfyl6BD-x8v79P7UuXSfMgtIwnfoP_VuY";
        const sbClient = window.supabase.createClient(SB_URL, SB_KEY);

        function logStatus(m, t = 'INFO') {
            const colors = { 'INFO':'#00ff88', 'LINK':'#f1c40f', 'TIME':'#9b59b6', 'TRACE':'#e67e22', 'DEBUG':'#3498db', 'ERROR':'#ff4d4d' };
            console.log(`%c[${new Date().toLocaleTimeString()}] [${t}] ${m}`, `color: ${colors[t] || '#fff'}; font-weight: bold;`);
        }

        function switchForm(type) {
            document.getElementById('tab-new').classList.toggle('active', type === 'nuevo');
            document.getElementById('tab-old').classList.toggle('active', type === 'ya');
            document.getElementById('form-nuevo').style.display = type === 'nuevo' ? 'block' : 'none';
            document.getElementById('form-ya').style.display = type === 'ya' ? 'block' : 'none';
        }

        async function auditCSSRules(templateId) {
            const scope = `.tpl-${templateId.toLowerCase()}`;
            let rulesFound = 0;
            try {
                for (let sheet of document.styleSheets) {
                    if (sheet.href && sheet.href.includes(templateId)) {
                        const rules = sheet.cssRules || sheet.rules;
                        for (let rule of rules) {
                            if (rule.selectorText && rule.selectorText.toLowerCase().includes(scope)) rulesFound++;
                        }
                    }
                }
            } catch (e) {}
            if (rulesFound > 0) logStatus(`AUDIT: ${rulesFound} reglas válidas para ${scope}.`, "LINK");
            else logStatus(`ERROR: No se hallaron estilos para el ámbito ${scope}.`, "ERROR");
        }

        async function injectAtomicCSS(templateId) {
            return new Promise((resolve) => {
                const cssPath = `css/templates/${templateId}.css?v=${Date.now()}`;
                let link = document.querySelector('link[data-template-css]');
                if (!link) {
                    link = document.createElement('link'); link.rel = 'stylesheet';
                    link.setAttribute('data-template-css', 'true'); document.head.appendChild(link);
                }
                link.onload = () => { logStatus(`LINK: Estilo vinculado.`, "LINK"); auditCSSRules(templateId); resolve(true); };
                link.onerror = () => { logStatus(`ERROR 404: No se halló el CSS.`, "ERROR"); resolve(false); };
                link.href = cssPath;
            });
        }

        async function initEvento() {
            logStatus("Iniciando Orquestador v147 - Full Integrity.", "INFO");
            const slug = new URLSearchParams(window.location.search).get('slug');
            if (!slug) return;

            try {
                const { data: ev, error } = await sbClient.from('eventos').select('*, organizaciones(nombre)').eq('slug', slug).single();
                if (error || !ev) throw new Error("Evento no hallado.");

                const templateId = ev.template_id || 'F3';
                document.body.className = `tpl-${templateId} tpl-${templateId.toLowerCase()}`;
                logStatus(`DEBUG: Ámbito [.tpl-${templateId.toLowerCase()}] activo.`, "DEBUG");

                await injectAtomicCSS(templateId);

                // MAPEO DE DATOS
                const content = ev.config_landing?.content || ev.content || {};
                document.getElementById('event-title').innerText = ev.nombre.toUpperCase();
                document.getElementById('org-name-badge').innerText = ev.organizaciones?.nombre.toUpperCase() || "--";
                document.getElementById('meta-fecha').innerText = ev.fecha;
                document.getElementById('meta-hora').innerText = `${ev.hora} HRS`;
                document.getElementById('meta-lugar').innerText = (content.ubicacion || ev.ubicacion || "--").toUpperCase();
                document.getElementById('venue-name').innerText = (content.ubicacion || ev.ubicacion || "--").toUpperCase();

                if (content.dj_lineup) {
                    const lineup = Array.isArray(content.dj_lineup) ? content.dj_lineup : content.dj_lineup.split('\n');
                    document.getElementById('db-lineup').innerHTML = lineup.map(dj => `<div class="dj-item"><span>${dj.trim()}</span></div>`).join('');
                    logStatus(`TRACE: Lineup inyectado (${lineup.length} artistas).`, "TRACE");
                }

                if (content.faq) {
                    const lines = content.faq.split('\n').filter(l => l.includes('|'));
                    document.getElementById('db-faq-list').innerHTML = lines.map(l => {
                        const [q, a] = l.split('|');
                        return `<div class="faq-item" onclick="this.classList.toggle('active')"><div class="faq-header"><span>${q.trim()}</span><div class="faq-icon-circle">+</div></div><div class="faq-answer">${a.trim()}</div></div>`;
                    }).join('');
                    logStatus(`TRACE: FAQ inyectado (${lines.length} preguntas).`, "TRACE");
                }

                // VISIBILIDAD (CONTRATO v121)
                const flags = ev.config_landing?.modules || ev.modules || {};
                const moduleMap = { 'mod-hero':true, 'mod-lineup':flags.dj_lineup, 'mod-gallery':flags.gallery, 'mod-info-tecnica':true, 'mod-faq-ubicacion':true, 'mod-sponsors':flags.sponsors, 'mod-form':true };
                
                Object.keys(moduleMap).forEach(id => {
                    const el = document.getElementById(id);
                    if (el) { el.style.setProperty('display', moduleMap[id] ? 'block' : 'none', 'important'); logStatus(`INFO: Módulo [${id}] -> ${moduleMap[id] ? 'FORZADO ACTIVO' : 'OCULTO'}`, "INFO"); }
                });

                logStatus("TIME: Heartbeat sincronizado (3.2rem).", "TIME");
                logStatus("TRACE: 12 Módulos sincronizados | Fidelidad Dual Validada.", "TRACE");

            } catch (err) { logStatus(`FALLO CRÍTICO: ${err.message}`, "ERROR"); } finally { document.getElementById('loader').style.display = 'none'; }
        }
        window.onload = initEvento;
    </script>
</body>
</html>
