    <script>
        const SB_URL = "https://ctgyvydzshueemlelkzv.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN0Z3l2eWR6c2h1ZWVtbGVsa3p2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2NTc1NzAsImV4cCI6MjA4OTIzMzU3MH0.3pMA-VZLV2Kfyl6BD-x8v79P7UuXSfMgtIwnfoP_VuY";
        const sbClient = window.supabase.createClient(SB_URL, SB_KEY);

        function logStatus(m, t = 'INFO') {
            const colors = { 'INFO':'#00ff88', 'LINK':'#f1c40f', 'TIME':'#9b59b6', 'TRACE':'#e67e22', 'DEBUG':'#3498db', 'ERROR':'#ff4d4d' };
            console.log(`%c[${new Date().toLocaleTimeString()}] [${t}] ${m}`, `color: ${colors[t] || '#fff'}; font-weight: bold;`);
        }

        // MOTOR DE FECHAS CALIBRADO v123 [cite: 9, 872]
        function parseSpanishDate(dateStr, timeStr) {
            const months = { "enero":"01", "febrero":"02", "marzo":"03", "abril":"04", "mayo":"05", "junio":"06", "julio":"07", "agosto":"08", "septiembre":"09", "octubre":"10", "noviembre":"11", "diciembre":"12" };
            const parts = dateStr.toLowerCase().split(' de ');
            if (parts.length === 3) {
                const d = parts[0].trim().padStart(2, '0');
                const m = months[parts[1].trim()];
                const a = parts[2].trim();
                return new Date(`${a}-${m}-${d}T${timeStr}`);
            }
            return new Date(`${dateStr}T${timeStr}`);
        }

        function switchForm(type) {
            const isNew = type === 'nuevo';
            document.getElementById('tab-new').classList.toggle('active', isNew);
            document.getElementById('tab-old').classList.toggle('active', !isNew);
            document.getElementById('form-nuevo').style.display = isNew ? 'block' : 'none';
            document.getElementById('form-ya').style.display = isNew ? 'none' : 'block';
            logStatus(`DEBUG: Ruta de formulario cambiada a [${type.toUpperCase()}]`, "DEBUG");
        }



        // === REEMPLAZO QUIRÚRGICO: Bypass de Caché v1.3.56 (única declaración — v1.4.8: se retiró la versión previa de un solo parámetro, que quedaba muerta/sobreescrita por hoisting de JS y nunca se ejecutaba) ===
        async function injectAtomicCSS(cat, tplId) {
            return new Promise((resolve) => {
                const path = `css/templates/${(cat || 'fiesta').toLowerCase()}/${(tplId || 'f3').toLowerCase()}.css?v=${Date.now()}`;
                let link = document.querySelector('link[data-template-css]');
                if (!link) { link = document.createElement('link'); link.rel = 'stylesheet'; link.setAttribute('data-template-css', 'true'); document.head.appendChild(link); }
                
                let isResolved = false;
                const timer = setTimeout(() => {
                    if (!isResolved) {
                        isResolved = true;
                        logStatus(`ERROR: Timeout de 5s al cargar CSS [${path}]. Continuando en degradación suave.`, "ERROR");
                        resolve(false);
                    }
                }, 5000);

                link.onload = () => {
                    if (!isResolved) {
                        isResolved = true;
                        clearTimeout(timer);
                        let rulesCount = 0;
                        try {
                            const sheets = Array.from(document.styleSheets);
                            const targetSheet = sheets.find(s => s.href && s.href.includes((tplId || 'f3').toLowerCase()));
                            if (targetSheet && targetSheet.cssRules) {
                                rulesCount = targetSheet.cssRules.length;
                            }
                        } catch (e) {}
                        logStatus(`LINK: Estilo [${tplId}] cargado con éxito (${rulesCount} reglas CSS).`, "LINK");
                        resolve(true);
                    }
                };

                link.onerror = () => {
                    if (!isResolved) {
                        isResolved = true;
                        clearTimeout(timer);
                        logStatus(`ERROR: Fallo crítico al cargar [${path}]`, "ERROR");
                        resolve(false);
                    }
                };

                link.href = path;
            });
        }

        async function initEvento() {
            logStatus("Iniciando Orquestador v214 - Sistema de Grid Atómico Modular.", "INFO");
            const slug = new URLSearchParams(window.location.search).get('slug');
            if (!slug) return;
            try {
                // Timeout de 8s para sbQuery (Resiliencia P4)
                const sbPromise = sbClient.from('eventos').select('*, organizaciones(nombre)').eq('slug', slug).single();
                const timeoutPromise = new Promise((_, reject) => setTimeout(() => reject(new Error("Timeout Supabase (8s) excedido")), 8000));
                const { data: ev, error } = await Promise.race([sbPromise, timeoutPromise]);
                if (error || !ev) throw new Error(error?.message || "Evento no hallado.");
                
                // DECLARACIÓN ÚNICA DEL CONTEXTO (Solución al SyntaxError) [cite: 12]
                const content = ev.config_landing?.content || {};

                // PUENTE CROMÁTICO DINÁMICO: Inyección en document.documentElement
                const primaryColor = ev.color_primario || content.color_primario || content.accent_color;
                if (primaryColor) {
                    document.documentElement.style.setProperty('--master-accent', primaryColor);
                }
                logStatus("DEBUG: Prioridad de color cedida a --master-accent.", "DEBUG");

                const cssLoadedOK = await injectAtomicCSS(ev.categoria_slug, ev.template_id);
                if (!cssLoadedOK) {
                    // Degradación visible (v1.4.8): antes este fallo solo quedaba en consola y la
                    // página se veía en blanco porque el kernel oculta todo por defecto (IoC v212).
                    document.body.innerHTML = '<div style="min-height:100vh; display:flex; align-items:center; justify-content:center; text-align:center; padding:2rem; color:#fff; background:#0a0a0c;"><p style="max-width:400px; opacity:0.8;">No pudimos cargar el diseño de este evento. Por favor recarga la página o vuelve a intentarlo más tarde.</p></div>';
                    return;
                }

                // Activación de Ámbito Dual (P3)
                const tplNormal = `tpl-${ev.template_id || 'F3'}`;
                const tplLower = `tpl-${(ev.template_id || 'f3').toLowerCase()}`;
                document.body.className = `${tplNormal} ${tplLower}`;
                logStatus(`DEBUG: Ámbito Dual inyectado [${tplNormal} ${tplLower}]`, "DEBUG");

                // Nota v1.4.8: el bloque "VINCULACIÓN DE VIDEO (v202)" que vivía aquí se retiró —
                // era 100% redundante: escribía sobre el mismo #db-video-content que el segmento
                // "MULTIMEDIA FINAL (v205)" más abajo sobreescribe por completo con lógica superior
                // (soporta ev.video_url, trailer_url y fallback). Ver ese segmento para la lógica vigente.

                const target = parseSpanishDate(ev.fecha, ev.hora).getTime();
                setInterval(() => {
                    const diff = target - Date.now();
                    if (diff <= 0) return;
                    document.getElementById('cd-days').innerText = Math.floor(diff / 86400000).toString().padStart(2, '0');
                    document.getElementById('cd-hours').innerText = Math.floor((diff % 86400000) / 3600000).toString().padStart(2, '0');
                    document.getElementById('cd-mins').innerText = Math.floor((diff % 3600000) / 60000).toString().padStart(2, '0');
                    document.getElementById('cd-secs').innerText = Math.floor((diff % 60000) / 1000).toString().padStart(2, '0');
                }, 1000);

                // MAPEO DE HERO & METADATA
                document.getElementById('event-title').innerText = ev.nombre.toUpperCase();
                document.getElementById('org-name-badge').innerText = ev.organizaciones?.nombre.toUpperCase() || "--";
                document.getElementById('meta-fecha').innerText = ev.fecha;
                document.getElementById('meta-hora').innerText = `${ev.hora} HRS`;
                document.getElementById('meta-lugar').innerText = (ev.ubicacion || "--").toUpperCase();
                if (ev.imagen_url) document.getElementById('mod-hero').style.backgroundImage = `url('${ev.imagen_url}')`;

// === INICIO SEGMENTO: VÍDEO SEGURO v1.5.10-STABLE (ADR-005 Compliance) ===
  // 1. Fuente única de verdad: ev.video_url (columna plana) con fallback seguro.
  const videoContainer = document.getElementById('db-video-content');
  const videoUrl = ev.video_url || content.trailer_url || ""; 

  if (videoUrl.includes('youtube.com') || videoUrl.includes('youtu.be')) {
      // Extracción limpia de ID de YouTube neutralizando ?si=, &list= y anchors
      let videoId = "";
      if (videoUrl.includes('youtu.be/')) {
          videoId = videoUrl.split('youtu.be/')[1]?.split('?')[0]?.split('&')[0];
      } else if (videoUrl.includes('v=')) {
          videoId = videoUrl.split('v=')[1]?.split('&')[0]?.split('?')[0];
      }
      
      const thumbUrl = videoId ? `https://img.youtube.com/vi/${videoId}/maxresdefault.jpg` : "";

      if (thumbUrl) {
