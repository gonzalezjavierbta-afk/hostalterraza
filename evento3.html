<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Master Orchestrator v142 · Sistema QR</title>
    
    <!-- CDNs Obligatorios (Contrato v107) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.3.0/dist/fonts/geist.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/qr-creator/dist/qr-creator.min.js"></script>

    <style>
        :root { --main-bg: #050505; --gold: #df20b6; --text-color: #ffffff; }
        html, body { 
            margin: 0; padding: 0; min-height: 100%;
            background-color: var(--main-bg); color: var(--text-color);
            font-family: 'Geist', sans-serif; -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }
        /* ESCUDO DE GRANO (v47) */
        body::before {
            content: ""; position: fixed; inset: 0; z-index: 9999; pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            opacity: 0.04; contrast: 130%;
        }
        /* Blindaje de Seguridad Master */
        section, header { display: none; }
        .loading-overlay { 
            position: fixed; inset: 0; background: #000; z-index: 999; 
            display: flex; align-items: center; justify-content: center; 
            font-weight: 900; letter-spacing: 3px; 
        }
    </style>
</head>

<body>
    <div id="loader" class="loading-overlay">SINCRONIZANDO V142...</div>

    <header id="mod-hero" class="hero">
        <div id="org-name-badge" style="position:absolute; top:2rem; left:2rem; font-weight:900; letter-spacing:2px; text-transform:uppercase;">--</div>
        <div class="hero-content">
            <h1 id="event-title" class="hero-title">--</h1>
            <div class="hero-meta">
                <div class="meta-item"><span id="meta-fecha">--/--/--</span></div>
                <div class="meta-item"><span id="meta-hora">--:--</span></div>
                <div class="meta-item"><span id="meta-lugar">--</span></div>
            </div>
            <div id="unified-frame" class="unified-countdown-frame">
                <div class="cd-block"><span id="cd-days" class="cd-v">00</span><span>DÍAS</span></div>
                <div class="cd-block"><span id="cd-hours" class="cd-v">00</span><span>HORAS</span></div>
                <div class="cd-block"><span id="cd-mins" class="cd-v">00</span><span>MIN</span></div>
                <div class="cd-block"><span id="cd-secs" class="cd-v">00</span><span>SEG</span></div>
            </div>
        </div>
    </header>

    <main id="main-content-flow">
        <section id="mod-lineup">
            <div id="db-poster-container"><img id="db-poster-img" src="" alt="Poster"></div>
            <div id="db-lineup"></div>
        </section>
        <section id="mod-gallery">
            <div id="db-gallery-grid"></div>
            <div class="media-sync">
                <div id="mod-trailer"><div id="db-video-content"></div></div>
                <div id="mod-playlist"><div id="db-spotify-embed"></div></div>
            </div>
        </section>
        <section id="mod-info-tecnica">
            <div id="db-dress-val">--</div>
            <div id="db-aforo-val">--</div>
        </section>
        <section id="mod-faq-ubicacion">
            <div id="db-faq-list"></div>
            <div id="venue-name">--</div>
            <div id="db-mapa-container"></div>
        </section>
        <section id="mod-form">
            <div class="form-master-box">
                <form id="master-reg-form">
                    <input type="text" id="reg-nombre" placeholder="Nombre completo *" required>
                    <input type="text" id="reg-cedula" placeholder="Cédula *" required>
                    <input type="tel" id="reg-tel" placeholder="WhatsApp *" required>
                    <button type="submit" class="btn-submit">Confirmar Asistencia →</button>
                </form>
            </div>
        </section>
    </main>

    <script>
        const SB_URL = "https://ctgyvydzshueemlelkzv.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN0Z3l2eWR6c2h1ZWVtbGVsa3p2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2NTc1NzAsImV4cCI6MjA4OTIzMzU3MH0.3pMA-VZLV2Kfyl6BD-x8v79P7UuXSfMgtIwnfoP_VuY";
        const sbClient = window.supabase.createClient(SB_URL, SB_KEY);

        function logStatus(m, t = 'INFO') {
            const colors = { 'INFO':'#00ff88', 'LINK':'#f1c40f', 'TIME':'#9b59b6', 'TRACE':'#e67e22', 'DEBUG':'#3498db', 'ERROR':'#ff4d4d' };
            console.log(`%c[${new Date().toLocaleTimeString()}] [${t}] ${m}`, `color: ${colors[t] || '#fff'}; font-weight: bold;`);
        }

        async function injectAtomicCSS(templateId) {
            return new Promise((resolve) => {
                const cssPath = `css/templates/${templateId}.css`;
                let link = document.querySelector('link[data-template-css]');
                if (!link) {
                    link = document.createElement('link'); link.rel = 'stylesheet';
                    link.setAttribute('data-template-css', 'true'); document.head.appendChild(link);
                }
                link.onload = () => { logStatus(`LINK: Estilo cargado.`, "LINK"); resolve(true); };
                link.onerror = () => { logStatus(`ERROR: ${cssPath} no hallado.`, "ERROR"); resolve(false); };
                link.href = cssPath;
            });
        }

        async function initEvento() {
            logStatus("Iniciando Orquestador v142.", "INFO");
            const slug = new URLSearchParams(window.location.search).get('slug');
            if (!slug) return;

            try {
                const { data: ev, error } = await sbClient.from('eventos').select('*, organizaciones(nombre)').eq('slug', slug).single();
                if (error || !ev) throw new Error("Evento no hallado.");

                const templateId = ev.template_id || 'F3';
                document.body.className = `tpl-${templateId.toLowerCase()}`;
                
                // --- CORRECCIÓN DE RUTA DE BANDERAS (v142) ---
                const flags = ev.config_landing?.modules || ev.modules || {};
                logStatus(`DEBUG: Origen de módulos detectado. FAQ: ${flags.faq}, Lineup: ${flags.dj_lineup}`, "DEBUG");

                await injectAtomicCSS(templateId);

                // Mapeo Metadata
                const content = ev.config_landing?.content || ev.content || {};
                document.getElementById('event-title').innerText = ev.nombre.toUpperCase();
                document.getElementById('meta-lugar').innerText = (content.ubicacion || ev.ubicacion || "--").toUpperCase();

                // Mapeo Módulos Dinámicos
                const moduleMap = {
                    'mod-hero': true,
                    'mod-lineup': flags.dj_lineup,
                    'mod-gallery': flags.gallery,
                    'mod-info-tecnica': flags.aforo || flags.dresscode,
                    'mod-faq-ubicacion': flags.faq || flags.ubicacion,
                    'mod-form': true
                };

                Object.keys(moduleMap).forEach(id => {
                    const el = document.getElementById(id);
                    if (el) {
                        const isVisible = moduleMap[id] === true;
                        el.style.setProperty('display', isVisible ? 'block' : 'none', 'important');
                        logStatus(`TRACE: Módulo [${id}] -> ${isVisible ? 'ACTIVO' : 'OCULTO'}`, "TRACE");
                    }
                });

                logStatus("TIME: Heartbeat sincronizado.", "TIME");

            } catch (err) {
                logStatus(`FALLO CRÍTICO: ${err.message}`, "ERROR");
            } finally {
                document.getElementById('loader').style.display = 'none';
            }
        }
        window.onload = initEvento;
    </script>
</body>
</html>
