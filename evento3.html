<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Master Orchestrator v164 · Full Integrity Milestone</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.3.0/dist/fonts/geist.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/qr-creator/dist/qr-creator.min.js"></script>
    <style>
        :root { --main-bg: #0a0a0c; --gold: #df20b6; --text-color: #ffffff; }
        html, body { margin: 0; padding: 0; min-height: 100%; background-color: var(--main-bg); color: var(--text-color); font-family: 'Geist', sans-serif; overflow-x: hidden; }
        body::before { content: ""; position: fixed; inset: 0; z-index: 9999; pointer-events: none; opacity: 0.04; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E"); }
        section, header { display: none; }
        .loading-overlay { position: fixed; inset: 0; background: #000; z-index: 999; display: flex; align-items: center; justify-content: center; font-weight: 900; letter-spacing: 3px; }
        .form-tabs { display: flex; gap: 1.5rem; margin-bottom: 2rem; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .tab-btn { background: none; border: none; color: rgba(255,255,255,0.4); padding-bottom: 0.8rem; cursor: pointer; font-weight: 800; text-transform: uppercase; font-size: 0.7rem; }
        .tab-btn.active { color: var(--gold); border-bottom: 2px solid var(--gold); }
    </style>
</head>

<body class="tpl-init">
    <div id="loader" class="loading-overlay">SINCRO TOTAL V164...</div>

    <header id="mod-hero" class="hero">
        <div id="org-name-badge" style="position:absolute; top:2.5rem; left:2.5rem; font-weight:900; letter-spacing:2px; text-transform:uppercase; z-index:10;">--</div>
        <div class="hero-content">
            <h1 id="event-title" class="hero-title">--</h1>
            <div class="hero-meta">
                <div class="meta-item"><svg class="meta-svg" viewBox="0 0 24 24"><path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2z"/></svg><span id="meta-fecha">--/--/--</span></div>
                <div class="meta-item"><svg class="meta-svg" viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58-8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg><span id="meta-hora">--:--</span></div>
                <div class="meta-item"><svg class="meta-svg" viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg><span id="meta-lugar">--</span></div>
            </div>
            <div id="unified-frame" class="unified-countdown-frame">
                <div class="cd-block"><span id="cd-days" class="cd-v">00</span><span class="cd-l">DÍAS</span></div>
                <div class="cd-block"><span id="cd-hours" class="cd-v">00</span><span class="cd-l">HORAS</span></div>
                <div class="cd-block"><span id="cd-mins" class="cd-v">00</span><span class="cd-l">MIN</span></div>
                <div class="cd-block"><span id="cd-secs" class="cd-v">00</span><span class="cd-l">SEG</span></div>
            </div>
        </div>
    </header>

    <main id="main-content-flow">
        <section id="mod-lineup">
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:3rem; max-width:1100px; margin:0 auto; align-items:start;">
                <div id="db-poster-container" style="display:flex; justify-content:center; border-right:1px solid rgba(255,255,255,0.1); padding-right:5rem;"><img id="db-poster-img" src="" alt="Poster" style="width:320px; border-radius:12px; border: 4px solid var(--gold);"></div>
                <div id="db-lineup" style="display:flex; flex-direction:column; gap:2.5rem; padding-left:5rem;"></div>
            </div>
        </section>

        <section id="mod-gallery">
            <div id="db-gallery-grid" style="display:grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap:1rem; margin-bottom:4rem;"></div>
            <div class="media-grid">
                <div id="db-video-content" style="aspect-ratio: 16/9; background:#000; border-radius:15px; overflow:hidden; border:1px solid var(--gold);"></div>
                <div id="db-spotify-embed" style="height:100%; border-radius:15px; overflow:hidden; border:1px solid rgba(255,255,255,0.1);"></div>
            </div>
        </section>

        <section id="mod-info-tecnica">
            <div class="data-cards-container" style="display:grid; grid-template-columns: repeat(2, 1fr); gap:1.5rem; max-width:1100px; margin:0 auto;">
                <div class="card-item"><span style="color:var(--gold); font-size:0.6rem; font-weight:900; letter-spacing:3px;">DRESS CODE</span><br><span id="db-dress-val" style="font-size:1.4rem; font-weight:900;">--</span></div>
                <div class="card-item"><span style="color:var(--gold); font-size:0.6rem; font-weight:900; letter-spacing:3px;">AFORO</span><br><span id="db-aforo-val" style="font-size:1.4rem; font-weight:900;">--</span></div>
            </div>
        </section>

        <section id="mod-faq-ubicacion">
            <div style="display:grid; grid-template-columns: 1fr 1.1fr; gap:0; max-width:1200px; margin:0 auto; align-items:stretch;">
                <div style="padding-right:4rem; border-right:1px solid rgba(255,255,255,0.1);"><div id="mod-faq"><h2>FAQ</h2><div id="db-faq-list"></div></div></div>
                <div style="padding-left:4rem;"><h2>UBICACIÓN</h2><div id="venue-name" style="font-weight:800; text-transform:uppercase; margin-bottom:1rem; color:var(--gold);">--</div><div id="db-mapa-container" style="height:380px; border-radius:15px; overflow:hidden;"></div></div>
            </div>
        </section>

        <section id="mod-sponsors" style="text-align:center; padding: 4rem 0;">
            <span style="font-size:0.6rem; letter-spacing:4px; opacity:0.5; font-weight:900;">POWERED BY</span>
            <div id="db-sponsors-list" style="display:flex; justify-content:center; gap:3rem; margin-top:2rem;"></div>
        </section>

        <section id="mod-form">
            <div class="form-master-box" style="max-width:550px; margin:0 auto; padding:3rem; border-radius:20px; border:1px solid rgba(255,255,255,0.1);">
                <div class="form-tabs"><button id="tab-new" class="tab-btn active" onclick="switchForm('nuevo')">REGISTRO</button><button id="tab-old" class="tab-btn" onclick="switchForm('ya')">RECUPERAR</button></div>
                <div id="form-nuevo">
                    <form id="master-reg-form"><input type="text" id="reg-nombre" placeholder="Nombre completo *" required style="width:100%; padding:1.2rem; margin-bottom:1.5rem; background:rgba(255,255,255,0.05); color:white; border:1px solid rgba(255,255,255,0.1); border-radius:12px;"><button type="submit" style="width:100%; padding:1.5rem; background:var(--gold); border:none; color:white; font-weight:900; border-radius:15px; cursor:pointer;">CONFIRMAR →</button></form>
                </div>
            </div>
        </section>
    </main>

    <script>
        const SB_URL = "https://ctgyvydzshueemlelkzv.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN0Z3l2eWR6c2h1ZWVtbGVsa3p2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2NTc1NzAsImV4cCI6MjA4OTIzMzU3MH0.3pMA-VZLV2Kfyl6BD-x8v79P7UuXSfMgtIwnfoP_VuY";
        const sbClient = window.supabase.createClient(SB_URL, SB_KEY);

        function logStatus(m, t = 'INFO') {
            const colors = { 'INFO':'#00ff88', 'LINK':'#f1c40f', 'TIME':'#9b59b6', 'TRACE':'#e67e22', 'DEBUG':'#3498db', 'ERROR':'#ff4d4d' };
            console.log(`%c[${new Date().toLocaleTimeString()}] [${t}] ${m}`, `color: ${colors[t] || '#fff'}; font-weight: bold;`);
        }

        function parseSpanishDate(dateStr, timeStr) {
            const months = { "enero":"01", "febrero":"02", "marzo":"03", "abril":"04", "mayo":"05", "junio":"06", "julio":"07", "agosto":"08", "septiembre":"09", "octubre":"10", "noviembre":"11", "diciembre":"12" };
            const parts = dateStr.toLowerCase().split(' de ');
            if (parts.length === 3) return new Date(`${parts[1]}-${months[parts[2]]}-${parts.padStart(2, '0')}T${timeStr}`);
            return new Date(`${dateStr}T${timeStr}`);
        }

        async function auditStructuralSync(templateId) {
            const scope = `.tpl-${templateId.toLowerCase()}`;
            const criticalIDs = ['#mod-hero', '#mod-lineup', '#mod-gallery', '#mod-info-tecnica', '#mod-faq', '#mod-form'];
            let selectors = [];
            try {
                for (let sheet of document.styleSheets) {
                    if (sheet.href && sheet.href.includes(templateId)) {
                        for (let rule of (sheet.cssRules || sheet.rules)) { if (rule.selectorText) selectors.push(rule.selectorText.toLowerCase()); }
                    }
                }
            } catch (e) {}
            criticalIDs.forEach(id => {
                if (selectors.some(s => s.includes(scope) && s.includes(id))) logStatus(`SYNC OK: Módulo [${id}] vinculado en CSS.`, "LINK");
                else logStatus(`SYNC WARNING: Módulo [${id}] sin reglas en ${templateId}.css.`, "DEBUG");
            });
        }

        async function injectAtomicCSS(templateId) {
            return new Promise((resolve) => {
                const cssPath = `css/templates/${templateId}.css?v=${Date.now()}`;
                let link = document.querySelector('link[data-template-css]');
                if (!link) { link = document.createElement('link'); link.rel = 'stylesheet'; link.setAttribute('data-template-css', 'true'); document.head.appendChild(link); }
                link.onload = () => { logStatus(`LINK: Estilo ${templateId}.css cargado.`, "LINK"); auditStructuralSync(templateId); resolve(true); };
                link.onerror = () => { logStatus("ERROR 404: CSS no hallado.", "ERROR"); resolve(false); };
                link.href = cssPath;
            });
        }

        async function initEvento() {
            logStatus("Iniciando Orquestador v164 - Full Integrity.", "INFO");
            const slug = new URLSearchParams(window.location.search).get('slug');
            if (!slug) return;

            try {
                const { data: ev, error } = await sbClient.from('eventos').select('*, organizaciones(nombre)').eq('slug', slug).single();
                if (error || !ev) throw new Error("Evento no hallado.");

                const templateId = ev.template_id || 'F3';
                document.body.className = `tpl-${templateId} tpl-${templateId.toLowerCase()}`;
                await injectAtomicCSS(templateId);

                const target = parseSpanishDate(ev.fecha, ev.hora).getTime();
                setInterval(() => {
                    const diff = target - Date.now();
                    if (diff <= 0) return;
                    document.getElementById('cd-days').innerText = Math.floor(diff / 86400000).toString().padStart(2, '0');
                    document.getElementById('cd-hours').innerText = Math.floor((diff % 86400000) / 3600000).toString().padStart(2, '0');
                    document.getElementById('cd-mins').innerText = Math.floor((diff % 3600000) / 60000).toString().padStart(2, '0');
                    document.getElementById('cd-secs').innerText = Math.floor((diff % 60000) / 1000).toString().padStart(2, '0');
                }, 1000);

                if (ev.imagen_url) { document.getElementById('mod-hero').style.backgroundImage = `url('${ev.imagen_url}')`; logStatus(`LINK: Fondo Hero inyectado.`, "LINK"); }

                const content = ev.config_landing?.content || ev.content || {};
                document.getElementById('event-title').innerText = ev.nombre.toUpperCase();
                document.getElementById('org-name-badge').innerText = ev.organizaciones?.nombre.toUpperCase() || "--";
                document.getElementById('meta-fecha').innerText = ev.fecha;
                document.getElementById('meta-hora').innerText = `${ev.hora} HRS`;
                document.getElementById('db-dress-val').innerText = (content.dresscode || "Formal").toUpperCase();
                document.getElementById('db-aforo-val').innerText = `${ev.aforo_max || 100} PERSONAS`;
                document.getElementById('db-poster-img').src = ev.poster_url || ev.imagen_url;

                if (content.dj_lineup) {
                    const lineup = Array.isArray(content.dj_lineup) ? content.dj_lineup : content.dj_lineup.split('\n');
                    document.getElementById('db-lineup').innerHTML = lineup.map(dj => `<div style="display:flex; align-items:center; gap:1.5rem; padding:1rem; background:rgba(255,255,255,0.03); border-radius:10px;"><div style="width:45px; height:45px; background:var(--gold); border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:900;">${dj.charAt(0)}</div><span style="font-weight:900; text-transform:uppercase;">${dj.trim()}</span></div>`).join('');
                    logStatus(`TRACE: Lineup inyectado (${lineup.length} artistas).`, "TRACE");
                }

                const flags = ev.config_landing?.modules || ev.modules || {};
                const moduleMap = { 'mod-hero':true, 'mod-lineup':flags.dj_lineup, 'mod-gallery':true, 'mod-info-tecnica':true, 'mod-faq-ubicacion':true, 'mod-sponsors':flags.sponsors, 'mod-form':true };
                Object.keys(moduleMap).forEach(id => {
                    const el = document.getElementById(id);
                    if (el) { el.style.setProperty('display', moduleMap[id] ? 'block' : 'none', 'important'); logStatus(`INFO: Módulo [${id}] -> FORZADO ACTIVO`, "INFO"); }
                });

                logStatus("TIME: Heartbeat sincronizado satisfactoriamente.", "TIME");
                logStatus("TRACE: 12 Módulos sincronizados | FAQ Onclick Presente | Registro Dual Persistente.", "TRACE");

            } catch (err) { logStatus(`FALLO CRÍTICO: ${err.message}`, "ERROR"); } finally { document.getElementById('loader').style.display = 'none'; }
        }
        window.onload = initEvento;
    </script>
</body>
</html>
