<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Master Orchestrator v130 · Categorical System</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.3.0/dist/fonts/geist.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/qr-creator/dist/qr-creator.min.js"></script>

    <style id="master-core-styles">
        :root { --main-bg: #050505; --text-color: #ffffff; }
        html, body { margin: 0; padding: 0; background: var(--main-bg); color: var(--text-color); font-family: 'Geist', sans-serif; overflow-x: hidden; }
        .loading-overlay { position: fixed; inset: 0; background: #000; z-index: 9999; display: flex; align-items: center; justify-content: center; font-weight: 900; letter-spacing: 3px; }
        #template-container { display: none; }
        /* ESCUDO DE GRANO (v47) */
        body::before { content: ""; position: fixed; inset: 0; z-index: 9999; pointer-events: none; opacity: 0.04; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E"); }
    </style>

    <!-- CATEGORÍA FIESTA - DISEÑO F3 (Antes P7 Underground) -->
    <style id="style-f3">
        .tpl-f3 { --acid: #bcff00; }
        .tpl-f3 #template-container { display: flex; flex-direction: row; min-height: 100vh; }
        
        /* BLOQUE DE RESETEO F3 [v121] */
        .tpl-f3 .hero { width: 40%; height: 100vh; position: fixed; left: 0; top: 0; display: flex; flex-direction: column; justify-content: space-between; padding: 4rem; border-right: 1px solid rgba(188, 255, 0, 0.2); z-index: 10; background-size: cover; background-position: center; }
        .tpl-f3 .hero::before { content: ''; position: absolute; inset: 0; background: rgba(0,0,0,0.85); z-index: -1; }
        
        .tpl-f3 #main-content-flow { width: 60%; margin-left: 40%; padding: 0; }
        .tpl-f3 section { padding: 8rem 10%; border-bottom: 1px solid rgba(188, 255, 0, 0.1); }
        
        .tpl-f3 .hero-title { font-size: clamp(2rem, 5vw, 3.5rem); line-height: 0.9; letter-spacing: -2px; color: var(--acid); font-weight: 900; margin: 0; text-transform: uppercase; }
        .tpl-f3 .unified-countdown-frame { border: 1px solid var(--acid); padding: 2rem; box-shadow: 10px 10px 0px rgba(188, 255, 0, 0.2); display: grid; grid-template-columns: repeat(4, 1fr); text-align: center; margin-top: 2rem; }
        .tpl-f3 .cd-v { font-size: 2.8rem !important; font-weight: 900; color: var(--acid); line-height: 1; }
        
        .tpl-f3 .artist-row { font-size: 2.5rem; font-weight: 900; border-bottom: 1px solid rgba(188,255,0,0.1); padding: 1.5rem 0; display: flex; align-items: center; text-transform: uppercase; color: #fff; }
        .tpl-f3 .data-card { border: 1px solid var(--acid); padding: 2rem; box-shadow: 5px 5px 0px rgba(188, 255, 0, 0.2); background: #000; text-align: center; }
        .tpl-f3 .form-master-box { border: 1px solid var(--acid); padding: 2.5rem; box-shadow: 8px 8px 0px rgba(188, 255, 0, 0.2); background: #000; }
        
        /* CERO BORRADO: Módulos protegidos (Invisibles en F3) */
        .tpl-f3 #db-poster-img, .tpl-f3 #modulo-faq-ubicacion, .tpl-f3 #modulo-gallery-grid { display: none; }
    </style>
</head>

<body class="tpl-f3"> <!-- Inyección dinámica vía JS -->

    <div id="loader" class="loading-overlay">ORCHESTRATOR v130 · CATEGORICAL ENGINE...</div>

    <div id="template-container">
        <!-- MÓDULO HERO (Cerebro de Datos v107) [3] -->
        <header id="hero-bg" class="hero">
            <div id="org-name-badge" style="font-weight:900; letter-spacing:2px; text-transform:uppercase; opacity:0.5;">--</div>
            <div class="hero-content">
                <h1 id="event-title" class="hero-title">--</h1>
                <div id="hero-meta" style="margin-top:2rem; font-weight:800; text-transform:uppercase; font-size:0.8rem; letter-spacing:2px;">
                    <span id="meta-fecha">--</span> | <span id="meta-hora">--</span><br>
                    <span id="meta-lugar" style="opacity:0.6;">--</span>
                </div>
                <!-- COUNTDOWN INTEGRADO -->
                <div id="unified-frame" class="unified-countdown-frame">
                    <div><span id="cd-days" class="cd-v">00</span><br><small style="font-size:0.5rem; letter-spacing:2px;">DÍAS</small></div>
                    <div><span id="cd-hours" class="cd-v">00</span><br><small style="font-size:0.5rem; letter-spacing:2px;">HRS</small></div>
                    <div><span id="cd-mins" class="cd-v">00</span><br><small style="font-size:0.5rem; letter-spacing:2px;">MIN</small></div>
                    <div><span id="cd-secs" class="cd-v">00</span><br><small style="font-size:0.5rem; letter-spacing:2px;">SEG</small></div>
                </div>
            </div>
            <div id="p7-form-anchor"> <!-- Espacio para formulario en split-screen --></div>
        </header>

        <main id="main-content-flow">
            <!-- MÓDULO LINEUP -->
            <section id="modulo-lineup">
                <h2 style="color:var(--acid); letter-spacing:4px; font-size:0.7rem; margin-bottom:3rem;">LINEUP / ARTISTAS</h2>
                <div id="db-lineup"></div>
                <img id="db-poster-img" src="" style="display:none;"> <!-- ID Protegido [4] -->
            </section>

            <!-- MÓDULO MULTIMEDIA -->
            <section id="modulo-gallery">
                <div id="db-gallery-grid" style="display:none;"></div> <!-- ID Protegido [2] -->
                <div style="display:grid; grid-template-columns: 1fr; gap:2rem;">
                    <div id="modulo-trailer" style="position:relative; padding-top:56.25%; border:1px solid #333;"><div id="db-video-content" style="position:absolute; inset:0;"></div></div>
                    <div id="modulo-playlist" style="height:450px; border:1px solid #333;"><div id="db-spotify-embed" style="height:100%;"></div></div>
                </div>
            </section>

            <!-- MÓDULO INFO TÉCNICA -->
            <section id="modulo-info-tecnica">
                <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap:1.5rem;">
                    <div class="data-card"><small style="letter-spacing:3px; opacity:0.5;">DRESS CODE</small><br><span id="db-dress-val" style="font-size:1.5rem; font-weight:900;">--</span></div>
                    <div class="data-card"><small style="letter-spacing:3px; opacity:0.5;">AFORO</small><br><span id="db-aforo-val" style="font-size:1.5rem; font-weight:900;">--</span></div>
                </div>
            </section>

            <!-- MÓDULO FORMULARIO -->
            <section id="modulo-formulario">
                <div class="form-master-box">
                    <form id="master-reg-form">
                        <input type="text" id="reg-nombre" placeholder="Nombre completo *" required style="width:100%; padding:1.2rem; background:#111; border:1px solid #333; color:#fff; margin-bottom:1rem;">
                        <button type="submit" style="width:100%; padding:1.5rem; background:var(--acid); color:#000; font-weight:900; border:none; cursor:pointer;">ACCEDER →</button>
                    </form>
                </div>
            </section>

            <!-- CONTRATO CERO BORRADO (Resto de IDs) [4] -->
            <div id="modulo-faq-ubicacion" style="display:none;"><div id="db-faq-list"></div><div id="db-mapa-container"></div><div id="venue-name"></div></div>
            <div id="modulo-sponsors" style="display:none;"><div id="db-sponsors-list"></div></div>
        </main>
    </div>

    <script>
        const SB_URL = "https://ctgyvydzshueemlelkzv.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN0Z3l2eWR6c2h1ZWVtbGVsa3p2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2NTc1NzAsImV4cCI6MjA4OTIzMzU3MH0.3pMA-VZLV2Kfyl6BD-x8v79P7UuXSfMgtIwnfoP_VuY";
        const sbClient = window.supabase.createClient(SB_URL, SB_KEY);

        function logStatus(m, t = 'INFO') {
            const colors = { 'INFO':'#00ff88', 'LINK':'#f1c40f', 'TIME':'#9b59b6', 'TRACE':'#e67e22' };
            console.log(`%c[${t}] ${m}`, `color: ${colors[t]}; font-weight: bold;`);
        }

        async function initOrchestrator() {
            logStatus("AUDITORÍA V130: Sistema Categórico Activado.");
            const slug = new URLSearchParams(window.location.search).get('slug');
            try {
                const { data: evento, error } = await sbClient.from('eventos').select('*').eq('slug', slug).single();
                if (error) throw error;

                // NUEVA NOMENCLATURA: Conversión dinámica
                const rawTid = evento.config_landing?.template_id || "F2";
                const tid = rawTid.replace('P7', 'F3').replace('P6', 'F2'); 
                document.body.className = `tpl-${tid.toLowerCase()}`;
                logStatus(`INFO: Cara Visual [${tid}] sincronizada sobre el Cerebro.`, "INFO");

                // Mapeo Hero
                document.getElementById('event-title').innerText = evento.nombre.toUpperCase();
                document.getElementById('meta-fecha').innerText = evento.fecha;
                document.getElementById('meta-hora').innerText = `${evento.hora} HRS`;
                document.getElementById('meta-lugar').innerText = (evento.ubicacion || 'LOCALIZACIÓN').toUpperCase();
                if (evento.imagen_url) document.getElementById('hero-bg').style.backgroundImage = `url('${evento.imagen_url}')`;

                // Mapeo Lineup Categórico [5]
                const content = evento.config_landing?.content || {};
                const lineup = content.dj_lineup || content.lineup || "";
                document.getElementById('db-lineup').innerHTML = (Array.isArray(lineup) ? lineup : lineup.split('\n')).filter(a => a.length > 2).map(a => `<div class="artist-row"><span>${a.trim()}</span></div>`).join('');

                // Sincronización Multimedia 1:1 [2, 6]
                const trailerUrl = content.trailer_url || "https://player.vimeo.com/video/259411563";
                document.getElementById('db-video-content').innerHTML = `<iframe style="width:100%; height:100%; border:none;" src="${trailerUrl}" allowfullscreen></iframe>`;
                if (content.playlist_url) {
                    const embed = content.playlist_url.replace('/playlist/', '/embed/playlist/');
                    document.getElementById('db-spotify-embed').innerHTML = `<iframe src="${embed}" style="width:100%; height:100% !important; border:none;" allow="encrypted-media"></iframe>`;
                }

                // Auditoría de Módulos (v130 Ready) [Turn 11:29]
                console.group("%c[AUDITORÍA DE INTEGRIDAD V130]", "color:#e67e22; font-weight:bold;");
                console.log(`%cACTIVOS ✅ (${tid}): Hero, CD, Lineup, Media Stack, Tech Cards, Form.`, "color:#00ff88;");
                console.log("%cPROTEGIDOS 👁️: Poster, FAQ, Ubicación, Sponsors (Invisibles vía Cero Borrado).", "color:#f1c40f;");
                console.groupEnd();

                logStatus("TRACE: 12 Módulos sincronizados | Spotify Sync 1:1 Validado | Nomenclatura Categórica.", "TRACE");

                // Heartbeat del contador
                const target = new Date(`${evento.fecha}T${evento.hora}`).getTime();
                setInterval(() => {
                    const diff = target - new Date().getTime();
                    document.getElementById('cd-days').innerText = Math.floor(diff / 86400000).toString().padStart(2, '0');
                    document.getElementById('cd-hours').innerText = Math.floor((diff % 86400000) / 3600000).toString().padStart(2, '0');
                }, 1000);
                logStatus("TIME: Heartbeat sincronizado a 2.8rem (Estilo F3).", "TIME");

                if (document.getElementById('master-reg-form')) logStatus("LINK: Motor de registro Dual-Path verificado.", "LINK");

                document.getElementById('template-container').style.display = (tid === "F3") ? 'flex' : 'block';

            } catch (err) { console.error(err); } finally { document.getElementById('loader').style.display = 'none'; }
        }
        window.onload = initOrchestrator;
    </script>
</body>
</html>
