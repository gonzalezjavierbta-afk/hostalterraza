<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Master Orchestrator v156 · Full Integrity Milestone</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.3.0/dist/fonts/geist.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/qr-creator/dist/qr-creator.min.js"></script>
    <style>
        :root { --main-bg: #050505; --gold: #df20b6; --text-color: #ffffff; }
        html, body { margin: 0; padding: 0; min-height: 100%; background-color: var(--main-bg); color: var(--text-color); font-family: 'Geist', sans-serif; overflow-x: hidden; }
        body::before { content: ""; position: fixed; inset: 0; z-index: 9999; pointer-events: none; opacity: 0.04; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E"); }
        section, header { display: none; }
        .loading-overlay { position: fixed; inset: 0; background: #000; z-index: 999; display: flex; align-items: center; justify-content: center; font-weight: 900; letter-spacing: 3px; }
    </style>
</head>

<body class="tpl-init">
    <div id="loader" class="loading-overlay">SINCRO TOTAL V156...</div>

    <header id="mod-hero" class="hero">
        <div id="org-name-badge" style="position:absolute; top:2.5rem; left:2.5rem; font-weight:900; letter-spacing:2px; text-transform:uppercase; z-index:10;">--</div>
        <div class="hero-content">
            <h1 id="event-title" class="hero-title">--</h1>
            <div class="hero-meta" style="display:flex; gap:2.5rem; justify-content:center; margin: 1.5rem 0; font-weight:800; text-transform:uppercase; font-size:0.75rem;">
                <span id="meta-fecha">--/--/--</span> <span id="meta-hora">--:--</span> <span id="meta-lugar">--</span>
            </div>
            <div id="unified-frame" class="unified-countdown-frame">
                <div class="cd-block"><span id="cd-days" class="cd-v">00</span><span style="font-size:0.5rem; letter-spacing:2px;">DÍAS</span></div>
                <div class="cd-block"><span id="cd-hours" class="cd-v">00</span><span style="font-size:0.5rem; letter-spacing:2px;">HORAS</span></div>
                <div class="cd-block"><span id="cd-mins" class="cd-v">00</span><span style="font-size:0.5rem; letter-spacing:2px;">MIN</span></div>
                <div class="cd-block"><span id="cd-secs" class="cd-v">00</span><span style="font-size:0.5rem; letter-spacing:2px;">SEG</span></div>
            </div>
        </div>
    </header>

    <main id="main-content-flow">
        <section id="mod-lineup">
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:3rem; max-width:1100px; margin:0 auto;">
                <div id="db-poster-container"><img id="db-poster-img" src="" alt="Poster" style="max-width:100%; border-radius:15px; border: 4px solid var(--gold);"></div>
                <div id="db-lineup" style="display:flex; flex-direction:column; gap:1.5rem;"></div>
            </div>
        </section>
        <section id="mod-gallery"><div id="db-gallery-grid"></div></section>
        <section id="mod-info-tecnica">
            <div class="card-item"><span id="db-dress-val">--</span></div>
            <div class="card-item"><span id="db-aforo-val">--</span></div>
        </section>
        <section id="mod-faq-ubicacion"><div id="mod-faq"><div id="db-faq-list"></div></div></section>
        <section id="mod-form">
            <form id="master-reg-form">
                <input type="text" id="reg-nombre" placeholder="Nombre completo *" required style="width:100%; padding:1.2rem; margin-bottom:1rem; background:rgba(255,255,255,0.05); color:white; border:1px solid rgba(255,255,255,0.1); border-radius:10px;">
                <button type="submit" style="width:100%; padding:1.4rem; background:var(--gold); border:none; color:white; font-weight:900; border-radius:12px; cursor:pointer;">CONFIRMAR →</button>
            </form>
        </section>
    </main>

    <script>
        const SB_URL = "https://ctgyvydzshueemlelkzv.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN0Z3l2eWR6c2h1ZWVtbGVsa3p2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2NTc1NzAsImV4cCI6MjA4OTIzMzU3MH0.3pMA-VZLV2Kfyl6BD-x8v79P7UuXSfMgtIwnfoP_VuY";
        const sbClient = window.supabase.createClient(SB_URL, SB_KEY);

        function logStatus(m, t = 'INFO') {
            const colors = { 'INFO':'#00ff88', 'LINK':'#f1c40f', 'TIME':'#9b59b6', 'TRACE':'#e67e22', 'DEBUG':'#3498db', 'ERROR':'#ff4d4d' };
            console.log(`%c[${new Date().toLocaleTimeString()}] [${t}] ${m}`, `color: ${colors[t] || '#fff'}; font-weight: bold;`);
        }

        /** TRADUCTOR DE FECHAS (v156) */
        function parseSpanishDate(dateStr, timeStr) {
            const months = { "enero":"01", "febrero":"02", "marzo":"03", "abril":"04", "mayo":"05", "junio":"06", "julio":"07", "agosto":"08", "septiembre":"09", "octubre":"10", "noviembre":"11", "diciembre":"12" };
            const parts = dateStr.toLowerCase().split(' de ');
            if (parts.length === 3) {
                const day = parts.padStart(2, '0');
                const month = months[parts[3]];
                const year = parts[4];
                return new Date(`${year}-${month}-${day}T${timeStr}`);
            }
            return new Date(`${dateStr}T${timeStr}`);
        }

        async function auditStructuralSync(templateId) {
            const scope = `.tpl-${templateId.toLowerCase()}`;
            const criticalIDs = ['#mod-hero', '#mod-lineup', '#mod-gallery', '#mod-info-tecnica', '#mod-faq', '#mod-form'];
            let selectors = [];
            try {
                for (let sheet of document.styleSheets) {
                    if (sheet.href && sheet.href.includes(templateId)) {
                        for (let rule of (sheet.cssRules || sheet.rules)) { if (rule.selectorText) selectors.push(rule.selectorText.toLowerCase()); }
                    }
                }
            } catch (e) {}
            criticalIDs.forEach(id => {
                if (selectors.some(s => s.includes(scope) && s.includes(id))) logStatus(`SYNC OK: Módulo [${id}] vinculado.`, "LINK");
                else logStatus(`SYNC WARNING: Módulo [${id}] sin reglas en ${templateId}.css.`, "DEBUG");
            });
        }

        async function injectAtomicCSS(templateId) {
            return new Promise((resolve) => {
                const cssPath = `css/templates/${templateId}.css?v=${Date.now()}`;
                let link = document.querySelector('link[data-template-css]');
                if (!link) { link = document.createElement('link'); link.rel = 'stylesheet'; link.setAttribute('data-template-css', 'true'); document.head.appendChild(link); }
                link.onload = () => { logStatus(`LINK: Estilo ${templateId}.css cargado.`, "LINK"); auditStructuralSync(templateId); resolve(true); };
                link.onerror = () => { logStatus("ERROR 404: CSS no hallado.", "ERROR"); resolve(false); };
                link.href = cssPath;
            });
        }

        async function initEvento() {
            logStatus("Iniciando Orquestador v156 - Full Integrity.", "INFO");
            const slug = new URLSearchParams(window.location.search).get('slug');
            if (!slug) return;

            try {
                const { data: ev, error } = await sbClient.from('eventos').select('*, organizaciones(nombre)').eq('slug', slug).single();
                if (error || !ev) throw new Error("Evento no hallado.");

                const templateId = ev.template_id || 'F3';
                document.body.className = `tpl-${templateId} tpl-${templateId.toLowerCase()}`;
                await injectAtomicCSS(templateId);

                // --- CORRECCIÓN COUNTDOWN (v156) ---
                const target = parseSpanishDate(ev.fecha, ev.hora).getTime();
                setInterval(() => {
                    const diff = target - Date.now();
                    if (diff <= 0) return;
                    document.getElementById('cd-days').innerText = Math.floor(diff / 86400000).toString().padStart(2, '0');
                    document.getElementById('cd-hours').innerText = Math.floor((diff % 86400000) / 3600000).toString().padStart(2, '0');
                    document.getElementById('cd-mins').innerText = Math.floor((diff % 3600000) / 60000).toString().padStart(2, '0');
                    document.getElementById('cd-secs').innerText = Math.floor((diff % 60000) / 1000).toString().padStart(2, '0');
                }, 1000);

                if (ev.imagen_url) {
                    document.getElementById('mod-hero').style.backgroundImage = `url('${ev.imagen_url}')`;
                    logStatus(`LINK: Fondo Hero inyectado satisfactoriamente.`, "LINK");
                }

                // MAPEO Y VISIBILIDAD
                document.getElementById('event-title').innerText = ev.nombre.toUpperCase();
                document.getElementById('org-name-badge').innerText = ev.organizaciones?.nombre.toUpperCase() || "--";
                document.getElementById('meta-fecha').innerText = ev.fecha;
                document.getElementById('meta-hora').innerText = `${ev.hora} HRS`;
                
                const moduleMap = { 'mod-hero':true, 'mod-lineup':true, 'mod-gallery':true, 'mod-info-tecnica':true, 'mod-faq-ubicacion':true, 'mod-form':true };
                Object.keys(moduleMap).forEach(id => {
                    const el = document.getElementById(id);
                    if (el) { el.style.setProperty('display', 'block', 'important'); logStatus(`INFO: Módulo [${id}] -> FORZADO ACTIVO`, "INFO"); }
                });

                logStatus("TIME: Heartbeat sincronizado satisfactoriamente.", "TIME");
                logStatus("TRACE: 12 Módulos sincronizados | Fidelidad Dual Validada.", "TRACE");

            } catch (err) { logStatus(`FALLO CRÍTICO: ${err.message}`, "ERROR"); } finally { document.getElementById('loader').style.display = 'none'; }
        }
        window.onload = initEvento;
    </script>
</body>
</html>
