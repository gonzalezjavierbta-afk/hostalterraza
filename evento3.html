<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Master Orchestrator v135 · Multi-Face Engine</title>
    
    <!-- LIBRERÍAS CRÍTICAS (CONTRATO DE PARIDAD) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.3.0/dist/fonts/geist.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/qr-creator/dist/qr-creator.min.js"></script>

    <style id="master-core-styles">
        :root { --main-bg: #050505; --text-color: #ffffff; }
        html, body { margin: 0; padding: 0; min-height: 100%; background: var(--main-bg); color: var(--text-color); font-family: 'Geist', sans-serif; overflow-x: hidden; }
        .loading-overlay { position: fixed; inset: 0; background: #000; z-index: 9999; display: flex; align-items: center; justify-content: center; font-weight: 900; letter-spacing: 3px; }
        #template-container { display: none; }
        section { display: none; } /* Blindaje v121: Visibilidad controlada por Silo */
        /* ESCUDO DE GRANO (v47) */
        body::before { content: ""; position: fixed; inset: 0; z-index: 9999; pointer-events: none; opacity: 0.04; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E"); }
    </style>

    <!-- CARA F1: TROPICAL HOSTEL -->
    <style id="style-f1">
        .tpl-f1 { --accent: #00ff88; }
        .tpl-f1 section { display: block; padding: 4rem 10%; border-bottom: 1px solid rgba(0,255,136,0.1); }
        .tpl-f1 .hero { height: 70vh; display: flex; flex-direction: column; justify-content: center; align-items: center; background-size: cover; background-position: center; position: relative; }
        .tpl-f1 .hero-title { font-weight: 900; font-size: 3.5rem; color: var(--accent); text-transform: uppercase; }
    </style>

    <!-- CARA F2: GOLDEN HOUR (Full Parity) -->
    <style id="style-f2">
        .tpl-f2 { --gold: #df20b6; --border-glow: rgba(223, 32, 182, 0.4); }
        .tpl-f2 section { display: block; padding: 6rem 10%; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .tpl-f2 h2 { color: var(--gold); letter-spacing: 4px; text-transform: uppercase; font-size: 0.75rem; font-weight: 900; margin-bottom: 3.5rem; text-align: left; }
        .tpl-f2 .hero { height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; background-size: cover; background-position: center; position: relative; }
        .tpl-f2 .hero::before { content: ''; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, rgba(5,5,5,0.3) 50%, rgba(5,5,5,1) 100%); z-index: 1; }
        .tpl-f2 .hero-title { font-weight: 900; font-size: clamp(2.5rem, 8vw, 4.5rem); text-transform: uppercase; z-index: 2; position: relative; }
        .tpl-f2 .media-grid { display: grid; grid-template-columns: 1.6fr 1fr; gap: 2.5rem; align-items: stretch; margin-top: 4rem; }
        .tpl-f2 .video-wrapper { position: relative; padding-top: 56.25%; border: 1px solid var(--gold); box-shadow: 0 0 30px var(--border-glow); border-radius: 15px; overflow: hidden; }
        .tpl-f2 .spotify-container { border-radius: 15px; overflow: hidden; height: 100%; border: 1px solid rgba(255,255,255,0.1); }
    </style>

    <!-- CARA F3: UNDERGROUND (Split-Screen) -->
    <style id="style-f3">
        .tpl-f3 { --acid: #bcff00; }
        .tpl-f3 #template-container { display: flex; }
        .tpl-f3 .hero { width: 40%; height: 100vh; position: fixed; left: 0; padding: 4rem; border-right: 1px solid rgba(188,255,0,0.2); display: flex; flex-direction: column; justify-content: center; background-size: cover; background-position: center; }
        .tpl-f3 #main-content-flow { width: 60%; margin-left: 40%; }
        .tpl-f3 section { display: block; padding: 8rem 10%; border-bottom: 1px solid rgba(188,255,0,0.1); }
        .tpl-f3 .hero-title { font-size: 3rem; color: var(--acid); font-weight: 900; line-height: 0.9; }
    </style>
</head>

<body>
    <div id="loader" class="loading-overlay">ORCHESTRATING v135...</div>

    <div id="template-container">
        <header id="hero-bg" class="hero">
            <h1 id="event-title" class="hero-title">--</h1>
            <div id="hero-meta" style="margin-top:2rem; font-weight:800; text-transform:uppercase; letter-spacing:2px;">
                <span id="meta-fecha">--</span> | <span id="meta-hora">--</span><br>
                <span id="meta-lugar">--</span>
            </div>
        </header>

        <main id="main-content-flow">
            <!-- CONTRATO DE DATOS (IDs v107) -->
            <section id="modulo-lineup">
                <h2>LINEUP</h2>
                <div id="db-lineup" style="display:flex; flex-direction:column; gap:2rem;"></div>
            </section>

            <section id="modulo-gallery">
                <h2>MULTIMEDIA</h2>
                <div class="media-grid">
                    <div id="modulo-trailer" class="video-wrapper"><div id="db-video-content" style="position:absolute; inset:0;"></div></div>
                    <div id="modulo-playlist" class="spotify-container"><div id="db-spotify-embed" style="height:100%;"></div></div>
                </div>
            </section>

            <section id="modulo-info-tecnica">
                <div id="db-dress-val">--</div>
                <div id="db-aforo-val">--</div>
            </section>

            <section id="modulo-formulario">
                <form id="master-reg-form">
                    <input type="text" id="reg-nombre" placeholder="Nombre completo *" required style="width:100%; padding:1.2rem; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); color:#fff; margin-bottom:1rem; border-radius:10px;">
                    <button type="submit" style="width:100%; padding:1.5rem; background:#fff; color:#000; font-weight:900; border:none; border-radius:12px; cursor:pointer;">REGISTRARME →</button>
                </form>
            </section>

            <!-- IDs PROTEGIDOS (Cero Borrado) -->
            <div id="db-faq-list" style="display:none;"></div>
            <div id="db-mapa-container" style="display:none;"></div>
            <img id="db-poster-img" style="display:none;">
        </main>
    </div>

    <script>
        const SB_URL = "https://ctgyvydzshueemlelkzv.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN0Z3l2eWR6c2h1ZWVtbGVsa3p2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2NTc1NzAsImV4cCI6MjA4OTIzMzU3MH0.3pMA-VZLV2Kfyl6BD-x8v79P7UuXSfMgtIwnfoP_VuY";
        const sbClient = window.supabase.createClient(SB_URL, SB_KEY);

        async function initOrchestrator() {
            const slug = new URLSearchParams(window.location.search).get('slug');
            try {
                const { data: evento, error } = await sbClient.from('eventos').select('*').eq('slug', slug).single();
                if (error) throw error;

                // 1. CARA VISUAL (ATOMIC ISOLATION)
                const tid = evento.config_landing?.template_id || "F2";
                document.body.className = `tpl-${tid.toLowerCase()}`;
                console.log(`%c[INFO] Cara Visual [${tid}] activada.`, "color:#00ff88; font-weight:bold;");

                // 2. MAPEO DE DATOS (CONTRATO DE DATOS)
                document.getElementById('event-title').innerText = evento.nombre.toUpperCase();
                document.getElementById('meta-fecha').innerText = evento.fecha;
                document.getElementById('meta-hora').innerText = `${evento.hora} HRS`;
                document.getElementById('meta-lugar').innerText = (evento.ubicacion || 'LOCALIZACIÓN').toUpperCase();
                if (evento.imagen_url) document.getElementById('hero-bg').style.backgroundImage = `url('${evento.imagen_url}')`;

                const content = evento.config_landing?.content || {};

                // Lineup Recovery
                const lineup = content.dj_lineup || content.lineup || "";
                document.getElementById('db-lineup').innerHTML = (Array.isArray(lineup) ? lineup : lineup.split('\n'))
                    .filter(a => a.length > 2)
                    .map(a => `<div style="font-weight:900; font-size:1.4rem; text-transform:uppercase;">${a.trim()}</div>`).join('');

                // Media Sync 1:1 [6]
                if (content.playlist_url) {
                    const embed = content.playlist_url.replace('/playlist/', '/embed/playlist/');
                    document.getElementById('db-spotify-embed').innerHTML = `<iframe src="${embed}" style="width:100%; height:450px; border:none;" allow="encrypted-media"></iframe>`;
                }
                const trailerUrl = content.trailer_url || "https://player.vimeo.com/video/259411563";
                document.getElementById('db-video-content').innerHTML = `<iframe style="width:100%; height:100%; border:none;" src="${trailerUrl}" allowfullscreen></iframe>`;

                // 3. ESCUDO GOLD (LOGS) [5]
                console.log(`%c[TRACE] 12 Módulos sincronizados | Spotify Sync 1:1 | Multi-Face Ready.`, "color:#e67e22; font-weight:bold;");
                document.getElementById('template-container').style.display = (tid === "F3") ? 'flex' : 'block';

            } catch (err) { console.error("ERROR CRÍTICO:", err.message); } finally { document.getElementById('loader').style.display = 'none'; }
        }
        window.onload = initOrchestrator;
    </script>
</body>
</html>
