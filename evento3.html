    <style>
        :root { --main-bg: #0a0a0c; --gold: #d72dc0; --text-color: #ffffff; }
        html, body { margin: 0; padding: 0; min-height: 100%; background-color: var(--main-bg); color: var(--text-color); font-family: 'Geist', sans-serif; overflow-x: hidden; }
        body::before { content: ""; position: fixed; inset: 0; z-index: 9999; pointer-events: none; opacity: 0.04; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E"); }

        .loading-overlay { position: fixed; inset: 0; background: #000; z-index: 999; display: flex; align-items: center; justify-content: center; font-weight: 900; letter-spacing: 3px; }
        .form-tabs { display: flex; gap: 1.5rem; margin-bottom: 2rem; border-bottom: 1px solid rgba(255,255,255,0.1); }

    </style>
</head>

<body class="tpl-init">

    <script>
        const SB_URL = "https://ctgyvydzshueemlelkzv.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN0Z3l2eWR6c2h1ZWVtbGVsa3p2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2NTc1NzAsImV4cCI6MjA4OTIzMzU3MH0.3pMA-VZLV2Kfyl6BD-x8v79P7UuXSfMgtIwnfoP_VuY";
        const sbClient = window.supabase.createClient(SB_URL, SB_KEY);

        function logStatus(m, t = 'INFO') {
            const colors = { 'INFO':'#00ff88', 'LINK':'#f1c40f', 'TIME':'#9b59b6', 'TRACE':'#e67e22', 'DEBUG':'#3498db', 'ERROR':'#ff4d4d' };
            console.log(`%c[${new Date().toLocaleTimeString()}] [${t}] ${m}`, `color: ${colors[t] || '#fff'}; font-weight: bold;`);
        }

        // MOTOR DE FECHAS CALIBRADO v123 [cite: 9, 872]
        function parseSpanishDate(dateStr, timeStr) {
            const months = { "enero":"01", "febrero":"02", "marzo":"03", "abril":"04", "mayo":"05", "junio":"06", "julio":"07", "agosto":"08", "septiembre":"09", "octubre":"10", "noviembre":"11", "diciembre":"12" };
            const parts = dateStr.toLowerCase().split(' de ');
            if (parts.length === 3) {
                const d = parts.trim().padStart(2, '0');
                const m = months[parts[1].trim()];
                const a = parts[2].trim();
                return new Date(`${a}-${m}-${d}T${timeStr}`);
            }
            return new Date(`${dateStr}T${timeStr}`);
        }

        function switchForm(type) {
            const isNew = type === 'nuevo';
            document.getElementById('tab-new').classList.toggle('active', isNew);
            document.getElementById('tab-old').classList.toggle('active', !isNew);
            document.getElementById('form-nuevo').style.display = isNew ? 'block' : 'none';
            document.getElementById('form-ya').style.display = isNew ? 'none' : 'block';
            logStatus(`DEBUG: Ruta de formulario cambiada a [${type.toUpperCase()}]`, "DEBUG");
        }

        async function injectAtomicCSS(cat, tplId) {
            return new Promise((resolve) => {
                const path = `css/templates/${(cat || 'fiesta').toLowerCase()}/${(tplId || 'f3').toLowerCase()}.css?v=${Date.now()}`;
                let link = document.querySelector('link[data-template-css]');
                if (!link) { link = document.createElement('link'); link.rel = 'stylesheet'; link.setAttribute('data-template-css', 'true'); document.head.appendChild(link); }
                link.onload = () => { logStatus(`LINK: Estilo [${tplId}] cargado con éxito.`, "LINK"); resolve(true); };
                link.onerror = () => { logStatus(`ERROR: Fallo crítico al cargar [${path}]`, "ERROR"); resolve(false); };
                link.href = path;
            });
        }

        async function initEvento() {
            logStatus("Iniciando Orquestador v196 - Fidelidad Absoluta Restablecida.", "INFO");
            const slug = new URLSearchParams(window.location.search).get('slug');
            if (!slug) return;
            try {
                const { data: ev, error } = await sbClient.from('eventos').select('*, organizaciones(nombre)').eq('slug', slug).single();
                if (error || !ev) throw new Error("Evento no hallado.");
                
                // DECLARACIÓN ÚNICA DEL CONTEXTO (Solución al SyntaxError) [cite: 12]
                const content = ev.config_landing?.content || {};

                await injectAtomicCSS(ev.categoria_slug, ev.template_id);
                document.body.className = `tpl-${(ev.template_id || 'f3').toLowerCase()}`;

                 // === INICIO SEGMENTO: VINCULACIÓN DE VIDEO (v202) ===
    if (content.video_url) {
        const videoContainer = document.getElementById('db-video-content');
        if (videoContainer) {
            const isYouTube = content.video_url.includes('youtube.com') || content.video_url.includes('youtu.be');
            
            if (isYouTube) {
                // Protocolo ADR-005: Miniatura + Link (Evita Error 153) [cite: 378]
                const vId = content.video_url.includes('v=') ? content.video_url.split('v=')[1].split('&') : content.video_url.split('/').pop();
                videoContainer.innerHTML = `
                    <div style="position:relative; width:100%; height:100%; cursor:pointer; background:url('https://img.youtube.com/vi/${vId}/maxresdefault.jpg') center/cover;" 
                         onclick="window.open('${content.video_url}', '_blank')">
                        <div style="position:absolute; inset:0; background:rgba(0,0,0,0.3); display:flex; align-items:center; justify-content:center;">
                            <svg width="68" height="68" viewBox="0 0 24 24"><path fill="white" d="M8 5v14l11-7z"/></svg>
                        </div>
                    </div>`;
            } else {
                // Fallback para Vimeo u otros proveedores [cite: 319, 816]
                videoContainer.innerHTML = `<iframe src="${content.video_url}" style="width:100%; height:100%; border:none;" allowfullscreen></iframe>`;
            }
            logStatus("TRACE: Video inyectado y vinculado con éxito.", "TRACE");
        }
    }
    // === FIN SEGMENTO VIDEO ===

                const target = parseSpanishDate(ev.fecha, ev.hora).getTime();
                setInterval(() => {
                    const diff = target - Date.now();
                    if (diff <= 0) return;
                    document.getElementById('cd-days').innerText = Math.floor(diff / 86400000).toString().padStart(2, '0');
                    document.getElementById('cd-hours').innerText = Math.floor((diff % 86400000) / 3600000).toString().padStart(2, '0');
                    document.getElementById('cd-mins').innerText = Math.floor((diff % 3600000) / 60000).toString().padStart(2, '0');
                    document.getElementById('cd-secs').innerText = Math.floor((diff % 60000) / 1000).toString().padStart(2, '0');
                }, 1000);

                // MAPEO DE HERO & METADATA
                document.getElementById('event-title').innerText = ev.nombre.toUpperCase();
                document.getElementById('org-name-badge').innerText = ev.organizaciones?.nombre.toUpperCase() || "--";
                document.getElementById('meta-fecha').innerText = ev.fecha;
                document.getElementById('meta-hora').innerText = `${ev.hora} HRS`;
                document.getElementById('meta-lugar').innerText = (ev.ubicacion || "--").toUpperCase();
                if (ev.imagen_url) document.getElementById('mod-hero').style.backgroundImage = `url('${ev.imagen_url}')`;


    // === INICIO SEGMENTO: MULTIMEDIA FINAL (v205) ===
    // 1. Jerarquía de Video: Columna Directa > JSON content > Fallback Silo [cite: 287, 872]
    const vUrl = ev.video_url || content.video_url || content.trailer_url || "https://player.vimeo.com/video/259411563";
    const vContainer = document.getElementById('db-video-content');
    
    if (vContainer && vUrl) {
        const isYT = vUrl.includes('youtube.com') || vUrl.includes('youtu.be');
        if (isYT) {
            // Extracción robusta de ID para URLs tipo watch?v= [cite: 395, 874]
            let vId = vUrl.includes('v=') ? vUrl.split('v=')[1].split('&') : vUrl.split('/').pop();
            
            vContainer.innerHTML = `
                <div style="position:relative; width:100%; height:100%; cursor:pointer; background:url('https://img.youtube.com/vi/${vId}/maxresdefault.jpg') center/cover;" 
                     onclick="window.open('${vUrl}', '_blank')">
                    <div style="position:absolute; inset:0; background:rgba(0,0,0,0.4); display:flex; align-items:center; justify-content:center;">
                        <svg width="68" height="68" viewBox="0 0 24 24"><path fill="white" d="M8 5v14l11-7z"/></svg>
                    </div>
                </div>`;
        } else {
            vContainer.innerHTML = `<iframe src="${vUrl}" style="width:100%; height:100%; border:none;" allowfullscreen></iframe>`;
        }
        // Log cuantitativo con verificación de URL [cite: 772]
        logStatus(`TRACE: Video real inyectado -> ${vUrl.substring(0, 30)}...`, "TRACE");
    }

    // 2. Sincronía Spotify 1:1 [cite: 462, 767]
    if (content.playlist_url) {
        const embedUrl = content.playlist_url.replace('/playlist/', '/embed/playlist/');
        const sContainer = document.getElementById('db-spotify-embed');
        if (sContainer) {
            sContainer.innerHTML = `<iframe src="${embedUrl}" width="100%" height="100%" frameBorder="0" allow="encrypted-media" style="border-radius:15px;"></iframe>`;
            logStatus("TRACE: Spotify Sync 1:1 Validado.", "TRACE");
        }
    }
    // === FIN SEGMENTO MULTIMEDIA ===


  // === INICIO SEGMENTO: PATROCINADORES CON FALLBACK (v207) ===
    // 1. Detección de Datos vs Fallback v107 [cite: 328, 898]
    const sponsorsRaw = content.sponsors || "";
    let sponsorsList = sponsorsRaw.split(',').map(s => s.trim()).filter(s => s.length > 0);
    let isFallback = false;

    if (sponsorsList.length === 0) {
        // Activación de Activos de Respaldo (Regla de Oro v123: No-Vacío) [cite: 766]
        sponsorsList = [
            "https://supabase.com/favicon/favicon-196x196.png",
            "https://github.com/apple-touch-icon.png",
            "https://www.vectorlogo.zone/logos/spotify/spotify-icon.svg"
        ];
        isFallback = true;
    }

    // 2. Inyección Física en el Contrato de Datos [cite: 757]
    const sponsorsContainer = document.getElementById('db-sponsors-list');
    if (sponsorsContainer) {
        sponsorsContainer.innerHTML = sponsorsList.map(url => `
            <div class="sponsor-item" style="padding: 1.5rem;">
                <img src="${url}" class="sponsor-img" style="height:40px; width:auto; opacity:0.7; filter: grayscale(1) brightness(1.2);">
            </div>`).join('');
            
        // Certificación Cuantitativa Obligatoria (GOLD v1.2) [cite: 760, 763]
        const statusMsg = isFallback ? `Sponsors de REFERENCIA inyectados (${sponsorsList.length} marcas)` : `Sponsors REALES inyectados (${sponsorsList.length} marcas)`;
        logStatus(`TRACE: ${statusMsg}.`, "TRACE");
    }
    // === FIN SEGMENTO PATROCINADORES ===

// === INICIO SEGMENTO: LINEUP & PÓSTER REAL (v197) ===
// 1. Verificación de Póster [cite: 343]
if (document.getElementById('db-poster-img')) {
    document.getElementById('db-poster-img').src = ev.poster_url || ev.imagen_url;
    logStatus("LINK: Póster real vinculado desde Supabase.", "LINK");
}

// === INICIO SEGMENTO: LINEUP CON FOTOS REALES (v198) ===
    if (content.dj_lineup && Array.isArray(content.dj_lineup)) {
        document.getElementById('db-lineup').innerHTML = content.dj_lineup.map(dj => {
            // Soporte Dual: Detecta si 'dj' es un texto simple o un objeto {nombre, foto} [cite: 821]
            const name = typeof dj === 'object' ? dj.nombre : dj;
            const photo = (typeof dj === 'object' && dj.foto) ? dj.foto : "https://ctgyvydzshueemlelkzv.supabase.co/storage/v1/object/public/assets/avatar-default.png";
            
            return `
                <div class="artist-item" style="display:flex; align-items:center; gap:1.8rem; margin-bottom:2.5rem;">
                    <img src="${photo}" class="artist-avatar" style="width:65px; height:65px; border-radius:50%; border:2px solid var(--gold, #d72dc0); object-fit:cover;">
                    <span class="artist-name" style="font-weight:900; text-transform:uppercase;">${name.toUpperCase()}</span>
                </div>`;
        }).join('');
        
        // Certificación Cuantitativa (Obligatorio Regla de Oro v123) [cite: 783]
        logStatus(`TRACE: Lineup inyectado (${content.dj_lineup.length} artistas con fotos reales).`, "TRACE");
    }
    // === FIN SEGMENTO: LINEUP ===

  // === INICIO SEGMENTO: FAQ MULTI-FORMATO (v200) ===
    if (content.faq) {
        let faqHtml = '';
        // Soporte para Array de objetos (v199) o String con tuberías (v107) [cite: 8, 338]
        if (Array.isArray(content.faq)) {
            faqHtml = content.faq.map(item => `
                <div class="faq-item" onclick="this.classList.toggle('active')" style="cursor:pointer; padding:1.2rem 0; border-bottom:1px solid rgba(255,255,255,0.05);">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <span style="font-weight:800; font-size:0.85rem; letter-spacing:1px;">${(item.pregunta || "").toUpperCase()}</span>
                        <div style="width:22px; height:22px; border-radius:50%; border:1px solid var(--gold, #d72dc0); display:flex; align-items:center; justify-content:center; color:var(--gold, #d72dc0);">+</div>
                    </div>
                    <div class="faq-answer" style="max-height:0; overflow:hidden; transition:0.4s ease; font-size:0.85rem; opacity:0.6; padding-top:0;">${item.respuesta}</div>
                </div>`).join('');
        } else if (typeof content.faq === 'string') {
            faqHtml = content.faq.split('\n').filter(l => l.includes('|')).map(l => {
                const [q, a] = l.split('|');
                return `<div class="faq-item" onclick="this.classList.toggle('active')" style="cursor:pointer; padding:1.2rem 0; border-bottom:1px solid rgba(255,255,255,0.05);"><div style="display:flex; justify-content:space-between; align-items:center;"><span style="font-weight:800; font-size:0.85rem; letter-spacing:1px;">${q.trim().toUpperCase()}</span><div style="width:22px; height:22px; border-radius:50%; border:1px solid var(--gold, #d72dc0); display:flex; align-items:center; justify-content:center; color:var(--gold, #d72dc0);">+</div></div><div class="faq-answer" style="max-height:0; overflow:hidden; transition:0.4s ease; font-size:0.85rem; opacity:0.6; padding-top:0;">${a.trim()}</div></div>`;
            }).join('');
        }
        document.getElementById('db-faq-list').innerHTML = faqHtml;
        
        // Log TRACE Requerido por Regla de Oro v123 [cite: 768]
        const count = document.querySelectorAll('#db-faq-list .faq-item').length;
        logStatus(`TRACE: FAQ inyectado (${count} preguntas detectadas).`, "TRACE");
    }
    // === FIN SEGMENTO: FAQ ===

    // === INICIO SEGMENTO: VINCULACIÓN DE UBICACIÓN (v201) ===
    if (ev.ubicacion) {
        // 1. Inyección de Texto del Venue [cite: 302]
        if (document.getElementById('venue-name')) {
            document.getElementById('venue-name').innerText = ev.ubicacion.toUpperCase();
        }

        // 2. Construcción Dinámica del Mapa (Google Maps Embed) [cite: 301]
        const mapUrl = `https://maps.google.com/maps?q=${encodeURIComponent(ev.ubicacion)}&t=&z=15&ie=UTF8&iwloc=&output=embed`;
        const mapContainer = document.getElementById('db-mapa-container');
        
        if (mapContainer) {
            mapContainer.innerHTML = `
                <iframe width="100%" height="100%" src="${mapUrl}" allowfullscreen 
                        style="filter: grayscale(1) invert(1) contrast(1.2); border:none;"></iframe>`;
        }

        // Certificación de Salud Escudo GOLD [cite: 805, 811]
        logStatus("TRACE: Módulo de ubicación vinculado y mapa inyectado.", "TRACE");
    }
    // === FIN SEGMENTO UBICACIÓN ===

                // ACTIVACIÓN DE MÓDULOS [cite: 865]
                const modules = ['mod-hero', 'mod-lineup', 'mod-gallery', 'mod-info-tecnica', 'mod-faq-ubicacion', 'mod-sponsors', 'mod-form'];
                modules.forEach(id => { if (document.getElementById(id)) { 
                    document.getElementById(id).style.setProperty('display', 'block', 'important'); 
                    logStatus(`INFO: Módulo [${id}] -> VALIDADO Y ACTIVO`, "INFO"); 
                }});

                logStatus("TIME: Heartbeat sincronizado satisfactoriamente.", "TIME");

            } catch (err) { logStatus(`FALLO CRÍTICO: ${err.message}`, "ERROR"); } finally { document.getElementById('loader').style.display = 'none'; }
        }
        window.onload = initEvento;
    </script>
