<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Master Orchestrator v111 · Sistema QR</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.3.0/dist/fonts/geist.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/qr-creator/dist/qr-creator.min.js"></script>

    <style id="master-core-styles">
        :root { --main-bg: #050505; --text-color: #ffffff; }
        html, body { margin: 0; padding: 0; background: var(--main-bg); color: var(--text-color); font-family: 'Geist', sans-serif; overflow-x: hidden; }
        .loading-overlay { position: fixed; inset: 0; background: #000; z-index: 9999; display: flex; align-items: center; justify-content: center; font-weight: 900; letter-spacing: 3px; }
        #template-container { display: none; }
    </style>

    <!-- SILO VISUAL: TEMPLATE 6 (Baseline v107 Protegido) -->
    <style id="style-p6">
        .tpl-p6 { --gold: #df20b6; --border-glow: rgba(223, 32, 182, 0.4); --glass-lite: rgba(255, 255, 255, 0.03); }
        .tpl-p6 body::before { content: ""; position: fixed; inset: 0; z-index: 9999; pointer-events: none; opacity: 0.04; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E"); }
        .tpl-p6 section { padding: 5rem 10%; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .tpl-p6 h2 { color: var(--gold); letter-spacing: 4px; text-transform: uppercase; font-size: 0.75rem; font-weight: 900; margin-bottom: 3.5rem; text-align: left; }
        
        .tpl-p6 .hero { position: relative; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; background-size: cover; background-position: center; }
        .tpl-p6 .hero::before { content: ''; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, rgba(5,5,5,0.3) 50%, rgba(5,5,5,1) 100%); z-index: 1; }
        .tpl-p6 .hero-title { font-weight: 900; font-size: clamp(2.5rem, 8vw, 4.5rem); text-transform: uppercase; z-index: 2; letter-spacing: -3px; }
        .tpl-p6 .hero-meta { display: flex; flex-wrap: wrap; justify-content: center; gap: 2.5rem; margin-top: 2.5rem; font-weight: 800; text-transform: uppercase; font-size: 0.85rem; letter-spacing: 2px; z-index: 2; position: relative; opacity: 0.9; }
        .tpl-p6 .meta-svg { width: 18px; height: 18px; fill: var(--gold); vertical-align: middle; margin-right: 0.7rem; }

        .tpl-p6 .unified-countdown-frame { position: relative; z-index: 2; margin: 3.5rem auto 0; padding: 0.7rem 1.2rem; background: rgba(255, 255, 255, 0.01); border-radius: 10px; border: 2px solid var(--gold); box-shadow: 0 0 25px var(--border-glow); display: flex; width: fit-content; }
        .tpl-p6 .cd-v { display: block; font-size: 3.2rem !important; font-weight: 900; line-height: 1; }

        .tpl-p6 .media-grid { display: grid; grid-template-columns: 1.6fr 1fr; gap: 2.5rem; max-width: 1100px; margin: 4rem auto 0; align-items: stretch; }
        .tpl-p6 .video-wrapper { position: relative; width: 100%; padding-top: 56.25%; border-radius: 15px; overflow: hidden; border: 1px solid var(--gold); box-shadow: 0 0 30px var(--border-glow); }
        .tpl-p6 .video-iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: none; }
        .tpl-p6 .spotify-container { border-radius: 15px; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); background: #121212; height: 100%; }

        .tpl-p6 .artist-avatar { width: 65px; height: 65px; border-radius: 50%; object-fit: cover; border: 2px solid var(--gold); }
        .tpl-p6 .poster-main-img { width: 320px; border-radius: 12px; border: 4px solid var(--gold); box-shadow: 0 0 30px var(--border-glow); }
        .tpl-p6 .data-card { background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 15px; padding: 2.5rem 1rem; text-align: center; min-height: 240px; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .tpl-p6 .card-icon-xl { width: 68px; height: 68px; fill: var(--gold); filter: drop-shadow(0 0 15px var(--gold)); opacity: 0.9; margin-top: 2rem; }

        .tpl-p6 .faq-icon-circle { width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--gold); display: flex; align-items: center; justify-content: center; color: var(--gold); }
        .tpl-p6 .sponsor-img { height: 40px; width: auto; opacity: 0.8; }
        .tpl-p6 .form-master-box { max-width: 600px; margin: 0 auto; background: var(--glass-lite); padding: 3rem; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); }
    </style>
</head>

<body class="tpl-p6">

    <div id="loader" class="loading-overlay">ORCHESTRATOR v111 · SYNCING P6...</div>

    <div id="template-container">
        <!-- CONTRATO DE DATOS (IDs v107 Obligatorios) -->
        <header id="hero-bg" class="hero">
            <div id="org-name-badge" style="position:absolute; top:2rem; left:2rem; font-weight:900; letter-spacing:2px; text-transform:uppercase; z-index:2;">--</div>
            <div class="hero-content">
                <h1 id="event-title" class="hero-title">--</h1>
                <div class="hero-meta">
                    <div class="meta-item"><svg class="meta-svg" viewBox="0 0 24 24"><path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2z"/></svg><span id="meta-fecha">--</span></div>
                    <div class="meta-item"><svg class="meta-svg" viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58-8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg><span id="meta-hora">--</span></div>
                    <div class="meta-item"><svg class="meta-svg" viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg><span id="meta-lugar">--</span></div>
                </div>
                <div id="unified-frame" class="unified-countdown-frame">
                    <div style="padding:0 0.8rem;"><span id="cd-days" class="cd-v">00</span><span style="font-size:0.5rem; letter-spacing:2px;">DÍAS</span></div>
                    <div style="padding:0 0.8rem;"><span id="cd-hours" class="cd-v">00</span><span style="font-size:0.5rem; letter-spacing:2px;">HORAS</span></div>
                    <div style="padding:0 0.8rem;"><span id="cd-mins" class="cd-v">00</span><span style="font-size:0.5rem; letter-spacing:2px;">MIN</span></div>
                    <div style="padding:0 0.8rem;"><span id="cd-secs" class="cd-v">00</span><span style="font-size:0.5rem; letter-spacing:2px;">SEG</span></div>
                </div>
            </div>
        </header>

        <main id="main-content-flow">
            <section id="modulo-lineup">
                <h2>ARTISTAS INVITADOS</h2>
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:0; max-width:950px; margin:0 auto; align-items:start;">
                    <div style="display:flex; justify-content:center; padding-right:5rem; border-right:1px solid rgba(255,255,255,0.1);"><img id="db-poster-img" src="" class="poster-main-img" alt="Poster"></div>
                    <div id="db-lineup" style="display:flex; flex-direction:column; gap:2.5rem; padding-left:5rem;"></div>
                </div>
            </section>

            <section id="modulo-gallery">
                <h2>GALERÍA</h2>
                <div id="db-gallery-grid" style="display:grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap:1rem; margin-top:1rem; margin-bottom:4rem;"></div>
                <div class="media-grid">
                    <div id="modulo-trailer" class="video-wrapper"><div id="db-video-content" style="height:100%; width:100%;"></div></div>
                    <div id="modulo-playlist" class="spotify-container"><div id="db-spotify-embed" style="height:100%;"></div></div>
                </div>
            </section>

            <section id="modulo-info-tecnica">
                <div class="data-cards-container" style="display:grid; grid-template-columns: repeat(4, 1fr); gap:1.2rem; max-width:1100px; margin:0 auto;">
                    <div class="data-card"><div><span style="color:var(--gold); font-size:0.6rem; font-weight:900; letter-spacing:3px;">DRESS CODE</span><br><span id="db-dress-val" style="font-size:1.15rem; font-weight:900;">--</span></div><svg class="card-icon-xl" viewBox="0 0 24 24"><path d="M17 10h-2c0-1.66-1.34-3-3-3s-3 1.34-3 3H7c-1.1 0-2 .9-2 2v6c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2v-6c0-1.1-.9-2-2-2z"/></svg></div>
                    <div class="data-card"><div><span style="color:var(--gold); font-size:0.6rem; font-weight:900; letter-spacing:3px;">GUEST LIST</span><br><span id="db-guest-val" style="font-size:1.15rem; font-weight:900;">--</span></div></div>
                    <div class="data-card"><div><span style="color:var(--gold); font-size:0.6rem; font-weight:900; letter-spacing:3px;">AFORO</span><br><span id="db-aforo-val" style="font-size:1.15rem; font-weight:900;">--</span></div><svg class="card-icon-xl" viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5s-3 1.34-3 3 1.34 3 3 3z"/></svg></div>
                    <div class="data-card"><div><span style="color:var(--gold); font-size:0.6rem; font-weight:900; letter-spacing:3px;">TICKETS</span><br><span id="db-ticket-val" style="font-size:1.15rem; font-weight:900;">--</span></div><svg class="card-icon-xl" viewBox="0 0 24 24"><path d="M22 10V6H4v4c1.1 0 2 .9 2 2s-.9 2-2 2v4h18v-4c-1.1 0-2-.9-2-2s.9-2 2-2z"/></svg></div>
                </div>
            </section>

            <section id="modulo-faq-ubicacion">
                <div style="display:grid; grid-template-columns: 1fr 1.1fr; gap:0; max-width:1200px; margin:0 auto; align-items:stretch;">
                    <div style="padding-right:4rem; border-right:1px solid rgba(255,255,255,0.1);"><h2>FAQ</h2><div id="db-faq-list"></div></div>
                    <div style="padding-left:4rem;"><h2>UBICACIÓN</h2><div id="venue-name" style="font-weight:800; text-transform:uppercase; margin-bottom:1rem;">--</div><div id="db-mapa-container" style="width:100%; height:380px; border-radius:15px; overflow:hidden; border:1px solid rgba(255,255,255,0.15);"></div></div>
                </div>
            </section>

            <section id="modulo-sponsors" style="text-align:center;">
                <span style="color:var(--gold); font-size:0.6rem; font-weight:900; letter-spacing:3px;">PATROCINADO POR</span>
                <div id="db-sponsors-list" style="display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:4rem; margin-top:2.5rem;"></div>
            </section>

            <section id="modulo-formulario">
                <div class="form-master-box">
                    <form id="master-reg-form">
                        <input type="text" id="reg-nombre" class="form-input" style="width:100%; padding:1.2rem; margin-bottom:1rem; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); color:white; border-radius:12px;" placeholder="Nombre completo *" required>
                        <button type="submit" style="background:var(--gold); color:white; border:none; padding:1.5rem; border-radius:15px; font-weight:900; width:100%; cursor:pointer;">Confirmar Asistencia →</button>
                    </form>
                </div>
            </section>
        </main>
    </div>

    <script>
        const SB_URL = "https://ctgyvydzshueemlelkzv.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN0Z3l2eWR6c2h1ZWVtbGVsa3p2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2NTc1NzAsImV4cCI6MjA4OTIzMzU3MH0.3pMA-VZLV2Kfyl6BD-x8v79P7UuXSfMgtIwnfoP_VuY";
        const sbClient = window.supabase.createClient(SB_URL, SB_KEY);

        function logStatus(m, t = 'INFO') {
            const colors = { 'INFO':'#00ff88', 'LINK':'#f1c40f', 'TIME':'#9b59b6', 'TRACE':'#e67e22', 'ERROR':'#ff4d4d' };
            console.log(`%c[${t}] ${m}`, `color: ${colors[t]}; font-weight: bold;`);
        }

        async function initOrchestrator() {
            logStatus("AUDITORÍA V111: Ejecutando Master Orchestrator Integrado.");
            const slug = new URLSearchParams(window.location.search).get('slug');
            try {
                const { data: evento, error } = await sbClient.from('eventos').select('*').eq('slug', slug).single();
                if (error) throw error;

                const tid = evento.config_landing?.template_id || "P6";
                document.body.className = `tpl-${tid.toLowerCase()}`;
                logStatus(`INFO: Template ${tid} activado sobre el nucleo master.`, "INFO");

                // 1. Datos Maestros
                document.getElementById('event-title').innerText = evento.nombre.toUpperCase();
                document.getElementById('meta-fecha').innerText = evento.fecha;
                document.getElementById('meta-hora').innerText = `${evento.hora} HRS`;
                document.getElementById('meta-lugar').innerText = (evento.ubicacion || 'LOCALIZACIÓN').toUpperCase();
                if (evento.imagen_url) document.getElementById('hero-bg').style.backgroundImage = `url('${evento.imagen_url}')`;
                const { data: org } = await sbClient.from('organizaciones').select('nombre').eq('id', evento.org_id).single();
                if (org) document.getElementById('org-name-badge').innerText = org.nombre.toUpperCase();

                // 2. Mapeo de Contenido (v107 Full)
                const content = evento.config_landing?.content || {};
                document.getElementById('db-poster-img').src = evento.poster_url || evento.imagen_url;
                
                const lineup = content.dj_lineup || content.lineup || "";
                document.getElementById('db-lineup').innerHTML = (Array.isArray(lineup) ? lineup : lineup.split('\n')).filter(a => a.length > 2).map(a => `
                    <div style="display:flex; align-items:center; gap:1.8rem;"><img src="https://images.unsplash.com/photo-1520813792240-56fc4a3765a7?q=80&w=200" class="artist-avatar"><span style="font-weight:900; text-transform:uppercase;">${a.trim()}</span></div>`).join('');
                
                if (content.gallery) document.getElementById('db-gallery-grid').innerHTML = content.gallery.map(u => `<img src="${u}" style="width:100%; height:250px; object-fit:cover; border-radius:12px;">`).join('');

                const trailerUrl = content.trailer_url || "https://player.vimeo.com/video/259411563";
                document.getElementById('db-video-content').innerHTML = `<iframe class="video-iframe" src="${trailerUrl}" allowfullscreen></iframe>`;
                if (content.playlist_url) {
                    const embed = content.playlist_url.replace('/playlist/', '/embed/playlist/');
                    document.getElementById('db-spotify-embed').innerHTML = `<iframe src="${embed}" style="width:100%; height:100%; border:none;" allow="encrypted-media"></iframe>`;
                }

                // 3. Tech Data
                document.getElementById('db-dress-val').innerText = (content.dresscode || 'NEON').toUpperCase();
                document.getElementById('db-guest-val').innerText = (content.guest_list || '+200');
                document.getElementById('db-aforo-val').innerText = `${evento.aforo_max || 100}`;
                document.getElementById('db-ticket-val').innerText = (content.tickets_info || 'DISPONIBLES').toUpperCase();

                if (content.faq) {
                    document.getElementById('db-faq-list').innerHTML = content.faq.split('\n').filter(l => l.includes('|')).map(l => {
                        const [q, a] = l.split('|');
                        return `<div class="faq-item" onclick="this.classList.toggle('active')"><div class="faq-header" style="display:flex; justify-content:space-between; padding:1.2rem 0; cursor:pointer;"><span>${q.trim()}</span><div class="faq-icon-circle">+</div></div><div class="faq-answer" style="max-height:0; opacity:0; overflow:hidden; transition:0.4s ease;">${a.trim()}</div></div>`;
                    }).join('');
                }

                const mapUrl = `https://maps.google.com/maps?q=${encodeURIComponent(evento.ubicacion)}&t=&z=15&ie=UTF8&iwloc=&output=embed`;
                document.getElementById('db-mapa-container').innerHTML = `<iframe width="100%" height="100%" src="${mapUrl}" allowfullscreen style="filter: grayscale(1) invert(1) contrast(1.2); border:none; border-radius:15px;"></iframe>`;

                const logos = ["https://supabase.com/favicon/favicon-196x196.png", "https://github.com/apple-touch-icon.png", "https://www.vectorlogo.zone/logos/spotify/spotify-icon.svg"];
                document.getElementById('db-sponsors-list').innerHTML = logos.map(url => `<img src="${url}" class="sponsor-img">`).join('');

                logStatus("TRACE: 12 Módulos mapeados y persistentes.", "TRACE");

                // 4. Heartbeat
                const target = new Date(`${evento.fecha}T${evento.hora}`).getTime();
                setInterval(() => {
                    const diff = target - new Date().getTime();
                    document.getElementById('cd-days').innerText = Math.floor(diff / 86400000).toString().padStart(2, '0');
                    document.getElementById('cd-hours').innerText = Math.floor((diff % 86400000) / 3600000).toString().padStart(2, '0');
                    document.getElementById('cd-mins').innerText = Math.floor((diff % 3600000) / 60000).toString().padStart(2, '0');
                    document.getElementById('cd-secs').innerText = Math.floor((diff % 60000) / 1000).toString().padStart(2, '0');
                }, 1000);
                logStatus("TIME: Heartbeat maestro sincronizado.", "TIME");

                if (document.getElementById('master-reg-form')) logStatus("LINK: Motor de registro verificado.", "LINK");

                document.getElementById('template-container').style.display = 'block';

            } catch (err) { console.error(err); } finally { document.getElementById('loader').style.display = 'none'; }
        }
        window.onload = initOrchestrator;
    </script>
</body>
</html>
