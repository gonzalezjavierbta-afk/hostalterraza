<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Master Orchestrator · Sistema QR v110</title>
    
    <!-- LIBRERÍAS MAESTRAS (Compartidas) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.3.0/dist/fonts/geist.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/qr-creator/dist/qr-creator.min.js"></script>

    <!-- 1. CSS CORE: Lógica de carga y reseteo (Heredado de evento.html) -->
    <style id="master-core-styles">
        :root { --main-bg: #050505; --text-color: #ffffff; }
        html, body { margin: 0; padding: 0; background: var(--main-bg); color: var(--text-color); font-family: 'Geist', sans-serif; overflow-x: hidden; }
        .loading-overlay { position: fixed; inset: 0; background: #000; z-index: 9999; display: flex; align-items: center; justify-content: center; font-weight: 900; letter-spacing: 3px; }
        #template-container { display: none; }
    </style>

    <!-- 2. SILO VISUAL: TEMPLATE 6 (Integrado desde evento2.html v107) -->
    <style id="style-p6">
        .tpl-p6 { --gold: #df20b6; --border-glow: rgba(223, 32, 182, 0.4); }
        .tpl-p6 section { display: none; padding: 5rem 10%; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .tpl-p6 h2 { color: var(--gold); letter-spacing: 4px; text-transform: uppercase; font-size: 0.75rem; font-weight: 900; margin-bottom: 3.5rem; text-align: left; }
        
        /* Estilos Premium v107: Hero, Multimedia y Lineup */
        .tpl-p6 .hero { position: relative; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; background-size: cover; background-position: center; }
        .tpl-p6 .hero::before { content: ''; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, rgba(5,5,5,0.3) 50%, rgba(5,5,5,1) 100%); z-index: 1; }
        .tpl-p6 .hero-title { font-weight: 900; font-size: clamp(2.5rem, 8vw, 4.5rem); text-transform: uppercase; z-index: 2; letter-spacing: -3px; }
        
        .tpl-p6 .unified-countdown-frame { position: relative; z-index: 2; margin-top: 3.5rem; padding: 0.7rem 1.2rem; background: rgba(255, 255, 255, 0.01); border-radius: 10px; border: 2px solid var(--gold); box-shadow: 0 0 25px var(--border-glow); display: flex; }
        .tpl-p6 .cd-v { display: block; font-size: 3.2rem !important; font-weight: 900; line-height: 1; }

        .tpl-p6 .media-grid { display: grid; grid-template-columns: 1.6fr 1fr; gap: 2.5rem; align-items: stretch; margin-top: 4rem; }
        .tpl-p6 .video-wrapper { border-radius: 15px; overflow: hidden; border: 1px solid var(--gold); box-shadow: 0 0 30px var(--border-glow); position: relative; padding-top: 56.25%; }
        .tpl-p6 .video-iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: none; }
        
        .tpl-p6 .artist-avatar { width: 65px; height: 65px; border-radius: 50%; object-fit: cover; border: 2px solid var(--gold); }
        .tpl-p6 .poster-main-img { width: 320px; border-radius: 12px; border: 4px solid var(--gold); box-shadow: 0 0 30px var(--border-glow); }
        
        .tpl-p6 .card-icon-xl { width: 68px; height: 68px; fill: var(--gold); filter: drop-shadow(0 0 15px var(--gold)); opacity: 0.9; margin-top: 2rem; }
    </style>
</head>

<body class="tpl-p6"> <!-- Se inyectará dinámicamente según la DB -->

    <div id="loader" class="loading-overlay">NEW MASTER · V110...</div>

    <div id="template-container">
        <!-- CONTRATO DE DATOS: Estructura HTML que el Orquestador siempre servirá -->
        <header id="hero-bg" class="hero">
            <div id="org-name-badge" style="position:absolute; top:2rem; left:2rem; font-weight:900; letter-spacing:2px; text-transform:uppercase; z-index:2;">--</div>
            <div class="hero-content">
                <h1 id="event-title" class="hero-title">--</h1>
                <div id="unified-frame" class="unified-countdown-frame">
                    <div style="padding:0 0.8rem;"><span id="cd-days" class="cd-v">00</span><span style="font-size:0.5rem; letter-spacing:2px;">DÍAS</span></div>
                    <div style="padding:0 0.8rem;"><span id="cd-hours" class="cd-v">00</span><span style="font-size:0.5rem; letter-spacing:2px;">HORAS</span></div>
                </div>
            </div>
        </header>

        <main id="main-content-flow">
            <!-- Bloque de Datos (IDs universales) -->
            <section id="modulo-lineup">
                <h2>ARTISTAS INVITADOS</h2>
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:5rem; max-width:950px; margin:0 auto;">
                    <img id="db-poster-img" src="" class="poster-main-img" alt="Poster">
                    <div id="db-lineup" style="display:flex; flex-direction:column; gap:2.5rem;"></div>
                </div>
            </section>

            <section id="modulo-gallery">
                <div id="db-gallery-grid" style="display:grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap:1rem; margin-bottom:4rem;"></div>
                <div class="media-grid">
                    <div id="db-video-content"></div>
                    <div id="db-spotify-embed" style="height:100%;"></div>
                </div>
            </section>

            <section id="modulo-info-tecnica">
                <div id="tech-data-container" style="display:grid; grid-template-columns: repeat(4, 1fr); gap:1.2rem;">
                    <!-- Los divs de las tarjetas se pueblan aquí -->
                    <div class="data-card"><span id="db-dress-val">--</span><svg class="card-icon-xl" viewBox="0 0 24 24"><path d="M17 10h-2c0-1.66-1.34-3-3-3s-3 1.34-3 3H7c-1.1 0-2 .9-2 2v6c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2v-6c0-1.1-.9-2-2-2z"/></svg></div>
                    <div class="data-card"><span id="db-aforo-val">--</span><svg class="card-icon-xl" viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5s-3 1.34-3 3 1.34 3 3 3z"/></svg></div>
                </div>
            </section>

            <section id="modulo-formulario">
                <div id="master-form-box" class="form-master-box">
                    <form id="master-reg-form">
                        <!-- Campos dinámicos v97 -->
                        <input type="text" id="reg-nombre" placeholder="Nombre completo *" required>
                        <input type="email" id="reg-email" placeholder="Correo (Opcional)">
                        <button type="submit">Confirmar Asistencia →</button>
                    </form>
                </div>
            </section>
        </main>
    </div>

    <script>
        const SB_URL = "https://ctgyvydzshueemlelkzv.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN0Z3l2eWR6c2h1ZWVtbGVsa3p2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2NTc1NzAsImV4cCI6MjA4OTIzMzU3MH0.3pMA-VZLV2Kfyl6BD-x8v79P7UuXSfMgtIwnfoP_VuY";
        const sbClient = window.supabase.createClient(SB_URL, SB_KEY);

        function logStatus(m, t = 'INFO') {
            const colors = { 'INFO':'#00ff88', 'LINK':'#f1c40f', 'TIME':'#9b59b6', 'TRACE':'#e67e22' };
            console.log(`%c[${t}] ${m}`, `color: ${colors[t]}; font-weight: bold;`);
        }

        async function initOrchestrator() {
            logStatus("AUDITORÍA V110: Iniciando el Nuevo Master (evento3).");
            const slug = new URLSearchParams(window.location.search).get('slug');
            
            try {
                const { data: evento, error } = await sbClient.from('eventos').select('*').eq('slug', slug).single();
                if (error) throw error;

                // 1. ACTIVACIÓN DE CARA VISUAL (P6 por defecto)
                const tid = evento.config_landing?.template_id || "P6";
                document.body.className = `tpl-${tid.toLowerCase()}`;
                logStatus(`INFO: Template ${tid} activado sobre el nucleo master.`, "INFO");

                // 2. MAPEO DE DATOS (Agonístico)
                document.getElementById('event-title').innerText = evento.nombre.toUpperCase();
                document.getElementById('db-poster-img').src = evento.poster_url || evento.imagen_url;
                if (evento.imagen_url) document.getElementById('hero-bg').style.backgroundImage = `url('${evento.imagen_url}')`;
                logStatus("TRACE: Datos del Hero y Poster inyectados.", "TRACE");

                // 3. HEARTBEAT
                const target = new Date(`${evento.fecha}T${evento.hora}`).getTime();
                setInterval(() => {
                    const diff = target - new Date().getTime();
                    document.getElementById('cd-days').innerText = Math.floor(diff / 86400000).toString().padStart(2, '0');
                    document.getElementById('cd-hours').innerText = Math.floor((diff % 86400000) / 3600000).toString().padStart(2, '0');
                }, 1000);
                logStatus("TIME: Heartbeat maestro sincronizado.", "TIME");

                // 4. MOTOR DUAL-PATH
                if (document.getElementById('master-reg-form')) {
                    logStatus("LINK: Motor de registro (Dual-Path) verificado y persistente.", "LINK");
                }

                document.getElementById('template-container').style.display = 'block';
                const { data: org } = await sbClient.from('organizaciones').select('nombre').eq('id', evento.org_id).single();
                if (org) document.getElementById('org-name-badge').innerText = org.nombre.toUpperCase();

            } catch (err) { console.error(err); } finally { document.getElementById('loader').style.display = 'none'; }
        }
        window.onload = initOrchestrator;
    </script>
</body>
</html>
