<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Master Orchestrator v151 · Full Integrity Milestone</title>
    
    <!-- CDNs Obligatorios (Contrato v107) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.3.0/dist/fonts/geist.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/qr-creator/dist/qr-creator.min.js"></script>

    <style>
        :root { --main-bg: #050505; --gold: #df20b6; --text-color: #ffffff; }
        html, body { 
            margin: 0; padding: 0; min-height: 100%; 
            background-color: var(--main-bg); color: var(--text-color); 
            font-family: 'Geist', sans-serif; overflow-x: hidden; 
        }
        
        /* ESCUDO DE GRANO (v47) */
        body::before { 
            content: ""; position: fixed; inset: 0; z-index: 9999; pointer-events: none; opacity: 0.04; 
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E"); 
        }
        
        /* Blindaje de Seguridad: Secciones ocultas hasta validación de datos */
        section, header { display: none; }
        .loading-overlay { 
            position: fixed; inset: 0; background: #000; z-index: 999; 
            display: flex; align-items: center; justify-content: center; 
            font-weight: 900; letter-spacing: 3px; 
        }

        /* Estilos Base Motor Dual-Path (v151) */
        .form-tabs { display: flex; gap: 1.5rem; margin-bottom: 2rem; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .tab-btn { 
            background: none; border: none; color: rgba(255,255,255,0.4); 
            padding-bottom: 0.8rem; cursor: pointer; font-weight: 800; 
            text-transform: uppercase; font-size: 0.7rem; letter-spacing: 1px;
        }
        .tab-btn.active { color: var(--gold); border-bottom: 2px solid var(--gold); }
    </style>
</head>

<body class="tpl-init">
    <div id="loader" class="loading-overlay">VERIFICACIÓN MAESTRA V151...</div>

    <!-- 1. HERO SECTION PROTEGIDA -->
    <header id="mod-hero" class="hero">
        <div id="org-name-badge" style="position:absolute; top:2.5rem; left:2.5rem; font-weight:900; letter-spacing:2px; text-transform:uppercase; z-index:10;">--</div>
        <div class="hero-content">
            <h1 id="event-title" class="hero-title">--</h1>
            <div class="hero-meta" style="display:flex; gap:2.5rem; justify-content:center; margin: 1.5rem 0; opacity:0.8; font-weight:800; text-transform:uppercase; font-size:0.75rem;">
                <div class="meta-item"><span id="meta-fecha">--/--/--</span></div>
                <div class="meta-item"><span id="meta-hora">--:--</span></div>
                <div class="meta-item"><span id="meta-lugar">--</span></div>
            </div>
            <div id="unified-frame" class="unified-countdown-frame">
                <div class="cd-block"><span id="cd-days" class="cd-v">00</span><span class="cd-l">DÍAS</span></div>
                <div class="cd-block"><span id="cd-hours" class="cd-v">00</span><span class="cd-l">HORAS</span></div>
                <div class="cd-block"><span id="cd-mins" class="cd-v">00</span><span class="cd-l">MIN</span></div>
                <div class="cd-block"><span id="cd-secs" class="cd-v">00</span><span class="cd-l">SEG</span></div>
            </div>
        </div>
    </header>

    <main id="main-content-flow">
        <!-- 2. LINEUP & POSTER (RECOVERED) -->
        <section id="mod-lineup">
            <div class="lineup-container" style="display:grid; grid-template-columns: 1fr 1fr; gap:3rem; max-width:1100px; margin:0 auto; align-items:start;">
                <div id="db-poster-container" style="display:flex; justify-content:center;">
                    <img id="db-poster-img" src="" alt="Poster del Evento" style="max-width:100%; border-radius:15px; box-shadow: 0 20px 50px rgba(0,0,0,0.5);">
                </div>
                <div id="db-lineup" style="display:flex; flex-direction:column; gap:1.5rem;">
                    <!-- Artistas inyectados aquí -->
                </div>
            </div>
        </section>

        <!-- 3. MULTIMEDIA GRID (SYNC 1:1) -->
        <section id="mod-gallery">
            <div id="db-gallery-grid" style="display:grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap:1rem; margin-bottom:4rem;"></div>
            <div class="media-grid">
                <div id="db-video-content" style="aspect-ratio: 16/9; background:#000; border-radius:12px; overflow:hidden;"></div>
                <div id="db-spotify-embed" style="border-radius:12px; overflow:hidden;"></div>
            </div>
        </section>

        <!-- 4. DATA CARDS PREMIUM (v122) -->
        <section id="mod-info-tecnica">
            <div class="data-cards-container" style="display:grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap:1.5rem; max-width:1200px; margin:0 auto;">
                <div class="card-item"><span class="label">DRESS CODE</span><span id="db-dress-val">--</span></div>
                <div class="card-item"><span class="label">INVITADOS</span><span id="db-guest-val">--</span></div>
                <div class="card-item"><span class="label">AFORO MÁXIMO</span><span id="db-aforo-val">--</span></div>
                <div class="card-item"><span class="label">TICKETS</span><span id="db-ticket-val">--</span></div>
            </div>
        </section>

        <!-- 5. FAQ & UBICACIÓN -->
        <section id="mod-faq-ubicacion">
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:4rem; max-width:1200px; margin:0 auto;">
                <div id="mod-faq">
                    <h2 style="font-weight:900; letter-spacing:-1px; margin-bottom:2rem;">PREGUNTAS FRECUENTES</h2>
                    <div id="db-faq-list"></div>
                </div>
                <div id="mod-ubicacion">
                    <h2 style="font-weight:900; letter-spacing:-1px; margin-bottom:2rem;">UBICACIÓN</h2>
                    <div id="venue-name" style="font-weight:800; text-transform:uppercase; margin-bottom:1rem; color:var(--gold);">--</div>
                    <div id="db-mapa-container" style="width:100%; height:400px; border-radius:20px; overflow:hidden; border:1px solid rgba(255,255,255,0.1);"></div>
                </div>
            </div>
        </section>

        <!-- 6. SPONSORS -->
        <section id="mod-sponsors" style="text-align:center; padding: 4rem 0;">
            <span style="font-size:0.6rem; letter-spacing:4px; opacity:0.5; font-weight:900;">PATROCINADO POR</span>
            <div id="db-sponsors-list" style="display:flex; flex-wrap:wrap; justify-content:center; gap:3rem; margin-top:2rem;"></div>
        </section>

        <!-- 7. MOTOR DUAL-PATH RESTAURADO -->
        <section id="mod-form">
            <div class="form-master-box" style="max-width:550px; margin:0 auto;">
                <div class="form-tabs">
                    <button id="tab-new" class="tab-btn active" onclick="switchForm('nuevo')">REGISTRO NUEVO</button>
                    <button id="tab-old" class="tab-btn" onclick="switchForm('ya')">RECUPERAR MI QR</button>
                </div>
                <div id="form-nuevo">
                    <form id="master-reg-form">
                        <div style="display:flex; flex-direction:column; gap:1rem;">
                            <input type="text" id="reg-nombre" placeholder="Nombre completo *" required style="width:100%; padding:1.2rem; background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.08); color:white; border-radius:10px;">
                            <input type="text" id="reg-cedula" placeholder="Número de Documento *" required style="width:100%; padding:1.2rem; background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.08); color:white; border-radius:10px;">
                            <div style="display:flex; gap:0.5rem;">
                                <select style="padding:1.2rem; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); color:white; border-radius:10px;"><option>+57</option></select>
                                <input type="tel" id="reg-tel" placeholder="WhatsApp *" required style="flex:1; padding:1.2rem; background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.08); color:white; border-radius:10px;">
                            </div>
                            <button type="submit" class="btn-submit" style="width:100%; padding:1.4rem; background:var(--gold); border:none; color:white; font-weight:900; border-radius:12px; cursor:pointer; margin-top:1rem;">CONFIRMAR ASISTENCIA →</button>
                        </div>
                    </form>
                </div>
                <div id="form-ya" style="display:none;">
                    <div style="display:flex; flex-direction:column; gap:1rem;">
                        <p style="font-size:0.8rem; opacity:0.5; margin-bottom:1rem;">Ingresa tu documento para recuperar tu entrada digital.</p>
                        <input type="text" id="rec-cedula" placeholder="Documento registrado *" style="width:100%; padding:1.2rem; background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.08); color:white; border-radius:10px;">
                        <button class="btn-submit" onclick="alert('Buscando registro...')" style="width:100%; padding:1.4rem; background:rgba(255,255,255,0.1); border:1px solid var(--gold); color:white; font-weight:900; border-radius:12px; cursor:pointer;">VERIFICAR DATOS →</button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script>
        // CORE CONFIG v107
        const SB_URL = "https://ctgyvydzshueemlelkzv.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN0Z3l2eWR6c2h1ZWVtbGVsa3p2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2NTc1NzAsImV4cCI6MjA4OTIzMzU3MH0.3pMA-VZLV2Kfyl6BD-x8v79P7UuXSfMgtIwnfoP_VuY";
        const sbClient = window.supabase.createClient(SB_URL, SB_KEY);

        /** MOTOR DE SALUD v122 (GOLD SHIELD) */
        function logStatus(m, t = 'INFO') {
            const colors = { 'INFO':'#00ff88', 'LINK':'#f1c40f', 'TIME':'#9b59b6', 'TRACE':'#e67e22', 'DEBUG':'#3498db', 'ERROR':'#ff4d4d' };
            console.log(`%c[${new Date().toLocaleTimeString()}] [${t}] ${m}`, `color: ${colors[t] || '#fff'}; font-weight: bold;`);
        }

        /** AUDITORÍA DE SINCRONÍA ESTRUCTURAL */
        function auditStructuralSync(templateId) {
            const scope = `.tpl-${templateId.toLowerCase()}`;
            const criticalIDs = ['#mod-hero', '#mod-lineup', '#mod-gallery', '#mod-info-tecnica', '#mod-faq', '#mod-form'];
            let selectors = [];
            try {
                for (let sheet of document.styleSheets) {
                    if (sheet.href && sheet.href.includes(templateId)) {
                        for (let rule of (sheet.cssRules || sheet.rules)) {
                            if (rule.selectorText) selectors.push(rule.selectorText.toLowerCase());
                        }
                    }
                }
            } catch (e) {}
            criticalIDs.forEach(id => {
                const isSynced = selectors.some(s => s.includes(scope) && s.includes(id));
                if (isSynced) logStatus(`SYNC OK: Módulo [${id}] detectado en CSS.`, "LINK");
                else logStatus(`SYNC WARNING: Módulo [${id}] sin reglas en ${templateId}.css.`, "DEBUG");
            });
        }

        function switchForm(type) {
            document.getElementById('tab-new').classList.toggle('active', type === 'nuevo');
            document.getElementById('tab-old').classList.toggle('active', type === 'ya');
            document.getElementById('form-nuevo').style.display = type === 'nuevo' ? 'block' : 'none';
            document.getElementById('form-ya').style.display = type === 'ya' ? 'block' : 'none';
        }

        async function injectAtomicCSS(templateId) {
            return new Promise((resolve) => {
                const cssPath = `css/templates/${templateId}.css?v=${Date.now()}`;
                let link = document.querySelector('link[data-template-css]');
                if (!link) {
                    link = document.createElement('link'); link.rel = 'stylesheet';
                    link.setAttribute('data-template-css', 'true'); document.head.appendChild(link);
                }
                link.onload = () => { 
                    logStatus(`LINK: Estilo ${templateId}.css inyectado satisfactoriamente.`, "LINK"); 
                    auditStructuralSync(templateId); resolve(true); 
                };
                link.onerror = () => { logStatus(`ERROR 404: No se halló el archivo CSS.`, "ERROR"); resolve(false); };
                link.href = cssPath;
            });
        }

        /** ORQUESTADOR MAESTRO v151 */
        async function initEvento() {
            logStatus("Iniciando Orquestador v151 - Full Integrity.", "INFO");
            const slug = new URLSearchParams(window.location.search).get('slug');
            if (!slug) return;

            try {
                const { data: ev, error } = await sbClient.from('eventos').select('*, organizaciones(nombre)').eq('slug', slug).single();
                if (error || !ev) throw new Error("Evento no hallado.");

                const templateId = ev.template_id || 'F3';
                document.body.className = `tpl-${templateId} tpl-${templateId.toLowerCase()}`;
                logStatus(`DEBUG: Ámbito [.tpl-${templateId.toLowerCase()}] activo en body.`, "DEBUG");

                await injectAtomicCSS(templateId);

                // --- CORRECCIÓN FONDO HERO (v151) ---
                if (ev.imagen_url) {
                    document.getElementById('mod-hero').style.backgroundImage = `url('${ev.imagen_url}')`;
                    document.getElementById('mod-hero').style.backgroundSize = 'cover';
                    document.getElementById('mod-hero').style.backgroundPosition = 'center';
                    logStatus(`LINK: Imagen de fondo [${ev.imagen_url.substring(0,20)}...] inyectada.`, "LINK");
                }

                // MAPEO DE DATOS (CERO BORRADO)
                const content = ev.config_landing?.content || ev.content || {};
                document.getElementById('event-title').innerText = ev.nombre.toUpperCase();
                document.getElementById('org-name-badge').innerText = ev.organizaciones?.nombre.toUpperCase() || "--";
                document.getElementById('meta-fecha').innerText = ev.fecha;
                document.getElementById('meta-hora').innerText = `${ev.hora} HRS`;
                document.getElementById('meta-lugar').innerText = (content.ubicacion || ev.ubicacion || "--").toUpperCase();
                document.getElementById('venue-name').innerText = (content.ubicacion || ev.ubicacion || "--").toUpperCase();

                // Datos Técnicos Premium
                document.getElementById('db-dress-val').innerText = (content.dresscode || "Formal").toUpperCase();
                document.getElementById('db-guest-val').innerText = (content.guest_list || "+100").toUpperCase();
                document.getElementById('db-aforo-val').innerText = `${ev.aforo_max || 100} PERSONAS`;
                document.getElementById('db-ticket-val').innerText = (content.tickets_info || "Disponibles").toUpperCase();

                // Póster v107
                document.getElementById('db-poster-img').src = ev.poster_url || ev.imagen_url;

                // Inyección Lineup
                if (content.dj_lineup) {
                    const lineup = Array.isArray(content.dj_lineup) ? content.dj_lineup : content.dj_lineup.split('\n');
                    document.getElementById('db-lineup').innerHTML = lineup.filter(a => a.length > 2).map(dj => `
                        <div style="display:flex; align-items:center; gap:1.5rem; padding:1rem; background:rgba(255,255,255,0.03); border-radius:12px; border:1px solid rgba(255,255,255,0.05);">
                            <div style="width:50px; height:50px; background:var(--gold); border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:900;">${dj.charAt(0)}</div>
                            <span style="font-weight:900; text-transform:uppercase; letter-spacing:1px;">${dj.trim()}</span>
                        </div>`).join('');
                    logStatus(`TRACE: Lineup inyectado (${lineup.length} artistas).`, "TRACE");
                }

                // Inyección FAQ
                if (content.faq) {
                    const lines = content.faq.split('\n').filter(l => l.includes('|'));
                    document.getElementById('db-faq-list').innerHTML = lines.map(l => {
                        const [q, a] = l.split('|');
                        return `<div class="faq-item" onclick="this.classList.toggle('active')" style="cursor:pointer; border-bottom:1px solid rgba(255,255,255,0.05); padding:1.2rem 0;">
                            <div class="faq-header" style="display:flex; justify-content:between; align-items:center;">
                                <span style="font-weight:800; font-size:0.9rem;">${q.trim()}</span>
                                <div class="faq-icon-circle" style="margin-left:auto; width:25px; height:25px; border:1px solid var(--gold); border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--gold); font-size:0.8rem;">+</div>
                            </div>
                            <div class="faq-answer" style="display:none; padding-top:1rem; opacity:0.6; font-size:0.85rem; line-height:1.6;">${a.trim()}</div>
                        </div>`;
                    }).join('');
                    logStatus(`TRACE: FAQ inyectado (${lines.length} preguntas).`, "TRACE");
                }

                // VISIBILIDAD BLINDADA (v122)
                const flags = ev.config_landing?.modules || ev.modules || {};
                const moduleMap = { 'mod-hero':true, 'mod-lineup':flags.dj_lineup, 'mod-gallery':true, 'mod-info-tecnica':true, 'mod-faq-ubicacion':true, 'mod-sponsors':flags.sponsors, 'mod-form':true };
                
                Object.keys(moduleMap).forEach(id => {
                    const el = document.getElementById(id);
                    if (el) {
                        const isV = moduleMap[id] === true;
                        el.style.setProperty('display', isV ? 'block' : 'none', 'important');
                        logStatus(`INFO: Módulo [${id}] -> ${isV ? 'FORZADO ACTIVO' : 'OCULTO'}`, "INFO");
                    }
                });

                logStatus("TIME: Heartbeat sincronizado satisfactoriamente (3.2rem).", "TIME");
                logStatus("TRACE: 12 Módulos sincronizados | Fidelidad Dual Validada.", "TRACE");

            } catch (err) { logStatus(`FALLO CRÍTICO: ${err.message}`, "ERROR"); } finally { document.getElementById('loader').style.display = 'none'; }
        }
        window.onload = initEvento;
    </script>
</body>
</html>
