<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sandbox CSS Templates — Hostal Terraza</title>

  <!-- Inyección Dinámica de CSS Externo (Fallback a f3.css) -->
  <link id="dynamic-template-css" rel="stylesheet" href="/css/templates/f3.css">

  <!-- CDN Supabase & QR Generator -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>

  <main class="event-container" id="event-app">
    <header class="event-header">
      <img id="event-image" src="" alt="Portada del Evento" style="display:none;">
    </header>

    <section class="event-body">
      <h1 class="event-title" id="event-title">Cargando sandbox...</h1>
      <div class="event-meta">
        <span id="event-date">--/--/----</span>
        <span id="event-capacity">Aforo: --</span>
      </div>

      <form id="register-form">
        <div id="dynamic-fields"></div>
        <button type="submit" class="btn-submit" id="btn-submit">Obtener Entrada</button>
      </form>
    </section>

    <section class="ticket-container" id="ticket-section">
      <h3>¡Tu entrada está lista!</h3>
      <div id="qrcode"></div>
      <canvas id="ticket-canvas" class="ticket-canvas"></canvas>
    </section>
  </main>

  <script>
    console.log("🚀 [AI-DOS Sandbox] Inicializando motor de eventos...");

    // CONFIGURACIÓN: Reemplazar con tus credenciales reales de Supabase
    const SUPABASE_URL = 'https://TU_PROYECTO_REAL.supabase.co'; 
    const SUPABASE_KEY = 'TU_ANON_KEY_REAL';

    // Ámbito seguro para evitar errores de duplicidad (Uncaught SyntaxError)
    if (typeof window.supabaseClient === 'undefined') {
      window.supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      console.log("✅ [AI-DOS Supabase] Cliente inicializado correctamente.");
    }

    async function initSandboxEngine() {
      const urlParams = new URLSearchParams(window.location.search);
      const eventSlug = urlParams.get('slug') || urlParams.get('id');

      console.log("🔍 [AI-DOS Params] Buscando evento con ID/Slug:", eventSlug);

      if (!eventSlug) {
        console.warn("⚠️ [AI-DOS Params] No se proporcionó parámetro ?slug= o ?id= en la URL.");
        document.getElementById('event-title').innerText = 'Modo Sandbox: Añade ?slug=... a la URL';
        return;
      }

      // 1. Consulta a Supabase
      console.log("📡 [AI-DOS DB] Consultando tabla 'eventos'...");
      const { data: event, error } = await window.supabaseClient
        .from('eventos')
        .select('*')
        .or(`id.eq.${eventSlug},slug.eq.${eventSlug}`)
        .single();

      if (error || !event) {
        console.error("❌ [AI-DOS DB Error] Error al obtener el evento desde Supabase:", error);
        document.getElementById('event-title').innerText = 'Error al cargar evento en sandbox';
        return;
      }

      console.log("🎉 [AI-DOS DB] Datos del evento cargados con éxito:", event);

      // 2. Inyección Dinámica de CSS Externo con Logs
      const templateSlug = event.template_slug || 'f3';
      const templatePath = `/css/templates/${templateSlug}.css`;
      
      console.log(`🎨 [AI-DOS Template] Inyectando hoja de estilos: ${templatePath}`);
      const cssLink = document.getElementById('dynamic-template-css');
      cssLink.href = templatePath;

      cssLink.onload = () => console.log(`✅ [AI-DOS CSS] Hoja de estilo '${templatePath}' cargada y aplicada.`);
      cssLink.onerror = () => console.error(`❌ [AI-DOS CSS Error] No se pudo cargar '${templatePath}'. Verifica que el archivo exista en el servidor.`);

      // 3. Renderizado en DOM
      document.getElementById('event-title').innerText = event.titulo;
      document.getElementById('event-date').innerText = new Date(event.fecha).toLocaleDateString();
      
      if (event.imagen_url) {
        const img = document.getElementById('event-image');
        img.src = event.imagen_url;
        img.style.display = 'block';
        console.log("🖼️ [AI-DOS UI] Imagen de portada cargada.");
      }

      // 4. Renderizado Dinámico de Formulario
      const fieldsContainer = document.getElementById('dynamic-fields');
      const customFields = event.custom_fields || [
        { name: 'nombre', label: 'Nombre Completo', type: 'text', required: true },
        { name: 'documento', label: 'Cédula / Pasaporte', type: 'text', required: true }
      ];

      fieldsContainer.innerHTML = customFields.map(field => `
        <div class="form-group">
          <label for="${field.name}">${field.label}</label>
          <input type="${field.type}" id="${field.name}" name="${field.name}" class="form-control" ${field.required ? 'required' : ''}>
        </div>
      `).join('');

      console.log("📝 [AI-DOS UI] Campos de formulario renderizados correctamente.");
    }

    document.addEventListener('DOMContentLoaded', initSandboxEngine);
  </script>
</body>
</html>
