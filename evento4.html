<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Silo T7: Underground · Sistema QR</title>
    
    <!-- LIBRERÍAS MAESTRAS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.3.0/dist/fonts/geist.min.css">
    <link rel="stylesheet" href="css/templates/fiesta/p5.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/qr-creator/dist/qr-creator.min.js"></script>

    <style>
        :root { 
            --acid: #a3e635; --main-bg: #0a1a0a; --text-color: #ffffff;
            --border-glow: rgba(163, 230, 53, 0.25);
        }

        html, body { 
            margin: 0; padding: 0; background: var(--main-bg); color: var(--text-color); 
            font-family: 'Geist', sans-serif; overflow-x: hidden; 
        }
    </style>
</head>

<body class="tpl-p5">

    <div id="loader" class="loading-overlay">UNDERGROUND SILO v119...</div>

    <div id="template-container">
        <!-- LADO IZQUIERDO: HERO & REGISTRO -->
        <header id="hero-bg" class="hero-sidebar">
            <div id="org-name-badge" style="font-weight:900; letter-spacing:2px; text-transform:uppercase; color:var(--acid);">--</div>
            <div>
                <h1 id="event-title" class="hero-title">--</h1>
                <div id="hero-meta" style="margin-top:2.2rem; opacity:0.6; font-size:0.75rem; font-weight:800; text-transform:uppercase; letter-spacing:2px;">
                    <span id="meta-fecha">--</span> • <span id="meta-hora">--</span> • <span id="meta-lugar">--</span>
                </div>
                
                <div class="form-master-box">
                    <form id="master-reg-form">
                        <input type="text" class="form-input" id="reg-nombre" placeholder="NOMBRE COMPLETO *" required>
                        <input type="text" class="form-input" id="reg-cedula" placeholder="DOCUMENTO ID *" required>
                        <button type="submit" class="btn-submit">REGISTRARME EN EL PIT →</button>
                    </form>
                </div>
            </div>
            <div style="font-size:0.5rem; opacity:0.3; letter-spacing:4px; text-transform:uppercase;">Disruptive Layout · Baseline v114</div>
        </header>

        <!-- LADO DERECHO: CONTENIDO -->
        <main id="main-content-flow" class="content-scroll">
            
            <section id="modulo-countdown">
                <h2>TIEMPO RESTANTE</h2>
                <div id="unified-frame" class="unified-countdown-frame">
                    <div><span id="cd-days" class="cd-v">00</span><br><small style="font-size:0.5rem; letter-spacing:1px;">DÍAS</small></div>
                    <div><span id="cd-hours" class="cd-v">00</span><br><small style="font-size:0.5rem; letter-spacing:1px;">HRS</small></div>
                    <div><span id="cd-mins" class="cd-v">00</span><br><small style="font-size:0.5rem; letter-spacing:1px;">MIN</small></div>
                    <div><span id="cd-secs" class="cd-v">00</span><br><small style="font-size:0.5rem; letter-spacing:1px;">SEG</small></div>
                </div>
            </section>

            <section id="modulo-gallery">
                <h2>VISUALS & AUDIO</h2>
                <div class="media-grid">
                    <div id="modulo-trailer" class="video-wrapper"><div id="db-video-content"></div></div>
                    <div id="modulo-playlist" class="spotify-container"><div id="db-spotify-embed"></div></div>
                </div>
            </section>

            <section id="modulo-lineup">
                <h2>LINEUP</h2>
                <div id="db-lineup"></div>
            </section>

            <section id="modulo-info-tecnica">
                <h2>ESPECIFICACIONES</h2>
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:1.5rem;">
                    <div class="data-card-underground">
                        <span class="data-label">DRESS CODE</span>
                        <span id="db-dress-val" class="data-value">--</span>
                    </div>
                    <div class="data-card-underground">
                        <span class="data-label">AFORO MÁXIMO</span>
                        <span id="db-aforo-val" class="data-value">--</span>
                    </div>
                </div>
            </section>

            <!-- Módulos Invisibles para mantener el "Cerebro" íntegro [1, 2] -->
            <img id="db-poster-img" src="" style="display:none;">
            <div id="db-faq-list" style="display:none;"></div>
            <div id="db-mapa-container" style="display:none;"></div>
            <div id="db-sponsors-list" style="display:none;"></div>
            <div id="db-gallery-grid" style="display:none;"></div>
        </main>
    </div>

    <script>
        const SB_URL = "https://ctgyvydzshueemlelkzv.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN0Z3l2eWR6c2h1ZWVtbGVsa3p2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2NTc1NzAsImV4cCI6MjA4OTIzMzU3MH0.3pMA-VZLV2Kfyl6BD-x8v79P7UuXSfMgtIwnfoP_VuY";
        const sbClient = window.supabase.createClient(SB_URL, SB_KEY);

        function logStatus(m, t = 'INFO') {
            const colors = { 'INFO':'#00ff88', 'LINK':'#f1c40f', 'TIME':'#9b59b6', 'TRACE':'#e67e22' };
            console.log(`%c[${t}] ${m}`, `color: ${colors[t]}; font-weight: bold;`);
        }

        async function initSiloP7() {
            logStatus("AUDITORÍA V119: Retomando trabajo en Silo P7 Underground.");
            const slug = new URLSearchParams(window.location.search).get('slug');
            try {
                const { data: evento, error } = await sbClient.from('eventos').select('*').eq('slug', slug).single();
                if (error) throw error;

                // PUENTE CROMÁTICO DINÁMICO: Inyección en document.documentElement
                const primaryColor = evento.color_primario || (evento.config_landing?.content?.color_primario);
                if (primaryColor) {
                    document.documentElement.style.setProperty('--master-accent', primaryColor);
                }
                logStatus("DEBUG: Prioridad de color cedida a --master-accent.", "DEBUG");

                // 1. Datos Maestros Hero
                document.getElementById('event-title').innerText = evento.nombre.toUpperCase();
                document.getElementById('meta-fecha').innerText = evento.fecha;
                document.getElementById('meta-hora').innerText = evento.hora;
                document.getElementById('meta-lugar').innerText = (evento.ubicacion || 'PIT').toUpperCase();
                if (evento.imagen_url) document.getElementById('hero-bg').style.backgroundImage = `url('${evento.imagen_url}')`;
                
                const { data: org } = await sbClient.from('organizaciones').select('nombre').eq('id', evento.org_id).single();
                if (org) document.getElementById('org-name-badge').innerText = org.nombre.toUpperCase();

                // 2. Mapeo de Contenido (v115 Engine)
                const content = evento.config_landing?.content || {};
                
                const lineup = content.dj_lineup || content.lineup || "";
                document.getElementById('db-lineup').innerHTML = (Array.isArray(lineup) ? lineup : lineup.split('\n')).filter(a => a.length > 2).map(a => `
                    <div class="artist-row"><span>${a.trim()}</span></div>`).join('');
                
                const trailerUrl = content.trailer_url || "https://player.vimeo.com/video/259411563";
                document.getElementById('db-video-content').innerHTML = `<iframe style="width:100%; height:100%; border:none; position:absolute; inset:0;" src="${trailerUrl}" allowfullscreen></iframe>`;
                
                if (content.playlist_url) {
                    const embed = content.playlist_url.replace('/playlist/', '/embed/playlist/');
                    document.getElementById('db-spotify-embed').innerHTML = `<iframe src="${embed}" style="width:100%; height:100% !important; min-height:450px; border:none;" allow="encrypted-media"></iframe>`;
                }

                // 3. Tech Data (Ajustado al estilo P7)
                document.getElementById('db-dress-val').innerText = (content.dresscode || 'ALL BLACK').toUpperCase();
                document.getElementById('db-aforo-val').innerText = `${evento.aforo_max || 'FULL'} PERSONAS`;

                logStatus("TRACE: 6 Módulos Underground sincronizados.", "TRACE");

                // 4. Heartbeat
                const target = new Date(`${evento.fecha}T${evento.hora}`).getTime();
                setInterval(() => {
                    const diff = target - new Date().getTime();
                    if (diff <= 0) return;
                    document.getElementById('cd-days').innerText = Math.floor(diff / 86400000).toString().padStart(2, '0');
                    document.getElementById('cd-hours').innerText = Math.floor((diff % 86400000) / 3600000).toString().padStart(2, '0');
                    document.getElementById('cd-mins').innerText = Math.floor((diff % 3600000) / 60000).toString().padStart(2, '0');
                    document.getElementById('cd-secs').innerText = Math.floor((diff % 60000) / 1000).toString().padStart(2, '0');
                }, 1000);
                logStatus("TIME: Heartbeat industrial activo.", "TIME");

                if (document.getElementById('master-reg-form')) logStatus("LINK: Motor de registro directo verificado.", "LINK");

                document.getElementById('template-container').style.display = 'flex';

            } catch (err) { logStatus(`ERROR CRÍTICO: ${err.message}`, "ERROR"); } finally { document.getElementById('loader').style.display = 'none'; }
        }
        window.onload = initSiloP7;
    </script>
</body>
</html>
