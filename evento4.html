<!-- SILO VISUAL: TEMPLATE 7 (Underground / Split-Screen) -->
<style id="style-p7">
    /* 1. RESETO Y VARIABLES ATÓMICAS */
    .tpl-p7 { 
        --acid: #bcff00; --main-bg: #000000; --text-color: #ffffff;
        --border-glow: rgba(188, 255, 0, 0.3);
    }
    
    /* 2. ESTRUCTURA DISRUPTIVA (Lateral Split) */
    .tpl-p7 #template-container { display: flex; flex-direction: row; min-height: 100vh; background: var(--main-bg); }
    
    /* LADO IZQUIERDO: Información Fija */
    .tpl-p7 #hero-bg { 
        width: 40%; height: 100vh; position: fixed; left: 0; top: 0;
        display: flex; flex-direction: column; justify-content: space-between;
        padding: 4rem; border-right: 1px solid rgba(188, 255, 0, 0.2); z-index: 10;
        background-size: cover; background-position: center;
    }
    .tpl-p7 #hero-bg::before { content: ''; position: absolute; inset: 0; background: rgba(0,0,0,0.85); z-index: -1; }
    
    /* LADO DERECHO: Contenido en Scroll */
    .tpl-p7 #main-content-flow { width: 60%; margin-left: 40%; padding: 0; }
    
    /* 3. ESTILO DE LOS 6 MÓDULOS ACTIVOS */
    .tpl-p7 section { padding: 6rem 12%; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .tpl-p7 h2 { color: var(--acid); font-size: 0.7rem; letter-spacing: 5px; font-weight: 900; margin-bottom: 3rem; }

    /* Módulo 1: Hero (Título y Metas) */
    .tpl-p7 .hero-title { font-size: clamp(2rem, 5vw, 3.5rem); line-height: 0.9; letter-spacing: -2px; margin: 0; color: var(--acid); }
    .tpl-p7 .hero-meta { font-size: 0.7rem; font-weight: 900; letter-spacing: 2px; opacity: 0.6; display: flex; flex-direction: column; gap: 0.5rem; }

    /* Módulo 2: Countdown (Industrial) */
    .tpl-p7 .unified-countdown-frame { 
        background: none; border: 1px solid var(--acid); padding: 2rem; border-radius: 0; 
        box-shadow: 10px 10px 0px var(--border-glow); display: grid; grid-template-columns: repeat(4, 1fr); text-align: center;
    }
    .tpl-p7 .cd-v { font-size: 2.8rem !important; font-weight: 900; color: var(--acid); }

    /* Módulo 3: Multimedia Sync 1:1 [v107] */
    .tpl-p7 .media-grid { display: grid; grid-template-columns: 1fr; gap: 2rem; align-items: stretch; }
    .tpl-p7 .video-wrapper { border: 1px solid rgba(255,255,255,0.1); border-radius: 0; position: relative; padding-top: 56.25%; filter: grayscale(1); transition: 0.4s; }
    .tpl-p7 .video-wrapper:hover { filter: grayscale(0); border-color: var(--acid); }
    .tpl-p7 .spotify-container { min-height: 400px; height: 100%; border: 1px solid rgba(255,255,255,0.1); }

    /* Módulo 4: Lineup (Tipográfico) */
    .tpl-p7 #db-lineup { display: flex; flex-direction: column; gap: 1rem; }
    .tpl-p7 .artist-row { font-size: 2.5rem; font-weight: 900; text-transform: uppercase; border-bottom: 1px solid rgba(188,255,0,0.1); padding: 1rem 0; transition: 0.3s; cursor: crosshair; }
    .tpl-p7 .artist-row:hover { color: var(--acid); padding-left: 2rem; }

    /* Módulo 5: Data Cards (Grid técnica) */
    .tpl-p7 .data-card { background: none; border: 1px solid rgba(255,255,255,0.1); border-radius: 0; min-height: 120px; display: flex; align-items: center; justify-content: center; font-weight: 900; }
    .tpl-p7 .card-icon-xl { display: none; } /* Diseño minimalista sin iconos pesados */

    /* Módulo 6: Formulario (Lado Izquierdo Fijo) */
    .tpl-p7 .form-master-box { background: none; border: 1px solid var(--acid); border-radius: 0; padding: 2rem; margin-top: 2rem; }
    .tpl-p7 .form-input { border-radius: 0; background: #111; border: 1px solid #333; color: white; padding: 1rem; margin-bottom: 1rem; width: 100%; box-sizing: border-box; }
    .tpl-p7 .btn-submit { background: var(--acid); color: black; border-radius: 0; font-weight: 900; padding: 1.2rem; cursor: pointer; text-transform: uppercase; width: 100%; }

    /* OCULTAR MÓDULOS NO DESEADOS (Protocolo Cero Borrado) */
    .tpl-p7 #db-poster-img, .tpl-p7 #modulo-faq-ubicacion, .tpl-p7 #modulo-sponsors, .tpl-p7 #modulo-gallery { display: none; }

    @media (max-width: 1024px) {
        .tpl-p7 #template-container { flex-direction: column; }
        .tpl-p7 #hero-bg { width: 100%; height: auto; position: relative; padding: 2rem; }
        .tpl-p7 #main-content-flow { width: 100%; margin-left: 0; }
    }
</style>
