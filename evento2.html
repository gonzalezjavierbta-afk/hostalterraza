<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sandbox v8: Visual Sync · Sistema QR</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.3.0/dist/fonts/geist.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/qr-creator/dist/qr-creator.min.js"></script>

    <style>
        :root { --main-bg: #050505; --gold: #ff007f; --text-color: #ffffff; }
        body { margin: 0; background-color: var(--main-bg); color: var(--text-color); font-family: 'Geist', sans-serif; -webkit-font-smoothing: antialiased; }
        
        /* HERO CON IMAGEN DE FONDO (Novedad) */
        .hero {
            position: relative;
            min-height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 10%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        /* Capa de oscurecimiento para legibilidad */
        .hero::before {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(to bottom, rgba(0,0,0,0.3) 0%, #050505 100%);
            z-index: 1;
        }
        .hero-content { position: relative; z-index: 2; }

        .hero-title {
            font-weight: 900; font-size: clamp(3.5rem, 12vw, 8rem); line-height: 0.85;
            text-transform: uppercase; margin: 0; letter-spacing: -5px;
            background: linear-gradient(to bottom, var(--gold), #ffffff);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 20px rgba(255, 0, 127, 0.5));
        }

        section { display: none; padding: 5rem 10%; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .data-item { margin-bottom: 1rem; padding: 1.5rem; background: rgba(255,255,255,0.02); border-left: 4px solid var(--gold); border-radius: 4px; font-size: 1.2rem; }
        .loading-overlay { position: fixed; inset: 0; background: #000; z-index: 999; display: flex; align-items: center; justify-content: center; }
    </style>
</head>

<body class="tpl-sandbox">

    <div id="loader" class="loading-overlay">Sincronizando imagen y datos...</div>

    <header id="hero-bg" class="hero">
        <div class="hero-content">
            <h1 id="event-title" class="hero-title">--</h1>
            <p id="event-date" style="letter-spacing: 4px; margin-top: 2rem; font-weight: bold; opacity: 0.8;">--</p>
        </div>
    </header>

    <section id="modulo-lineup">
        <h2 style="color: var(--gold); letter-spacing: 2px;">DJ LINEUP</h2>
        <div id="db-lineup"></div>
    </section>

    <section id="modulo-playlist">
        <h2 style="color: var(--gold); letter-spacing: 2px;">SPOTIFY</h2>
        <div id="db-spotify"></div>
    </section>

    <script>
        const SANDBOX_CONFIG = {
            lineup: true,
            playlist: true,
            force_gold: '#ff007f'
        };

        const SB_URL = "https://ctgyvydzshueemlelkzv.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN0Z3l2eWR6c2h1ZWVtbGVsa3p2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2NTc1NzAsImV4cCI6MjA4OTIzMzU3MH0.3pMA-VZLV2Kfyl6BD-x8v79P7UuXSfMgtIwnfoP_VuY";
        const sbClient = window.supabase.createClient(SB_URL, SB_KEY);

        function logStatus(mensaje, tipo = 'INFO') {
            const t = new Date().toLocaleTimeString();
            const colors = { 'INFO': '#00ff88', 'JSON': '#f39c12', 'LINK': '#f7b731', 'ERROR': '#ff4d4d' };
            console.log(`%c[${t}] [${tipo}] ${mensaje}`, `color: ${colors[tipo]}; font-family: monospace; font-weight: bold;`);
        }

        async function initEvento() {
            logStatus("Iniciando carga visual profunda...");
            const slug = new URLSearchParams(window.location.search).get('slug');

            try {
                const { data: evento, error } = await sbClient
                    .from('eventos')
                    .select('nombre, fecha, hora, imagen_url, config_landing')
                    .eq('slug', slug)
                    .single();

                if (error) throw error;

                // 1. APLICAR IMAGEN DE FONDO (Hero)
                if (evento.imagen_url) {
                    document.getElementById('hero-bg').style.backgroundImage = `url('${evento.imagen_url}')`;
                    logStatus("VINCULADO: Imagen de fondo (Hero) aplicada.", "LINK");
                }

                document.getElementById('event-title').innerText = evento.nombre.toUpperCase();
                document.getElementById('event-date').innerText = `${evento.fecha} | ${evento.hora}`;

                // 2. PROCESAR JSON PARA LINEUP Y SPOTIFY
                const config = evento.config_landing || {};
                
                if (config.lineup) {
                    const artistas = config.lineup.split('\n').filter(a => a.trim() !== "");
                    document.getElementById('db-lineup').innerHTML = artistas.map(a => `<div class="data-item">${a}</div>`).join('');
                    logStatus(`VINCULADO: ${artistas.length} artistas desde config_landing.`, "LINK");
                }

                if (config.video_url && config.video_url.includes('spotify')) {
                    const embed = config.video_url.replace('open.spotify.com', 'open.spotify.com/embed');
                    document.getElementById('db-spotify').innerHTML = `<iframe src="${embed}" width="100%" height="380" frameBorder="0" allow="encrypted-media" style="border-radius:12px;"></iframe>`;
                    logStatus("VINCULADO: Playlist Spotify desde config_landing.", "LINK");
                }

                // Visibilidad
                document.documentElement.style.setProperty('--gold', SANDBOX_CONFIG.force_gold);
                Object.keys(SANDBOX_CONFIG).forEach(key => {
                    const el = document.getElementById(`modulo-${key}`);
                    if (el) el.style.display = SANDBOX_CONFIG[key] ? 'block' : 'none';
                });

                logStatus("SINCRONIZACIÓN VISUAL COMPLETADA.", "INFO");

            } catch (err) {
                logStatus(`FALLO: ${err.message}`, "ERROR");
            } finally {
                document.getElementById('loader').style.display = 'none';
            }
        }
        window.onload = initEvento;
    </script>
</body>
</html>
