<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Editor v97: Full-Height Playlist · Sistema QR</title>
   
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.3.0/dist/fonts/geist.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/qr-creator/dist/qr-creator.min.js"></script>


    <style>
        :root {
            --main-bg: #050505; --gold: #df20b6; --text-color: #ffffff;
            --glass-lite: rgba(255, 255, 255, 0.03); --border-glow: rgba(223, 32, 182, 0.4);
        }


        html, body {
            margin: 0; padding: 0; min-height: 100%;
            background-color: var(--main-bg); color: var(--text-color);
            font-family: 'Geist', sans-serif; -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }


        /* ESCUDO DE GRANO (v47) */
        body::before {
            content: ""; position: fixed; inset: 0; z-index: 9999; pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            opacity: 0.04; contrast: 130%;
        }
       
        section { display: none; padding: 5rem 10%; border-bottom: 1px solid rgba(255,255,255,0.05); }
        h2 { color: var(--gold); letter-spacing: 4px; text-transform: uppercase; font-size: 0.75rem; font-weight: 900; margin-bottom: 3.5rem; text-align: left; }


        /* 1. HERO & REFINED COUNTDOWN (v95 Reference) */
        .hero { position: relative; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 2rem; background-size: cover; background-position: center; text-align: center; }
        .hero::before { content: ''; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, rgba(5,5,5,0.3) 50%, rgba(5,5,5,1) 100%); z-index: 1; }
        .hero-title { font-weight: 900; font-size: clamp(2.5rem, 8vw, 4.5rem); text-transform: uppercase; margin: 0; letter-spacing: -3px; z-index: 2; position: relative; }
       
        .hero-meta { display: flex; flex-wrap: wrap; justify-content: center; gap: 2.5rem; margin-top: 2.5rem; font-weight: 800; text-transform: uppercase; font-size: 0.85rem; letter-spacing: 2px; z-index: 2; position: relative; opacity: 0.9; }
        .meta-item { display: flex; align-items: center; gap: 0.7rem; }
        .meta-svg { width: 18px !important; height: 18px !important; fill: var(--gold); }


        .unified-countdown-frame {
            position: relative; z-index: 2; margin: 3.5rem auto 0; padding: 0.7rem 1.2rem;
            background: rgba(255, 255, 255, 0.01); border-radius: 10px; border: 2px solid var(--gold);
            backdrop-filter: blur(2px); box-shadow: 0 0 25px var(--border-glow); display: flex; width: fit-content;
        }
        .cd-block { padding: 0 0.8rem; border-right: 1px solid rgba(255,255,255,0.1); text-align: center; }
        .cd-block:last-child { border-right: none; }
        .cd-v { display: block; font-size: 3.2rem !important; font-weight: 900; line-height: 1; margin-bottom: 0.2rem; }


        /* 2. MEDIA GRID v97 (Full-Height Sync) */
        .media-grid { display: grid; grid-template-columns: 1.6fr 1fr; gap: 2.5rem; max-width: 1100px; margin: 4rem auto 0; align-items: stretch; }
        .video-wrapper { position: relative; width: 100%; padding-top: 56.25%; border-radius: 15px; overflow: hidden; border: 1px solid var(--gold); background: #000; box-shadow: 0 0 30px var(--border-glow); }
        .video-iframe { position: absolute; inset: 0; border: none; width: 100%; height: 100%; }
       
        .spotify-container {
            border-radius: 15px; overflow: hidden; border: 1px solid rgba(255,255,255,0.1);
            background: #121212; height: 100%; display: flex; flex-direction: column;
        }
        #db-spotify-embed { flex: 1; display: flex; }
        /* v97 Fix: Forzamos al iframe a no minimizarse */
        #db-spotify-embed iframe { width: 100%; height: 100% !important; min-height: 450px; border: none; }


        /* 3. LINEUP & DATA CARDS */
        .artist-avatar { width: 65px !important; height: 65px !important; border-radius: 50% !important; object-fit: cover; border: 2px solid var(--gold); }
        .data-card { background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 15px; padding: 2.5rem 1rem; text-align: center; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 240px; }
        .card-icon-xl { width: 68px !important; height: 68px !important; fill: var(--gold); filter: drop-shadow(0 0 15px var(--gold)); opacity: 0.9; margin-top: 2rem; }


        /* 4. FAQ & MAP */
        .faq-item { border-bottom: 1px solid rgba(255,255,255,0.05); cursor: pointer; }
        .faq-header { display: flex; justify-content: space-between; align-items: center; padding: 1.2rem 0; font-size: 0.9rem; }
        .faq-icon-circle { width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--gold); display: flex; align-items: center; justify-content: center; color: var(--gold); }
        .faq-answer { max-height: 0; opacity: 0; overflow: hidden; transition: 0.4s ease; font-size: 0.85rem; color: rgba(255,255,255,0.6); }
        .faq-item.active .faq-answer { max-height: 200px; opacity: 1; padding-bottom: 1.5rem; }
        .map-frame-immersive { width: 100%; height: 380px; border-radius: 15px; overflow: hidden; border: 1px solid rgba(255,255,255,0.15); margin-top: 1.5rem; }


        /* 5. FORM MASTER BOX */
        .form-master-box { max-width: 600px; margin: 0 auto; background: var(--glass-lite); padding: 3rem; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(10px); }
        .tab-btn { background: none; border: none; color: rgba(255,255,255,0.4); padding-bottom: 1rem; font-weight: 800; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 2px; cursor: pointer; border-bottom: 2px solid transparent; }
        .tab-btn.active { color: var(--gold); border-bottom: 2px solid var(--gold); }
        .form-input { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); padding: 1.2rem; border-radius: 12px; color: white; width: 100%; box-sizing: border-box; font-family: inherit; margin-bottom: 1.5rem; }
        .btn-submit { background: var(--gold); color: white; border: none; padding: 1.5rem; border-radius: 15px; font-weight: 900; cursor: pointer; text-transform: uppercase; letter-spacing: 2px; width: 100%; }
       
        .loading-overlay { position: fixed; inset: 0; background: #000; z-index: 999; display: flex; align-items: center; justify-content: center; font-weight: 900; letter-spacing: 3px; }
       
        @media (max-width: 850px) {
            .media-grid { grid-template-columns: 1fr; }
            .cd-v { font-size: 2.2rem; }
            .form-master-box { padding: 2rem 1.5rem; }
        }
    </style>
</head>


<body class="tpl-sandbox">


    <div id="loader" class="loading-overlay">FULL-HEIGHT SYNC v97...</div>


    <header id="hero-bg" class="hero">
        <div id="org-name-badge" style="position:absolute; top:2rem; left:2rem; font-weight:900; letter-spacing:2px; text-transform:uppercase;">--</div>
        <div class="hero-content">
            <h1 id="event-title" class="hero-title">--</h1>
            <div class="hero-meta">
                <div class="meta-item"><svg class="meta-svg" viewBox="0 0 24 24"><path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2z"/></svg><span id="meta-fecha">--/--/--</span></div>
                <div class="meta-item"><svg class="meta-svg" viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58-8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg><span id="meta-hora">--:--</span></div>
                <div class="meta-item"><svg class="meta-svg" viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg><span id="meta-lugar">--</span></div>
            </div>
            <div id="unified-frame" class="unified-countdown-frame">
                <div class="cd-block"><span id="cd-days" class="cd-v">00</span><span style="font-size:0.5rem; letter-spacing:2px;">DÍAS</span></div>
                <div class="cd-block"><span id="cd-hours" class="cd-v">00</span><span style="font-size:0.5rem; letter-spacing:2px;">HORAS</span></div>
                <div class="cd-block"><span id="cd-mins" class="cd-v">00</span><span style="font-size:0.5rem; letter-spacing:2px;">MIN</span></div>
                <div class="cd-block"><span id="cd-secs" class="cd-v">00</span><span style="font-size:0.5rem; letter-spacing:2px;">SEG</span></div>
            </div>
        </div>
    </header>


    <main id="main-content-flow">
        <!-- 1. LINEUP -->
        <section id="modulo-lineup">
            <h2>ARTISTAS INVITADOS</h2>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:0; max-width:950px; margin:0 auto; align-items:start;">
                <div style="display:flex; justify-content:center; padding-right:5rem; border-right:1px solid rgba(255,255,255,0.1);"><img id="db-poster-img" src="" style="width:320px; border-radius:12px; border:4px solid var(--gold); shadow: 0 0 30px var(--gold);" alt="Poster"></div>
                <div id="db-lineup" style="display:flex; flex-direction:column; gap:2.5rem; padding-left:5rem;"></div>
            </div>
        </section>


        <!-- 2. GALLERY & MEDIA (Spotify Fixed) -->
        <section id="modulo-gallery">
            <h2>GALERÍA</h2>
            <div id="db-gallery-grid" style="display:grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap:1rem; margin-top:1rem;"></div>
            <div class="media-grid">
                <div id="modulo-trailer" class="video-wrapper"><div id="db-video-content" style="height:100%; width:100%;"></div></div>
                <div id="modulo-playlist" class="spotify-container"><div id="db-spotify-embed"></div></div>
            </div>
        </section>


        <!-- 3. DATA CARDS -->
        <section id="modulo-info-tecnica">
            <div class="data-cards-container" style="display:grid; grid-template-columns: repeat(4, 1fr); gap:1.2rem; max-width:1100px; margin:0 auto;">
                <div class="data-card"><div><span style="color:var(--gold); font-size:0.6rem; font-weight:900; letter-spacing:3px; text-transform:uppercase;">DRESS CODE</span><br><span id="db-dress-val" style="font-size:1.15rem; font-weight:900; text-transform:uppercase;">--</span></div><svg class="card-icon-xl" viewBox="0 0 24 24"><path d="M17 10h-2c0-1.66-1.34-3-3-3s-3 1.34-3 3H7c-1.1 0-2 .9-2 2v6c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2v-6c0-1.1-.9-2-2-2z"/></svg></div>
                <div class="data-card"><div><span style="color:var(--gold); font-size:0.6rem; font-weight:900; letter-spacing:3px; text-transform:uppercase;">GUEST LIST</span><br><span id="db-guest-val" style="font-size:1.15rem; font-weight:900;">--</span><br><span style="font-size:0.6rem; opacity:0.4; font-weight:800; text-transform:uppercase;">CONFIRMADOS</span></div></div>
                <div class="data-card"><div><span style="color:var(--gold); font-size:0.6rem; font-weight:900; letter-spacing:3px; text-transform:uppercase;">AFORO</span><br><span id="db-aforo-val" style="font-size:1.15rem; font-weight:900;">--</span></div><svg class="card-icon-xl" viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5s-3 1.34-3 3 1.34 3 3 3z"/></svg></div>
                <div class="data-card"><div><span style="color:var(--gold); font-size:0.6rem; font-weight:900; letter-spacing:3px; text-transform:uppercase;">TICKETS</span><br><span id="db-ticket-val" style="font-size:1.15rem; font-weight:900;">--</span></div><svg class="card-icon-xl" viewBox="0 0 24 24"><path d="M22 10V6H4v4c1.1 0 2 .9 2 2s-.9 2-2 2v4h18v-4c-1.1 0-2-.9-2-2s.9-2 2-2z"/></svg></div>
            </div>
        </section>


        <!-- 4. FAQ & UBICACIÓN -->
        <section id="modulo-faq-ubicacion">
            <div style="display:grid; grid-template-columns: 1fr 1.1fr; gap:0; max-width:1200px; margin:0 auto; align-items:stretch;">
                <div style="padding-right:4rem; border-right:1px solid rgba(255,255,255,0.1);"><h2>FAQ</h2><div id="db-faq-list"></div></div>
                <div style="padding-left:4rem;"><h2>UBICACIÓN</h2><div id="venue-name" style="font-weight:800; text-transform:uppercase; margin-bottom:1rem;">--</div><div id="db-mapa-container" class="map-frame-immersive"></div></div>
            </div>
        </section>


        <!-- 5. FORMULARIO -->
        <section id="modulo-formulario">
            <div class="form-master-box">
                <div class="form-tabs">
                    <button class="tab-btn active" id="tab-new" onclick="switchForm('nuevo')">Registro Nuevo</button>
                    <button class="tab-btn" id="tab-old" onclick="switchForm('ya')">Ya estoy registrado</button>
                </div>
                <div id="form-nuevo">
                    <form id="master-reg-form">
                        <input type="text" class="form-input" id="reg-nombre" placeholder="Nombre completo *" required>
                        <input type="text" class="form-input" id="reg-cedula" placeholder="Cédula / Documento *" required>
                        <div style="display:flex; gap:0.5rem;">
                            <select class="form-input" id="reg-prefijo" style="width:110px;"><option value="+57">🇨🇴 +57</option></select>
                            <input type="tel" class="form-input" id="reg-tel" placeholder="WhatsApp *" required>
                        </div>
                        <input type="email" class="form-input" id="reg-email" placeholder="Correo (Opcional)">
                        <div id="db-dynamic-fields"></div>
                        <button type="submit" class="btn-submit">Confirmar Asistencia →</button>
                    </form>
                </div>
                <div id="form-ya" style="display:none;">
                    <p style="font-size:0.8rem; opacity:0.6; margin-bottom:2rem;">Ingresa tus datos para recuperar tu entrada QR.</p>
                    <input type="text" class="form-input" id="rec-cedula" placeholder="Cédula / Documento *">
                    <input type="tel" class="form-input" id="rec-tel" placeholder="WhatsApp registrado *">
                    <button class="btn-submit" onclick="alert('Sistema de verificación operativo.')">Verificar mis datos →</button>
                </div>
            </div>
        </section>
    </main>


    <script>
        const SANDBOX_CONFIG = { countdown: true, trailer: true, aforo: true, lineup: true, dress_code: true, gallery: true, guest_list: true, faq: true, playlist: true, ubicacion: true, formulario: true };
        const SB_URL = "https://ctgyvydzshueemlelkzv.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN0Z3l2eWR6c2h1ZWVtbGVsa3p2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2NTc1NzAsImV4cCI6MjA4OTIzMzU3MH0.3pMA-VZLV2Kfyl6BD-x8v79P7UuXSfMgtIwnfoP_VuY";
        const sbClient = window.supabase.createClient(SB_URL, SB_KEY);


        function logStatus(m, t = 'INFO') {
            const colors = { 'INFO': '#00ff88', 'LINK': '#f1c40f', 'TIME': '#9b59b6', 'TRACE': '#e67e22', 'ERROR': '#ff4d4d' };
            console.log(`%c[${new Date().toLocaleTimeString()}] [${t}] ${m}`, `color: ${colors[t] || '#fff'}; font-weight: bold;`);
        }


        function switchForm(type) {
            document.getElementById('tab-new').classList.toggle('active', type === 'nuevo');
            document.getElementById('tab-old').classList.toggle('active', type === 'ya');
            document.getElementById('form-nuevo').style.display = type === 'nuevo' ? 'block' : 'none';
            document.getElementById('form-ya').style.display = type === 'ya' ? 'block' : 'none';
        }


        async function initEvento() {
            logStatus("AUDITORÍA V97: Forzando altura completa en Playlist y validando Baseline.");
            const slug = new URLSearchParams(window.location.search).get('slug');
            try {
                const { data: evento, error } = await sbClient.from('eventos').select('*').eq('slug', slug).single();
                if (error) throw error;
               
                const target = new Date(`${evento.fecha}T${evento.hora}`).getTime();
                setInterval(() => {
                    const diff = target - new Date().getTime();
                    if (diff <= 0) return;
                    document.getElementById('cd-days').innerText = Math.floor(diff / 86400000).toString().padStart(2, '0');
                    document.getElementById('cd-hours').innerText = Math.floor((diff % 86400000) / 3600000).toString().padStart(2, '0');
                    document.getElementById('cd-mins').innerText = Math.floor((diff % 3600000) / 60000).toString().padStart(2, '0');
                    document.getElementById('cd-secs').innerText = Math.floor((diff % 60000) / 1000).toString().padStart(2, '0');
                }, 1000);
                logStatus("TIME: Heartbeat sincronizado satisfactoriamente.", "TIME");


                const { data: org } = await sbClient.from('organizaciones').select('nombre').eq('id', evento.org_id).single();
                if (org) document.getElementById('org-name-badge').innerText = org.nombre.toUpperCase();


                document.getElementById('event-title').innerText = evento.nombre.toUpperCase();
                document.getElementById('meta-fecha').innerText = evento.fecha;
                document.getElementById('meta-hora').innerText = `${evento.hora} HRS`;
                document.getElementById('meta-lugar').innerText = (evento.ubicacion || 'LOCALIZACIÓN').toUpperCase();
                if (evento.imagen_url) document.getElementById('hero-bg').style.backgroundImage = `url('${evento.imagen_url}')`;


                const content = evento.config_landing?.content || {};


                // 3. Media Sync v97 (Forced 100% height)
                const trailerUrl = content.trailer_url || "https://player.vimeo.com/video/259411563?h=79100067&color=df20b6&title=0&byline=0&portrait=0";
                document.getElementById('db-video-content').innerHTML = `<iframe class="video-iframe" src="${trailerUrl}" allow="autoplay; fullscreen" allowfullscreen></iframe>`;


                if (content.playlist_url) {
                    const embed = content.playlist_url.replace('/playlist/', '/embed/playlist/');
                    document.getElementById('db-spotify-embed').innerHTML = `<iframe src="${embed}" frameBorder="0" allow="encrypted-media"></iframe>`;
                    logStatus("LINK: Playlist Spotify sincronizada a altura dinámica del video.", "LINK");
                }


                if (document.getElementById('modulo-formulario')) {
                    logStatus("LINK: Motor de registro (Dual-Path) verificado y persistente.", "LINK");
                }


                // technical data
                document.getElementById('db-poster-img').src = evento.poster_url || evento.imagen_url;
                const lineup = content.dj_lineup || content.lineup || "";
                document.getElementById('db-lineup').innerHTML = (Array.isArray(lineup) ? lineup : lineup.split('\n')).filter(a => a.length > 2).map(a => `
                    <div style="display:flex; align-items:center; gap:1.8rem;"><img src="https://images.unsplash.com/photo-1520813792240-56fc4a3765a7?q=80&w=200" class="artist-avatar"><span style="font-weight:900; text-transform:uppercase;">${a.trim()}</span></div>`).join('');
                if (content.gallery) document.getElementById('db-gallery-grid').innerHTML = content.gallery.map(u => `<img src="${u}" style="width:100%; height:250px; object-fit:cover; border-radius:12px;">`).join('');
               
                document.getElementById('db-dress-val').innerText = (content.dresscode || 'NEON').toUpperCase();
                document.getElementById('db-guest-val').innerText = (content.guest_list || '+200');
                document.getElementById('db-aforo-val').innerText = `${evento.aforo_max || 100}`;
                document.getElementById('db-ticket-val').innerText = (content.tickets_info || 'DISPONIBLES').toUpperCase();


                if (content.faq) {
                    document.getElementById('db-faq-list').innerHTML = content.faq.split('\n').filter(l => l.includes('|')).map(l => {
                        const [q, a] = l.split('|');
                        return `<div class="faq-item" onclick="this.classList.toggle('active')"><div class="faq-header"><span>${(q||'Info').trim()}</span><div class="faq-icon-circle">+</div></div><div class="faq-answer">${(a||'Consultar.').trim()}</div></div>`;
                    }).join('');
                }
                const mapUrl = `https://maps.google.com/maps?q=${encodeURIComponent(evento.ubicacion)}&t=&z=15&ie=UTF8&iwloc=&output=embed`;
                document.getElementById('db-mapa-container').innerHTML = `<iframe width="100%" height="100%" src="${mapUrl}" allowfullscreen style="filter: grayscale(1) invert(1) contrast(1.2); border:none;"></iframe>`;
                document.getElementById('venue-name').innerText = (evento.ubicacion || 'LOCALIZACIÓN').toUpperCase();


                Object.keys(SANDBOX_CONFIG).forEach(key => {
                    const elId = (key==='faq'||key==='ubicacion') ? 'modulo-faq-ubicacion' : (['dress_code','guest_list','aforo'].includes(key)) ? 'modulo-info-tecnica' : (key==='playlist'||key==='trailer'||key==='gallery') ? 'modulo-gallery' : `modulo-${key}`;
                    const el = document.getElementById(elId);
                    if (el) { el.style.display = 'block'; logStatus(`INFO: Módulo ${key.toUpperCase()} validado.`, "INFO"); }
                });


            } catch (err) { logStatus(`ERROR CRÍTICO: ${err.message}`, "ERROR"); } finally { document.getElementById('loader').style.display = 'none'; }
        }
        window.onload = initEvento;
    </script>
</body>
</html>
