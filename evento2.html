<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Editor v62: Memory Stable · Full Form & Icons Recovery</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.3.0/dist/fonts/geist.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/qr-creator/dist/qr-creator.min.js"></script>

    <style>
        :root { 
            --main-bg: #050505; --gold: #df20b6; --text-color: #ffffff;
            --glass-lite: rgba(255, 255, 255, 0.03); --border-glow: rgba(223, 32, 182, 0.2);
        }

        html, body { 
            margin: 0; padding: 0; min-height: 100%; 
            background-color: var(--main-bg); color: var(--text-color); 
            font-family: 'Geist', sans-serif; -webkit-font-smoothing: antialiased; 
        }

        /* ESCUDO DE GRANO (v47 Fix) */
        body::before {
            content: ""; position: fixed; inset: 0; z-index: 9999; pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            opacity: 0.04; contrast: 130%;
        }
        
        section { display: none; padding: 6rem 10%; border-bottom: 1px solid rgba(255,255,255,0.05); }
        h2 { color: var(--gold); letter-spacing: 4px; text-transform: uppercase; font-size: 0.75rem; font-weight: 900; margin-bottom: 4rem; text-align: left; }

        /* HERO & COUNTDOWN */
        .hero { position: relative; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 2rem; background-size: cover; background-position: center; box-sizing: border-box; text-align: center; }
        .hero::before { content: ''; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, rgba(5,5,5,0.3) 50%, rgba(5,5,5,1) 100%); z-index: 1; }
        .org-badge { position: absolute; top: 2rem; left: 2rem; z-index: 10; font-weight: 900; font-size: 1.1rem; letter-spacing: 2px; text-transform: uppercase; }
        .hero-title { font-weight: 900; font-size: clamp(2.5rem, 8vw, 4.5rem); text-transform: uppercase; margin: 0; letter-spacing: -3px; z-index: 2; position: relative; }
        .unified-countdown-frame { position: relative; z-index: 2; margin: 3rem auto 0; padding: 1.5rem 2.5rem; background: var(--glass-lite); border-radius: 12px; border: 1px solid var(--gold); backdrop-filter: blur(8px); display: flex; justify-content: center; align-items: center; width: fit-content; }
        .cd-block { padding: 0 1.5rem; border-right: 1px solid rgba(255,255,255,0.1); text-align: center; }
        .cd-block:last-child { border-right: none; }
        .cd-v { display: block; font-size: 2.2rem; font-weight: 900; }

        /* DATA CARDS v54 RESTORED ICONS */
        .data-cards-container { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.2rem; max-width: 1000px; margin: 0 auto; }
        .data-card { background: var(--glass-lite); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 2rem 1rem; text-align: center; backdrop-filter: blur(10px); box-shadow: 0 0 15px rgba(0,0,0,0.5); }
        .card-label { color: var(--gold); font-size: 0.65rem; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 1rem; display: block; }
        .card-val { display: block; font-size: 1rem; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; }
        .card-icon { width: 32px; height: 32px; fill: var(--gold); margin-top: 1.5rem; filter: drop-shadow(0 0 8px var(--gold)); opacity: 0.8; }

        /* LINEUP & MEDIA */
        .lineup-container { display: grid; grid-template-columns: 1fr 1fr; gap: 0; align-items: start; max-width: 950px; margin: 0 auto; }
        .lineup-col-poster { display: flex; justify-content: center; padding-right: 5rem; border-right: 1px solid rgba(255,255,255,0.1); }
        .lineup-poster { width: 320px; border-radius: 12px; border: 4px solid var(--gold); box-shadow: 0 0 40px var(--border-glow); }
        .artist-list { display: flex; flex-direction: column; gap: 2.5rem; padding-left: 5rem; }
        .artist-avatar { width: 65px; height: 65px; border-radius: 50%; object-fit: cover; border: 2px solid var(--gold); }
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; }
        .gallery-img { width: 100%; height: 250px; object-fit: cover; border-radius: 8px; border: 1px solid rgba(255,255,255,0.05); }

        /* DUAL LAYOUT FAQ/UBICACION */
        .faq-ubicacion-grid { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 0; max-width: 1000px; margin: 0 auto; align-items: start; }
        .faq-col { padding-right: 5rem; border-right: 1px solid rgba(255,255,255,0.1); }
        .ubicacion-col { padding-left: 5rem; }
        .faq-item { display: flex; justify-content: space-between; align-items: center; padding: 1.2rem 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-weight: 500; font-size: 0.95rem; }
        .faq-icon-plus { color: var(--gold); font-size: 1.4rem; }

        /* FORM RECOVERY v62 */
        .form-container { max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 1.5rem; }
        .form-input { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 1.2rem; border-radius: 10px; color: white; width: 100%; box-sizing: border-box; }
        .btn-submit { background: var(--gold); color: white; border: none; padding: 1.4rem; border-radius: 12px; font-weight: 900; cursor: pointer; width: 100%; text-transform: uppercase; letter-spacing: 2px; margin-top: 1rem; }
        
        .loading-overlay { position: fixed; inset: 0; background: #000; z-index: 999; display: flex; align-items: center; justify-content: center; font-weight: 900; letter-spacing: 3px; }
        
        @media (max-width: 850px) {
            .data-cards-container { grid-template-columns: repeat(2, 1fr); }
            .lineup-container, .faq-ubicacion-grid { grid-template-columns: 1fr; gap: 4rem; }
            .lineup-col-poster, .faq-col { border-right: none; padding-right: 0; }
            .artist-list, .ubicacion-col { padding-left: 0; }
            h2 { text-align: center; }
        }
    </style>
</head>

<body class="tpl-sandbox">

    <div id="loader" class="loading-overlay">MILESTONE v62: STABLE SYNC...</div>

    <header id="hero-bg" class="hero">
        <div id="org-name-badge" class="org-badge">--</div>
        <div class="hero-content">
            <h1 id="event-title" class="hero-title">--</h1>
            <div id="unified-frame" class="unified-countdown-frame">
                <div class="cd-block"><span id="cd-days" class="cd-v">00</span><span>DÍAS</span></div>
                <div class="cd-block"><span id="cd-hours" class="cd-v">00</span><span>HORAS</span></div>
                <div class="cd-block"><span id="cd-mins" class="cd-v">00</span><span>MIN</span></div>
                <div class="cd-block"><span id="cd-secs" class="cd-v">00</span><span>SEG</span></div>
            </div>
        </div>
    </header>

    <main id="main-content-flow">
        <section id="modulo-countdown" style="display:none;"></section>
        <section id="modulo-aforo" style="display:none;"></section>

        <!-- DATA CARDS (v54 + Icons Recovery) -->
        <section id="modulo-info-tecnica">
            <div class="data-cards-container">
                <div class="data-card">
                    <span class="card-label">DRESS CODE</span>
                    <span id="db-dress-val" class="card-val">...</span>
                    <svg class="card-icon" viewBox="0 0 24 24"><path d="M17 10h-2c0-1.66-1.34-3-3-3s-3 1.34-3 3H7c-1.1 0-2 .9-2 2v6c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2v-6c0-1.1-.9-2-2-2zM12 11c1.1 0 2 .9 2 2s-.9 2-2 2-2-.9-2-2 .9-2 2-2z"/></svg>
                </div>
                <div class="data-card">
                    <span class="card-label">GUEST LIST</span>
                    <span id="db-guest-val" class="card-val">...</span>
                    <svg class="card-icon" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                </div>
                <div class="data-card">
                    <span class="card-label">AFORO</span>
                    <span id="db-aforo-val" class="card-val">...</span>
                    <svg class="card-icon" viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5s-3 1.34-3 3 1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5s-3 1.34-3 3 1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
                </div>
                <div class="data-card">
                    <span class="card-label">TICKETS</span>
                    <span id="db-ticket-val" class="card-val">DISPONIBLES</span>
                    <svg class="card-icon" viewBox="0 0 24 24"><path d="M22 10V6c0-1.11-.9-2-2-2H4c-1.1 0-1.99.89-1.99 2v4c1.1 0 1.99.9 1.99 2s-.89 2-2 2v4c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2v-4c-1.1 0-2-.9-2-2s.9-2 2-2zm-9 7h-2v-2h2v2zm0-4h-2v-2h2v2zm0-4h-2V7h2v2z"/></svg>
                </div>
            </div>
        </section>

        <!-- LINEUP -->
        <section id="modulo-lineup">
            <h2>ARTISTAS INVITADOS</h2>
            <div class="lineup-container">
                <div class="lineup-col-poster"><img id="db-poster-img" src="" class="lineup-poster" alt="Afiche"></div>
                <div id="db-lineup" class="artist-list"></div>
            </div>
        </section>

        <!-- GALERÍA -->
        <section id="modulo-gallery">
            <h2>GALERÍA</h2>
            <div id="db-gallery-grid" class="gallery-grid"></div>
        </section>

        <!-- DUAL MEDIA -->
        <section id="modulo-trailer-playlist">
            <h2>TRÁILER / BANDA SONORA</h2>
            <div style="display:grid; grid-template-columns: 1.6fr 1fr; gap:2.5rem; max-width:1100px; margin:0 auto;">
                <div id="modulo-trailer" style="position:relative; width:100%; padding-top:56.25%; border-radius:15px; overflow:hidden; border:1px solid var(--gold);"><iframe id="db-trailer-iframe" src="" allowfullscreen style="position:absolute; inset:0; border:none; width:100%; height:100%;"></iframe></div>
                <div id="modulo-playlist" style="border-radius:15px; overflow:hidden; border:1px solid rgba(255,255,255,0.1);"><div id="db-spotify"></div></div>
            </div>
        </section>

        <!-- FAQ & UBICACIÓN (Ref: faqubicacion.jpg) -->
        <section id="modulo-faq-ubicacion">
            <div class="faq-ubicacion-grid">
                <div class="faq-col"><h2>FAQ</h2><div id="db-faq-list"></div></div>
                <div class="ubicacion-col"><h2>UBICACIÓN</h2><div id="venue-name" style="font-weight:800; font-size:1.2rem; text-transform:uppercase; margin-bottom:1rem;">--</div><div id="db-mapa-container" style="width:100%; height:180px; border-radius:12px; overflow:hidden; border:1px solid rgba(255,255,255,0.1);"></div></div>
            </div>
        </section>

        <!-- FORMULARIO FULL RECOVERY (Ref: evento.html) -->
        <section id="modulo-formulario">
            <h2>REGISTRO DE ASISTENCIA</h2>
            <form id="master-reg-form" class="form-container">
                <input type="text" class="form-input" id="reg-nombre" placeholder="Nombre completo *" required>
                <input type="text" class="form-input" id="reg-cedula" placeholder="Cédula / Documento *" required>
                
                <div style="display:flex; gap:0.5rem;">
                    <select class="form-input" id="reg-pais" style="width:110px;">
                        <option value="+57">🇨🇴 +57</option>
                        <option value="+1">🇺🇸 +1</option>
                        <option value="+52">🇲🇽 +52</option>
                        <option value="+34">🇪🇸 +34</option>
                    </select>
                    <input type="tel" class="form-input" id="reg-tel" placeholder="WhatsApp / Teléfono *" required>
                </div>

                <div id="db-dynamic-fields" style="display:flex; flex-direction:column; gap:1.5rem;"></div>
                
                <button type="submit" class="btn-submit">CONFIRMAR ASISTENCIA →</button>
            </form>
        </section>
    </main>

    <script>
        const SANDBOX_CONFIG = { countdown: true, trailer: true, aforo: true, lineup: true, dress_code: true, gallery: true, guest_list: true, faq: true, playlist: true, ubicacion: true, formulario: true };
        const SB_URL = "https://ctgyvydzshueemlelkzv.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN0Z3l2eWR6c2h1ZWVtbGVsa3p2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2NTc1NzAsImV4cCI6MjA4OTIzMzU3MH0.3pMA-VZLV2Kfyl6BD-x8v79P7UuXSfMgtIwnfoP_VuY";
        const sbClient = window.supabase.createClient(SB_URL, SB_KEY);

        function logStatus(m, t = 'INFO') {
            const colors = { 'INFO': '#00ff88', 'LINK': '#f1c40f', 'TIME': '#9b59b6', 'ERROR': '#ff4d4d', 'TRACE': '#e67e22', 'JSON': '#f39c12' };
            console.log(`%c[${new Date().toLocaleTimeString()}] [${t}] ${m}`, `color: ${colors[t] || '#fff'}; font-weight: bold;`);
        }

        function startCountdown(d, t) {
            const target = new Date(`${d}T${t}`).getTime();
            if (isNaN(target)) return;
            logStatus(`TIME: Heartbeat v62 activo para el ${d}.`, "TIME");
            setInterval(() => {
                const diff = target - new Date().getTime();
                if (diff <= 0) return;
                document.getElementById('cd-days').innerText = Math.floor(diff / 86400000).toString().padStart(2, '0');
                document.getElementById('cd-hours').innerText = Math.floor((diff % 86400000) / 3600000).toString().padStart(2, '0');
                document.getElementById('cd-mins').innerText = Math.floor((diff % 3600000) / 60000).toString().padStart(2, '0');
                document.getElementById('cd-secs').innerText = Math.floor((diff % 60000) / 1000).toString().padStart(2, '0');
            }, 1000);
        }

        async function initEvento() {
            logStatus("AUDITORÍA V62: Ejecutando punto de control estable (11 módulos)...");
            const slug = new URLSearchParams(window.location.search).get('slug');
            try {
                const { data: evento, error } = await sbClient.from('eventos').select('*').eq('slug', slug).single();
                if (error) throw error;
                startCountdown(evento.fecha, evento.hora);

                const { data: org } = await sbClient.from('organizaciones').select('nombre').eq('id', evento.org_id).single();
                if (org) document.getElementById('org-name-badge').innerText = org.nombre.toUpperCase();

                const content = evento.config_landing?.content || {};
                logStatus(`JSON: config_landing verificado con ${Object.keys(content).length} llaves.`, "JSON");

                // 1. DATA CARDS BINDING
                try {
                    document.getElementById('event-title').innerText = evento.nombre.toUpperCase();
                    document.getElementById('db-dress-val').innerText = (content.dresscode || 'BLACK & NEON').toUpperCase();
                    document.getElementById('db-guest-val').innerText = (content.guest_list || 'RESERVADOS').toUpperCase();
                    document.getElementById('db-aforo-val').innerText = `LÍMITE: ${evento.aforo_max || 300}`;
                    logStatus("LINK: Data Cards e iconos vinculados.", "LINK");
                } catch (e) { logStatus(`ERR-CARDS: ${e.message}`, "ERROR"); }

                // 2. LINEUP BINDING
                try {
                    document.getElementById('db-poster-img').src = evento.poster_url || evento.imagen_url || "https://images.unsplash.com/photo-1533174072545-7a4b6ad7a6c3";
                    const proPhotos = ["https://images.unsplash.com/photo-1493225255756-d9584f8606e9?q=80&w=200", "https://images.unsplash.com/photo-1520813792240-56fc4a3765a7?q=80&w=200", "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?q=80&w=200", "https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=200"];
                    const lineup = content.dj_lineup || content.lineup || "";
                    document.getElementById('db-lineup').innerHTML = (Array.isArray(lineup) ? lineup : lineup.split('\n')).filter(a => a.length > 2).map((a, i) => `
                        <div class="artist-item"><img src="${proPhotos[i % 4]}" class="artist-avatar"><span style="font-weight:900;">${a.trim()}</span></div>`).join('');
                } catch (e) { logStatus(`ERR-LINEUP: ${e.message}`, "ERROR"); }

                // 3. MEDIA BINDING
                try {
                    if (content.gallery) document.getElementById('db-gallery-grid').innerHTML = content.gallery.map(u => `<img src="${u}" class="gallery-img">`).join('');
                    document.getElementById('db-trailer-iframe').src = content.trailer_url || "https://player.vimeo.com/video/259411563?h=79100067&color=df20b6";
                    if (content.playlist_url) {
                        const embed = content.playlist_url.replace('open.spotify.com', 'open.spotify.com/embed');
                        document.getElementById('db-spotify').innerHTML = `<iframe src="${embed}" width="100%" height="450" frameBorder="0" allow="encrypted-media" style="filter: invert(1) hue-rotate(180deg) brightness(0.8); border:none;"></iframe>`;
                    }
                } catch (e) { logStatus(`ERR-MEDIA: ${e.message}`, "ERROR"); }

                // 4. FAQ BINDING (v61 Structural Fix)
                try {
                    if (content.faq && typeof content.faq === 'string') {
                        const lineas = content.faq.split('\n').filter(l => l.includes('|'));
                        document.getElementById('db-faq-list').innerHTML = lineas.map(l => {
                            const [q] = l.split('|'); // Destructuración segura de Array
                            return `<div class="faq-item"><span>${(q || 'Consulta').trim()}</span><span class="faq-icon-plus">+</span></div>`;
                        }).join('');
                        logStatus("TRACE: faq procesado mediante l.split('|').", "TRACE");
                    }
                } catch (e) { logStatus(`ERR-FAQ: ${e.message}`, "ERROR"); }

                // 5. UBICACIÓN BINDING
                try {
                    document.getElementById('venue-name').innerText = (evento.ubicacion || 'LOCALIZACIÓN').toUpperCase();
                    const mapUrl = `https://maps.google.com/maps?q=${encodeURIComponent(evento.ubicacion)}&t=&z=15&ie=UTF8&iwloc=&output=embed`;
                    document.getElementById('db-mapa-container').innerHTML = `<iframe width="100%" height="100%" src="${mapUrl}" allowfullscreen style="filter: grayscale(1) invert(1) contrast(1.2); border:none;"></iframe>`;
                } catch (e) { logStatus(`ERR-MAP: ${e.message}`, "ERROR"); }

                // 6. FORMULARIO BINDING (Ref: evento.html logic)
                try {
                    const fields = evento.form_campos || {};
                    let html = '';
                    if (fields.email) html += `<input type="email" class="form-input" placeholder="Correo electrónico *">`;
                    if (fields.edad) html += `<input type="number" class="form-input" placeholder="Edad *">`;
                    if (fields.ciudad) html += `<input type="text" class="form-input" placeholder="Ciudad de origen *">`;
                    document.getElementById('db-dynamic-fields').innerHTML = html;
                    logStatus("LINK: Formulario completado con campos dinámicos.", "LINK");
                } catch (e) { logStatus(`ERR-FORM: ${e.message}`, "ERROR"); }

                if (evento.imagen_url) document.getElementById('hero-bg').style.backgroundImage = `url('${evento.imagen_url}')`;

                // --- AUDITORÍA DE ESCUDO FINAL v62 ---
                Object.keys(SANDBOX_CONFIG).forEach(key => {
                    const sectionId = (key === 'faq' || key === 'ubicacion') ? 'modulo-faq-ubicacion' : 
                                     (['dress_code','guest_list','aforo'].includes(key)) ? 'modulo-info-tecnica' : 
                                     (['playlist','trailer'].includes(key)) ? 'modulo-trailer-playlist' : `modulo-${key}`;
                    const el = document.getElementById(sectionId);
                    if (el) { el.style.display = 'block'; logStatus(`INFO: Módulo ${key.toUpperCase()} validado.`, "INFO"); }
                });

                logStatus("SINCRONIZACIÓN MAESTRA V62 FINALIZADA.", "INFO");
            } catch (err) { logStatus(`CRÍTICO: ${err.message}`, "ERROR"); } finally { document.getElementById('loader').style.display = 'none'; }
        }
        window.onload = initEvento;
    </script>
</body>
</html>
