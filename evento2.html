<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Editor v47: physical validation Fix · Sistema QR</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.3.0/dist/fonts/geist.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/qr-creator/dist/qr-creator.min.js"></script>

    <style>
        :root { 
            --main-bg: #050505; 
            --gold: #df20b6; 
            --text-color: #ffffff;
            --glass-lite: rgba(255, 255, 255, 0.03);
        }

        html, body { 
            margin: 0; padding: 0; min-height: 100%; 
            background-color: var(--main-bg); color: var(--text-color); 
            font-family: 'Geist', sans-serif; -webkit-font-smoothing: antialiased; 
        }

        /* ESCUDO DE GRANO (v47 Fix 404): Ruido Inline para evitar errores de red */
        body::before {
            content: ""; position: fixed; inset: 0; z-index: 9999; pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            opacity: 0.03; contrast: 120%;
        }
        
        section { display: none; padding: 5rem 10%; border-bottom: 1px solid rgba(255,255,255,0.05); }
        h2 { color: var(--gold); letter-spacing: 4px; text-transform: uppercase; font-size: 0.7rem; font-weight: 900; margin-bottom: 3rem; text-align: center; }

        /* HERO P6 STABLE */
        .hero { 
            position: relative; height: 100vh; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; padding: 2rem; background-size: cover; background-position: center; 
            box-sizing: border-box; text-align: center;
        }
        .hero::before { 
            content: ''; position: absolute; inset: 0; 
            background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, rgba(5,5,5,0.3) 50%, rgba(5,5,5,1) 100%); z-index: 1; 
        }

        .org-badge { position: absolute; top: 2rem; left: 2rem; z-index: 10; color: white; font-weight: 900; font-size: 1.1rem; letter-spacing: 2px; text-transform: uppercase; }

        .hero-content { position: relative; z-index: 2; width: 100%; max-width: 850px; }
        .hero-title { font-weight: 900; font-size: clamp(2rem, 8vw, 4.5rem); line-height: 1; text-transform: uppercase; margin: 0; letter-spacing: -3px; color: #fff; }

        .hero-meta { display: flex; flex-wrap: wrap; justify-content: center; gap: 1.5rem; margin-top: 2rem; font-weight: 800; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 1px; }
        .meta-item { display: flex; align-items: center; gap: 0.5rem; }
        .meta-icon { width: 16px; height: 18px; fill: var(--gold); }

        .aforo-box {
            display: inline-block; margin-top: 1.5rem; padding: 0.8rem 1.5rem;
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15);
            border-radius: 4px; color: #fff; font-size: 0.75rem; font-weight: 700;
            letter-spacing: 1px; text-transform: uppercase;
        }

        .unified-countdown-frame {
            position: relative; z-index: 2; margin-top: 2.5rem; padding: 1.5rem 2rem;
            background: var(--glass-lite); border-radius: 12px;
            border: 1px solid var(--gold); backdrop-filter: blur(6px);
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 0 20px rgba(223, 32, 182, 0.15);
            width: fit-content; margin-left: auto; margin-right: auto;
        }
        .cd-block { padding: 0 1.2rem; display: flex; flex-direction: column; align-items: center; }
        .cd-block:not(:last-child) { border-right: 1px solid rgba(255,255,255,0.1); }
        .cd-v { display: block; font-size: clamp(1.8rem, 4vw, 2.5rem); font-weight: 900; line-height: 1; color: #fff; }
        .cd-l { font-size: 0.55rem; letter-spacing: 2px; opacity: 0.4; text-transform: uppercase; margin-top: 0.4rem; font-weight: 900; }

        .data-item { margin-bottom: 1.5rem; padding: 2rem; background: var(--glass-lite); border: 1px solid rgba(255,255,255,0.05); border-radius: 12px; backdrop-filter: blur(5px); }
        
        .form-container { max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 1.5rem; }
        .form-label { color: var(--gold); font-size: 0.65rem; font-weight: 900; letter-spacing: 1px; text-transform: uppercase; opacity: 0.8; }
        .form-input { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 1.2rem; border-radius: 10px; color: white; font-family: inherit; width: 100%; box-sizing: border-box; font-size: 1rem; }
        .btn-submit { background: var(--gold); color: white; border: none; padding: 1.4rem; border-radius: 12px; font-weight: 900; cursor: pointer; width: 100%; text-transform: uppercase; letter-spacing: 2px; box-shadow: 0 10px 25px rgba(223, 32, 182, 0.4); margin-top: 1rem; }
        
        .loading-overlay { position: fixed; inset: 0; background: #000; z-index: 999; display: flex; align-items: center; justify-content: center; font-weight: 900; }
    </style>
</head>

<body class="tpl-sandbox">

    <div id="loader" class="loading-overlay">FINAL CALIBRATION v47...</div>

    <header id="hero-bg" class="hero">
        <div id="org-name-badge" class="org-badge">--</div>

        <div class="hero-content">
            <h1 id="event-title" class="hero-title">--</h1>
            
            <div class="hero-meta">
                <div class="meta-item"><svg class="meta-icon" viewBox="0 0 24 24"><path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2z"/></svg><span id="meta-fecha">--/--/--</span></div>
                <div class="meta-item"><svg class="meta-icon" viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg><span id="meta-hora">--:--</span></div>
                <div class="meta-item"><svg class="meta-icon" viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg><span id="meta-lugar">--</span></div>
            </div>

            <div id="hero-aforo-txt" class="aforo-box">...</div>

            <div id="unified-frame" class="unified-countdown-frame">
                <div class="cd-block"><span id="cd-days" class="cd-v">00</span><span class="cd-l">Días</span></div>
                <div class="cd-block"><span id="cd-hours" class="cd-v">00</span><span class="cd-l">Horas</span></div>
                <div class="cd-block"><span id="cd-mins" class="cd-v">00</span><span class="cd-l">Min</span></div>
                <div class="cd-block"><span id="cd-secs" class="cd-v">00</span><span class="cd-l">Seg</span></div>
            </div>
        </div>
    </header>

    <main id="main-content-flow">
        <section id="modulo-countdown" style="display:none;"></section>
        <section id="modulo-aforo" style="display:none;"></section>

        <section id="modulo-trailer"><h2>EXPERIENCIA VISUAL</h2><div id="db-trailer-container"></div></section>
        <section id="modulo-lineup"><h2>DJ LINEUP</h2><div id="db-lineup"></div></section>
        <section id="modulo-dress_code"><h2>VESTIMENTA</h2><div id="db-dress-txt" class="data-item" style="text-align:center;">--</div></section>
        <section id="modulo-gallery"><h2>GALERÍA</h2><div id="db-gallery-grid" style="display:grid; grid-template-columns:repeat(auto-fit, minmax(250px, 1fr)); gap:1.5rem;"></div></section>
        <section id="modulo-guest_list"><h2>GUEST LIST</h2><div id="db-guest-txt" class="data-item">--</div></section>
        <section id="modulo-faq"><h2>DUDAS FRECUENTES</h2><div id="db-faq-list"></div></section>
        <section id="modulo-playlist"><h2>BANDA SONORA</h2><div id="db-spotify"></div></section>
        <section id="modulo-ubicacion"><h2>LOCALIZACIÓN</h2><div id="db-mapa-container" style="width:100%; height:450px; border-radius:15px; overflow:hidden; border:1px solid rgba(255,255,255,0.1);"></div></section>

        <!-- MODULO FORMULARIO CON CAMPOS ESTÁTICOS PROTEGIDOS -->
        <section id="modulo-formulario">
            <h2>RESERVA TU LUGAR</h2>
            <form id="master-reg-form" class="form-container" onsubmit="alert('Registro enviado'); return false;">
                <div><label class="form-label">Nombre *</label><input type="text" class="form-input" placeholder="Tu Nombre" required></div>
                <div><label class="form-label">Cédula *</label><input type="text" class="form-input" placeholder="ID" required></div>
                <div><label class="form-label">WhatsApp *</label><div style="display:flex; gap:0.5rem;"><select class="form-input" style="width:110px;"><option value="+57">🇨🇴 +57</option></select><input type="tel" class="form-input" required></div></div>
                <div id="db-dynamic-fields"></div>
                <button type="submit" class="btn-submit">CONFIRMAR ASISTENCIA →</button>
            </form>
        </section>
    </main>

    <script>
        const SANDBOX_CONFIG = {
            countdown: true, trailer: true, aforo: true, lineup: true, dress_code: true, 
            gallery: true, guest_list: true, faq: true, playlist: true, ubicacion: true, 
            formulario: true, force_gold: '#df20b6' 
        };

        const SB_URL = "https://ctgyvydzshueemlelkzv.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN0Z3l2eWR6c2h1ZWVtbGVsa3p2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2NTc1NzAsImV4cCI6MjA4OTIzMzU3MH0.3pMA-VZLV2Kfyl6BD-x8v79P7UuXSfMgtIwnfoP_VuY";
        const sbClient = window.supabase.createClient(SB_URL, SB_KEY);

        function logStatus(mensaje, tipo = 'INFO') {
            const colors = { 'INFO': '#00ff88', 'LINK': '#f1c40f', 'TIME': '#9b59b6', 'ERROR': '#ff4d4d' };
            console.log(`%c[${new Date().toLocaleTimeString()}] [${tipo}] ${mensaje}`, `color: ${colors[tipo] || '#fff'}; font-weight: bold;`);
        }

        function startCountdown(date, time) {
            try {
                const target = new Date(`${date}T${time}`).getTime();
                if (isNaN(target)) return;
                logStatus(`TIME: Heartbeat activo v47 para ${date}.`, "TIME");
                setInterval(() => {
                    const diff = target - new Date().getTime();
                    if (diff <= 0) return;
                    document.getElementById('cd-days').innerText = Math.floor(diff / 86400000).toString().padStart(2, '0');
                    document.getElementById('cd-hours').innerText = Math.floor((diff % 86400000) / 3600000).toString().padStart(2, '0');
                    document.getElementById('cd-mins').innerText = Math.floor((diff % 3600000) / 60000).toString().padStart(2, '0');
                    document.getElementById('cd-secs').innerText = Math.floor((diff % 60000) / 1000).toString().padStart(2, '0');
                }, 1000);
            } catch (e) { logStatus(`ERROR TIME: ${e.message}`, "ERROR"); }
        }

        async function initEvento() {
            logStatus("AUDITORÍA V47: Restaurando precisión física del formulario...");
            const slug = new URLSearchParams(window.location.search).get('slug');

            try {
                const { data: evento, error } = await sbClient.from('eventos').select('*').eq('slug', slug).single();
                if (error) throw error;

                if (SANDBOX_CONFIG.countdown) startCountdown(evento.fecha, evento.hora);

                const { data: org } = await sbClient.from('organizaciones').select('nombre').eq('id', evento.org_id).single();
                if (org) document.getElementById('org-name-badge').innerText = org.nombre.toUpperCase();

                document.getElementById('event-title').innerText = evento.nombre.toUpperCase();
                document.getElementById('meta-fecha').innerText = evento.fecha;
                document.getElementById('meta-hora').innerText = `${evento.hora} HRS`;
                document.getElementById('meta-lugar').innerText = evento.ubicacion.toUpperCase();
                if (evento.aforo_max) document.getElementById('hero-aforo-txt').innerText = `${evento.aforo_max} CUPOS DISPONIBLES`;
                if (evento.imagen_url) document.getElementById('hero-bg').style.backgroundImage = `url('${evento.imagen_url}')`;

                const content = evento.config_landing?.content || {};

                // 1. LINEUP
                const lineup = content.dj_lineup || content.lineup;
                if (lineup) {
                    const l = Array.isArray(lineup) ? lineup : lineup.split('\n');
                    document.getElementById('db-lineup').innerHTML = l.map(a => `<div class="data-item" style="text-align:center; font-weight:900;">${a}</div>`).join('');
                    logStatus("LINK: Lineup inyectado.", "LINK");
                }

                // 2. DRESS CODE
                if (content.dresscode || content.vestimenta) {
                    document.getElementById('db-dress-txt').innerText = (content.dresscode || content.vestimenta).toUpperCase();
                    logStatus("LINK: Dress Code inyectado.", "LINK");
                }

                // 3. GALERÍA
                if (content.gallery) {
                    document.getElementById('db-gallery-grid').innerHTML = content.gallery.map(u => `<img src="${u}" style="width:100%; height:300px; object-fit:cover; border-radius:12px;">`).join('');
                    logStatus("LINK: Galería inyectada.", "LINK");
                }

                // 4. GUEST LIST
                if (content.guest_list) {
                    document.getElementById('db-guest-txt').innerText = content.guest_list;
                    logStatus("LINK: Guest List inyectada.", "LINK");
                }

                // 5. FAQ
                if (content.faq && typeof content.faq === 'string') {
                    const lineas = content.faq.split('\n').filter(l => l.includes('|'));
                    document.getElementById('db-faq-list').innerHTML = lineas.map(l => {
                        const [q, a] = l.split('|');
                        return `<div class="data-item"><b style="color:var(--gold); display:block; margin-bottom:1rem; font-size:0.8rem;">${q.trim()}</b><p style="opacity:0.7; margin:0;">${a.trim()}</p></div>`;
                    }).join('');
                    logStatus("LINK: FAQ inyectada.", "LINK");
                }

                // 6. PLAYLIST
                if (content.playlist_url) {
                    const embed = content.playlist_url.replace('open.spotify.com', 'open.spotify.com/embed');
                    document.getElementById('db-spotify').innerHTML = `<iframe src="${embed}" width="100%" height="380" frameBorder="0" allow="encrypted-media" style="border-radius:15px; border:none; filter: invert(1) hue-rotate(180deg) brightness(0.8);"></iframe>`;
                    logStatus("LINK: Playlist inyectada.", "LINK");
                }

                // 7. MAPA
                if (evento.ubicacion) {
                    const url = `https://maps.google.com/maps?q=${encodeURIComponent(evento.ubicacion)}&t=&z=15&ie=UTF8&iwloc=&output=embed`;
                    document.getElementById('db-mapa-container').innerHTML = `<iframe width="100%" height="100%" src="${url}" allowfullscreen style="filter: grayscale(1) invert(1) contrast(1.2); border:none;"></iframe>`;
                    logStatus("LINK: Mapa inyectado.", "LINK");
                }

                // 8. FORMULARIO DINÁMICO
                if (evento.form_campos) {
                    const fields = evento.form_campos || {};
                    let html = '';
                    if (fields.email) html += `<div style="margin-bottom:1rem;"><label class="form-label">Email *</label><input type="email" class="form-input" required></div>`;
                    if (fields.edad) html += `<div style="margin-bottom:1rem;"><label class="form-label">Edad</label><input type="number" class="form-input"></div>`;
                    document.getElementById('db-dynamic-fields').innerHTML = html;
                    logStatus("LINK: Formulario dinámico inyectado.", "LINK");
                }

                // --- AUDITORÍA DE INTEGRIDAD FÍSICA v47 ---
                logStatus("--- INICIANDO AUDITORÍA DE INTEGRIDAD FÍSICA ---", "INFO");
                Object.keys(SANDBOX_CONFIG).forEach(key => {
                    if (key === 'force_gold' || key === 'trailer') return;
                    const el = document.getElementById(`modulo-${key}`);
                    if (!el) return;

                    // FIX v47: El formulario se valida buscando inputs físicos en el formulario maestro, no en db-dynamic
                    const formElement = el.querySelector('form');
                    const container = el.querySelector('[id*="db-"]') || document.getElementById('unified-frame');
                    const hasInput = (formElement || el).querySelector('input');
                    const hasIframe = (container || el).querySelector('iframe');
                    const hasImg = (container || el).querySelector('img');
                    const cleanTxt = container ? container.innerText.replace(/\s/g, '').replace('--', '') : '';
                    
                    let isValid = (key === 'formulario') ? (hasInput !== null) : (cleanTxt.length >= 3 || hasIframe || hasImg);

                    if (SANDBOX_CONFIG[key] && !isValid && key !== 'countdown' && key !== 'aforo') {
                        logStatus(`ERROR: Módulo ${key.toUpperCase()} vacío.`, "ERROR");
                    } else if (SANDBOX_CONFIG[key]) {
                        logStatus(`INFO: Módulo ${key.toUpperCase()} verificado.`, "INFO");
                        el.style.display = 'block';
                    }
                });

                logStatus("SINCRONIZACIÓN MAESTRA V47 FINALIZADA.", "INFO");

            } catch (err) { logStatus(`CRÍTICO: ${err.message}`, "ERROR"); } finally { document.getElementById('loader').style.display = 'none'; }
        }
        window.onload = initEvento;
    </script>
</body>
</html>
