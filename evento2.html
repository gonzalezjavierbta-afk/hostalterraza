<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Editor v81: Production Hardening · Sistema QR</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.3.0/dist/fonts/geist.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/qr-creator/dist/qr-creator.min.js"></script>

    <style>
        :root { 
            --main-bg: #050505; --gold: #df20b6; --text-color: #ffffff;
            --glass-lite: rgba(255, 255, 255, 0.03); --border-glow: rgba(223, 32, 182, 0.4);
        }

        html, body { 
            margin: 0; padding: 0; min-height: 100%; 
            background-color: var(--main-bg); color: var(--text-color); 
            font-family: 'Geist', sans-serif; -webkit-font-smoothing: antialiased; 
            overflow-x: hidden;
        }

        /* ESCUDO DE GRANO (v47) */
        body::before {
            content: ""; position: fixed; inset: 0; z-index: 9999; pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            opacity: 0.04; contrast: 130%;
        }
        
        section { display: none; padding: 5rem 10%; border-bottom: 1px solid rgba(255,255,255,0.05); }
        h2 { color: var(--gold); letter-spacing: 4px; text-transform: uppercase; font-size: 0.75rem; font-weight: 900; margin-bottom: 3.5rem; text-align: left; }

        /* 1. HERO & COUNTDOWN (3.2rem) */
        .hero { position: relative; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 2rem; background-size: cover; background-position: center; text-align: center; }
        .hero::before { content: ''; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, rgba(5,5,5,0.3) 50%, rgba(5,5,5,1) 100%); z-index: 1; }
        .org-badge { position: absolute; top: 2rem; left: 2rem; z-index: 10; font-weight: 900; font-size: 1.1rem; letter-spacing: 2px; text-transform: uppercase; }
        .hero-title { font-weight: 900; font-size: clamp(2.5rem, 8vw, 4.5rem); text-transform: uppercase; margin: 0; letter-spacing: -3px; z-index: 2; position: relative; }
        
        .hero-meta { display: flex; flex-wrap: wrap; justify-content: center; gap: 2.5rem; margin-top: 2.5rem; font-weight: 800; text-transform: uppercase; font-size: 0.85rem; letter-spacing: 2px; z-index: 2; position: relative; opacity: 0.9; }
        .meta-item { display: flex; align-items: center; gap: 0.7rem; }
        .meta-svg { width: 18px; height: 18px; fill: var(--gold); }

        .unified-countdown-frame { position: relative; z-index: 2; margin: 3rem auto 0; padding: 1.5rem 2.5rem; background: var(--glass-lite); border-radius: 12px; border: 1px solid var(--gold); backdrop-filter: blur(8px); display: flex; width: fit-content; }
        .cd-block { padding: 0 1.5rem; border-right: 1px solid rgba(255,255,255,0.1); text-align: center; }
        .cd-block:last-child { border-right: none; }
        .cd-v { display: block; font-size: 3.2rem; font-weight: 900; line-height: 1; margin-bottom: 0.5rem; }

        /* 2. MEDIA (Recovery Fix) */
        .gallery-media-grid { display: grid; grid-template-columns: 1.6fr 1fr; gap: 2.5rem; max-width: 1100px; margin: 4rem auto 0; align-items: start; }
        .video-wrapper { position: relative; width: 100%; padding-top: 56.25%; border-radius: 15px; overflow: hidden; border: 1px solid var(--gold); background: #000; box-shadow: 0 0 30px var(--border-glow); }
        .video-iframe { position: absolute; inset: 0; border: none; width: 100%; height: 100%; }
        .spotify-container { border-radius: 15px; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); background: #121212; height: 600px; } /* Altura inmersiva */

        /* 3. LINEUP & DATA CARDS */
        .lineup-poster { width: 320px !important; border-radius: 12px; border: 4px solid var(--gold); box-shadow: 0 0 40px var(--border-glow); }
        .artist-avatar { width: 65px !important; height: 65px !important; border-radius: 50% !important; object-fit: cover; border: 2px solid var(--gold); }
        
        .data-cards-container { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.2rem; max-width: 1100px; margin: 0 auto; }
        .data-card { 
            background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.08); 
            border-radius: 15px; padding: 2.5rem 1rem; text-align: center; 
            display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 240px;
        }
        .card-icon-xl { width: 68px !important; height: 68px !important; fill: var(--gold); filter: drop-shadow(0 0 15px var(--gold)); opacity: 0.9; margin-top: 2rem; }

        /* 4. SPONSORS v81 (Zero Filters - Native Alpha) */
        .sponsors-full-frame { width: 100vw; margin-left: calc(-50vw + 50%); padding: 5.5rem 0; border-top: 1px solid rgba(255,255,255,0.05); }
        .sponsors-strip { display: flex; justify-content: center; align-items: center; gap: clamp(2.5rem, 8vw, 8rem); flex-wrap: wrap; padding: 0 10%; }
        .sponsor-logo { 
            height: 44px !important; width: auto !important; max-width: 210px;
            object-fit: contain; 
            /* Filtros eliminados para respetar logos blancos con transparencia original */
            background: transparent !important;
            opacity: 1;
            transition: transform 0.4s;
        }

        /* 5. FORM & FAQ */
        .faq-icon-circle { width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--gold); display: flex; align-items: center; justify-content: center; color: var(--gold); }
        .form-input { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 1.2rem; border-radius: 12px; color: white; width: 100%; box-sizing: border-box; }
        .btn-submit { background: var(--gold); color: white; border: none; padding: 1.5rem; border-radius: 15px; font-weight: 900; cursor: pointer; text-transform: uppercase; letter-spacing: 2px; }
        
        .loading-overlay { position: fixed; inset: 0; background: #000; z-index: 999; display: flex; align-items: center; justify-content: center; font-weight: 900; letter-spacing: 3px; }
        
        @media (max-width: 850px) {
            .gallery-media-grid { grid-template-columns: 1fr; }
            .data-cards-container { grid-template-columns: repeat(2, 1fr); }
            .cd-v { font-size: 2.2rem; }
            .spotify-container { height: 450px; }
        }
    </style>
</head>

<body class="tpl-sandbox">

    <div id="loader" class="loading-overlay">PRODUCTION HARDENING v81...</div>

    <header id="hero-bg" class="hero">
        <div id="org-name-badge" class="org-badge">--</div>
        <div class="hero-content">
            <h1 id="event-title" class="hero-title">--</h1>
            <div class="hero-meta">
                <div class="meta-item"><svg class="meta-svg" viewBox="0 0 24 24"><path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2z"/></svg><span id="meta-fecha">--/--/--</span></div>
                <div class="meta-item"><svg class="meta-svg" viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58-8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg><span id="meta-hora">--:--</span></div>
                <div class="meta-item"><svg class="meta-svg" viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg><span id="meta-lugar">--</span></div>
            </div>
            <div id="unified-frame" class="unified-countdown-frame">
                <div class="cd-block"><span id="cd-days" class="cd-v">00</span><span style="font-size:0.5rem; letter-spacing:2px;">DÍAS</span></div>
                <div class="cd-block"><span id="cd-hours" class="cd-v">00</span><span style="font-size:0.5rem; letter-spacing:2px;">HORAS</span></div>
                <div class="cd-block"><span id="cd-mins" class="cd-v">00</span><span style="font-size:0.5rem; letter-spacing:2px;">MIN</span></div>
                <div class="cd-block"><span id="cd-secs" class="cd-v">00</span><span style="font-size:0.5rem; letter-spacing:2px;">SEG</span></div>
            </div>
        </div>
    </header>

    <main id="main-content-flow">
        <!-- LINEUP -->
        <section id="modulo-lineup">
            <h2>ARTISTAS INVITADOS</h2>
            <div class="lineup-container">
                <div style="display:flex; justify-content:center; padding-right:5rem; border-right:1px solid rgba(255,255,255,0.1);"><img id="db-poster-img" src="" class="lineup-poster" alt="Poster"></div>
                <div id="db-lineup" style="display:flex; flex-direction:column; gap:2.5rem; padding-left:5rem;"></div>
            </div>
        </section>

        <!-- GALLERY & MEDIA (v81 Stabilized) -->
        <section id="modulo-gallery">
            <h2>GALERÍA</h2>
            <div id="db-gallery-grid" style="display:grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap:1rem; margin-top:1rem;"></div>
            <div class="gallery-media-grid">
                <div id="modulo-trailer" class="video-wrapper"><iframe id="db-trailer-iframe" class="video-iframe" src="" allow="autoplay; fullscreen" allowfullscreen></iframe></div>
                <div id="modulo-playlist" class="spotify-container"><div id="db-spotify-embed" style="height:100%;"></div></div>
            </div>
        </section>

        <!-- DATA CARDS -->
        <section id="modulo-info-tecnica">
            <div class="data-cards-container">
                <div class="data-card">
                    <div><span class="card-label">DRESS CODE</span><br><span id="db-dress-val" class="card-val">--</span></div>
                    <svg class="card-icon-xl" viewBox="0 0 24 24"><path d="M17 10h-2c0-1.66-1.34-3-3-3s-3 1.34-3 3H7c-1.1 0-2 .9-2 2v6c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2v-6c0-1.1-.9-2-2-2zM12 11c1.1 0 2 .9 2 2s-.9 2-2 2-2-.9-2-2 .9-2 2-2z"/></svg>
                </div>
                <div class="data-card">
                    <div><span class="card-label">GUEST LIST</span><br><span id="db-guest-val" class="card-val">--</span><br><span style="font-size:0.6rem; opacity:0.4; font-weight:800; text-transform: uppercase;">CONFIRMADOS</span></div>
                </div>
                <div class="data-card">
                    <div><span class="card-label">AFORO</span><br><span id="db-aforo-val" class="card-val">--</span></div>
                    <svg class="card-icon-xl" viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5s-3 1.34-3 3 1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5s-3 1.34-3 3 1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
                </div>
                <div class="data-card">
                    <div><span class="card-label">TICKETS</span><br><span id="db-ticket-val" class="card-val">--</span></div>
                    <svg class="card-icon-xl" viewBox="0 0 24 24"><path d="M22 10V6c0-1.11-.9-2-2-2H4c-1.1 0-1.99.89-1.99 2v4c1.1 0 1.99.9 1.99 2s-.89 2-2 2v4c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2v-4c-1.1 0-2-.9-2-2s.9-2 2-2zm-9 7h-2v-2h2v2zm0-4h-2v-2h2v2zm0-4h-2V7h2v2z"/></svg>
                </div>
            </div>
        </section>

        <!-- FAQ & UBICACIÓN -->
        <section id="modulo-faq-ubicacion">
            <div style="display:grid; grid-template-columns: 1fr 1.1fr; gap:0; max-width:1200px; margin:0 auto; align-items:stretch;">
                <div style="padding-right:4rem; border-right:1px solid rgba(255,255,255,0.1);"><h2>FAQ</h2><div id="db-faq-list"></div></div>
                <div style="padding-left:4rem;"><h2>UBICACIÓN</h2><div id="venue-name" style="font-weight:800; text-transform:uppercase; margin-bottom:1rem;">--</div><div id="db-mapa-container" class="map-frame-immersive"></div></div>
            </div>
        </section>

        <!-- SPONSORS (True Alpha Release) -->
        <section id="modulo-patrocinadores">
            <div class="sponsors-full-frame">
                <span style="color:var(--gold); font-size:0.65rem; font-weight:900; letter-spacing:4px; text-transform:uppercase; margin-bottom:4rem; text-align:center; display:block;">PATROCINADORES</span>
                <div id="db-sponsors-strip" class="sponsors-strip"></div>
            </div>
        </section>

        <!-- FORM -->
        <section id="modulo-formulario">
            <h2 style="text-align:center;">REGISTRO DE ASISTENCIA</h2>
            <form id="master-reg-form" class="form-container">
                <input type="text" class="form-input" placeholder="Nombre completo *" required>
                <div style="display:flex; gap:0.5rem;"><select class="form-input" style="width:110px;"><option value="+57">🇨🇴 +57</option><option value="+34">🇪🇸 +34</option></select><input type="tel" class="form-input" placeholder="WhatsApp *" required></div>
                <div id="db-dynamic-fields" style="display:flex; flex-direction:column; gap:1.5rem;"></div>
                <button type="submit" class="btn-submit">CONFIRMAR REGISTRO →</button>
            </form>
        </section>
    </main>

    <script>
        const SANDBOX_CONFIG = { countdown: true, trailer: true, aforo: true, lineup: true, dress_code: true, gallery: true, guest_list: true, faq: true, playlist: true, ubicacion: true, patrocinadores: true, formulario: true };
        const SB_URL = "https://ctgyvydzshueemlelkzv.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN0Z3l2eWR6c2h1ZWVtbGVsa3p2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2NTc1NzAsImV4cCI6MjA4OTIzMzU3MH0.3pMA-VZLV2Kfyl6BD-x8v79P7UuXSfMgtIwnfoP_VuY";
        const sbClient = window.supabase.createClient(SB_URL, SB_KEY);

        function logStatus(m, t = 'INFO') {
            const colors = { 'INFO': '#00ff88', 'LINK': '#f1c40f', 'TIME': '#9b59b6', 'ERROR': '#ff4d4d', 'TRACE': '#e67e22' };
            console.log(`%c[${new Date().toLocaleTimeString()}] [${t}] ${m}`, `color: ${colors[t] || '#fff'}; font-weight: bold;`);
        }

        async function initEvento() {
            logStatus("AUDITORÍA V81: Ejecutando blindaje de Media y lógica True Alpha para Sponsors.");
            const slug = new URLSearchParams(window.location.search).get('slug');
            try {
                const { data: evento, error } = await sbClient.from('eventos').select('*').eq('slug', slug).single();
                if (error) throw error;
                
                // 1. Heartbeat immediate (v75 restore)
                const target = new Date(`${evento.fecha}T${evento.hora}`).getTime();
                setInterval(() => {
                    const diff = target - new Date().getTime();
                    if (diff <= 0) return;
                    document.getElementById('cd-days').innerText = Math.floor(diff / 86400000).toString().padStart(2, '0');
                    document.getElementById('cd-hours').innerText = Math.floor((diff % 86400000) / 3600000).toString().padStart(2, '0');
                    document.getElementById('cd-mins').innerText = Math.floor((diff % 3600000) / 60000).toString().padStart(2, '0');
                    document.getElementById('cd-secs').innerText = Math.floor((diff % 60000) / 1000).toString().padStart(2, '0');
                }, 1000);
                logStatus("TIME: Heartbeat sincronizado satisfactoriamente.", "TIME");

                // 2. Hero Data
                document.getElementById('event-title').innerText = evento.nombre.toUpperCase();
                document.getElementById('meta-fecha').innerText = evento.fecha;
                document.getElementById('meta-hora').innerText = `${evento.hora} HRS`;
                document.getElementById('meta-lugar').innerText = (evento.ubicacion || 'LOCALIZACIÓN').toUpperCase();
                if (evento.imagen_url) document.getElementById('hero-bg').style.backgroundImage = `url('${evento.imagen_url}')`;

                const content = evento.config_landing?.content || {};

                // 3. Media Hardening (v81 Fix)
                if (content.trailer_url) {
                    document.getElementById('db-trailer-iframe').src = content.trailer_url;
                    logStatus("LINK: Video oficial (TRAILER) inyectado con éxito.", "LINK");
                }
                if (content.playlist_url) {
                    const embedUrl = content.playlist_url.replace('/playlist/', '/embed/playlist/');
                    document.getElementById('db-spotify-embed').innerHTML = `<iframe src="${embedUrl}" width="100%" height="100%" frameBorder="0" allow="encrypted-media" style="border:none;"></iframe>`;
                    logStatus("LINK: Playlist de Spotify inyectada en formato inmersivo.", "LINK");
                }

                // 4. Lineup & Gallery (Circle Restoration)
                document.getElementById('db-poster-img').src = evento.poster_url || evento.imagen_url;
                const lineup = content.dj_lineup || content.lineup || "";
                document.getElementById('db-lineup').innerHTML = (Array.isArray(lineup) ? lineup : lineup.split('\n')).filter(a => a.length > 2).map(a => `
                    <div style="display:flex; align-items:center; gap:1.8rem;"><img src="https://images.unsplash.com/photo-1520813792240-56fc4a3765a7?q=80&w=200" class="artist-avatar"><span style="font-weight:900; text-transform:uppercase;">${a.trim()}</span></div>`).join('');
                if (content.gallery) document.getElementById('db-gallery-grid').innerHTML = content.gallery.map(u => `<img src="${u}" style="width:100%; height:250px; object-fit:cover; border-radius:8px;">`).join('');

                // 5. Sponsors (v81 True Alpha Logic - NO FILTERS)
                try {
                    const forcedAsset = "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSe_O0ax-NJaL7VRZjRusflR1T92YebpyBO4CrO_8T_Lw&s=10";
                    const marks = ["Logo 1", "Logo 2", "Logo 3", "Logo 4"];
                    document.getElementById('db-sponsors-strip').innerHTML = marks.map(m => {
                        return `<img src="${forcedAsset}" class="sponsor-logo" alt="${m}" onload="console.log('%c[TRACE] Sponsor ${m} cargado con Alpha Nativo.', 'color: #e67e22;')">`;
                    }).join('');
                    logStatus("LINK: Sponsors desplegados en modo 'Clean Alpha' (Filtros desactivados).", "LINK");
                } catch (e) { logStatus(`ERR-SPONSORS: ${e.message}`, "ERROR"); }

                // 6. Technical Data & rest
                document.getElementById('db-dress-val').innerText = (content.dresscode || 'NEON').toUpperCase();
                document.getElementById('db-guest-val').innerText = (content.guest_list || '+200');
                document.getElementById('db-aforo-val').innerText = `${evento.aforo_max || 100}`;
                document.getElementById('db-ticket-val').innerText = (content.tickets_info || 'DISPONIBLES').toUpperCase();

                if (content.faq) {
                    const lineas = content.faq.split('\n').filter(l => l.includes('|'));
                    document.getElementById('db-faq-list').innerHTML = lineas.map(l => {
                        const [q, a] = l.split('|');
                        return `<div class="faq-item" onclick="this.classList.toggle('active')"><div class="faq-header"><span>${(q||'Consulta').trim()}</span><div class="faq-icon-circle">+</div></div><div class="faq-answer">${(a||'Contacta al hostal.').trim()}</div></div>`;
                    }).join('');
                }
                const mapUrl = `https://maps.google.com/maps?q=${encodeURIComponent(evento.ubicacion)}&t=&z=15&ie=UTF8&iwloc=&output=embed`;
                document.getElementById('db-mapa-container').innerHTML = `<iframe width="100%" height="100%" src="${mapUrl}" allowfullscreen style="filter: grayscale(1) invert(1) contrast(1.2); border:none;"></iframe>`;

                // Audit Final v81
                Object.keys(SANDBOX_CONFIG).forEach(key => {
                    const elId = (key==='faq'||key==='ubicacion') ? 'modulo-faq-ubicacion' : (['dress_code','guest_list','aforo'].includes(key)) ? 'modulo-info-tecnica' : (key==='playlist'||key==='trailer'||key==='gallery') ? 'modulo-gallery' : (key==='patrocinadores') ? 'modulo-patrocinadores' : `modulo-${key}`;
                    const el = document.getElementById(elId);
                    if (el) { el.style.display = 'block'; logStatus(`INFO: Módulo ${key.toUpperCase()} validado.`, "INFO"); }
                });

            } catch (err) { logStatus(`CRÍTICO: ${err.message}`, "ERROR"); } finally { document.getElementById('loader').style.display = 'none'; }
        }
        window.onload = initEvento;
    </script>
</body>
</html>
