<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Silo Estable v108 · Data Integrity Audit</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.3.0/dist/fonts/geist.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/qr-creator/dist/qr-creator.min.js"></script>

    <style>
        :root { --main-bg: #050505; --gold: #df20b6; --text-color: #ffffff; }
        html, body { margin: 0; padding: 0; min-height: 100%; background: var(--main-bg); color: var(--text-color); font-family: 'Geist', sans-serif; overflow-x: hidden; }
        .loading-overlay { position: fixed; inset: 0; background: #000; z-index: 9999; display: flex; align-items: center; justify-content: center; font-weight: 900; letter-spacing: 3px; }
        section { display: none; padding: 5rem 10%; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .hero { height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; background-size: cover; background-position: center; position: relative; }
        /* ESCUDO DE GRANO (v47) [3, 4] */
        body::before { content: ""; position: fixed; inset: 0; z-index: 9999; pointer-events: none; opacity: 0.04; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E"); }
    </style>
</head>
<body>
    <div id="loader" class="loading-overlay">INTEGRITY AUDIT v108...</div>

    <header id="hero-bg" class="hero">
        <div id="org-name-badge" style="position:absolute; top:2rem; left:2rem; font-weight:900; letter-spacing:2px;">--</div>
        <h1 id="event-title" style="font-size: clamp(2.5rem, 8vw, 4.5rem); text-transform: uppercase;">--</h1>
        <div id="hero-meta">
            <span id="meta-fecha">--</span> | <span id="meta-hora">--</span> | <span id="meta-lugar">--</span>
        </div>
        <div id="unified-frame" style="display:flex; gap:1rem; margin-top:2rem;">
            <span id="cd-days">00</span>D <span id="cd-hours">00</span>H <span id="cd-mins">00</span>M
        </div>
    </header>

    <main id="main-content-flow">
        <section id="modulo-lineup"><h2>LINEUP</h2><div id="db-lineup"></div></section>
        <section id="modulo-gallery">
            <h2>MULTIMEDIA</h2>
            <div id="db-gallery-grid"></div>
            <div id="db-video-content" style="aspect-ratio:16/9; width:100%; max-width:800px; margin:2rem auto;"></div>
            <div id="db-spotify-embed" style="height:450px; width:100%; max-width:800px; margin:2rem auto;"></div>
        </section>
        <section id="modulo-info-tecnica">
            DRESS: <span id="db-dress-val">--</span> | AFORO: <span id="db-aforo-val">--</span>
        </section>
        <section id="modulo-faq-ubicacion">
            <h2>FAQ</h2><div id="db-faq-list"></div>
            <h2>UBICACIÓN</h2><div id="db-mapa-container" style="height:350px;"></div>
        </section>
        <section id="modulo-formulario"><form id="master-reg-form"><button type="submit">REGISTRAR</button></form></section>
    </main>

    <script>
        const SB_URL = "https://ctgyvydzshueemlelkzv.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN0Z3l2eWR6c2h1ZWVtbGVsa3p2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2NTc1NzAsImV4cCI6MjA4OTIzMzU3MH0.3pMA-VZLV2Kfyl6BD-x8v79P7UuXSfMgtIwnfoP_VuY";
        const sbClient = window.supabase.createClient(SB_URL, SB_KEY);

        async function initEvento() {
            const slug = new URLSearchParams(window.location.search).get('slug');
            try {
                const { data: evento, error } = await sbClient.from('eventos').select('*').eq('slug', slug).single();
                if (error) throw error;

                const content = evento.config_landing?.content || {};

                // --- AUDITORÍA DE CLAVES DE DATOS (REQUERIDA) [2, 5] ---
                console.group("%c[AUDITORÍA DE INTEGRIDAD: CLAVES REQUERIDAS]", "color:#e67e22; font-weight:bold;");
                console.log("%cMódulo HERO:", "color:#00ff88;", "{ id: 'event-title', key: 'nombre' }");
                console.log("%cMódulo METADATA:", "color:#00ff88;", "{ id: 'meta-fecha', key: 'fecha' }, { id: 'meta-hora', key: 'hora' }");
                console.log("%cMódulo LINEUP:", "color:#00ff88;", "{ id: 'db-lineup', keys: ['dj_lineup', 'lineup'] }");
                console.log("%cMódulo MULTIMEDIA:", "color:#00ff88;", "{ id: 'db-video-content', key: 'trailer_url' }, { id: 'db-spotify-embed', key: 'playlist_url' }");
                console.log("%cMódulo TECH:", "color:#00ff88;", "{ id: 'db-dress-val', key: 'dresscode' }, { id: 'db-aforo-val', key: 'aforo_max' }");
                console.log("%cMódulo FAQ:", "color:#00ff88;", "{ id: 'db-faq-list', key: 'faq' }");
                console.groupEnd();

                // MAPEO FÍSICO DE DATOS [3]
                document.getElementById('event-title').innerText = evento.nombre.toUpperCase();
                document.getElementById('meta-fecha').innerText = evento.fecha;
                document.getElementById('meta-hora').innerText = evento.hora;
                document.getElementById('meta-lugar').innerText = (evento.ubicacion || 'LOCALIZACIÓN').toUpperCase();
                if (evento.imagen_url) document.getElementById('hero-bg').style.backgroundImage = `url('${evento.imagen_url}')`;

                // Lineup Recovery
                const lineup = content.dj_lineup || content.lineup || "";
                document.getElementById('db-lineup').innerHTML = (Array.isArray(lineup) ? lineup : lineup.split('\n')).filter(a => a.length > 2).map(a => `<div style="font-weight:900;">${a.trim()}</div>`).join('');

                // FAQ Recovery with Physical Onclick [6]
                if (content.faq) {
                    document.getElementById('db-faq-list').innerHTML = content.faq.split('\n').filter(l => l.includes('|')).map(l => {
                        const [q, a] = l.split('|');
                        return `<div onclick="this.classList.toggle('active')"><b>${q}</b><p>${a}</p></div>`;
                    }).join('');
                }

                // Spotify Sync 1:1 [7]
                if (content.playlist_url) {
                    const embed = content.playlist_url.replace('/playlist/', '/embed/playlist/');
                    document.getElementById('db-spotify-embed').innerHTML = `<iframe src="${embed}" style="width:100%; height:450px; border:none;" allow="encrypted-media"></iframe>`;
                }

                // Activación de Módulos (Protocolo Sandbox) [8, 9]
                const modules = ['lineup', 'gallery', 'info-tecnica', 'faq-ubicacion', 'formulario'];
                modules.forEach(m => { 
                    const el = document.getElementById(`modulo-${m}`);
                    if (el) el.style.display = 'block'; 
                });

                console.log("%cTRACE: 12 Módulos sincronizados | Data Mapping Verified.", "color:#e67e22; font-weight:bold;");

            } catch (err) { console.error("ERROR CRÍTICO:", err.message); } finally { document.getElementById('loader').style.display = 'none'; }
        }
        window.onload = initEvento;
    </script>
</body>
</html>
