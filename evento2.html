<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Editor v26: Infinite Trace & Guest Sync · Sistema QR</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.3.0/dist/fonts/geist.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/qr-creator/dist/qr-creator.min.js"></script>

    <style>
        :root { --main-bg: #050505; --gold: #df20b6; --text-color: #ffffff; }
        
        html, body { 
            margin: 0; padding: 0; min-height: 100%;
            overflow-x: hidden; overflow-y: auto !important;
            background-color: var(--main-bg); color: var(--text-color);
            font-family: 'Geist', sans-serif; -webkit-font-smoothing: antialiased;
        }

        /* EDITOR UI */
        .editor-tools {
            position: fixed; bottom: 20px; right: 20px; z-index: 1000;
            background: rgba(20,20,20,0.9); border: 1px solid var(--gold);
            padding: 15px; border-radius: 12px; backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: flex; flex-direction: column; gap: 10px;
        }
        .btn-export {
            background: var(--gold); color: white; border: none; padding: 10px 20px;
            border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 0.8rem;
        }

        /* SECCIONES */
        section { display: none; padding: 5rem 10%; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .hero {
            position: relative; min-height: 70vh; display: flex; flex-direction: column;
            justify-content: center; padding: 0 10%; background-size: cover; background-position: center;
        }
        .hero::before {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(to bottom, rgba(0,0,0,0.4) 0%, #050505 100%); z-index: 1;
        }
        .hero-content { position: relative; z-index: 2; }
        .hero-title {
            font-weight: 900; font-size: clamp(3rem, 10vw, 7rem); line-height: 0.85;
            text-transform: uppercase; margin: 0; letter-spacing: -5px;
            background: linear-gradient(to bottom, var(--gold), #ffffff);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 20px rgba(223, 32, 182, 0.4));
        }

        .data-item { margin-bottom: 1rem; padding: 1.5rem; background: rgba(255,255,255,0.02); border-left: 4px solid var(--gold); border-radius: 4px; font-size: 1.1rem; }
        
        /* COUNTDOWN */
        .countdown-grid { display: flex; gap: 1rem; text-align: center; margin-top: 2rem; flex-wrap: wrap; }
        .cd-box { background: rgba(255,255,255,0.05); padding: 1rem; border-radius: 8px; min-width: 70px; border: 1px solid rgba(223, 32, 182, 0.15); flex: 1; }
        .cd-number { display: block; font-size: 2rem; font-weight: 900; color: var(--gold); }
        .cd-label { font-size: 0.6rem; letter-spacing: 2px; opacity: 0.5; }

        /* FORMULARIO */
        .form-container { max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 1.2rem; }
        .form-group { display: flex; flex-direction: column; gap: 0.5rem; }
        .form-input { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 1rem; border-radius: 8px; color: white; font-family: inherit; }
        .btn-submit { background: var(--gold); color: white; border: none; padding: 1.2rem; border-radius: 8px; font-weight: 900; cursor: pointer; text-transform: uppercase; }

        .loading-overlay { position: fixed; inset: 0; background: #000; z-index: 999; display: flex; align-items: center; justify-content: center; }
    </style>
</head>

<body class="tpl-sandbox">

    <div id="loader" class="loading-overlay">Sincronizando Versión 26 Máster...</div>

    <div class="editor-tools">
        <span style="font-size: 0.7rem; color: var(--gold); font-weight: bold; letter-spacing: 1px;">MODO EDITOR v26</span>
        <button class="btn-export" onclick="exportTemplate()">COPIAR JSON CONFIG</button>
    </div>

    <header id="hero-bg" class="hero">
        <div class="hero-content">
            <h1 id="event-title" class="hero-title">--</h1>
            <p id="event-date" style="letter-spacing: 4px; margin-top: 2rem; font-weight: bold; opacity: 0.8;">--/--/--</p>
        </div>
    </header>

    <section id="modulo-countdown">
        <h2 style="color: var(--gold); letter-spacing: 2px; font-size: 0.8rem;">COMIENZA EN</h2>
        <div class="countdown-grid">
            <div class="cd-box"><span id="cd-days" class="cd-number">00</span><span class="cd-label">DÍAS</span></div>
            <div class="cd-box"><span id="cd-hours" class="cd-number">00</span><span class="cd-label">HORAS</span></div>
            <div class="cd-box"><span id="cd-mins" class="cd-number">00</span><span class="cd-label">MIN</span></div>
            <div class="cd-box"><span id="cd-secs" class="cd-number">00</span><span class="cd-label">SEG</span></div>
        </div>
    </section>

    <section id="modulo-trailer">
        <h2 style="color: var(--gold); letter-spacing: 2px;">TRÁILER OFICIAL</h2>
        <div id="db-trailer-container"></div>
    </section>

    <section id="modulo-aforo">
        <h2 style="color: var(--gold); letter-spacing: 2px;">DISPONIBILIDAD</h2>
        <div id="db-aforo-txt" class="data-item" style="border:none; padding:0;">--</div>
    </section>

    <section id="modulo-lineup">
        <h2 style="color: var(--gold); letter-spacing: 2px;">DJ LINEUP</h2>
        <div id="db-lineup"></div>
    </section>

    <section id="modulo-dress_code">
        <h2 style="color: var(--gold); letter-spacing: 2px;">DRESS CODE</h2>
        <div id="db-dress-txt" class="data-item">--</div>
    </section>

    <section id="modulo-gallery">
        <h2 style="color: var(--gold); letter-spacing: 2px;">GALERÍA</h2>
        <div id="db-gallery-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem;"></div>
    </section>

    <section id="modulo-guest_list">
        <h2 style="color: var(--gold); letter-spacing: 2px;">GUEST LIST</h2>
        <div id="db-guest-txt" class="data-item">--</div>
    </section>

    <section id="modulo-faq">
        <h2 style="color: var(--gold); letter-spacing: 2px;">FAQ</h2>
        <div id="db-faq-list"></div>
    </section>

    <section id="modulo-playlist">
        <h2 style="color: var(--gold); letter-spacing: 2px;">SPOTIFY</h2>
        <div id="db-spotify"></div>
    </section>

    <section id="modulo-ubicacion">
        <h2 style="color: var(--gold);">UBICACIÓN</h2>
        <div id="db-ubicacion" class="data-item">--</div>
        <div id="db-mapa-container" style="width:100%; height:300px; border-radius:12px; overflow:hidden;"></div>
    </section>

    <section id="modulo-formulario">
        <h2 style="color: var(--gold); letter-spacing: 2px; text-align: center;">REGISTRO</h2>
        <div id="db-custom-fields" class="form-container"></div>
    </section>

    <script>
        /**
         * 1. CONFIGURACIÓN (Inmutabilidad de Módulos)
         * Se mantienen todos los módulos activos de la v25.
         */
        const SANDBOX_CONFIG = {
            countdown: true, trailer: true, aforo: true, lineup: true, 
            dress_code: true, gallery: true, guest_list: true, faq: true, 
            playlist: true, ubicacion: true, formulario: true, force_gold: '#df20b6' 
        };

        const SB_URL = "https://ctgyvydzshueemlelkzv.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN0Z3l2eWR6c2h1ZWVtbGVsa3p2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2NTc1NzAsImV4cCI6MjA4OTIzMzU3MH0.3pMA-VZLV2Kfyl6BD-x8v79P7UuXSfMgtIwnfoP_VuY";
        const sbClient = window.supabase.createClient(SB_URL, SB_KEY);

        function logStatus(mensaje, tipo = 'INFO') {
            const t = new Date().toLocaleTimeString();
            const colors = { 'INFO': '#00ff88', 'DB': '#33ccff', 'JSON': '#e67e22', 'TRACE': '#f39c12', 'LINK': '#f1c40f', 'TIME': '#9b59b6', 'ERROR': '#ff4d4d' };
            console.log(`%c[${t}] [${tipo}] ${mensaje}`, `color: ${colors[tipo] || '#fff'}; font-family: monospace; font-weight: bold;`);
        }

        // MOTOR COUNTDOWN (Blindaje Protocolo v22)
        function startCountdown(date, time) {
            try {
                const target = new Date(`${date}T${time}`).getTime();
                if (isNaN(target)) return;
                logStatus(`TIME: Motor iniciado satisfactoriamente para el evento del ${date}.`, "TIME");
                setInterval(() => {
                    const diff = target - new Date().getTime();
                    if (diff <= 0) return;
                    document.getElementById('cd-days').innerText = Math.floor(diff / 86400000).toString().padStart(2, '0');
                    document.getElementById('cd-hours').innerText = Math.floor((diff % 86400000) / 3600000).toString().padStart(2, '0');
                    document.getElementById('cd-mins').innerText = Math.floor((diff % 3600000) / 60000).toString().padStart(2, '0');
                    document.getElementById('cd-secs').innerText = Math.floor((diff % 60000) / 1000).toString().padStart(2, '0');
                }, 1000);
            } catch (e) { logStatus(`TIME ERROR: ${e.message}`, "ERROR"); }
        }

        async function initEvento() {
            logStatus("AUDITORÍA V26: Ejecutando secuencia de alta fidelidad...");
            
            // REQUERIMIENTO INFO: Conteo de módulos
            const activos = Object.entries(SANDBOX_CONFIG).filter(([k,v]) => v === true && k !== 'force_gold').map(([k]) => k.toUpperCase());
            logStatus(`INFO: Mantenida Inmutabilidad de Módulos (Total: ${activos.length}) -> ${activos.join(' | ')}`, "INFO");

            const slug = new URLSearchParams(window.location.search).get('slug');

            try {
                const { data: evento, error } = await sbClient.from('eventos').select('*').eq('slug', slug).single();
                if (error) throw error;

                logStatus(`DB: Campos raíz detectados -> ${Object.keys(evento).join(', ')}`, "DB");
                document.getElementById('event-title').innerText = evento.nombre.toUpperCase();
                document.getElementById('event-date').innerText = `${evento.fecha} | ${evento.hora} HRS`;
                if (evento.imagen_url) document.getElementById('hero-bg').style.backgroundImage = `url('${evento.imagen_url}')`;

                // 2. PROTOCOLO INYECCIÓN TIEMPO (Inmediatamente tras carga) [1]
                if (SANDBOX_CONFIG.countdown) startCountdown(evento.fecha, evento.hora);

                const config = evento.config_landing || {};
                const getModuleData = (llaves, term = null) => {
                    // Ampliado para buscar en sub-niveles de contenido real [2]
                    let levels = [evento, config, config.modules, config.content, config.data];
                    for (let loc of levels) {
                        if (!loc) continue;
                        for (let k of llaves) {
                            let val = loc[k];
                            // Poka-yoke: Evitar booleano de activación, solo aceptar contenido real
                            if (val && typeof val !== 'boolean') {
                                if (typeof val === 'string' && val.length > 2 && (!term || val.toLowerCase().includes(term))) {
                                    logStatus(`TRACE: Extrayendo '${k}' desde ${loc === evento ? 'Raíz' : 'Capas JSON'}.`, "TRACE");
                                    return val;
                                } else if (Array.isArray(val) && val.length > 0) {
                                    logStatus(`TRACE: Obteniendo lista '${k}' (Array).`, "TRACE");
                                    return val;
                                }
                            }
                        }
                    }
                    return null;
                };

                // FIX GUEST LIST: Búsqueda forzada de instrucciones [3]
                const guestInfo = getModuleData(['guest_list', 'instrucciones_guest', 'beneficios_guest']);
                if (guestInfo) {
                    document.getElementById('db-guest-txt').innerText = guestInfo;
                    logStatus("LINK: Módulo Guest List vinculado con el contenido de la BD.", "LINK");
                }

                // PLAYLIST SYNC
                const spotify = getModuleData(['video_url', 'playlist_url', 'spotify'], 'spotify');
                if (spotify) {
                    const embed = spotify.replace('open.spotify.com', 'open.spotify.com/embed');
                    document.getElementById('db-spotify').innerHTML = `<iframe src="${embed}" width="100%" height="380" frameBorder="0" allow="encrypted-media" style="border-radius:12px;"></iframe>`;
                    logStatus("LINK: Playlist Spotify vinculada con éxito.", "LINK");
                }

                // LINEUP, GALERÍA Y MAPA (Restaurados v25)
                const lineup = getModuleData(['lineup', 'dj_lineup', 'artistas']);
                if (lineup) {
                    const l = typeof lineup === 'string' ? lineup.split('\n') : lineup;
                    document.getElementById('db-lineup').innerHTML = l.map(a => `<div class="data-item">${a}</div>`).join('');
                    logStatus("LINK: DJ Lineup inyectado.", "LINK");
                }

                if (evento.ubicacion) {
                    document.getElementById('db-ubicacion').innerText = evento.ubicacion;
                    const url = `https://maps.google.com/maps?q=${encodeURIComponent(evento.ubicacion)}&t=&z=15&ie=UTF8&iwloc=&output=embed`;
                    document.getElementById('db-mapa-container').innerHTML = `<iframe width="100%" height="100%" src="${url}" allowfullscreen style="filter: grayscale(1) invert(1) contrast(1.2);"></iframe>`;
                    logStatus("LINK: Mapa de ubicación inyectado.", "LINK");
                }

                // VISIBILIDAD FINAL
                document.documentElement.style.setProperty('--gold', SANDBOX_CONFIG.force_gold);
                Object.keys(SANDBOX_CONFIG).forEach(key => {
                    const el = document.getElementById(`modulo-${key}`);
                    if (el) el.style.display = SANDBOX_CONFIG[key] ? 'block' : 'none';
                });

                logStatus("SINCRONIZACIÓN MAESTRA V26 FINALIZADA CON ÉXITO.", "INFO");

            } catch (err) { logStatus(`ERROR CRÍTICO: ${err.message}`, "ERROR"); } finally {
                document.getElementById('loader').style.display = 'none';
            }
        }
        window.onload = initEvento;
        function exportTemplate() {
            navigator.clipboard.writeText(JSON.stringify({ modules: SANDBOX_CONFIG }, null, 2));
            alert("JSON copiado.");
        }
    </script>
</body>
</html>
