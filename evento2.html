<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sandbox v5: Deep Sync · Sistema QR</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.3.0/dist/fonts/geist.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/qr-creator/dist/qr-creator.min.js"></script>

    <style>
        :root { --main-bg: #050505; --gold: #ff007f; --text-color: #ffffff; }
        body { margin: 0; background-color: var(--main-bg); color: var(--text-color); font-family: 'Geist', sans-serif; -webkit-font-smoothing: antialiased; }
        section { display: none; padding: 5rem 10%; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .loading-overlay { position: fixed; inset: 0; background: #000; z-index: 999; display: flex; align-items: center; justify-content: center; }
        body.tpl-sandbox { background: radial-gradient(circle at top right, #1a001a 0%, #050505 100%); }
        .hero-title { font-weight: 900; font-size: clamp(3rem, 10vw, 7rem); line-height: 0.85; text-transform: uppercase; background: linear-gradient(to bottom, var(--gold), #ffffff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 0 20px rgba(255, 0, 127, 0.4)); }
        .data-item { margin-bottom: 1rem; padding: 1.5rem; background: rgba(255,255,255,0.02); border-left: 4px solid var(--gold); border-radius: 4px; font-size: 1.2rem; }
    </style>
</head>

<body class="tpl-sandbox">

    <div id="loader" class="loading-overlay">Forzando sincronización profunda...</div>

    <header class="hero" style="padding: 10% 10% 2% 10%;">
        <h1 id="event-title" class="hero-title">--</h1>
        <p id="event-date" style="letter-spacing: 3px; opacity: 0.5; font-weight: bold;">--</p>
    </header>

    <section id="modulo-sinopsis">
        <h2 style="color: var(--gold); letter-spacing: 2px;">SINOPSIS</h2>
        <div id="db-descripcion" style="line-height: 1.6; opacity: 0.8; font-size: 1.1rem;">--</div>
    </section>

    <section id="modulo-lineup">
        <h2 style="color: var(--gold); letter-spacing: 2px;">DJ LINEUP</h2>
        <div id="db-lineup"></div>
    </section>

    <section id="modulo-playlist">
        <h2 style="color: var(--gold); letter-spacing: 2px;">PLAYLIST OFICIAL</h2>
        <div id="db-spotify-area"></div>
    </section>

    <section id="modulo-ubicacion">
        <h2 style="color: var(--gold); letter-spacing: 2px;">UBICACIÓN</h2>
        <div id="db-ubicacion" class="data-item">--</div>
    </section>

    <script>
        /**
         * CONFIGURACIÓN SANDBOX
         */
        const SANDBOX_CONFIG = {
            sinopsis: true,
            lineup: true,
            playlist: true,
            ubicacion: true,
            faq: true,
            force_gold: '#ff007f'
        };

        const SB_URL = "https://ctgyvydzshueemlelkzv.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN0Z3l2eWR6c2h1ZWVtbGVsa3p2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2NTc1NzAsImV4cCI6MjA4OTIzMzU3MH0.3pMA-VZLV2Kfyl6BD-x8v79P7UuXSfMgtIwnfoP_VuY";

        const sbClient = window.supabase.createClient(SB_URL, SB_KEY);

        function logStatus(mensaje, tipo = 'INFO') {
            const t = new Date().toLocaleTimeString();
            const colors = { 'INFO': '#00ff88', 'DB': '#33ccff', 'LINK': '#f7b731', 'ERROR': '#ff4d4d' };
            console.log(`%c[${t}] [${tipo}] ${mensaje}`, `color: ${colors[tipo]}; font-family: monospace; font-weight: bold;`);
        }

        async function initEvento() {
            logStatus("Iniciando Deep Sync con columnas explícitas...");
            const slug = new URLSearchParams(window.location.search).get('slug');

            try {
                // CONSULTA EXPLÍCITA: Pedimos las columnas exactas para evitar fallos de RLS o Cache [6]
                const { data: evento, error } = await sbClient
                    .from('eventos')
                    .select('id, nombre, fecha, hora, descripcion, lineup, video_url, ubicacion, faq, aforo_max')
                    .eq('slug', slug)
                    .single();

                if (error) throw error;

                // LOG DE VERIFICACIÓN DE CRUDO
                logStatus(`Estructura recibida de ${evento.nombre}: ${Object.keys(evento).join(', ')}`, "DB");

                // VINCULACIÓN DE DATOS
                document.getElementById('event-title').innerText = evento.nombre.toUpperCase();
                document.getElementById('event-date').innerText = `${evento.fecha} | ${evento.hora} HRS`;

                // 1. Lineup: Procesar saltos de línea [5]
                if (evento.lineup) {
                    const artistas = evento.lineup.split('\n').filter(a => a.trim() !== "");
                    document.getElementById('db-lineup').innerHTML = artistas.map(a => `<div class="data-item">${a}</div>`).join('');
                    logStatus(`VINCULADO: ${artistas.length} artistas en Lineup.`, "LINK");
                }

                // 2. Playlist/Spotify: Detectar si es link de Spotify en el campo video_url [6]
                if (evento.video_url && evento.video_url.includes('spotify')) {
                    const embedUrl = evento.video_url.replace('open.spotify.com', 'open.spotify.com/embed');
                    document.getElementById('db-spotify-area').innerHTML = `<iframe src="${embedUrl}" width="100%" height="380" frameBorder="0" allow="encrypted-media" style="border-radius:12px;"></iframe>`;
                    logStatus("VINCULADO: Reproductor de Spotify detectado en video_url.", "LINK");
                }

                // 3. Otros campos
                document.getElementById('db-descripcion').innerHTML = evento.descripcion || 'Sin descripción.';
                document.getElementById('db-ubicacion').innerText = evento.ubicacion || 'Por definir.';

                // Aplicar visibilidad y colores
                document.documentElement.style.setProperty('--gold', SANDBOX_CONFIG.force_gold);
                Object.keys(SANDBOX_CONFIG).forEach(key => {
                    const el = document.getElementById(`modulo-${key}`);
                    if (el) el.style.display = SANDBOX_CONFIG[key] ? 'block' : 'none';
                });

                logStatus("SINCRONIZACIÓN COMPLETADA EXITOSAMENTE.", "INFO");

            } catch (err) {
                logStatus(`FALLO CRÍTICO: ${err.message}`, "ERROR");
            } finally {
                document.getElementById('loader').style.display = 'none';
            }
        }

        window.onload = initEvento;
    </script>
</body>
</html>
