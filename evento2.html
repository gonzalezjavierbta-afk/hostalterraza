<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Editor v50: Poster Fallback & Audit Shield · Sistema QR</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.3.0/dist/fonts/geist.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/qr-creator/dist/qr-creator.min.js"></script>

    <style>
        :root { 
            --main-bg: #050505; 
            --gold: #df20b6; 
            --text-color: #ffffff;
            --glass-lite: rgba(255, 255, 255, 0.03);
        }

        html, body { 
            margin: 0; padding: 0; min-height: 100%; 
            background-color: var(--main-bg); color: var(--text-color); 
            font-family: 'Geist', sans-serif; -webkit-font-smoothing: antialiased; 
        }

        /* ESCUDO DE GRANO (Fix 404): Ruido generado por CSS/SVG Inline */
        body::before {
            content: ""; position: fixed; inset: 0; z-index: 9999; pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            opacity: 0.04; contrast: 130%;
        }
        
        section { display: none; padding: 6rem 10%; border-bottom: 1px solid rgba(255,255,255,0.05); }
        h2 { color: var(--gold); letter-spacing: 4px; text-transform: uppercase; font-size: 0.7rem; font-weight: 900; margin-bottom: 4rem; text-align: center; }

        /* HERO STABLE */
        .hero { 
            position: relative; height: 100vh; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; padding: 2rem; background-size: cover; background-position: center; 
            box-sizing: border-box; text-align: center;
        }
        .hero::before { content: ''; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, rgba(5,5,5,0.3) 50%, rgba(5,5,5,1) 100%); z-index: 1; }
        .org-badge { position: absolute; top: 2rem; left: 2rem; z-index: 10; color: white; font-weight: 900; font-size: 1.1rem; letter-spacing: 2px; text-transform: uppercase; }
        .hero-title { font-weight: 900; font-size: clamp(2rem, 8vw, 4.5rem); line-height: 1; text-transform: uppercase; margin: 0; letter-spacing: -3px; z-index: 2; position: relative; }
        .aforo-box { display: inline-block; margin-top: 1.5rem; padding: 0.8rem 1.5rem; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15); border-radius: 4px; font-size: 0.75rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; z-index: 2; position: relative; }

        .unified-countdown-frame {
            position: relative; z-index: 2; margin-top: 2.5rem; padding: 1.5rem 2rem; background: var(--glass-lite); border-radius: 12px;
            border: 1px solid var(--gold); backdrop-filter: blur(6px); display: flex; justify-content: center; align-items: center;
            box-shadow: 0 0 20px rgba(223, 32, 182, 0.15); width: fit-content;
        }
        .cd-block { padding: 0 1.2rem; border-right: 1px solid rgba(255,255,255,0.1); text-align: center; }
        .cd-block:last-child { border-right: none; }
        .cd-v { display: block; font-size: 2rem; font-weight: 900; }
        .cd-l { font-size: 0.5rem; letter-spacing: 2px; opacity: 0.4; text-transform: uppercase; margin-top: 0.4rem; font-weight: 900; }

        /* LINEUP DUAL COLUMN (v50 Fix) */
        .lineup-container { 
            display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 4rem; align-items: start; 
            max-width: 1000px; margin: 0 auto;
        }
        .lineup-poster { width: 100%; border-radius: 12px; border: 1px solid rgba(223, 32, 182, 0.3); box-shadow: 0 0 40px rgba(223, 32, 182, 0.15); }
        .artist-list { display: flex; flex-direction: column; gap: 1.8rem; }
        .artist-item { display: flex; align-items: center; gap: 1.5rem; padding: 1rem; background: var(--glass-lite); border-radius: 12px; border: 1px solid rgba(255,255,255,0.03); }
        .artist-avatar { width: 55px; height: 55px; border-radius: 50%; object-fit: cover; border: 2px solid var(--gold); }
        .artist-name { font-weight: 900; font-size: 1.1rem; text-transform: uppercase; letter-spacing: 1px; }

        .data-item { margin-bottom: 1.5rem; padding: 2rem; background: var(--glass-lite); border: 1px solid rgba(255,255,255,0.05); border-radius: 12px; backdrop-filter: blur(5px); }
        .form-input { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 1.2rem; border-radius: 10px; color: white; width: 100%; box-sizing: border-box; }
        .btn-submit { background: var(--gold); color: white; border: none; padding: 1.4rem; border-radius: 12px; font-weight: 900; cursor: pointer; width: 100%; text-transform: uppercase; letter-spacing: 2px; }
        .loading-overlay { position: fixed; inset: 0; background: #000; z-index: 999; display: flex; align-items: center; justify-content: center; font-weight: 900; letter-spacing: 2px; }
    </style>
</head>

<body class="tpl-sandbox">

    <div id="loader" class="loading-overlay">SYNCHRONIZING VERSION 50...</div>

    <header id="hero-bg" class="hero">
        <div id="org-name-badge" class="org-badge">--</div>
        <div class="hero-content">
            <h1 id="event-title" class="hero-title">--</h1>
            <div id="hero-aforo-txt" class="aforo-box">...</div>
            <div id="unified-frame" class="unified-countdown-frame">
                <div class="cd-block"><span id="cd-days" class="cd-v">00</span><span class="cd-l">Días</span></div>
                <div class="cd-block"><span id="cd-hours" class="cd-v">00</span><span class="cd-l">Horas</span></div>
                <div class="cd-block"><span id="cd-mins" class="cd-v">00</span><span class="cd-l">Min</span></div>
                <div class="cd-block"><span id="cd-secs" class="cd-v">00</span><span class="cd-l">Seg</span></div>
            </div>
        </div>
    </header>

    <main id="main-content-flow">
        <section id="modulo-countdown" style="display:none;"></section>
        <section id="modulo-aforo" style="display:none;"></section>
        <section id="modulo-trailer"><h2>EXPERIENCIA VISUAL</h2><div id="db-trailer-container"></div></section>

        <!-- MÓDULO LINEUP (v50: DUAL COLUMN & POSTER FALLBACK) -->
        <section id="modulo-lineup">
            <h2>ARTISTAS INVITADOS</h2>
            <div class="lineup-container">
                <div class="lineup-col">
                    <img id="db-poster-img" src="" class="lineup-poster" alt="Evento Afiche">
                </div>
                <div id="db-lineup" class="artist-list"></div>
            </div>
        </section>

        <section id="modulo-dress_code"><h2>VESTIMENTA</h2><div id="db-dress-txt" class="data-item" style="text-align:center;">--</div></section>
        <section id="modulo-gallery"><h2>GALERÍA</h2><div id="db-gallery-grid" style="display:grid; grid-template-columns:repeat(auto-fit, minmax(250px, 1fr)); gap:1.5rem;"></div></section>
        <section id="modulo-guest_list"><h2>GUEST LIST</h2><div id="db-guest-txt" class="data-item">--</div></section>
        <section id="modulo-faq"><h2>DUDAS FRECUENTES</h2><div id="db-faq-list"></div></section>
        <section id="modulo-playlist"><h2>BANDA SONORA</h2><div id="db-spotify"></div></section>
        <section id="modulo-ubicacion"><h2>LOCALIZACIÓN</h2><div id="db-mapa-container" style="width:100%; height:450px; border-radius:15px; overflow:hidden; border:1px solid rgba(255,255,255,0.1);"></div></section>

        <section id="modulo-formulario">
            <h2>RESERVA TU LUGAR</h2>
            <form id="master-reg-form" style="max-width:600px; margin:0 auto; display:flex; flex-direction:column; gap:1.5rem;">
                <div><input type="text" class="form-input" placeholder="Nombre completo *" required></div>
                <div><input type="text" class="form-input" placeholder="Cédula *" required></div>
                <div style="display:flex; gap:0.5rem;"><select class="form-input" style="width:110px;"><option value="+57">🇨🇴 +57</option></select><input type="tel" class="form-input" placeholder="WhatsApp *" required></div>
                <div id="db-dynamic-fields"></div>
                <button type="submit" class="btn-submit">CONFIRMAR ASISTENCIA →</button>
            </form>
        </section>
    </main>

    <script>
        const SANDBOX_CONFIG = {
            countdown: true, trailer: true, aforo: true, lineup: true, dress_code: true, 
            gallery: true, guest_list: true, faq: true, playlist: true, ubicacion: true, 
            formulario: true, force_gold: '#df20b6' 
        };

        const SB_URL = "https://ctgyvydzshueemlelkzv.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN0Z3l2eWR6c2h1ZWVtbGVsa3p2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2NTc1NzAsImV4cCI6MjA4OTIzMzU3MH0.3pMA-VZLV2Kfyl6BD-x8v79P7UuXSfMgtIwnfoP_VuY";
        const sbClient = window.supabase.createClient(SB_URL, SB_KEY);

        function logStatus(mensaje, tipo = 'INFO') {
            const colors = { 'INFO': '#00ff88', 'LINK': '#f1c40f', 'TIME': '#9b59b6', 'ERROR': '#ff4d4d' };
            console.log(`%c[${new Date().toLocaleTimeString()}] [${tipo}] ${mensaje}`, `color: ${colors[tipo] || '#fff'}; font-weight: bold;`);
        }

        function startCountdown(date, time) {
            try {
                const target = new Date(`${date}T${time}`).getTime();
                if (isNaN(target)) return;
                logStatus(`TIME: Latido v50 sincronizado para el ocaso del ${date}.`, "TIME");
                setInterval(() => {
                    const diff = target - new Date().getTime();
                    if (diff <= 0) return;
                    document.getElementById('cd-days').innerText = Math.floor(diff / 86400000).toString().padStart(2, '0');
                    document.getElementById('cd-hours').innerText = Math.floor((diff % 86400000) / 3600000).toString().padStart(2, '0');
                    document.getElementById('cd-mins').innerText = Math.floor((diff % 3600000) / 60000).toString().padStart(2, '0');
                    document.getElementById('cd-secs').innerText = Math.floor((diff % 60000) / 1000).toString().padStart(2, '0');
                }, 1000);
            } catch (e) { logStatus(`ERROR TIME: ${e.message}`, "ERROR"); }
        }

        async function initEvento() {
            logStatus("AUDITORÍA V50: Iniciando Blindaje de Auditoría y Fallback de Poster...");
            const slug = new URLSearchParams(window.location.search).get('slug');

            try {
                const { data: evento, error } = await sbClient.from('eventos').select('*').eq('slug', slug).single();
                if (error) throw error;

                // 1. PROTOCOLO LATIDO (Heartbeat)
                if (SANDBOX_CONFIG.countdown) startCountdown(evento.fecha, evento.hora);

                const { data: org } = await sbClient.from('organizaciones').select('nombre').eq('id', evento.org_id).single();
                if (org) document.getElementById('org-name-badge').innerText = org.nombre.toUpperCase();

                document.getElementById('event-title').innerText = evento.nombre.toUpperCase();
                if (evento.aforo_max) document.getElementById('hero-aforo-txt').innerText = `${evento.aforo_max} CUPOS DISPONIBLES`;
                if (evento.imagen_url) document.getElementById('hero-bg').style.backgroundImage = `url('${evento.imagen_url}')`;

                const content = evento.config_landing?.content || {};

                // 2. INYECCIÓN LINEUP & POSTER FALLBACK (v50 Ref)
                const posterImg = document.getElementById('db-poster-img');
                const defaultPoster = "https://images.unsplash.com/photo-1533174072545-7a4b6ad7a6c3?q=80&w=1000&auto=format&fit=crop"; // Estética P6 Sunset
                posterImg.src = evento.poster_url || evento.imagen_url || defaultPoster;
                logStatus("LINK: Poster inyectado (con fallback P6).", "LINK");

                const lineup = content.dj_lineup || content.lineup;
                if (lineup) {
                    const l = Array.isArray(lineup) ? lineup : lineup.split('\n');
                    document.getElementById('db-lineup').innerHTML = l.map(a => `
                        <div class="artist-item">
                            <img src="https://ui-avatars.com/api/?name=${encodeURIComponent(a)}&background=df20b6&color=fff&bold=true" class="artist-avatar">
                            <span class="artist-name">${a}</span>
                        </div>`).join('');
                    logStatus("LINK: Lista de artistas inyectada.", "LINK");
                }

                // 3. RESTO DE MÓDULOS (Blindaje v50)
                if (content.dresscode) document.getElementById('db-dress-txt').innerText = content.dresscode.toUpperCase();
                if (content.guest_list) document.getElementById('db-guest-txt').innerText = content.guest_list;
                if (content.gallery) document.getElementById('db-gallery-grid').innerHTML = content.gallery.map(u => `<img src="${u}" style="width:100%; height:300px; object-fit:cover; border-radius:12px;">`).join('');

                if (content.faq && typeof content.faq === 'string') {
                    const lineas = content.faq.split('\n').filter(l => l.includes('|'));
                    document.getElementById('db-faq-list').innerHTML = lineas.map(l => {
                        const [q, a] = l.split('|');
                        return `<div class="data-item"><b style="color:var(--gold); display:block; margin-bottom:1rem;">${q.trim()}</b><p style="opacity:0.7; margin:0;">${a.trim()}</p></div>`;
                    }).join('');
                }

                if (content.playlist_url) {
                    const embed = content.playlist_url.replace('open.spotify.com', 'open.spotify.com/embed');
                    document.getElementById('db-spotify').innerHTML = `<iframe src="${embed}" width="100%" height="380" frameBorder="0" allow="encrypted-media" style="border-radius:15px; border:none; filter: invert(1) hue-rotate(180deg) brightness(0.8);"></iframe>`;
                    logStatus("LINK: Playlist inyectada.", "LINK");
                }

                if (evento.ubicacion) {
                    const url = `https://maps.google.com/maps?q=${encodeURIComponent(evento.ubicacion)}&t=&z=15&ie=UTF8&iwloc=&output=embed`;
                    document.getElementById('db-mapa-container').innerHTML = `<iframe width="100%" height="100%" src="${url}" allowfullscreen style="filter: grayscale(1) invert(1) contrast(1.2); border:none;"></iframe>`;
                }

                if (evento.form_campos) {
                    const fields = evento.form_campos || {};
                    let html = '';
                    if (fields.email) html += `<div><input type="email" class="form-input" placeholder="Email de contacto"></div>`;
                    if (fields.edad) html += `<div><input type="number" class="form-input" placeholder="Edad"></div>`;
                    document.getElementById('db-dynamic-fields').innerHTML = html;
                    logStatus("LINK: Formulario dinámico inyectado.", "LINK");
                }

                // --- 4. AUDITORÍA DE ESCUDO (v50 Shield) ---
                logStatus("--- INICIANDO AUDITORÍA DE ESCUDO v50 ---", "INFO");
                Object.keys(SANDBOX_CONFIG).forEach(key => {
                    if (key === 'force_gold' || key === 'trailer') return;
                    const el = document.getElementById(`modulo-${key}`);
                    if (!el) return;

                    const container = el.querySelector('[id*="db-"]') || el.querySelector('form') || document.getElementById('unified-frame');
                    const hasInput = el.querySelectorAll('input').length > 0;
                    const hasIframe = el.querySelectorAll('iframe').length > 0;
                    const hasImg = el.querySelectorAll('img').length > 0;
                    const contentTxt = container ? container.innerText.replace(/\s/g, '').replace('--', '') : '';
                    
                    // SHIELD FIX: Playlist ahora es válido si tiene iframe. Formulario es válido si tiene inputs físicos.
                    let isValid = (key === 'formulario') ? hasInput : (contentTxt.length >= 3 || hasIframe || hasImg);

                    if (SANDBOX_CONFIG[key] && isValid) {
                        logStatus(`INFO: Módulo ${key.toUpperCase()} verificado.`, "INFO");
                        el.style.display = 'block';
                    } else if (SANDBOX_CONFIG[key]) {
                        logStatus(`ERROR: Módulo ${key.toUpperCase()} falló validación de contenido.`, "ERROR");
                    }
                });

                logStatus("SINCRONIZACIÓN MAESTRA V50 FINALIZADA.", "INFO");

            } catch (err) { logStatus(`CRÍTICO: ${err.message}`, "ERROR"); } finally { document.getElementById('loader').style.display = 'none'; }
        }
        window.onload = initEvento;
    </script>
</body>
</html>
