<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Editor v54: Data Cards Grid · Sistema QR</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.3.0/dist/fonts/geist.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/qr-creator/dist/qr-creator.min.js"></script>

    <style>
        :root { 
            --main-bg: #050505; 
            --gold: #df20b6; 
            --text-color: #ffffff;
            --glass-lite: rgba(255, 255, 255, 0.03);
            --border-glow: rgba(223, 32, 182, 0.2);
        }

        html, body { 
            margin: 0; padding: 0; min-height: 100%; 
            background-color: var(--main-bg); color: var(--text-color); 
            font-family: 'Geist', sans-serif; -webkit-font-smoothing: antialiased; 
        }

        /* ESCUDO DE GRANO (v47 Fix) */
        body::before {
            content: ""; position: fixed; inset: 0; z-index: 9999; pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            opacity: 0.04; contrast: 130%;
        }
        
        section { display: none; padding: 6rem 10%; border-bottom: 1px solid rgba(255,255,255,0.05); }
        h2 { color: var(--gold); letter-spacing: 4px; text-transform: uppercase; font-size: 0.75rem; font-weight: 900; margin-bottom: 4rem; text-align: center; }

        /* HERO & COUNTDOWN (v52 Stable) */
        .hero { position: relative; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 2rem; background-size: cover; background-position: center; box-sizing: border-box; text-align: center; }
        .hero::before { content: ''; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, rgba(5,5,5,0.3) 50%, rgba(5,5,5,1) 100%); z-index: 1; }
        .org-badge { position: absolute; top: 2rem; left: 2rem; z-index: 10; font-weight: 900; font-size: 1.1rem; letter-spacing: 2px; text-transform: uppercase; }
        .hero-title { font-weight: 900; font-size: clamp(2rem, 8vw, 4.5rem); text-transform: uppercase; margin: 0; letter-spacing: -3px; z-index: 2; position: relative; }
        .hero-meta { display: flex; flex-wrap: wrap; justify-content: center; gap: 2rem; margin-top: 2rem; font-weight: 800; text-transform: uppercase; font-size: 0.85rem; letter-spacing: 2px; z-index: 2; position: relative; opacity: 0.9; }
        .meta-icon { width: 14px; height: 14px; fill: var(--gold); vertical-align: middle; margin-right: 0.4rem; }
        .aforo-box-hero { display: inline-block; margin-top: 1.5rem; padding: 0.8rem 1.5rem; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15); border-radius: 4px; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; z-index: 2; position: relative; }

        .unified-countdown-frame {
            position: relative; z-index: 2; margin: 3rem auto 0; padding: 1.5rem 2.5rem; background: var(--glass-lite); border-radius: 12px;
            border: 1px solid var(--gold); backdrop-filter: blur(8px); display: flex; justify-content: center; align-items: center; width: fit-content;
        }
        .cd-block { padding: 0 1.5rem; border-right: 1px solid rgba(255,255,255,0.1); text-align: center; }
        .cd-block:last-child { border-right: none; }
        .cd-v { display: block; font-size: 2.2rem; font-weight: 900; }
        .cd-l { font-size: 0.5rem; letter-spacing: 3px; opacity: 0.4; text-transform: uppercase; margin-top: 0.5rem; }

        /* DATA CARDS v54 (Ref: referencia-datos.jpg) */
        .data-cards-container { 
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.2rem; 
            max-width: 1000px; margin: 0 auto; 
        }
        .data-card { 
            background: var(--glass-lite); border: 1px solid rgba(255,255,255,0.1); 
            border-radius: 10px; padding: 2rem 1rem; text-align: center; 
            backdrop-filter: blur(10px); transition: 0.3s;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }
        .data-card:hover { border-color: var(--gold); box-shadow: 0 0 25px var(--border-glow); }
        .card-label { color: var(--gold); font-size: 0.65rem; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 1rem; display: block; }
        .card-val { display: block; font-size: 1rem; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; line-height: 1.3; }
        .card-icon { width: 32px; height: 32px; fill: var(--gold); margin-top: 1.5rem; filter: drop-shadow(0 0 8px var(--gold)); opacity: 0.8; }

        /* MEDIA GRID (v53) */
        .dual-media-grid { display: grid; grid-template-columns: 1.6fr 1fr; gap: 2rem; max-width: 1100px; margin: 0 auto; }
        .video-wrapper { position: relative; width: 100%; padding-top: 56.25%; border-radius: 15px; overflow: hidden; border: 1px solid var(--gold); box-shadow: 0 0 30px var(--border-glow); }
        .video-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        .playlist-wrapper { border-radius: 15px; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); height: 100%; }

        .lineup-container { display: grid; grid-template-columns: 1fr 1fr; gap: 0; align-items: start; max-width: 950px; margin: 0 auto; }
        .lineup-col-poster { display: flex; justify-content: center; padding-right: 5rem; border-right: 1px solid rgba(255,255,255,0.1); }
        .lineup-poster { width: 320px; border-radius: 12px; border: 4px solid var(--gold); }
        .artist-list { display: flex; flex-direction: column; gap: 2.5rem; padding-left: 5rem; }
        .artist-item { display: flex; align-items: center; gap: 1.8rem; }
        .artist-avatar { width: 65px; height: 65px; border-radius: 50%; object-fit: cover; border: 2px solid var(--gold); }

        .form-input { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 1.2rem; border-radius: 10px; color: white; width: 100%; box-sizing: border-box; }
        .btn-submit { background: var(--gold); color: white; border: none; padding: 1.4rem; border-radius: 12px; font-weight: 900; cursor: pointer; width: 100%; text-transform: uppercase; letter-spacing: 2px; }
        .loading-overlay { position: fixed; inset: 0; background: #000; z-index: 999; display: flex; align-items: center; justify-content: center; font-weight: 900; }
        
        @media (max-width: 768px) {
            .data-cards-container { grid-template-columns: repeat(2, 1fr); }
            .lineup-container, .dual-media-grid { grid-template-columns: 1fr; gap: 3rem; }
            .lineup-col-poster { border: none; padding: 0; margin-bottom: 2rem; }
            .artist-list { padding: 0; }
        }
    </style>
</head>

<body class="tpl-sandbox">

    <div id="loader" class="loading-overlay">CALIBRATING DATA CARDS v54...</div>

    <header id="hero-bg" class="hero">
        <div id="org-name-badge" class="org-badge">--</div>
        <div class="hero-content">
            <h1 id="event-title" class="hero-title">--</h1>
            <div class="hero-meta">
                <span><svg class="meta-icon" viewBox="0 0 24 24"><path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2z"/></svg><span id="meta-fecha">--/--/--</span></span>
                <span><svg class="meta-icon" viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg><span id="meta-hora">--:--</span></span>
                <span><svg class="meta-icon" viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg><span id="meta-lugar">--</span></span>
            </div>
            <div id="hero-aforo-txt" class="aforo-box-hero">...</div>
            <div id="unified-frame" class="unified-countdown-frame">
                <div class="cd-block"><span id="cd-days" class="cd-v">00</span><span class="cd-l">Días</span></div>
                <div class="cd-block"><span id="cd-hours" class="cd-v">00</span><span class="cd-l">Horas</span></div>
                <div class="cd-block"><span id="cd-mins" class="cd-v">00</span><span class="cd-l">Min</span></div>
                <div class="cd-block"><span id="cd-secs" class="cd-v">00</span><span class="cd-l">Seg</span></div>
            </div>
        </div>
    </header>

    <main id="main-content-flow">
        <!-- MODULOS INVISIBLES DE AUDITORÍA (577) -->
        <section id="modulo-countdown" style="display:none;"></section>
        <section id="modulo-aforo" style="display:none;"></section>

        <!-- SECCIÓN DE DATA CARDS v54 -->
        <section id="modulo-info-tecnica">
            <div class="data-cards-container">
                <!-- CARD 1: DRESS CODE -->
                <div class="data-card">
                    <span class="card-label">DRESS CODE</span>
                    <span id="db-dress-val" class="card-val">...</span>
                    <svg class="card-icon" viewBox="0 0 24 24"><path d="M17 10h-2c0-1.66-1.34-3-3-3s-3 1.34-3 3H7c-1.1 0-2 .9-2 2v6c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2v-6c0-1.1-.9-2-2-2zM12 11c1.1 0 2 .9 2 2s-.9 2-2 2-2-.9-2-2 .9-2 2-2z"/></svg>
                </div>
                <!-- CARD 2: GUEST LIST -->
                <div class="data-card">
                    <span class="card-label">GUEST LIST</span>
                    <span id="db-guest-val" class="card-val">...</span>
                    <svg class="card-icon" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                </div>
                <!-- CARD 3: AFORO -->
                <div class="data-card">
                    <span class="card-label">AFORO</span>
                    <span id="db-aforo-val" class="card-val">...</span>
                    <svg class="card-icon" viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5s-3 1.34-3 3 1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5s-3 1.34-3 3 1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
                </div>
                <!-- CARD 4: TICKETS -->
                <div class="data-card">
                    <span class="card-label">TICKETS</span>
                    <span id="db-ticket-val" class="card-val">DISPONIBLES</span>
                    <svg class="card-icon" viewBox="0 0 24 24"><path d="M22 10V6c0-1.11-.9-2-2-2H4c-1.1 0-1.99.89-1.99 2v4c1.1 0 1.99.9 1.99 2s-.89 2-2 2v4c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2v-4c-1.1 0-2-.9-2-2s.9-2 2-2zm-9 7h-2v-2h2v2zm0-4h-2v-2h2v2zm0-4h-2V7h2v2z"/></svg>
                </div>
            </div>
        </section>

        <section id="modulo-lineup">
            <h2>ARTISTAS INVITADOS</h2>
            <div class="lineup-container">
                <div class="lineup-col-poster"><img id="db-poster-img" src="" class="lineup-poster" alt="Afiche"></div>
                <div id="db-lineup" class="artist-list"></div>
            </div>
        </section>

        <section id="modulo-gallery">
            <h2>GALERÍA</h2>
            <div id="db-gallery-grid" style="display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:1rem;"></div>
        </section>

        <section id="modulo-trailer-playlist">
            <h2>TRÁILER / BANDA SONORA</h2>
            <div class="dual-media-grid">
                <div id="modulo-trailer" class="video-wrapper"><iframe src="https://player.vimeo.com/video/259411563?h=79100067&color=df20b6" allowfullscreen></iframe></div>
                <div id="modulo-playlist" class="playlist-wrapper"><div id="db-spotify"></div></div>
            </div>
        </section>

        <section id="modulo-faq"><h2>DUDAS FRECUENTES</h2><div id="db-faq-list"></div></section>
        <section id="modulo-ubicacion"><h2>LOCALIZACIÓN</h2><div id="db-mapa-container" style="width:100%; height:450px; border-radius:15px; overflow:hidden; border:1px solid rgba(255,255,255,0.1);"></div></section>
        <section id="modulo-formulario"><h2>REGISTRO</h2><form id="master-reg-form" style="max-width:600px; margin:0 auto; display:flex; flex-direction:column; gap:1.5rem;"><div><input type="text" class="form-input" placeholder="Nombre *" required></div><div><input type="text" class="form-input" placeholder="Cédula *" required></div><div style="display:flex; gap:0.5rem;"><select class="form-input" style="width:110px;"><option value="+57">🇨🇴 +57</option></select><input type="tel" class="form-input" placeholder="WhatsApp *" required></div><div id="db-dynamic-fields"></div><button type="submit" class="btn-submit">CONFIRMAR →</button></form></section>
    </main>

    <script>
        const SANDBOX_CONFIG = {
            countdown: true, trailer: true, aforo: true, lineup: true, dress_code: true, 
            gallery: true, guest_list: true, faq: true, playlist: true, ubicacion: true, 
            formulario: true, force_gold: '#df20b6' 
        };

        const SB_URL = "https://ctgyvydzshueemlelkzv.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN0Z3l2eWR6c2h1ZWVtbGVsa3p2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2NTc1NzAsImV4cCI6MjA4OTIzMzU3MH0.3pMA-VZLV2Kfyl6BD-x8v79P7UuXSfMgtIwnfoP_VuY";
        const sbClient = window.supabase.createClient(SB_URL, SB_KEY);

        function logStatus(mensaje, tipo = 'INFO') {
            const colors = { 'INFO': '#00ff88', 'LINK': '#f1c40f', 'TIME': '#9b59b6', 'ERROR': '#ff4d4d' };
            console.log(`%c[${new Date().toLocaleTimeString()}] [${tipo}] ${mensaje}`, `color: ${colors[tipo] || '#fff'}; font-weight: bold;`);
        }

        function startCountdown(date, time) {
            try {
                const target = new Date(`${date}T${time}`).getTime();
                if (isNaN(target)) return;
                logStatus(`TIME: Heartbeat activo en v54 para ${date}.`, "TIME");
                setInterval(() => {
                    const diff = target - new Date().getTime();
                    if (diff <= 0) return;
                    document.getElementById('cd-days').innerText = Math.floor(diff / 86400000).toString().padStart(2, '0');
                    document.getElementById('cd-hours').innerText = Math.floor((diff % 86400000) / 3600000).toString().padStart(2, '0');
                    document.getElementById('cd-mins').innerText = Math.floor((diff % 3600000) / 60000).toString().padStart(2, '0');
                    document.getElementById('cd-secs').innerText = Math.floor((diff % 60000) / 1000).toString().padStart(2, '0');
                }, 1000);
            } catch (e) { logStatus(`ERROR TIME: ${e.message}`, "ERROR"); }
        }

        async function initEvento() {
            logStatus("AUDITORÍA V54: Sincronizando 4 Data Cards con Grid Ref...");
            const slug = new URLSearchParams(window.location.search).get('slug');

            try {
                const { data: evento, error } = await sbClient.from('eventos').select('*').eq('slug', slug).single();
                if (error) throw error;

                if (SANDBOX_CONFIG.countdown) startCountdown(evento.fecha, evento.hora);

                const { data: org } = await sbClient.from('organizaciones').select('nombre').eq('id', evento.org_id).single();
                if (org) document.getElementById('org-name-badge').innerText = org.nombre.toUpperCase();

                document.getElementById('event-title').innerText = evento.nombre.toUpperCase();
                document.getElementById('meta-fecha').innerText = evento.fecha;
                document.getElementById('meta-hora').innerText = `${evento.hora} HRS`;
                document.getElementById('meta-lugar').innerText = evento.ubicacion.toUpperCase();
                
                const content = evento.config_landing?.content || {};

                // 1. INYECCIÓN DATA CARDS v54 (Ref: datos.jpg)
                document.getElementById('db-dress-val').innerText = (content.dresscode || content.vestimenta || 'NO DEFINIDO').toUpperCase();
                document.getElementById('db-guest-val').innerText = (content.guest_list || 'RESERVA ABIERTA').toUpperCase();
                document.getElementById('db-aforo-val').innerText = evento.aforo_max ? `LIMITADO ${evento.aforo_max} PERSONAS` : 'SIN LÍMITE';
                document.getElementById('db-ticket-val').innerText = (content.tickets_info || 'EARLY BIRD').toUpperCase();
                logStatus("LINK: Data Cards (Dress, Guest, Aforo, Tickets) inyectadas.", "LINK");

                if (evento.aforo_max) document.getElementById('hero-aforo-txt').innerText = `${evento.aforo_max} CUPOS DISPONIBLES`;
                if (evento.imagen_url) document.getElementById('hero-bg').style.backgroundImage = `url('${evento.imagen_url}')`;

                // 2. LINEUP
                const posterImg = document.getElementById('db-poster-img');
                posterImg.src = evento.poster_url || evento.imagen_url || "https://images.unsplash.com/photo-1533174072545-7a4b6ad7a6c3?q=80&w=1000";
                
                const lineup = content.dj_lineup || content.lineup;
                if (lineup) {
                    const proPhotos = ["https://images.unsplash.com/photo-1493225255756-d9584f8606e9?q=80&w=200", "https://images.unsplash.com/photo-1520813792240-56fc4a3765a7?q=80&w=200", "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?q=80&w=200", "https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=200"];
                    document.getElementById('db-lineup').innerHTML = (Array.isArray(lineup) ? lineup : lineup.split('\n')).map((a, i) => `
                        <div class="artist-item"><img src="${proPhotos[i % 4]}" class="artist-avatar"><span class="artist-name" style="font-weight:900; font-size:1.1rem; text-transform:uppercase;">${a}</span></div>`).join('');
                }

                // 3. MEDIA (Gallery / Playlist)
                const gallery = content.gallery || content.galeria;
                if (gallery) {
                    const urls = Array.isArray(gallery) ? gallery : gallery.split('\n');
                    document.getElementById('db-gallery-grid').innerHTML = urls.filter(u => u.length > 5).map(u => `<img src="${u.trim()}" style="width:100%; height:250px; object-fit:cover; border-radius:8px;">`).join('');
                }

                if (content.playlist_url) {
                    const embed = content.playlist_url.replace('open.spotify.com', 'open.spotify.com/embed');
                    document.getElementById('db-spotify').innerHTML = `<iframe src="${embed}" width="100%" height="450" frameBorder="0" allow="encrypted-media" style="filter: invert(1) hue-rotate(180deg) brightness(0.8); border:none;"></iframe>`;
                }

                // Otros bloques
                if (content.faq && typeof content.faq === 'string') {
                    const lineas = content.faq.split('\n').filter(l => l.includes('|'));
                    document.getElementById('db-faq-list').innerHTML = lineas.map(l => {
                        const [q, a] = l.split('|');
                        return `<div class="data-item" style="margin-bottom:1.5rem;"><b style="color:var(--gold); display:block; margin-bottom:1rem;">${q.trim()}</b><p style="opacity:0.7; margin:0;">${a.trim()}</p></div>`;
                    }).join('');
                }
                if (evento.ubicacion) {
                    const url = `https://maps.google.com/maps?q=${encodeURIComponent(evento.ubicacion)}&t=&z=15&ie=UTF8&iwloc=&output=embed`;
                    document.getElementById('db-mapa-container').innerHTML = `<iframe width="100%" height="100%" src="${url}" allowfullscreen style="filter: grayscale(1) invert(1) contrast(1.2); border:none;"></iframe>`;
                }

                // --- 4. AUDITORÍA FÍSICA v54 ---
                logStatus("--- INICIANDO AUDITORÍA DE ESCUDO v54 ---", "INFO");
                Object.keys(SANDBOX_CONFIG).forEach(key => {
                    const sectionId = key === 'dress_code' || key === 'guest_list' || key === 'aforo' ? 'modulo-info-tecnica' : `modulo-${key}`;
                    const el = document.getElementById(sectionId) || document.getElementById('modulo-trailer-playlist');
                    if (!el) return;
                    const hasInput = el.querySelectorAll('input').length > 0;
                    const hasIframe = el.querySelectorAll('iframe').length > 0;
                    const hasImg = el.querySelectorAll('img').length > 0;
                    const contentTxt = el.innerText.replace(/\s/g, '').replace('--', '');
                    let isValid = (key === 'formulario') ? hasInput : (contentTxt.length >= 3 || hasIframe || hasImg);
                    if (SANDBOX_CONFIG[key] && isValid) {
                        logStatus(`INFO: Módulo ${key.toUpperCase()} verificado.`, "INFO");
                        el.style.display = 'block';
                    }
                });

                logStatus("SINCRONIZACIÓN MAESTRA V54 FINALIZADA.", "INFO");

            } catch (err) { logStatus(`CRÍTICO: ${err.message}`, "ERROR"); } finally { document.getElementById('loader').style.display = 'none'; }
        }
        window.onload = initEvento;
    </script>
</body>
</html>
