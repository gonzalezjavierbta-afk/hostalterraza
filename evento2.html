<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Editor v43: Pixel Perfect Glow · Sistema QR</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.3.0/dist/fonts/geist.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/qr-creator/dist/qr-creator.min.js"></script>

    <style>
        :root { 
            --main-bg: #050505; 
            --gold: #df20b6; 
            --text-color: #ffffff;
            --glass: rgba(255, 255, 255, 0.05);
        }

        html, body { 
            margin: 0; padding: 0; min-height: 100%; 
            background-color: var(--main-bg); color: var(--text-color); 
            font-family: 'Geist', sans-serif; -webkit-font-smoothing: antialiased; 
        }

        /* Ruido Cinematográfico P6 */
        body::before {
            content: ""; position: fixed; inset: 0; z-index: 9999; pointer-events: none;
            background-image: url("https://grainy-gradients.vercel.app/noise.svg");
            opacity: 0.04; contrast: 150%;
        }
        
        section { display: none; padding: 5rem 10%; border-bottom: 1px solid rgba(255,255,255,0.05); }
        h2 { color: var(--gold); letter-spacing: 4px; text-transform: uppercase; font-size: 0.7rem; font-weight: 900; margin-bottom: 3rem; text-align: center; }

        /* HERO INTEGRADO (Pixel Perfect v43) */
        .hero { 
            position: relative; height: 100vh; display: flex; flex-direction: column; 
            justify-content: space-between; padding: 3rem 10%; background-size: cover; background-position: center; 
            box-sizing: border-box; overflow: hidden;
        }
        .hero::before { 
            content: ''; position: absolute; inset: 0; 
            background: linear-gradient(to bottom, rgba(0,0,0,0.6) 0%, rgba(5,5,5,0) 40%, rgba(5,5,5,1) 100%); z-index: 1; 
        }

        .org-badge {
            position: absolute; top: 2.5rem; left: 2.5rem; z-index: 10;
            color: white; font-weight: 900; font-size: 1.2rem; letter-spacing: 2px;
            text-transform: uppercase;
        }

        .hero-content { position: relative; z-index: 2; text-align: center; margin-top: 8vh; }
        
        /* Título más pequeño para ajuste de pantalla completa */
        .hero-title { 
            font-weight: 900; font-size: clamp(2rem, 8vw, 5.5rem); line-height: 0.9; 
            text-transform: uppercase; margin: 0; letter-spacing: -4px; 
            background: linear-gradient(to bottom, #ffffff, var(--gold)); 
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; 
        }

        /* Metadatos con Iconos (Ref: cabezote.jpg) */
        .hero-meta {
            display: flex; justify-content: center; gap: 2rem; margin-top: 1.5rem;
            font-weight: 700; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 2px; opacity: 0.8;
        }
        .meta-item { display: flex; align-items: center; gap: 0.5rem; }
        .meta-icon { width: 14px; height: 14px; fill: var(--gold); }

        /* Countdown Cajas Transparentes con Glow */
        .hero-countdown { 
            position: relative; z-index: 2; width: 100%; max-width: 700px; margin: 0 auto;
            display: flex; gap: 1rem; padding-bottom: 2rem;
        }
        .cd-item { 
            flex: 1; padding: 1.2rem; background: var(--glass); border-radius: 10px; 
            border: 1px solid var(--gold); backdrop-filter: blur(12px); text-align: center;
            box-shadow: 0 0 15px rgba(223, 32, 182, 0.2), inset 0 0 10px rgba(223, 32, 182, 0.1);
        }
        .cd-val { display: block; font-size: clamp(1.5rem, 4vw, 2.8rem); font-weight: 900; line-height: 1; }
        .cd-lab { font-size: 0.5rem; letter-spacing: 2px; opacity: 0.5; text-transform: uppercase; margin-top: 0.5rem; display: block; font-weight: 900; }

        .data-item { margin-bottom: 1.5rem; padding: 1.5rem; background: var(--glass); border: 1px solid rgba(255,255,255,0.05); border-radius: 12px; }
        .btn-submit { background: var(--gold); color: white; border: none; padding: 1.2rem; border-radius: 8px; font-weight: 900; cursor: pointer; width: 100%; text-transform: uppercase; letter-spacing: 2px; box-shadow: 0 5px 20px rgba(223, 32, 182, 0.4); }
        .loading-overlay { position: fixed; inset: 0; background: #000; z-index: 999; display: flex; align-items: center; justify-content: center; font-weight: 900; letter-spacing: 2px; }
    </style>
</head>

<body class="tpl-sandbox">

    <div id="loader" class="loading-overlay">CALIBRATING PIXELS v43...</div>

    <header id="hero-bg" class="hero">
        <div id="org-name-badge" class="org-badge">--</div>

        <div class="hero-content">
            <h1 id="event-title" class="hero-title">--</h1>
            
            <!-- CONTENEDOR DE METADATOS CON ICONOS (Ref: cabezote.jpg) -->
            <div class="hero-meta">
                <div class="meta-item">
                    <svg class="meta-icon" viewBox="0 0 24 24"><path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2z"/></svg>
                    <span id="meta-fecha">--/--/--</span>
                </div>
                <div class="meta-item">
                    <svg class="meta-icon" viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>
                    <span id="meta-hora">--:-- HRS</span>
                </div>
                <div class="meta-item">
                    <svg class="meta-icon" viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
                    <span id="meta-lugar">--</span>
                </div>
            </div>
        </div>

        <div id="integrated-countdown" class="hero-countdown">
            <div class="cd-item"><span id="cd-days" class="cd-val">00</span><span class="cd-lab">Días</span></div>
            <div class="cd-item"><span id="cd-hours" class="cd-val">00</span><span class="cd-lab">Horas</span></div>
            <div class="cd-item"><span id="cd-mins" class="cd-val">00</span><span class="cd-lab">Min</span></div>
            <div class="cd-item"><span id="cd-secs" class="cd-val">00</span><span class="cd-lab">Seg</span></div>
        </div>
    </header>

    <main id="main-content-flow">
        <section id="modulo-countdown" style="display:none;"></section>
        <section id="modulo-trailer"><h2>EXPERIENCIA VISUAL</h2><div id="db-trailer-container"></div></section>
        <section id="modulo-aforo"><h2>DISPONIBILIDAD</h2><div id="db-aforo-txt" class="data-item" style="text-align:center; font-weight:900;">--</div></section>
        <section id="modulo-lineup"><h2>ARTISTAS</h2><div id="db-lineup"></div></section>
        <section id="modulo-dress_code"><h2>VESTIMENTA</h2><div id="db-dress-txt" class="data-item" style="text-align:center;">--</div></section>
        <section id="modulo-gallery"><h2>GALERÍA</h2><div id="db-gallery-grid" style="display:grid; grid-template-columns:repeat(auto-fit, minmax(250px, 1fr)); gap:1rem;"></div></section>
        <section id="modulo-guest_list"><h2>GUEST LIST</h2><div id="db-guest-txt" class="data-item">--</div></section>
        <section id="modulo-faq"><h2>PREGUNTAS</h2><div id="db-faq-list"></div></section>
        <section id="modulo-playlist"><h2>BANDA SONORA</h2><div id="db-spotify"></div></section>
        <section id="modulo-ubicacion"><h2>LOCALIZACIÓN</h2><div id="db-ubicacion" class="data-item" style="text-align:center;">--</div><div id="db-mapa-container" style="width:100%; height:400px; border-radius:20px; overflow:hidden;"></div></section>
        <section id="modulo-formulario"><h2>REGISTRO</h2><form id="master-reg-form" class="data-item" style="background:transparent; border:none; padding:0; max-width:600px; margin:0 auto;"><div id="db-dynamic-fields" style="display:flex; flex-direction:column; gap:1.2rem;"></div><button type="submit" class="btn-submit" style="margin-top:2rem;">CONFIRMAR ASISTENCIA →</button></form></section>
    </main>

    <script>
        const SANDBOX_CONFIG = {
            countdown: true, trailer: true, aforo: true, lineup: true, dress_code: true, 
            gallery: true, guest_list: true, faq: true, playlist: true, ubicacion: true, 
            formulario: true, force_gold: '#df20b6' 
        };

        const SB_URL = "https://ctgyvydzshueemlelkzv.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN0Z3l2eWR6c2h1ZWVtbGVsa3p2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2NTc1NzAsImV4cCI6MjA4OTIzMzU3MH0.3pMA-VZLV2Kfyl6BD-x8v79P7UuXSfMgtIwnfoP_VuY";
        const sbClient = window.supabase.createClient(SB_URL, SB_KEY);

        function logStatus(mensaje, tipo = 'INFO') {
            const colors = { 'INFO': '#00ff88', 'LINK': '#f1c40f', 'TIME': '#9b59b6', 'ERROR': '#ff4d4d' };
            console.log(`%c[${new Date().toLocaleTimeString()}] [${tipo}] ${mensaje}`, `color: ${colors[tipo] || '#fff'}; font-weight: bold;`);
        }

        function startCountdown(date, time) {
            try {
                const target = new Date(`${date}T${time}`).getTime();
                if (isNaN(target)) return;
                logStatus(`TIME: Heartbeat sincronizado en cajas Glow para ${date}.`, "TIME");
                setInterval(() => {
                    const diff = target - new Date().getTime();
                    if (diff <= 0) return;
                    document.getElementById('cd-days').innerText = Math.floor(diff / 86400000).toString().padStart(2, '0');
                    document.getElementById('cd-hours').innerText = Math.floor((diff % 86400000) / 3600000).toString().padStart(2, '0');
                    document.getElementById('cd-mins').innerText = Math.floor((diff % 3600000) / 60000).toString().padStart(2, '0');
                    document.getElementById('cd-secs').innerText = Math.floor((diff % 60000) / 1000).toString().padStart(2, '0');
                }, 1000);
            } catch (e) { logStatus(`ERROR TIME: ${e.message}`, "ERROR"); }
        }

        async function initEvento() {
            logStatus("AUDITORÍA V43: Ejecutando refinamiento estético Pixel Perfect...");
            const slug = new URLSearchParams(window.location.search).get('slug');

            try {
                const { data: evento, error } = await sbClient.from('eventos').select('*').eq('slug', slug).single();
                if (error) throw error;

                if (SANDBOX_CONFIG.countdown) startCountdown(evento.fecha, evento.hora);

                // Fetch Organización
                const { data: org } = await sbClient.from('organizaciones').select('nombre').eq('id', evento.org_id).single();
                if (org) document.getElementById('org-name-badge').innerText = org.nombre.toUpperCase();

                // Inyección Metadatos (Ref: cabezote.jpg)
                document.getElementById('event-title').innerText = evento.nombre.toUpperCase();
                document.getElementById('meta-fecha').innerText = evento.fecha;
                document.getElementById('meta-hora').innerText = `${evento.hora} HRS`;
                document.getElementById('meta-lugar').innerText = evento.ubicacion.toUpperCase();
                logStatus("LINK: Metadatos con iconografía inyectados en Hero.", "LINK");

                if (evento.imagen_url) document.getElementById('hero-bg').style.backgroundImage = `url('${evento.imagen_url}')`;

                // Resto de módulos (Paridad Estable)
                if (evento.aforo_max) document.getElementById('db-aforo-txt').innerText = `${evento.aforo_max} CUPOS TOTALES DISPONIBLES.`;
                
                const content = evento.config_landing?.content || {};
                const lineup = content.dj_lineup || content.lineup;
                if (lineup) document.getElementById('db-lineup').innerHTML = (Array.isArray(lineup) ? lineup : lineup.split('\n')).map(a => `<div class="data-item" style="text-align:center; font-weight:900;">${a}</div>`).join('');
                
                if (content.gallery) document.getElementById('db-gallery-grid').innerHTML = content.gallery.map(u => `<img src="${u}" style="width:100%; height:300px; object-fit:cover; border-radius:12px;">`).join('');

                if (content.faq && typeof content.faq === 'string') {
                    const lineas = content.faq.split('\n').filter(l => l.includes('|'));
                    document.getElementById('db-faq-list').innerHTML = lineas.map(l => {
                        const [q, a] = l.split('|');
                        return `<div class="data-item"><b style="color:var(--gold); display:block; margin-bottom:1rem; font-size:0.8rem;">${q.trim()}</b><p style="opacity:0.7; margin:0;">${a.trim()}</p></div>`;
                    }).join('');
                }

                if (content.playlist_url) {
                    const embed = content.playlist_url.replace('open.spotify.com', 'open.spotify.com/embed');
                    document.getElementById('db-spotify').innerHTML = `<iframe src="${embed}" width="100%" height="380" frameBorder="0" allow="encrypted-media" style="border-radius:20px; border:none; filter: invert(1) hue-rotate(180deg) brightness(0.8);"></iframe>`;
                }

                if (evento.ubicacion) {
                    const url = `https://maps.google.com/maps?q=${encodeURIComponent(evento.ubicacion)}&t=&z=15&ie=UTF8&iwloc=&output=embed`;
                    document.getElementById('db-mapa-container').innerHTML = `<iframe width="100%" height="100%" src="${url}" allowfullscreen style="filter: grayscale(1) invert(1) contrast(1.2); border:none;"></iframe>`;
                    document.getElementById('db-ubicacion').innerText = evento.ubicacion.toUpperCase();
                }

                // Auditoría Final v43
                logStatus("--- INICIANDO AUDITORÍA DE INTEGRIDAD GLOW ---", "INFO");
                Object.keys(SANDBOX_CONFIG).forEach(key => {
                    if (key === 'force_gold' || key === 'trailer') return;
                    const el = document.getElementById(`modulo-${key}`) || document.getElementById('integrated-countdown');
                    const isValid = (el.innerText.replace(/\s/g, '').length > 5 || el.querySelector('input') || el.querySelector('iframe') || el.querySelector('img'));
                    if (SANDBOX_CONFIG[key] && isValid) logStatus(`INFO: Módulo ${key.toUpperCase()} verificado con éxito.`, "INFO");
                    if (el.tagName === 'SECTION') el.style.display = SANDBOX_CONFIG[key] ? 'block' : 'none';
                });

                logStatus("SINCRONIZACIÓN MAESTRA V43 FINALIZADA.", "INFO");

            } catch (err) { logStatus(`CRÍTICO: ${err.message}`, "ERROR"); } finally { document.getElementById('loader').style.display = 'none'; }
        }
        window.onload = initEvento;
    </script>
</body>
</html>
