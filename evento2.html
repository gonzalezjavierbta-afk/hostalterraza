<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sandbox v14: Master Sync · Sistema QR</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.3.0/dist/fonts/geist.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/qr-creator/dist/qr-creator.min.js"></script>

    <style>
        :root { --main-bg: #050505; --gold: #df20b6; --text-color: #ffffff; }
        
        html, body { 
            margin: 0; padding: 0; min-height: 100%;
            overflow-x: hidden; overflow-y: auto !important;
            background-color: var(--main-bg); color: var(--text-color);
            font-family: 'Geist', sans-serif; -webkit-font-smoothing: antialiased;
        }

        /* HERO VISUAL */
        .hero {
            position: relative; min-height: 80vh; display: flex; flex-direction: column;
            justify-content: center; padding: 0 10%; background-size: cover; background-position: center;
        }
        .hero::before {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(to bottom, rgba(0,0,0,0.4) 0%, #050505 100%); z-index: 1;
        }
        .hero-content { position: relative; z-index: 2; }
        .hero-title {
            font-weight: 900; font-size: clamp(3.5rem, 12vw, 8rem); line-height: 0.85;
            text-transform: uppercase; margin: 0; letter-spacing: -5px;
            background: linear-gradient(to bottom, var(--gold), #ffffff);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 20px rgba(223, 32, 182, 0.5));
        }

        section { display: none; padding: 5rem 10%; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .data-item { margin-bottom: 1rem; padding: 1.5rem; background: rgba(255,255,255,0.02); border-left: 4px solid var(--gold); border-radius: 4px; font-size: 1.2rem; }
        .loading-overlay { position: fixed; inset: 0; background: #000; z-index: 999; display: flex; align-items: center; justify-content: center; }
    </style>
</head>

<body class="tpl-sandbox">

    <div id="loader" class="loading-overlay">Sincronizando Playlist y Datos...</div>

    <header id="hero-bg" class="hero">
        <div class="hero-content">
            <h1 id="event-title" class="hero-title">--</h1>
            <p id="event-date" style="letter-spacing: 4px; margin-top: 2rem; font-weight: bold; opacity: 0.8;">--</p>
        </div>
    </header>

    <!-- MÓDULOS ACTIVOS -->
    <section id="modulo-lineup">
        <h2 style="color: var(--gold); letter-spacing: 2px;">DJ LINEUP</h2>
        <div id="db-lineup"></div>
    </section>

    <section id="modulo-playlist">
        <h2 style="color: var(--gold); letter-spacing: 2px;">SPOTIFY PLAYLIST</h2>
        <div id="db-spotify"></div>
    </section>

    <section id="modulo-ubicacion">
        <h2 style="color: var(--gold);">UBICACIÓN</h2>
        <div id="db-ubicacion" class="data-item">--</div>
    </section>

    <script>
        const SANDBOX_CONFIG = {
            lineup: true,
            playlist: true,
            ubicacion: true,
            force_gold: '#df20b6' 
        };

        const SB_URL = "https://ctgyvydzshueemlelkzv.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN0Z3l2eWR6c2h1ZWVtbGVsa3p2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2NTc1NzAsImV4cCI6MjA4OTIzMzU3MH0.3pMA-VZLV2Kfyl6BD-x8v79P7UuXSfMgtIwnfoP_VuY";
        const sbClient = window.supabase.createClient(SB_URL, SB_KEY);

        function logStatus(mensaje, tipo = 'INFO') {
            const t = new Date().toLocaleTimeString();
            const colors = { 'INFO': '#00ff88', 'DB': '#33ccff', 'TRACE': '#e67e22', 'LINK': '#f1c40f', 'ERROR': '#ff4d4d' };
            console.log(`%c[${t}] [${tipo}] ${mensaje}`, `color: ${colors[tipo]}; font-family: monospace; font-weight: bold;`);
        }

        async function initEvento() {
            logStatus("Iniciando auditoría v14 (Master Sync)...");
            const slug = new URLSearchParams(window.location.search).get('slug');

            try {
                const { data: evento, error } = await sbClient
                    .from('eventos')
                    .select('*')
                    .eq('slug', slug)
                    .single();

                if (error) throw error;

                // 1. AUDITORÍA RAÍZ
                logStatus(`Campos en raíz DB: ${Object.keys(evento).join(', ')}`, "DB");

                if (evento.imagen_url) {
                    document.getElementById('hero-bg').style.backgroundImage = `url('${evento.imagen_url}')`;
                    logStatus("LINK: Imagen Hero vinculada.", "LINK");
                }
                document.getElementById('event-title').innerText = evento.nombre.toUpperCase();
                document.getElementById('event-date').innerText = `${evento.fecha} | ${evento.hora}`;
                if (evento.ubicacion) document.getElementById('db-ubicacion').innerText = evento.ubicacion;

                const config = evento.config_landing || {};
                logStatus(`Estructura JSON detectada: ${Object.keys(config).join(', ')}`, "TRACE");

                /**
                 * FUNCIÓN DE BÚSQUEDA EXCLUSIVA DE CONTENIDO
                 * Busca en raíz de evento, config, modules y content, ignorando booleanos.
                 */
                const findContent = (llaves) => {
                    for (let key of llaves) {
                        // Primero probar raíz de la tabla (ej: video_url)
                        if (evento[key] && typeof evento[key] === 'string' && evento[key].length > 5) {
                            logStatus(`TRACE: Usando '${key}' desde RAÍZ de la tabla.`, "TRACE");
                            return evento[key];
                        }
                        // Luego probar en el JSON (raíz, modules, content)
                        let locations = [config, config.modules, config.content];
                        for (let loc of locations) {
                            if (loc && loc[key] !== undefined && typeof loc[key] === 'string' && loc[key].length > 2) {
                                logStatus(`TRACE: Usando '${key}' desde JSON (config_landing).`, "TRACE");
                                return loc[key];
                            }
                        }
                    }
                    return null;
                };

                // 2. VINCULAR LINEUP (Ya funcional)
                const lineupData = findContent(['lineup', 'dj_lineup', 'artistas']);
                if (lineupData) {
                    const artistas = lineupData.split('\n').filter(a => a.trim() !== "");
                    document.getElementById('db-lineup').innerHTML = artistas.map(a => `<div class="data-item">${a}</div>`).join('');
                    logStatus(`LINK: ${artistas.length} artistas vinculados.`, "LINK");
                }

                // 3. VINCULAR PLAYLIST (Mejorado)
                // Se buscan específicamente las llaves donde admin.html guarda la URL
                const spotifyUrl = findContent(['video_url', 'spotify_url', 'playlist_url', 'playlist']);
                
                if (spotifyUrl && spotifyUrl.toLowerCase().includes('spotify')) {
                    const embed = spotifyUrl.replace('open.spotify.com', 'open.spotify.com/embed');
                    document.getElementById('db-spotify').innerHTML = `<iframe src="${embed}" width="100%" height="380" frameBorder="0" allow="encrypted-media" style="border-radius:12px; border:none;"></iframe>`;
                    logStatus("LINK: Playlist Spotify inyectada correctamente.", "LINK");
                } else {
                    logStatus("TRACE: No se encontró una URL de Spotify válida. Se omitirá el módulo.", "ERROR");
                }

                // Aplicar visibilidad final
                document.documentElement.style.setProperty('--gold', SANDBOX_CONFIG.force_gold);
                Object.keys(SANDBOX_CONFIG).forEach(key => {
                    const el = document.getElementById(`modulo-${key}`);
                    if (el) el.style.display = SANDBOX_CONFIG[key] ? 'block' : 'none';
                });

                logStatus("SINCRONIZACIÓN FINALIZADA.", "INFO");

            } catch (err) {
                logStatus(`FALLO: ${err.message}`, "ERROR");
            } finally {
                document.getElementById('loader').style.display = 'none';
            }
        }
        window.onload = initEvento;
    </script>
</body>
</html>
