<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sandbox de Diseño · Sistema QR</title>
    
    <!-- Fuentes sugeridas para 2026 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.3.0/dist/fonts/geist.min.css">
    
    <!-- Librerías Core (Supabase y Generador QR Seguro) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/qr-creator/dist/qr-creator.min.js"></script>

    <style>
        /* ESTILOS BASE DEL SISTEMA (No editar aquí) */
        :root {
            --main-bg: #0a0a0a;
            --gold: #c8a96e; /* Color primario de la organización [5] */
            --text-color: #ffffff;
        }
        body {
            margin: 0;
            background-color: var(--main-bg);
            color: var(--text-color);
            font-family: 'Geist', sans-serif;
            overflow-x: hidden;
        }
        section { display: none; padding: 4rem 10%; } /* Ocultos por defecto [2] */
        .loading-overlay { position: fixed; inset: 0; background: #000; z-index: 999; display: flex; align-items: center; justify-content: center; }
    </style>

    <!-- ================================================================
         1. SANDBOX STYLES (EDITA AQUÍ TUS NORMAS DE CSS)
         Este bloque tiene prioridad sobre cualquier estilo previo. 
         ================================================================ -->
    <style id="sandbox-styles">
        /* Reglas aplicadas solo cuando el body tiene la clase .tpl-sandbox */
        body.tpl-sandbox {
            background: linear-gradient(180deg, #000 0%, #1a1a1a 100%);
        }

        /* Ejemplo: Título principal cinematográfico [6, 7] */
        .tpl-sandbox .hero-title {
            font-size: clamp(3rem, 10vw, 6rem);
            text-align: center;
            text-transform: uppercase;
            letter-spacing: -2px;
            margin-bottom: 1rem;
            color: var(--gold); /* Cambia --gold en la sección de variables */
        }

        /* Ejemplo: Ajuste de módulos de la nueva plantilla */
        .tpl-sandbox #modulo-lineup {
            border: 1px solid rgba(200, 169, 110, 0.3);
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.02);
        }

        /* NOTA: Para añadir una nueva sección, crea el ID aquí y en el HTML abajo */
    </style>
</head>

<body class="tpl-sandbox"> <!-- FORZADO: Siempre carga como Sandbox [prompt] -->

    <div id="loader" class="loading-overlay">Cargando experiencia...</div>

    <!-- CONTENEDOR HERO -->
    <header class="hero">
        <h1 id="event-title" class="hero-title">--</h1>
        <p id="event-date">--</p>
    </header>

    <!-- MÓDULO: TRÁILER (YouTube optimizado) [2, 8] -->
    <section id="modulo-trailer">
        <div id="video-container">
            <!-- El JS inyectará el thumbnail aquí para evitar Error 153 -->
        </div>
    </section>

    <!-- MÓDULO: SINOPSIS -->
    <section id="modulo-sinopsis">
        <h2>Sinopsis</h2>
        <div id="event-description">--</div>
    </section>

    <!-- MÓDULO: DJ LINEUP [9, 10] -->
    <section id="modulo-lineup">
        <h2>Lineup</h2>
        <ul id="lineup-list"></ul>
    </section>

    <!-- FORMULARIO DE REGISTRO DINÁMICO [2, 11] -->
    <section id="modulo-registro" style="display: block !important;">
        <h2>Reserva tu entrada</h2>
        <form id="form-registro">
            <input type="text" id="reg-nombre" placeholder="Nombre completo" required>
            <input type="text" id="reg-cedula" placeholder="Cédula / Documento" required>
            <input type="tel" id="reg-tel" placeholder="Teléfono" required>
            <div id="campos-custom"></div> <!-- Aquí se cargan preguntas del admin [12] -->
            <button type="submit" id="btn-submit">Confirmar Asistencia</button>
        </form>
    </section>

    <!-- ÁREA DEL TICKET QR (Canvas API) [2, 13] -->
    <div id="ticket-result" style="display: none;">
        <canvas id="qr-canvas"></canvas>
    </div>

    <script>
        /* ================================================================
           2. MANUAL MODULE CONTROLLER (EDITA AQUÍ PARA ACTIVAR MÓDULOS)
           ================================================================ */
        const SANDBOX_CONFIG = {
            trailer: false,
            sinopsis: true,
            lineup: true,
            faq: false,
            force_gold: '#c8a96e' // Cambia el color base aquí manualmente
        };

        /* CREDENCIALES DEL SISTEMA [1] */
        const SB_URL = "https://ctgyvydzshueemlelkzv.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN0Z3l2eWR6c2h1ZWVtbGVsa3p2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2NTc1NzAsImV4cCI6MjA4OTIzMzU3MH0.3pMA-VZLV2Kfyl6BD-x8v79P7UuXSfMgtIwnfoP_VuY";
        const supabase = exports.supabase.createClient(SB_URL, SB_KEY);

        async function initSandbox() {
            const params = new URLSearchParams(window.location.search);
            const slug = params.get('slug');

            if (!slug) {
                alert("Necesitas un ?slug= en la URL para cargar datos reales.");
                return;
            }

            try {
                // Obtener datos reales del evento [2]
                const { data: evento, error } = await supabase
                    .from('eventos')
                    .select('*, organizaciones(color_primario, nombre_app)')
                    .eq('slug', slug)
                    .single();

                if (error) throw error;

                // Inyectar Datos Reales
                document.getElementById('event-title').innerText = evento.nombre;
                document.getElementById('event-description').innerHTML = evento.descripcion;
                
                // Aplicar variable de color (Prioridad Manual > Org)
                document.documentElement.style.setProperty('--gold', SANDBOX_CONFIG.force_gold || evento.organizaciones.color_primario);

                // CONTROLADOR MANUAL DE MÓDULOS [instrucciones]
                applyManualFilters();

            } catch (err) {
                console.error("Error cargando evento:", err);
            } finally {
                document.getElementById('loader').style.display = 'none';
            }
        }

        function applyManualFilters() {
            // Recorre el objeto SANDBOX_CONFIG y aplica display block/none
            Object.keys(SANDBOX_CONFIG).forEach(key => {
                const el = document.getElementById(`modulo-${key}`);
                if (el) {
                    el.style.display = SANDBOX_CONFIG[key] ? 'block' : 'none';
                }
            });
        }

        // Ejecutar al cargar
        window.onload = initSandbox;
    </script>
</body>
</html>
