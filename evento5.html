<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Silo T8: Arthouse Zen · Sistema QR</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.3.0/dist/fonts/geist.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/qr-creator/dist/qr-creator.min.js"></script>

    <style>
        :root { --zen-bg: #0a0a0a; --zen-text: #ffffff; --zen-accent: #333333; }
        html, body { margin: 0; padding: 0; background: var(--zen-bg); color: var(--zen-text); font-family: 'Geist', sans-serif; overflow-x: hidden; }

        /* ESCUDO DE GRANO (v47) - Aplicado para textura fanzine */
        body::before { content: ""; position: fixed; inset: 0; z-index: 9999; pointer-events: none; opacity: 0.03; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E"); }

        /* ESTRUCTURA EDITORIAL (Columna Centrada) */
        #template-container { display: none; flex-direction: column; align-items: center; padding: 0 5%; }
        
        /* 1. HERO - Impacto Tipográfico Puro */
        .hero { height: 80vh; display: flex; flex-direction: column; justify-content: center; text-align: center; max-width: 900px; }
        .hero-title { font-size: clamp(3rem, 12vw, 8rem); font-weight: 900; letter-spacing: -6px; line-height: 0.8; margin: 0; text-transform: uppercase; }
        .hero-meta { margin-top: 4rem; font-size: 0.7rem; letter-spacing: 5px; opacity: 0.4; font-weight: 700; text-transform: uppercase; }

        /* SECCIONES ZEN */
        section { width: 100%; max-width: 650px; padding: 12rem 0; border-bottom: 1px solid var(--zen-accent); }
        h2 { font-size: 0.6rem; letter-spacing: 6px; font-weight: 900; margin-bottom: 5rem; opacity: 0.3; text-transform: uppercase; }

        /* 2. COUNTDOWN (Text-Based) */
        .unified-countdown-frame { display: flex; justify-content: space-between; border: none; padding: 0; box-shadow: none; }
        .cd-v { font-size: 4rem !important; font-weight: 900; letter-spacing: -3px; color: var(--zen-text); }
        .cd-label { font-size: 0.5rem; letter-spacing: 3px; opacity: 0.3; display: block; margin-top: 0.5rem; }

        /* 3. MULTIMEDIA STACK (v121 Sync) */
        .media-stack { display: flex; flex-direction: column; gap: 1rem; width: 100%; }
        .video-wrapper { position: relative; padding-top: 56.25%; background: #000; border: 1px solid var(--zen-accent); }
        .spotify-container { height: 150px; border: 1px solid var(--zen-accent); overflow: hidden; }

        /* 4. LINEUP (Minimal List) */
        .artist-list { display: flex; flex-direction: column; gap: 0.5rem; }
        .artist-name { font-size: 2.2rem; font-weight: 900; letter-spacing: -1px; text-transform: uppercase; transition: 0.4s; }
        .artist-name:hover { padding-left: 1.5rem; color: #555; }

        /* 5. TECH DATA (No-Plano con Estilo Boutique) */
        .tech-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; }
        .data-card { padding: 3rem; background: #0d0d0d; border-radius: 4px; text-align: center; border: 1px solid #1a1a1a; }
        .data-val { font-size: 1.8rem; font-weight: 900; display: block; margin-bottom: 0.5rem; letter-spacing: -1px; }
        .data-lab { font-size: 0.5rem; letter-spacing: 3px; opacity: 0.4; }

        /* 6. FORMULARIO (Focus) */
        .form-master-box { background: #0d0d0d; padding: 4rem; border: 1px solid #1a1a1a; }
        .form-input { border-radius: 0; background: transparent; border: none; border-bottom: 2px solid #222; padding: 1.5rem 0; color: white; width: 100%; font-size: 1.2rem; margin-bottom: 2rem; }
        .form-input:focus { border-color: white; outline: none; }
        .btn-submit { background: white; color: black; font-weight: 900; padding: 2rem; border: none; cursor: pointer; text-transform: uppercase; width: 100%; letter-spacing: 4px; }

        /* IDs DE DATOS INVISIBLES (Regla de Oro: Cero Borrado) */
        #db-poster-img, #db-gallery-grid, #db-faq-list, #db-mapa-container, #db-sponsors-list { display: none; }

        .loading-overlay { position: fixed; inset: 0; background: #000; z-index: 9999; display: flex; align-items: center; justify-content: center; font-weight: 900; color: white; letter-spacing: 10px; }

        @media (max-width: 850px) { .hero-title { font-size: 4rem; } section { padding: 8rem 0; } }
    </style>
</head>

<body class="tpl-p8">

    <div id="loader" class="loading-overlay">ARTHOUSE ENGINE v121...</div>

    <div id="template-container">
        <!-- MÓDULO 1: HERO (Cerebro) -->
        <header class="hero">
            <div id="org-name-badge" style="font-weight:900; letter-spacing:5px; opacity:0.3; margin-bottom:2rem; text-transform:uppercase;">--</div>
            <h1 id="event-title" class="hero-title">--</h1>
            <div id="hero-meta" class="hero-meta">
                <span id="meta-fecha">--</span> • <span id="meta-hora">--</span> • <span id="meta-lugar">--</span>
            </div>
        </header>

        <!-- MÓDULO 2: COUNTDOWN -->
        <section id="modulo-countdown">
            <h2>TEMPORALIDAD</h2>
            <div id="unified-frame" class="unified-countdown-frame">
                <div><span id="cd-days" class="cd-v">00</span><span class="cd-label">DAYS</span></div>
                <div><span id="cd-hours" class="cd-v">00</span><span class="cd-label">HOURS</span></div>
                <div><span id="cd-mins" class="cd-v">00</span><span class="cd-label">MINS</span></div>
                <div><span id="cd-secs" class="cd-v">00</span><span class="cd-label">SECS</span></div>
            </div>
        </section>

        <!-- MÓDULO 3: MULTIMEDIA -->
        <section id="modulo-gallery">
            <h2>ARCHIVOS MULTIMEDIA</h2>
            <div class="media-stack">
                <div id="modulo-trailer" class="video-wrapper"><div id="db-video-content" style="position:absolute; inset:0;"></div></div>
                <div id="modulo-playlist" class="spotify-container"><div id="db-spotify-embed" style="width:100%; height:100%;"></div></div>
            </div>
        </section>

        <!-- MÓDULO 4: LINEUP -->
        <section id="modulo-lineup">
            <h2>PARTICIPANTES</h2>
            <div id="db-lineup" class="artist-list"></div>
        </section>

        <!-- MÓDULO 5: DATA CARDS -->
        <section id="modulo-info-tecnica">
            <h2>ESPECIFICACIONES</h2>
            <div class="tech-grid">
                <div class="data-card"><span id="db-dress-val" class="data-val">--</span><span class="data-lab">VESTIMENTA</span></div>
                <div class="data-card"><span id="db-aforo-val" class="data-val">--</span><span class="data-lab">AFORO</span></div>
            </div>
        </section>

        <!-- MÓDULO 6: FORMULARIO -->
        <section id="modulo-formulario">
            <h2>REGISTRO EXCLUSIVO</h2>
            <div class="form-master-box">
                <form id="master-reg-form">
                    <input type="text" class="form-input" id="reg-nombre" placeholder="Nombre completo *" required>
                    <input type="text" class="form-input" id="reg-cedula" placeholder="Cédula / ID *" required>
                    <button type="submit" class="btn-submit">CONFIRMAR ACCESO →</button>
                </form>
            </div>
        </section>

        <!-- CONTRATO DE INTEGRIDAD (IDs Ocultos v121) -->
        <img id="db-poster-img" src="">
        <div id="db-gallery-grid"></div>
        <div id="db-faq-list"></div>
        <div id="db-mapa-container"></div>
        <div id="db-sponsors-list"></div>
    </div>

    <script>
        const SB_URL = "https://ctgyvydzshueemlelkzv.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN0Z3l2eWR6c2h1ZWVtbGVsa3p2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2NTc1NzAsImV4cCI6MjA4OTIzMzU3MH0.3pMA-VZLV2Kfyl6BD-x8v79P7UuXSfMgtIwnfoP_VuY";
        const sbClient = window.supabase.createClient(SB_URL, SB_KEY);

        function logStatus(m, t = 'INFO') {
            const colors = { 'INFO':'#00ff88', 'LINK':'#f1c40f', 'TIME':'#9b59b6', 'TRACE':'#e67e22' };
            console.log(`%c[${t}] ${m}`, `color: ${colors[t]}; font-weight: bold;`);
        }

        async function initZen() {
            logStatus("AUDITORÍA V121: Ejecutando Silo T8 Arthouse Zen.");
            const slug = new URLSearchParams(window.location.search).get('slug');
            try {
                const { data: evento, error } = await sbClient.from('eventos').select('*').eq('slug', slug).single();
                if (error) throw error;

                // 1. Mapeo Hero (v121-Ready)
                document.getElementById('event-title').innerText = evento.nombre.toUpperCase();
                document.getElementById('meta-fecha').innerText = evento.fecha;
                document.getElementById('meta-hora').innerText = evento.hora;
                document.getElementById('meta-lugar').innerText = (evento.ubicacion || 'VENUE').toUpperCase();
                
                const { data: org } = await sbClient.from('organizaciones').select('nombre').eq('id', evento.org_id).single();
                if (org) document.getElementById('org-name-badge').innerText = org.nombre.toUpperCase();

                // 2. Mapeo Contenido (6 Módulos Zen)
                const content = evento.config_landing?.content || {};
                const lineup = content.dj_lineup || content.lineup || "";
                document.getElementById('db-lineup').innerHTML = (Array.isArray(lineup) ? lineup : lineup.split('\n')).filter(a => a.length > 2).map(a => `<div class="artist-name"><span>${a.trim()}</span></div>`).join('');
                
                const trailerUrl = content.trailer_url || "https://player.vimeo.com/video/259411563";
                document.getElementById('db-video-content').innerHTML = `<iframe style="width:100%; height:100%; border:none;" src="${trailerUrl}" allowfullscreen></iframe>`;
                if (content.playlist_url) {
                    const embed = content.playlist_url.replace('/playlist/', '/embed/playlist/');
                    document.getElementById('db-spotify-embed').innerHTML = `<iframe src="${embed}" style="width:100%; height:80px; border:none;" allow="encrypted-media"></iframe>`;
                }

                document.getElementById('db-dress-val').innerText = (content.dresscode || 'BLACK').toUpperCase();
                document.getElementById('db-aforo-val').innerText = `${evento.aforo_max || 'FULL'}`;

                logStatus("TRACE: 6 Módulos Zen sincronizados con éxito.", "TRACE");

                // 3. Heartbeat
                const target = new Date(`${evento.fecha}T${evento.hora}`).getTime();
                setInterval(() => {
                    const diff = target - new Date().getTime();
                    if (diff <= 0) return;
                    document.getElementById('cd-days').innerText = Math.floor(diff / 86400000).toString().padStart(2, '0');
                    document.getElementById('cd-hours').innerText = Math.floor((diff % 86400000) / 3600000).toString().padStart(2, '0');
                    document.getElementById('cd-mins').innerText = Math.floor((diff % 3600000) / 60000).toString().padStart(2, '0');
                    document.getElementById('cd-secs').innerText = Math.floor((diff % 60000) / 1000).toString().padStart(2, '0');
                }, 1000);
                logStatus("TIME: Heartbeat editorial activo.", "TIME");

                if (document.getElementById('master-reg-form')) logStatus("LINK: Motor de registro directo verificado.", "LINK");

                document.getElementById('template-container').style.display = 'flex';

            } catch (err) { logStatus(`ERROR: ${err.message}`, "ERROR"); } finally { document.getElementById('loader').style.display = 'none'; }
        }
        window.onload = initZen;
    </script>
</body>
</html>
