<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quiet Luxury v126 · Private Member Club</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.3.0/dist/fonts/geist.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/qr-creator/dist/qr-creator.min.js"></script>

    <style>
        :root { --main-bg: #050505; --gold: #c8a96e; --text-color: #ffffff; }
        html, body { margin: 0; padding: 0; background: var(--main-bg); color: var(--text-color); font-family: 'Geist', sans-serif; overflow: hidden; }

        /* ESCUDO DE GRANO (v47) */
        body::before { content: ""; position: fixed; inset: 0; z-index: 9999; pointer-events: none; opacity: 0.04; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E"); }

        /* ESTRUCTURA SINGLE VIEWPORT (P9) */
        #template-container { 
            display: none; height: 100vh; width: 100vw; 
            background-size: cover; background-position: center;
            position: relative; align-items: center; justify-content: center;
        }
        #template-container::before { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at center, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0.95) 100%); z-index: 1; }

        /* PANEL CENTRAL REFINADO */
        .luxury-panel { 
            position: relative; z-index: 10; display: grid; grid-template-columns: 1fr 0.8fr; 
            gap: 6rem; max-width: 1200px; width: 85%; align-items: center;
        }

        /* METADATOS ORGÁNICOS */
        .info-side { border-left: 1px solid rgba(200, 169, 110, 0.3); padding-left: 4rem; }
        .org-badge { font-size: 0.55rem; letter-spacing: 7px; opacity: 0.5; text-transform: uppercase; margin-bottom: 1.5rem; }
        .hero-title { font-size: clamp(3.5rem, 9vw, 6.5rem); font-weight: 900; letter-spacing: -6px; line-height: 0.8; margin: 0; text-transform: uppercase; }
        
        .metadata-organic { margin-top: 3rem; list-style: none; padding: 0; }
        .metadata-organic li { font-size: 0.8rem; font-weight: 800; letter-spacing: 3px; text-transform: uppercase; color: var(--gold); margin-bottom: 0.8rem; display: flex; align-items: center; gap: 1rem; }
        .metadata-organic li::before { content: ''; width: 30px; height: 1px; background: rgba(200, 169, 110, 0.4); }

        /* DATA CARDS SOFISTICADOS (v126) */
        .tech-specs-organic { margin-top: 4rem; display: flex; gap: 3rem; }
        .data-item { position: relative; }
        .data-item .label { font-size: 0.5rem; letter-spacing: 4px; opacity: 0.4; text-transform: uppercase; display: block; margin-bottom: 0.3rem; }
        .data-item .value { font-size: 1.4rem; font-weight: 900; letter-spacing: -1px; text-transform: uppercase; border-bottom: 2px solid var(--gold); padding-bottom: 0.2rem; }

        /* FORMULARIO GLASS (Single Viewport Focus) */
        .form-master-box { 
            background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(30px); 
            padding: 4rem; border: 1px solid rgba(255, 255, 255, 0.05); 
            box-shadow: 0 40px 100px rgba(0,0,0,0.8); border-radius: 4px;
        }
        .form-input { 
            background: transparent; border: none; border-bottom: 1px solid rgba(255,255,255,0.1); 
            padding: 1.5rem 0; color: white; width: 100%; font-size: 1.1rem; margin-bottom: 2rem; 
            font-family: inherit; transition: 0.4s;
        }
        .form-input:focus { border-color: var(--gold); outline: none; padding-left: 1rem; }
        .btn-submit { 
            background: var(--gold); color: black; font-weight: 900; padding: 1.8rem; 
            border: none; cursor: pointer; text-transform: uppercase; width: 100%; 
            letter-spacing: 5px; margin-top: 1rem; transition: 0.5s ease;
        }
        .btn-submit:hover { letter-spacing: 8px; filter: brightness(1.3); transform: translateY(-2px); }

        .loading-overlay { position: fixed; inset: 0; background: #000; z-index: 9999; display: flex; align-items: center; justify-content: center; font-weight: 900; letter-spacing: 12px; color: var(--gold); text-transform: uppercase; }

        /* IDs DE DATOS PROTEGIDOS (Cero Borrado) */
        #db-poster-img, #modulo-countdown, #modulo-gallery, #modulo-lineup, #db-faq-list, #db-mapa-container, #db-sponsors-list { display: none; }

        @media (max-width: 1100px) {
            .luxury-panel { grid-template-columns: 1fr; gap: 4rem; width: 90%; }
            .info-side { padding-left: 0; border-left: none; text-align: center; }
            .metadata-organic li { justify-content: center; }
            .tech-specs-organic { justify-content: center; }
            #template-container { overflow-y: auto; height: auto; min-height: 100vh; padding: 6rem 0; }
        }
    </style>
</head>

<body class="tpl-p9">

    <div id="loader" class="loading-overlay">SOPHISTICATION v126...</div>

    <div id="template-container">
        <div class="luxury-panel">
            <!-- SECCIÓN A: IDENTIDAD TIPOGRÁFICA Y METADATOS -->
            <div class="info-side">
                <div id="org-name-badge" class="org-badge">--</div>
                <h1 id="event-title" class="hero-title">--</h1>
                
                <ul class="metadata-organic">
                    <li id="meta-fecha">--</li>
                    <li id="meta-hora">--</li>
                    <li id="meta-lugar">--</li>
                </ul>

                <div class="tech-specs-organic">
                    <div class="data-item">
                        <span class="label">DRESS CODE</span>
                        <span id="db-dress-val" class="value">--</span>
                    </div>
                    <div class="data-item">
                        <span class="label">PRIVATE CAPACITY</span>
                        <span id="db-aforo-val" class="value">--</span>
                    </div>
                </div>
            </div>

            <!-- SECCIÓN B: FORMULARIO DE ACCESO -->
            <div class="form-master-box">
                <div style="font-size:0.5rem; letter-spacing:6px; opacity:0.4; margin-bottom:3rem; text-transform:uppercase; text-align:center;">Request Admission Invitation</div>
                <form id="master-reg-form">
                    <input type="text" id="reg-nombre" placeholder="TU NOMBRE *" required class="form-input">
                    <input type="text" id="reg-cedula" placeholder="DOCUMENTO ID *" required class="form-input">
                    <button type="submit" class="btn-submit">Somet Admission →</button>
                </form>
            </div>
        </div>

        <!-- CONTRATO DE DATOS PROTEGIDOS (Cerebro de Datos v121) -->
        <main style="display:none;">
            <div id="modulo-countdown"></div>
            <div id="modulo-gallery"><div id="db-gallery-grid"></div><div id="db-video-content"></div><div id="db-spotify-embed"></div></div>
            <div id="modulo-lineup"><div id="db-lineup"></div><img id="db-poster-img"></div>
            <div id="db-faq-list"></div>
            <div id="db-mapa-container"></div>
            <div id="db-sponsors-list"></div>
        </main>
    </div>

    <script>
        const SB_URL = "https://ctgyvydzshueemlelkzv.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN0Z3l2eWR6c2h1ZWVtbGVsa3p2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2NTc1NzAsImV4cCI6MjA4OTIzMzU3MH0.3pMA-VZLV2Kfyl6BD-x8v79P7UuXSfMgtIwnfoP_VuY";
        const sbClient = window.supabase.createClient(SB_URL, SB_KEY);
        
        function logStatus(m, t = 'INFO') {
            const colors = { 'INFO':'#00ff88', 'LINK':'#f1c40f', 'TIME':'#9b59b6', 'TRACE':'#e67e22' };
            console.log(`%c[${new Date().toLocaleTimeString()}] [${t}] ${m}`, `color: ${colors[t]}; font-weight: bold;`);
        }

        async function initQuietLuxury() {
            logStatus("AUDITORÍA V126: Iniciando Silo T9 con Metadatos Orgánicos.", "INFO");
            const slug = new URLSearchParams(window.location.search).get('slug');
            
            try {
                const { data: evento, error } = await sbClient.from('eventos').select('*').eq('slug', slug).single();
                if (error) throw error;

                // 1. Mapeo Metadatos (Diseño Orgánico)
                document.getElementById('event-title').innerText = evento.nombre.toUpperCase();
                document.getElementById('meta-fecha').innerText = evento.fecha;
                document.getElementById('meta-hora').innerText = `${evento.hora} HRS`;
                document.getElementById('meta-lugar').innerText = (evento.ubicacion || 'HIDDEN VENUE').toUpperCase();
                if (evento.imagen_url) document.getElementById('template-container').style.backgroundImage = `url('${evento.imagen_url}')`;
                
                const { data: org } = await sbClient.from('organizaciones').select('nombre').eq('id', evento.org_id).single();
                if (org) document.getElementById('org-name-badge').innerText = org.nombre.toUpperCase();
                logStatus("INFO: Metadatos del Hero inyectados orgánicamente.", "INFO");

                // 2. Mapeo Datos Técnicos (Refined Style)
                const content = evento.config_landing?.content || {};
                document.getElementById('db-dress-val').innerText = (content.dresscode || 'FORMAL').toUpperCase();
                document.getElementById('db-aforo-val').innerText = `${evento.aforo_max || 'LIMITED'}`;
                logStatus("INFO: Datos técnicos refinados con Jerarquía Boutique.", "INFO");

                // 3. Auditoría de Módulos (v124 High-Density)
                console.group("%c[AUDITORÍA DE INTEGRIDAD V126]", "color:#e67e22; font-weight:bold;");
                console.log("%cACTIVOS ✅: Hero (Identidad), Metadata List, Tech Specs Organic, Form Glassmorphism.", "color:#00ff88;");
                console.log("%cPROTEGIDOS 👁️: Countdown, Media Stack, Lineup, FAQ, Mapa, Sponsors (Invisibles para asegurar integridad).", "color:#f1c40f;");
                console.groupEnd();

                logStatus("TRACE: 12 Módulos sincronizados | Organic Metadata Ready | Single Viewport Fix.", "TRACE");

                if (document.getElementById('master-reg-form')) logStatus("LINK: Motor de registro directo verificado y persistente.", "LINK");

                document.getElementById('template-container').style.display = 'flex';

            } catch (err) { logStatus(`ERROR CRÍTICO: ${err.message}`, "ERROR"); } finally { document.getElementById('loader').style.display = 'none'; }
        }
        window.onload = initQuietLuxury;
    </script>
</body>
</html>
