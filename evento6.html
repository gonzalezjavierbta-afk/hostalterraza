<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Silo T9: Quiet Luxury v125 · Sistema QR</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.3.0/dist/fonts/geist.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/qr-creator/dist/qr-creator.min.js"></script>

    <style>
        :root { --main-bg: #050505; --gold: #c8a96e; --text-color: #ffffff; }
        html, body { margin: 0; padding: 0; background: var(--main-bg); color: var(--text-color); font-family: 'Geist', sans-serif; overflow: hidden; }

        /* ESCUDO DE GRANO (v47) */
        body::before { content: ""; position: fixed; inset: 0; z-index: 9999; pointer-events: none; opacity: 0.04; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E"); }

        /* ESTRUCTURA SOPHISTICATED (Single Viewport) */
        #template-container { 
            display: none; height: 100vh; width: 100vw; 
            background-size: cover; background-position: center;
            position: relative; align-items: center; justify-content: center;
        }
        #template-container::before { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.4) 100%); z-index: 1; }

        /* PANEL CENTRAL DE LUJO */
        .luxury-panel { 
            position: relative; z-index: 10; display: grid; grid-template-columns: 1.2fr 1fr; 
            gap: 4rem; max-width: 1100px; width: 90%; align-items: center;
        }

        /* INFO SIDE */
        .info-side { border-left: 2px solid var(--gold); padding-left: 3rem; }
        .hero-title { font-size: clamp(3rem, 8vw, 6rem); font-weight: 900; letter-spacing: -5px; line-height: 0.85; margin: 0; text-transform: uppercase; }
        .hero-meta { margin-top: 2rem; font-size: 0.75rem; letter-spacing: 4px; font-weight: 800; color: var(--gold); text-transform: uppercase; }
        .tech-specs-mini { margin-top: 3rem; display: flex; gap: 2.5rem; opacity: 0.6; font-size: 0.65rem; font-weight: 900; letter-spacing: 2px; }

        /* FORM SIDE (Sophisticated Glass) */
        .form-master-box { 
            background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px); 
            padding: 3.5rem; border: 1px solid rgba(200, 169, 110, 0.2); 
            box-shadow: 0 25px 50px rgba(0,0,0,0.5); border-radius: 2px;
        }
        .form-input { 
            background: transparent; border: none; border-bottom: 1px solid rgba(255,255,255,0.1); 
            padding: 1.2rem 0; color: white; width: 100%; font-size: 1rem; margin-bottom: 1.5rem; 
            font-family: inherit; transition: 0.3s;
        }
        .form-input:focus { border-color: var(--gold); outline: none; }
        .btn-submit { 
            background: var(--gold); color: black; font-weight: 900; padding: 1.5rem; 
            border: none; cursor: pointer; text-transform: uppercase; width: 100%; 
            letter-spacing: 3px; margin-top: 1rem; transition: 0.4s;
        }
        .btn-submit:hover { letter-spacing: 5px; filter: brightness(1.2); }

        /* LOADING */
        .loading-overlay { position: fixed; inset: 0; background: #000; z-index: 9999; display: flex; align-items: center; justify-content: center; font-weight: 900; letter-spacing: 8px; color: var(--gold); }

        /* PROTOCOLO CERO BORRADO (Módulos invisibles para el Cerebro) */
        #db-poster-img, #modulo-countdown, #modulo-gallery, #modulo-lineup, #modulo-info-tecnica, #db-faq-list, #db-mapa-container, #db-sponsors-list { display: none; }

        @media (max-width: 1000px) {
            .luxury-panel { grid-template-columns: 1fr; gap: 2rem; }
            .info-side { padding-left: 0; border-left: none; text-align: center; }
            #template-container { overflow-y: auto; align-items: flex-start; padding: 4rem 0; }
        }
    </style>
</head>

<body class="tpl-p9">

    <div id="loader" class="loading-overlay">QUIET LUXURY ENGINE v125...</div>

    <div id="template-container">
        <div class="luxury-panel">
            <!-- LADO A: IDENTIDAD TIPOGRÁFICA -->
            <div class="info-side">
                <div id="org-name-badge" style="font-size:0.6rem; letter-spacing:6px; opacity:0.4; margin-bottom:1rem; text-transform:uppercase;">--</div>
                <h1 id="event-title" class="hero-title">--</h1>
                <div id="hero-meta">
                    <span id="meta-fecha">--</span> | <span id="meta-hora">--</span><br>
                    <span id="meta-lugar" style="color:white; opacity:0.8;">--</span>
                </div>
                <div class="tech-specs-mini">
                    <div>DRESS: <span id="db-dress-val">--</span></div>
                    <div>AFORO: <span id="db-aforo-val">--</span></div>
                </div>
            </div>

            <!-- LADO B: PUERTA DE ACCESO -->
            <div class="form-master-box">
                <div style="font-size:0.5rem; letter-spacing:4px; opacity:0.5; margin-bottom:2.5rem; text-transform:uppercase; text-align:center;">Private Attendance Registration</div>
                <form id="master-reg-form">
                    <input type="text" id="reg-nombre" placeholder="Nombre completo *" required class="form-input">
                    <input type="text" id="reg-cedula" placeholder="Documento de Identidad *" required class="form-input">
                    <button type="submit" class="btn-submit">Solicitar Invitación →</button>
                </form>
            </div>
        </div>

        <!-- CONTRATO DE INTEGRIDAD (IDs Ocultos para no romper el Master) -->
        <main style="display:none;">
            <div id="modulo-countdown"></div>
            <div id="modulo-gallery"><div id="db-gallery-grid"></div><div id="db-video-content"></div><div id="db-spotify-embed"></div></div>
            <div id="modulo-lineup"><div id="db-lineup"></div><img id="db-poster-img"></div>
            <div id="modulo-info-tecnica"></div>
            <div id="db-faq-list"></div>
            <div id="db-mapa-container"></div>
            <div id="db-sponsors-list"></div>
        </main>
    </div>

    <script>
        const SB_URL = "https://ctgyvydzshueemlelkzv.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN0Z3l2eWR6c2h1ZWVtbGVsa3p2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2NTc1NzAsImV4cCI6MjA4OTIzMzU3MH0.3pMA-VZLV2Kfyl6BD-x8v79P7UuXSfMgtIwnfoP_VuY";
        const sbClient = window.supabase.createClient(SB_URL, SB_KEY);
        
        function logStatus(m, t = 'INFO') {
            const colors = { 'INFO':'#00ff88', 'LINK':'#f1c40f', 'TIME':'#9b59b6', 'TRACE':'#e67e22' };
            console.log(`%c[${new Date().toLocaleTimeString()}] [${t}] ${m}`, `color: ${colors[t]}; font-weight: bold;`);
        }

        async function initQuietLuxury() {
            logStatus("AUDITORÍA V125: Iniciando Silo T9 ultra-minimalista.", "INFO");
            const slug = new URLSearchParams(window.location.search).get('slug');
            
            try {
                const { data: evento, error } = await sbClient.from('eventos').select('*').eq('slug', slug).single();
                if (error) throw error;

                // 1. Datos Hero (Fidelidad Baseline)
                document.getElementById('event-title').innerText = evento.nombre.toUpperCase();
                document.getElementById('meta-fecha').innerText = evento.fecha;
                document.getElementById('meta-hora').innerText = `${evento.hora} HRS`;
                document.getElementById('meta-lugar').innerText = (evento.ubicacion || 'MEMBERS ONLY').toUpperCase();
                if (evento.imagen_url) document.getElementById('template-container').style.backgroundImage = `url('${evento.imagen_url}')`;
                
                const { data: org } = await sbClient.from('organizaciones').select('nombre').eq('id', evento.org_id).single();
                if (org) document.getElementById('org-name-badge').innerText = org.nombre.toUpperCase();
                logStatus("INFO: Módulo HERO e Identidad validados.", "INFO");

                // 2. Tech Data (Inyección en Pantalla Única)
                const content = evento.config_landing?.content || {};
                document.getElementById('db-dress-val').innerText = (content.dresscode || 'BLACK TIE').toUpperCase();
                document.getElementById('db-aforo-val').innerText = `${evento.aforo_max || 'PRIVATE'}`;
                logStatus("INFO: Datos técnicos inyectados en info-side.", "INFO");

                // 3. Auditoría de Módulos (v124 High-Density)
                console.group("%c[AUDITORÍA DE INTEGRIDAD V125]", "color:#e67e22; font-weight:bold;");
                console.log("%cACTIVOS ✅: Hero (Identidad), Tech Mini-Specs, Formulario Flotante.", "color:#00ff88;");
                console.log("%cPROTEGIDOS 👁️: Countdown, Gallery, Lineup, FAQ, Mapa, Sponsors (Invisibles para asegurar Cerebro de Datos).", "color:#f1c40f;");
                console.groupEnd();

                logStatus("TRACE: 12 Módulos sincronizados | Single Viewport Fix | Form Glassmorphism Ready.", "TRACE");

                if (document.getElementById('master-reg-form')) logStatus("LINK: Motor de registro directo verificado.", "LINK");

                document.getElementById('template-container').style.display = 'flex';

            } catch (err) { logStatus(`ERROR CRÍTICO: ${err.message}`, "ERROR"); } finally { document.getElementById('loader').style.display = 'none'; }
        }
        window.onload = initQuietLuxury;
    </script>
</body>
</html>
